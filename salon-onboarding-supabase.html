async function handleRecoverySession(session){
  try{
    const {data:profile}=await supabaseClient.from("user_profiles").select("account_type").eq("user_id",session.user.id).maybeSingle();

function buildTimeOptions(){
  const opts = [];
  for (let h=6; h<=23; h++){
    for (let m=0; m<60; m+=30){
      const period = h>=12 ? "PM" : "AM";
      let h12 = h % 12; if (h12===0) h12 = 12;
      opts.push(`${h12}:${String(m).padStart(2,"0")} ${period}`);
    }
  }
  return opts;
}
const TIME_OPTIONS = buildTimeOptions();

function defaultHours(){
  const hours = {};

    const isWeekend = d==="Sat" || d==="Sun";
    hours[d] = { open: !isWeekend, start: "8:30 AM", end: "5:00 PM" };
  });
  return hours;
}

const REGISTRATION_DRAFT_KEY="blooma-business-registration-draft-v1";
function registrationDraftPayload(){
  return {
    authView:state.authView, authStep:state.authStep, email:state.email,
    firstName:state.firstName, lastName:state.lastName, regPhone:state.regPhone,
    password:state.password, acceptedTerms:state.acceptedTerms
  };
}
function persistRegistrationDraft(){
  if(state.registered || state.awaitingEmailConfirmation || state.authView!=="register") return;
  try{ sessionStorage.setItem(REGISTRATION_DRAFT_KEY,JSON.stringify(registrationDraftPayload())); }catch(e){}
}
function restoreRegistrationDraft(){
  try{
    const raw=sessionStorage.getItem(REGISTRATION_DRAFT_KEY); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||typeof d!=="object") return false;
    if(d.authView==="register") state.authView="register";
    if(Number.isInteger(d.authStep)) state.authStep=Math.max(0,Math.min(1,d.authStep));
    ["email","firstName","lastName","regPhone","password"].forEach(k=>{ if(typeof d[k]==="string") state[k]=d[k]; });
    if(typeof d.acceptedTerms==="boolean") state.acceptedTerms=d.acceptedTerms;
    return true;
  }catch(e){ return false; }
}
function clearRegistrationDraft(){ try{ sessionStorage.removeItem(REGISTRATION_DRAFT_KEY); }catch(e){} }

const VENUE_DRAFT_PREFIX="blooma-venue-setup-draft:";
const PENDING_VENUE_DRAFT_KEY="blooma-pending-venue-draft-v2";
function venueDraftKey(email=state.email){ return VENUE_DRAFT_PREFIX+String(email||"pending").trim().toLowerCase(); }
function venueDraftPayload(){
  return {
    step:state.step,
    name:state.name,
    categories:state.categories,
    address:state.address,
    city:state.city,
    region:state.region,
    phone:state.phone,
    description:state.description,
    hours:state.hours,
    services:state.services,
    team:state.team
  };
}
function rememberPendingVenueDraft(){
  if(!state.draftId || !state.email) return;
  try{ localStorage.setItem(PENDING_VENUE_DRAFT_KEY,JSON.stringify({draftId:state.draftId,email:state.email,updatedAt:Date.now()})); }catch(e){}
}
function getPendingVenueDraft(){
  try{
    const raw=localStorage.getItem(PENDING_VENUE_DRAFT_KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d||typeof d!=="object"||!d.draftId) return null;
    return d;
  }catch(e){ return null; }
}
function clearPendingVenueDraft(){ try{ localStorage.removeItem(PENDING_VENUE_DRAFT_KEY); }catch(e){} }
function newVenueDraftId(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=new Uint8Array(16); crypto.getRandomValues(b); b[6]=(b[6]&15)|64; b[8]=(b[8]&63)|128;
  const h=Array.from(b,x=>x.toString(16).padStart(2,"0"));
  return `${h.slice(0,4).join("")}-${h.slice(4,6).join("")}-${h.slice(6,8).join("")}-${h.slice(8,10).join("")}-${h.slice(10).join("")}`;
}
function ensureVenueDraftId(){
  if(!state.draftId) state.draftId=newVenueDraftId();
  rememberPendingVenueDraft();
  return state.draftId;
}
function persistVenueDraft(){
  if(!state.registered || state.launched) return;
  try{ localStorage.setItem(venueDraftKey(),JSON.stringify(venueDraftPayload())); }catch(e){}
  rememberPendingVenueDraft();
}
function restoreVenueDraft(email){
  try{
    const raw=localStorage.getItem(venueDraftKey(email)); if(!raw) return false;
    const d=JSON.parse(raw); if(!d||typeof d!=="object") return false;
    applyVenueDraftPayload(d);
    return true;
  }catch(e){ return false; }
}
function applyVenueDraftPayload(d){
  if(!d||typeof d!=="object") return false;
  if(Number.isInteger(d.step)) state.step=Math.max(0,Math.min(STEP_META.length-1,d.step));
  ["name","address","city","region","phone","description"].forEach(k=>{ if(typeof d[k]==="string") state[k]=d[k]; });
  if(Array.isArray(d.categories)) state.categories=d.categories;
  if(d.hours&&typeof d.hours==="object") state.hours=d.hours;
  if(Array.isArray(d.services)) state.services=d.services;
  if(Array.isArray(d.team)) state.team=d.team;
  serviceCounter=Math.max(0,...state.services.map(x=>Number(x.id)||0))+1;
  stylistCounter=Math.max(0,...state.team.map(x=>Number(x.id)||0))+1;
  return true;
}
function applyRemoteVenueDraft(d){
  if(!d||typeof d!=="object") return false;
  if(d.draft_id) state.draftId=String(d.draft_id);
  if(d.email) state.email=String(d.email);
  state.draftReady=!!d.ready_to_finalize;
  state.draftStatus=String(d.status||"draft");
  if(d.salon_id) state.salonId=d.salon_id;
  applyVenueDraftPayload(d.payload||{});
  rememberPendingVenueDraft();
  return true;
}
function clearVenueDraft(){
  try{ localStorage.removeItem(venueDraftKey()); }catch(e){}
  clearPendingVenueDraft();
}
let venueDraftSyncTimer=null;
async function saveVenueDraftRemote(ready=state.draftReady){
  if(!state.email || state.launched) return null;
  ensureVenueDraftId();
  const {data,error}=await supabaseClient.rpc("save_venue_onboarding_draft",{
    p_draft_id:state.draftId,
    p_email:state.email.trim(),
    p_payload:venueDraftPayload(),
    p_ready_to_finalize:!!ready
  });
  if(error) throw error;
  state.draftReady=!!ready;
  if(data?.status) state.draftStatus=data.status;
  rememberPendingVenueDraft();
  return data;
}
function queueVenueDraftSync(delay=450){
  if(!state.registered || !state.email || state.launched) return;
  persistVenueDraft();
  clearTimeout(venueDraftSyncTimer);
  venueDraftSyncTimer=setTimeout(()=>{ saveVenueDraftRemote(state.draftReady).catch(err=>console.warn("Blooma draft autosave",err)); },delay);
}
async function loadVenueDraftRemote(draftId){
  if(!draftId) return null;
  const {data,error}=await supabaseClient.rpc("get_venue_onboarding_draft",{p_draft_id:draftId});
  if(error) throw error;
  return data||null;
}
async function loadMyVenueDraftRemote(){
  const {data,error}=await supabaseClient.rpc("get_my_venue_onboarding_draft");
  if(error) throw error;
  return data||null;
}
async function finalizeVenueDraftRemote(){
  if(!state.draftId) throw new Error("Venue draft not found. Please reopen Blooma for Business and try again.");
  const {data,error}=await supabaseClient.rpc("finalize_venue_onboarding_draft",{p_draft_id:state.draftId});
  if(error) throw error;
  state.salonId=data?.salon_id||state.salonId;
  state.draftStatus="completed";
  state.draftReady=true;
  return data;
}
function setState(patch){ Object.assign(state, patch); persistVenueDraft(); queueVenueDraftSync(); render(); }
function bindEnterKeyAdvance(fieldIds, onSubmit){
  fieldIds.forEach((id,i)=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("keydown", e=>{
      if (e.key !== "Enter") return;
      e.preventDefault();
      const nextId = fieldIds[i+1];
      const nextEl = nextId ? document.getElementById(nextId) : null;
      if (nextEl) nextEl.focus();
      else if (typeof onSubmit === "function") onSubmit();
    });
  });
}
function resetScroll(root){
  requestAnimationFrame(()=>{
    window.scrollTo(0, 0);
    const page = root.querySelector(".page");
    if (page) page.scrollTop = 0;
    const scrollable = root.querySelector("[style*='overflow-y:auto']");
    if (scrollable) scrollable.scrollTop = 0;
  });
}
function initialsOf(name){
  return (name||"").trim().split(/\s+/).map(w=>w[0]).filter(Boolean).slice(0,2).join("").toUpperCase() || "?";
}

function validateLoginStep(){
  const errors = {};
  const email = state.loginEmail.trim();
  if (!email) errors.loginEmail = "Enter your email";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.loginEmail = "Enter a valid email";
  if (!state.loginPassword) errors.loginPassword = "Enter your password";
  return errors;
}

function validateEmailStep(){
  const errors = {};
  const email = state.email.trim();
  if (!email) errors.email = "Enter your email";
  else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = "Enter a valid email";
  return errors;
}

function validateDetailsStep(){
  const errors = {};
  if (!state.firstName.trim()) errors.firstName = "Enter your first name";
  if (!state.lastName.trim()) errors.lastName = "Enter your last name";
  if (!state.regPhone.trim()) errors.regPhone = "Enter your phone number";
  if (!state.password) errors.password = "Create a password";
  else if (state.password.length < 6) errors.password = "Use at least 6 characters";
  if (!state.acceptedTerms) errors.acceptedTerms = "You need to accept the terms to continue";
  return errors;
}

function validateBusinessStep(){
  const errors = {};
  if (!state.name.trim()) errors.name = "Enter your venue name";
  if (state.categories.length===0) errors.categories = "Pick at least one category";
  if (!state.address.trim()) errors.address = "Enter your address";
  if (!state.city.trim()) errors.city = "Enter your city";
  if (!state.region.trim()) errors.region = "Enter your region";
  if (!state.phone.trim()) errors.phone = "Enter a contact number";
  return errors;
}

async function createVenueAccount(){
  const email = state.email.trim();
  ensureVenueDraftId();
  const options = { data:{
    account_type:"venue",
    first_name:state.firstName.trim(),
    last_name:state.lastName.trim(),
    phone:state.regPhone.trim()
  } };
  const redirectTo = authRedirectUrl(state.draftId);
  if (redirectTo) options.emailRedirectTo = redirectTo;
  const { data, error } = await supabaseClient.auth.signUp({ email, password:state.password, options });
  if (error) throw error;
  await saveVenueDraftRemote(false);
  if (data?.user?.identities && data.user.identities.length===0){
    const resendOptions={}; if(redirectTo) resendOptions.emailRedirectTo=redirectTo;
    const {error:resendError}=await supabaseClient.auth.resend({type:"signup",email,options:resendOptions});
    if(!resendError) throw new Error("A confirmation email has already been sent to this address. Your venue setup can still be saved while you confirm it.");
    throw new Error("An account already exists with this email. Venue and customer accounts are separate, so use the matching login or a different email.");
  }
  return data;
}
async function resendVenueConfirmationEmail(){
  const email=state.email.trim();
  if(!email) throw new Error("Enter your email first.");
  ensureVenueDraftId();
  await saveVenueDraftRemote(state.draftReady);
  const options={};
  const redirectTo=authRedirectUrl(state.draftId);
  if(redirectTo) options.emailRedirectTo=redirectTo;
  const {error}=await supabaseClient.auth.resend({type:"signup",email,options});
  if(error) throw error;
}

async function finishLegacyConfirmedVenueAccount(){
  const { data:{session} } = await supabaseClient.auth.getSession();
  if (!session) throw new Error("We couldn't verify your signed-in session. Please use the confirmation link again.");
  const {data:existingProfile,error:profileReadError}=await supabaseClient.from("user_profiles").select("account_type").eq("user_id",session.user.id).maybeSingle();
  if(profileReadError) throw profileReadError;
  const existingType=String(existingProfile?.account_type||session.user.user_metadata?.account_type||"venue").toLowerCase();
  if(existingType!=="venue") throw new Error("This is a customer account. Venue and customer accounts are separate.");
  const { error:updateError } = await supabaseClient.auth.updateUser({
    password: state.password,
    data: { account_type:"venue", first_name:state.firstName.trim(), last_name:state.lastName.trim(), phone:state.regPhone.trim() }
  });
  if (updateError) throw updateError;
  const uid = session.user.id;
  const { error:profileError } = await supabaseClient.from("user_profiles").upsert({
    user_id:uid, account_type:"venue", first_name:state.firstName.trim(), last_name:state.lastName.trim(), phone:state.regPhone.trim(), updated_at:new Date().toISOString()
  }, { onConflict:"user_id" });
  if (profileError) throw profileError;
}

async function createVenueRecord(){
  const { data, error } = await supabaseClient.rpc("create_venue_for_current_user_v2", {
    p_name: state.name.trim(),
    p_categories: state.categories,
    p_address: state.address.trim(),
    p_city: state.city.trim(),
    p_region: state.region.trim(),
    p_phone: state.phone.trim(),
    p_description: state.description.trim(),
    p_hours: state.hours,
  });
  if (error) throw error;
  state.salonId = data;
  return data;
}

function renderForgotPassword(root){
  const e = state.forgotErrors;
  const html = state.forgotSent ? `

      </div>
    </div>
  ` : `
    <div class="page no-scroll">
      <div class="topbar">
        <button class="backbtn" id="forgotBackBtn" aria-label="Go back">${icon('chevronLeft')}</button>
      </div>
      <div style="flex:1;overflow-y:hidden;padding:20px 20px 24px;min-height:0;">
        <h1 class="step-title">Reset your password</h1>
        <p class="step-sub">Enter your email and we'll send you a link to reset it.</p>
        <div class="field" style="margin-bottom:0;">
          <label>Email address</label>
          <input id="forgotEmailInput" class="${e.forgotEmail?'error':''}" type="email" autocomplete="email" inputmode="email" enterkeyhint="go" value="${escapeAttr(state.forgotEmail)}" placeholder="you@example.com" />
          ${e.forgotEmail?`<p class="hint" style="color:var(--red);">${e.forgotEmail}</p>`:""}
        </div>
      </div>
      <div style="padding:16px 20px;border-top:1px solid var(--border);background:var(--white);flex-shrink:0;">
        <button class="primary-btn" id="sendResetBtn">Send reset link</button>
      </div>
    </div>
  `;
  root.innerHTML = `<div class="shell">${html}</div>`;
  resetScroll(root);
  const backBtn = document.getElementById("forgotBackBtn");
  if (backBtn) backBtn.addEventListener("click", ()=>{ setState({ authView:"login", forgotErrors:{} }); });
  const backToLoginBtn = document.getElementById("backToLoginBtn");
  if (backToLoginBtn) backToLoginBtn.addEventListener("click", ()=>{ setState({ authView:"login", forgotSent:false, forgotEmail:"", forgotErrors:{} }); });
  const sendBtn = document.getElementById("sendResetBtn");
  const emailInput = document.getElementById("forgotEmailInput");
  const doSend = async ()=>{
    if (state.forgotBusy) return;
    const email = (emailInput?.value||"").trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ setState({ forgotErrors:{forgotEmail:"Enter a valid email address."} }); return; }
    state.forgotBusy = true; state.forgotEmail = email;
    if (sendBtn){ sendBtn.disabled=true; sendBtn.textContent="Sending…"; }
    try{
      await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}/business-auth` });
      state.forgotBusy = false;
      setState({ forgotSent:true, forgotErrors:{} });
    }catch(err){
      state.forgotBusy = false;
      setState({ forgotErrors:{forgotEmail: err?.message || "We couldn't send that email. Please try again."} });
    }
  };
  if (sendBtn) sendBtn.addEventListener("click", doSend);
  if (emailInput) bindEnterKeyAdvance(["forgotEmailInput"], doSend);
}

            <button type="button" class="password-toggle" id="toggleNewPasswordBtn" aria-label="${state.showNewPassword?'Hide password':'Show password'}">${icon(state.showNewPassword?'eyeOff':'eye')}</button>

  const pwInput = document.getElementById("newPasswordInput");
  const doSubmit = async ()=>{

    if (submitBtn){ submitBtn.disabled=true; submitBtn.textContent="Updating…"; }
    try{

    }
  };
  if (submitBtn) submitBtn.addEventListener("click", doSubmit);
  if (pwInput) bindEnterKeyAdvance(["newPasswordInput"], doSubmit);
}

function render(){
  const root = document.getElementById("root");

  if (!state.registered){
    if(state.awaitingEmailConfirmation){
      root.innerHTML = `<div class="shell">${renderAwaitingEmailConfirmation()}</div>`;
      resetScroll(root);
      bindAwaitingEmailConfirmation();
    }else if (state.authView === "login") renderLoginFlow(root);
    else if (state.authView === "forgotPassword") renderForgotPassword(root);
    else if (state.authView === "resetPassword") renderResetPassword(root);
    else renderAuthFlow(root);
    return;
  }

  if (state.launched){
    root.innerHTML = `<div class="shell">${renderLaunched()}</div>`;
    resetScroll(root);
    const dashboardBtn=document.getElementById("goToDashboardBtn");
    if(dashboardBtn) dashboardBtn.addEventListener("click",()=>{ window.location.href=adminDestination(); });
    return;
  }

  const meta = STEP_META[state.step];
  let body = "";
  if (state.step===0) body = renderBusinessStep();
  else if (state.step===1) body = renderHoursStep();
  else if (state.step===2) body = renderReviewStep();

  const isLast = state.step === STEP_META.length - 1;
  const nextLabel = isLast ? "Finish setup" : "Continue";
  const dots = STEP_META.map((_, i)=>{
    const cls = i===state.step ? 'current' : (i<state.step ? 'done' : 'upcoming');
    return `<div class="dot ${cls}"></div>`;
  }).join("");

  const html = `
    <div class="page">
      <div class="topbar">
        <button class="backbtn" id="backBtn" aria-label="Go back">${icon('chevronLeft')}</button>
        <div class="stepdots">${dots}</div>
      </div>
      <div style="flex:1;overflow-y:auto;padding:20px 20px 24px;min-height:0;">
        <h1 class="step-title">${meta.title}</h1>
        <p class="step-sub">${meta.sub}</p>
        ${body}
      </div>
      <div style="padding:16px 20px;border-top:1px solid var(--border);background:var(--white);flex-shrink:0;">
        <button class="primary-btn" id="nextBtn">${nextLabel}</button>
      </div>
    </div>
  `;

  root.innerHTML = `<div class="shell">${html}</div>`;
  resetScroll(root);
  bindEvents();
}

/* ---------------------------------------------------
   EVENT BINDING: REGISTRATION
--------------------------------------------------- */
function bindAuthEvents(){
  const authBackBtn = document.getElementById("authBackBtn");
  if (authBackBtn) authBackBtn.addEventListener("click", ()=>{
    if (state.authStep>0) setState({ authStep: state.authStep-1 });
  });

  const authNextBtn = document.getElementById("authNextBtn");
  if (authNextBtn) authNextBtn.addEventListener("click", async ()=>{
    if (state.authBusy) return;
    if (state.authStep===0){
      const errors = validateEmailStep();
      if (Object.keys(errors).length){ setState({ regErrors: errors }); return; }
      state.authBusy = true; authNextBtn.disabled = true; authNextBtn.textContent = "Checking…";
      try{
        const email=state.email.trim();
        if(await bloomaAccountEmailExists(email)){
          state.authBusy=false;
          setState({authView:"login",loginEmail:email,loginPassword:"",loginErrors:{},regErrors:{}});
          return;
        }
        setState({ authStep: 1, regErrors: {}, emailConfirmationSent:false, emailConfirmed:false, authBusy:false });
      }catch(err){
        state.authBusy = false;
        setState({ regErrors:{ email: err.message || "We couldn't check that email. Try again." } });
      }
      return;
    }
    const errors = validateDetailsStep();
    if (Object.keys(errors).length){ setState({ regErrors: errors }); return; }
    state.authBusy = true; authNextBtn.disabled = true; authNextBtn.textContent = "Creating…";
    try{
      let result;
      if(state.emailConfirmed){
        await finishLegacyConfirmedVenueAccount();
        result={session:(await supabaseClient.auth.getSession()).data.session};
      }else{
        result=await createVenueAccount();
      }
      clearRegistrationDraft();
      if(result?.session){ setState({ registered:true, regErrors:{}, authBusy:false, emailConfirmed:true }); }
      else setState({ awaitingEmailConfirmation:true, emailConfirmationSent:true, regErrors:{}, authBusy:false });
    }catch(err){
      state.authBusy = false;
      const msg=err.message || "We couldn't finish creating your account.";
      if(/confirmation email has already been sent/i.test(msg)) setState({awaitingEmailConfirmation:true,emailConfirmationSent:true,regErrors:{},authBusy:false});
      else setState({ regErrors:{ confirmation: msg } });
    }
  });

  const emailInput = document.getElementById("emailInput");
  if (emailInput) emailInput.addEventListener("input", e=>{ state.email = e.target.value; persistRegistrationDraft(); });
  const firstNameInput = document.getElementById("firstNameInput");
  if (firstNameInput) firstNameInput.addEventListener("input", e=>{ state.firstName = e.target.value; persistRegistrationDraft(); });
  const lastNameInput = document.getElementById("lastNameInput");
  if (lastNameInput) lastNameInput.addEventListener("input", e=>{ state.lastName = e.target.value; persistRegistrationDraft(); });
  const regPhoneInput = document.getElementById("regPhoneInput");
  if (regPhoneInput) regPhoneInput.addEventListener("input", e=>{ state.regPhone = e.target.value; persistRegistrationDraft(); });
  const passwordInput = document.getElementById("passwordInput");
  if (passwordInput) passwordInput.addEventListener("input", e=>{ state.password = e.target.value; persistRegistrationDraft(); });
  const togglePasswordBtn = document.getElementById("togglePasswordBtn");
  if (togglePasswordBtn) togglePasswordBtn.addEventListener("click", ()=> setState({ showPassword: !state.showPassword }));
  const termsRow = document.getElementById("termsRow");
  if (termsRow) termsRow.addEventListener("click", e=>{
    if (e.target.closest("[data-legal-link]")) return;
    state.acceptedTerms=!state.acceptedTerms;
    const box=document.getElementById("termsCheckboxBox");
    if(box){ box.classList.toggle("checked",state.acceptedTerms); box.classList.remove("error"); box.innerHTML=state.acceptedTerms?icon("checkSmall"):""; }
    const termsError=document.querySelector("[data-terms-error]"); if(termsError) termsError.remove();
    persistRegistrationDraft();
  });
  document.querySelectorAll("[data-legal-link]").forEach(a=>a.addEventListener("click", e=>{
    e.stopPropagation();
    persistRegistrationDraft();
  }));

  const gotoLoginLink = document.getElementById("gotoLoginLink");
  if (gotoLoginLink) gotoLoginLink.addEventListener("click", ()=> setState({ authView: "login", loginErrors: {} }));

  if (authNextBtn){
    const fieldIds = state.authStep===0 ? ["emailInput"] : ["firstNameInput","lastNameInput","regPhoneInput","passwordInput"];
    bindEnterKeyAdvance(fieldIds, ()=>authNextBtn.click());
  }
}

/* ---------------------------------------------------
   EVENT BINDING: LOGIN
--------------------------------------------------- */
function bindLoginEvents(){
  const loginNextBtn = document.getElementById("loginNextBtn");
  if (loginNextBtn) loginNextBtn.addEventListener("click", async ()=>{
    const errors = validateLoginStep();
    if (Object.keys(errors).length){ setState({ loginErrors: errors }); return; }
    loginNextBtn.disabled = true; loginNextBtn.textContent = "Logging in…";
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email:state.loginEmail.trim(), password:state.loginPassword });
    if (error){ setState({ loginErrors:{ loginPassword:error.message || "Unable to log in" } }); return; }
    const [{data:profile},{data:owner}]=await Promise.all([
      supabaseClient.from("user_profiles").select("account_type,first_name,last_name,phone").eq("user_id",data.user.id).maybeSingle(),
      supabaseClient.from("owner_profiles").select("salon_id").eq("user_id",data.user.id).maybeSingle()
    ]);
    const accountType=String(profile?.account_type||data.user.user_metadata?.account_type||(owner?.salon_id?"venue":"customer")).toLowerCase();
    if(accountType!=="venue"){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      setState({ loginErrors:{ loginPassword:"That login belongs to a Blooma customer account. Venue and customer accounts are separate." } });
      return;
    }
    let ownerSalonId=owner?.salon_id||null;
    if(!ownerSalonId && new URLSearchParams(location.search).get("staff_invite")){
      ownerSalonId=await tryAcceptStaffInviteFromUrl();
    }
    if (ownerSalonId){ clearVenueDraft(); window.location.href = adminDestination(); return; }
    const signedEmail=data.user.email||state.loginEmail.trim();
    state.email=signedEmail;
    try{
      const remoteDraft=await loadMyVenueDraftRemote();
      if(remoteDraft) applyRemoteVenueDraft(remoteDraft);
      else restoreVenueDraft(signedEmail);
    }catch(err){
      console.warn("Blooma venue draft resume",err);
      restoreVenueDraft(signedEmail);
    }
    setState({
      registered:true, awaitingEmailConfirmation:false, loginErrors:{}, email:signedEmail, emailConfirmed:!!data.user.email_confirmed_at,
      firstName:profile?.first_name||"", lastName:profile?.last_name||"", regPhone:profile?.phone||"",
      phone:state.phone||profile?.phone||""
    });
  });

  const loginEmailInput = document.getElementById("loginEmailInput");
  if (loginEmailInput) loginEmailInput.addEventListener("input", e=>{ state.loginEmail = e.target.value; });
  const loginPasswordInput = document.getElementById("loginPasswordInput");
  if (loginPasswordInput) loginPasswordInput.addEventListener("input", e=>{ state.loginPassword = e.target.value; });
  const toggleLoginPasswordBtn = document.getElementById("toggleLoginPasswordBtn");
  if (toggleLoginPasswordBtn) toggleLoginPasswordBtn.addEventListener("click", ()=> setState({ showLoginPassword: !state.showLoginPassword }));

  const gotoRegisterLink = document.getElementById("gotoRegisterLink");
  if (gotoRegisterLink) gotoRegisterLink.addEventListener("click", ()=> setState({ authView: "register", authStep: 0, regErrors: {} }));

  const forgotPasswordLink = document.getElementById("forgotPasswordLink");
  if (forgotPasswordLink) forgotPasswordLink.addEventListener("click", ()=>{ setState({ authView:"forgotPassword", forgotEmail: state.loginEmail.trim(), forgotSent:false, forgotErrors:{} }); });

  if (loginNextBtn){
    bindEnterKeyAdvance(["loginEmailInput","loginPasswordInput"], ()=>loginNextBtn.click());
  }
}

/* ---------------------------------------------------
   EVENT BINDING
--------------------------------------------------- */
function bindEvents(){
  const backBtn = document.getElementById("backBtn");
  if (backBtn) backBtn.addEventListener("click", ()=>{
    if (state.step>0) setState({ step: state.step-1 });
    else if (state.authView === "login") setState({ registered: false });
    else setState({ registered: false, authStep: 1 });
  });

  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", async ()=>{
    if (state.step===0){
      const errors = validateBusinessStep();
      if (Object.keys(errors).length){ setState({ errors }); return; }
      setState({ step: 1, errors: {} });
      return;
    }
    if (state.step < STEP_META.length - 1){
      setState({ step: state.step + 1 });
      return;
    }
    // final step — save the complete draft first. Email confirmation finishes the hidden venue automatically.
    if (DAY_NAMES.every(d=>!state.hours[d].open)){
      return;
    }
    nextBtn.disabled = true; nextBtn.textContent = "Saving setup…";
    try{
      state.draftReady=true;
      persistVenueDraft();
      await saveVenueDraftRemote(true);
      const {data:{session}}=await supabaseClient.auth.getSession();
      const emailConfirmed=!!session?.user?.email_confirmed_at;
      if(!session || !emailConfirmed){
        state.registered=false;
        state.awaitingEmailConfirmation=true;
        state.emailConfirmationSent=true;
        render();
        return;
      }
      nextBtn.textContent = "Creating venue…";
      await finalizeVenueDraftRemote();
      clearVenueDraft();
      state.launched=true;
      state.awaitingEmailConfirmation=false;
      state.errors={};
      render();
    }catch(err){
      state.draftReady=false;
      setState({ errors:{...state.errors, launch:err.message || "We couldn't save your venue setup. Try again."} });
    }
  });

  // step 0 — business
  const nameInput = document.getElementById("nameInput");
  if (nameInput) nameInput.addEventListener("input", e=>{ state.name = e.target.value; });
  const addressInput = document.getElementById("addressInput");
  if (addressInput) addressInput.addEventListener("input", e=>{ state.address = e.target.value; });
  const cityInput = document.getElementById("cityInput");
  if (cityInput) cityInput.addEventListener("input", e=>{ state.city = e.target.value; });
  const regionInput = document.getElementById("regionInput");
  if (regionInput) regionInput.addEventListener("input", e=>{ state.region = e.target.value; });
  const phoneInput = document.getElementById("phoneInput");
  if (phoneInput) phoneInput.addEventListener("input", e=>{ state.phone = e.target.value; });
  const descInput = document.getElementById("descInput");
  if (descInput) descInput.addEventListener("input", e=>{ state.description = e.target.value; });
  document.querySelectorAll("[data-togglecat]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const cat = btn.getAttribute("data-togglecat");
      const set = new Set(state.categories);
      if (set.has(cat)) set.delete(cat); else set.add(cat);
      setState({ categories: Array.from(set) });
    });
  });

  // step 1 — hours
  document.querySelectorAll("[data-toggleday]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const d = btn.getAttribute("data-toggleday");
      state.hours[d].open = !state.hours[d].open;
      setState({});
    });
  });
  document.querySelectorAll("[data-daystart]").forEach(sel=>{
    sel.addEventListener("change", e=>{ state.hours[sel.getAttribute("data-daystart")].start = e.target.value; });
  });
  document.querySelectorAll("[data-dayend]").forEach(sel=>{
    sel.addEventListener("change", e=>{ state.hours[sel.getAttribute("data-dayend")].end = e.target.value; });
  });

  // step 2 — services
  const addServiceBtn = document.querySelector("[data-addservice]");
  if (addServiceBtn) addServiceBtn.addEventListener("click", ()=> setState({ addingService:true, svcName:"", svcDuration:"45", svcPrice:"" }));
  document.querySelectorAll("[data-editservice]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const s = state.services.find(x=>x.id===parseInt(btn.getAttribute("data-editservice"),10));
      if (s) setState({ editingServiceId: s.id, svcName: s.name, svcDuration: String(s.duration), svcPrice: String(s.price) });
    });
  });
  document.querySelectorAll("[data-deleteservice]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseInt(btn.getAttribute("data-deleteservice"),10);
      setState({ confirmDialog: { title:"Remove service?", message:"You can always add it back later.", confirmLabel:"Remove", actionType:"deleteService", actionId:id } });
    });
  });
  document.querySelectorAll("[data-dismissservicemodal]").forEach(el=>{
    el.addEventListener("click", (ev)=>{ if (ev.target===el || el.hasAttribute("data-dismissservicemodal")) setState({ addingService:false, editingServiceId:null }); });
  });
  const modalSheet1 = document.querySelector(".modal-overlay[data-dismissservicemodal] [data-modalsheet]");
  if (modalSheet1) modalSheet1.addEventListener("click", e=>e.stopPropagation());
  const svcNameInput = document.getElementById("svcNameInput");
  if (svcNameInput) svcNameInput.addEventListener("input", e=>{ state.svcName = e.target.value; syncServiceBtn(); });
  const svcDurationInput = document.getElementById("svcDurationInput");
  if (svcDurationInput) svcDurationInput.addEventListener("input", e=>{ state.svcDuration = e.target.value; syncServiceBtn(); });
  const svcPriceInput = document.getElementById("svcPriceInput");
  if (svcPriceInput) svcPriceInput.addEventListener("input", e=>{ state.svcPrice = e.target.value; syncServiceBtn(); });
  const saveServiceBtn = document.getElementById("saveServiceBtn");
  if (saveServiceBtn) saveServiceBtn.addEventListener("click", ()=>{
    const name = state.svcName.trim();
    const duration = Math.max(15,Math.min(480,parseInt(state.svcDuration,10)||30));
    const price = Number(state.svcPrice);
    if (!name || !duration || isNaN(price)) return;
    if (state.editingServiceId){
      const s = state.services.find(x=>x.id===state.editingServiceId);
      if (s){ s.name=name; s.duration=duration; s.price=price; }
    } else {
      state.services.push({ id: serviceCounter++, name, duration, price });
    }
    setState({ addingService:false, editingServiceId:null });
  });

  // step 3 — team
  const addStylistBtn = document.querySelector("[data-addstylist]");
  if (addStylistBtn) addStylistBtn.addEventListener("click", ()=> setState({ addingStylist:true, stylistName:"", stylistSpecialty:"" }));
  document.querySelectorAll("[data-editstylist]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const t = state.team.find(x=>x.id===parseInt(btn.getAttribute("data-editstylist"),10));
      if (t) setState({ editingStylistId: t.id, stylistName: t.name, stylistSpecialty: t.specialty||"" });
    });
  });
  document.querySelectorAll("[data-deletestylist]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseInt(btn.getAttribute("data-deletestylist"),10);
      setState({ confirmDialog: { title:"Remove team member?", message:"You can always add them back later.", confirmLabel:"Remove", actionType:"deleteStylist", actionId:id } });
    });
  });
  document.querySelectorAll("[data-dismissstylistmodal]").forEach(el=>{
    el.addEventListener("click", (ev)=>{ if (ev.target===el || el.hasAttribute("data-dismissstylistmodal")) setState({ addingStylist:false, editingStylistId:null }); });
  });
  const stylistNameInput = document.getElementById("stylistNameInput");
  if (stylistNameInput) stylistNameInput.addEventListener("input", e=>{ state.stylistName = e.target.value; syncStylistBtn(); });
  const stylistSpecialtyInput = document.getElementById("stylistSpecialtyInput");
  if (stylistSpecialtyInput) stylistSpecialtyInput.addEventListener("input", e=>{ state.stylistSpecialty = e.target.value; });
  const saveStylistBtn = document.getElementById("saveStylistBtn");
  if (saveStylistBtn) saveStylistBtn.addEventListener("click", ()=>{
    const name = state.stylistName.trim();
    if (!name) return;
    const specialty = state.stylistSpecialty.trim();
    if (state.editingStylistId){
      const t = state.team.find(x=>x.id===state.editingStylistId);
      if (t){ t.name=name; t.specialty=specialty; }
    } else {
      state.team.push({ id: stylistCounter++, name, specialty });
    }
    setState({ addingStylist:false, editingStylistId:null });
  });

  // step 2 — review
  document.querySelectorAll("[data-gotostep]").forEach(btn=>{
    btn.addEventListener("click", ()=> setState({ step: parseInt(btn.getAttribute("data-gotostep"),10) }));
  });

  // confirm modal
  document.querySelectorAll("[data-dismissconfirm]").forEach(el=>{
    el.addEventListener("click", (ev)=>{ if (ev.target===el || el.hasAttribute("data-dismissconfirm")) setState({ confirmDialog:null }); });
  });
  const confirmActionBtn = document.querySelector("[data-confirmaction]");
  if (confirmActionBtn) confirmActionBtn.addEventListener("click", ()=>{
    const cd = state.confirmDialog;
    if (!cd) return;
    if (cd.actionType==="deleteService"){
      const idx = state.services.findIndex(x=>x.id===cd.actionId);
      if (idx>-1) state.services.splice(idx,1);
    } else if (cd.actionType==="deleteStylist"){
      const idx = state.team.findIndex(x=>x.id===cd.actionId);
      if (idx>-1) state.team.splice(idx,1);
    }
    setState({ confirmDialog:null });
  });

  // autosave any text/select change after the field-specific state handler has run
  document.querySelectorAll("input,textarea,select").forEach(el=>{
    el.addEventListener("input",()=>queueVenueDraftSync());
    el.addEventListener("change",()=>queueVenueDraftSync());
  });

  // stop modal sheet clicks from closing the overlay
  document.querySelectorAll("[data-modalsheet]").forEach(el=>{
    el.addEventListener("click", ev=> ev.stopPropagation());
  });
}

function syncServiceBtn(){
  const canSave = state.svcName.trim().length > 0 && Number(state.svcDuration) >= 15 && Number(state.svcDuration) <= 480 && state.svcPrice.trim().length > 0 && !isNaN(Number(state.svcPrice));
  const btn = document.getElementById("saveServiceBtn");
  if (btn) btn.disabled = !canSave;
}
function syncStylistBtn(){
  const btn = document.getElementById("saveStylistBtn");
  if (btn) btn.disabled = state.stylistName.trim().length === 0;
}

window.addEventListener("pagehide", ()=>{ persistRegistrationDraft(); persistVenueDraft(); });

async function bootstrapVenuePage(){
  if(inPasswordRecovery) return;
  const params=new URLSearchParams(location.search);
  const confirmedReturn=params.get("confirmed")==="1";
  const pending=getPendingVenueDraft();
  const requestedDraftId=params.get("draft") || pending?.draftId || "";
  let remoteDraft=null;
  try{
    if(requestedDraftId){
      try{
        remoteDraft=await loadVenueDraftRemote(requestedDraftId);
        if(remoteDraft) applyRemoteVenueDraft(remoteDraft);
      }catch(err){ console.warn("Blooma draft link",err); }
    }

    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session){
      if(remoteDraft){
        state.emailConfirmationSent=true;
        if(state.draftStatus==="completed"){
          state.authView="login";
          state.loginEmail=state.email;
          state.registered=false;
          state.awaitingEmailConfirmation=false;
        }else if(state.draftReady){
          state.registered=false;
          state.awaitingEmailConfirmation=true;
        }else{
          state.registered=true;
          state.awaitingEmailConfirmation=false;
        }
      }else{
        restoreRegistrationDraft();
      }
      if(/^https?:$/.test(location.protocol) && params.has("confirmed")) history.replaceState({},"","/business-auth");
      render();
      return;
    }

    const [{data:profile},{data:owner}]=await Promise.all([
      supabaseClient.from("user_profiles").select("account_type,first_name,last_name,phone").eq("user_id",session.user.id).maybeSingle(),
      supabaseClient.from("owner_profiles").select("salon_id").eq("user_id",session.user.id).maybeSingle()
    ]);
    const accountType=String(profile?.account_type||session.user.user_metadata?.account_type||(owner?.salon_id?"venue":"customer")).toLowerCase();
    if(accountType!=="venue"){
      const wrongEmail=session.user.email||"";
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      state.authView="login";
      state.loginEmail=wrongEmail;
      state.registered=false;
      state.awaitingEmailConfirmation=false;
      state.loginErrors={loginPassword:"This is a Blooma customer account. Venue and customer accounts are separate."};
      render();
      return;
    }

    state.email=session.user.email||state.email;
    state.firstName=profile?.first_name||state.firstName;
    state.lastName=profile?.last_name||state.lastName;
    state.regPhone=profile?.phone||state.regPhone;
    state.phone=state.phone||profile?.phone||"";
    state.emailConfirmed=!!session.user.email_confirmed_at;
    state.emailConfirmationSent=confirmedReturn||state.emailConfirmationSent;

    let ownerSalonId=owner?.salon_id||null;
    if(!ownerSalonId && new URLSearchParams(location.search).get("staff_invite")){
      ownerSalonId=await tryAcceptStaffInviteFromUrl();
    }

    if(!remoteDraft){
      try{
        remoteDraft=await loadMyVenueDraftRemote();
        if(remoteDraft) applyRemoteVenueDraft(remoteDraft);
      }catch(err){ console.warn("Blooma authenticated draft resume",err); }
    }

    if(ownerSalonId){
      if(confirmedReturn && remoteDraft?.status==="completed"){
        state.salonId=ownerSalonId;
        state.registered=true;
        state.launched=true;
        state.awaitingEmailConfirmation=false;
        clearVenueDraft();
        if(/^https?:$/.test(location.protocol)) history.replaceState({},"","/business-auth");
        render();
        return;
      }
      clearVenueDraft();
      window.location.replace(adminDestination());
      return;
    }

    if(remoteDraft) applyRemoteVenueDraft(remoteDraft);
    else restoreVenueDraft(state.email);
    state.registered=true;
    state.awaitingEmailConfirmation=false;

    if(confirmedReturn && state.emailConfirmed && remoteDraft?.ready_to_finalize){
      try{
        await finalizeVenueDraftRemote();
        clearVenueDraft();
        state.launched=true;
        state.registered=true;
        state.awaitingEmailConfirmation=false;
      }catch(err){
        state.errors={...state.errors,launch:err.message||"We couldn't finish creating your venue. Your setup is still saved."};
      }
    }

    if(/^https?:$/.test(location.protocol) && (params.has("confirmed")||params.has("draft"))) history.replaceState({},"","/business-auth");
  }catch(e){
    console.warn("Blooma venue auth bootstrap",e);
    if(!state.registered && !state.awaitingEmailConfirmation) restoreRegistrationDraft();
  }
  render();
}
bootstrapVenuePage();
</script>
