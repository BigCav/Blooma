<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Blooma</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#FAF9FD;color:#241F33;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
  }
  .card{text-align:center;max-width:380px;}
  .icon{width:72px;height:72px;border-radius:20px;background:#F1ECFB;color:#7C5CD9;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0 0 10px;}
  p{font-size:14.5px;color:#6B6285;line-height:1.6;margin:0 0 28px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;padding:13px 26px;background:#7C5CD9;color:#fff;transition:background .15s;}
  .btn:hover{background:#6D4DC7;}
  .sub-link{display:block;margin-top:20px;font-size:13px;color:#8A80AD;text-decoration:underline;}
</style>
</head><body>
<script>
if(/^\/venue\/[^/]+\/?$/i.test(location.pathname)){
  fetch('/index.html',{cache:'no-store'}).then(r=>r.text()).then(html=>{document.open();document.write(html);document.close()});
}else{
  document.body.innerHTML=`
    <div class="card">
      <div class="icon"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></div>
      <h1>Page not found</h1>
      <p>That page doesn't exist, or may have moved. Let's get you back on track.</p>
      <a class="btn" href="/">Back to Blooma</a>
      <a class="sub-link" href="/for-business">Looking for venue tools?</a>
    </div>
  `;
}
</script>
</body></html>
