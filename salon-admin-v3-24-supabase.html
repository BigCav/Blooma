async function bootAdmin(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){
    document.getElementById("app").innerHTML=`<div class="shell"><div class="login-required"><div><h1 style="font-size:22px;margin:0 0 8px;">Log in to your venue</h1><p style="font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;">Use your venue account before opening the owner dashboard.</p><button class="primary-btn" onclick="location.href=(location.protocol==='file:'?'salon-onboarding-supabase.html':'/business-auth?view=login')">Log in</button></div></div></div>`;
    return;
  }
  const [{data:profile},{data:owner,error:ownerError}]=await Promise.all([
    supabaseClient.from("user_profiles").select("account_type").eq("user_id",session.user.id).maybeSingle(),
    supabaseClient.from("owner_profiles").select("salon_id,role").eq("user_id",session.user.id).maybeSingle()
  ]);
  const accountType=String(profile?.account_type||session.user.user_metadata?.account_type||(owner?.salon_id?"venue":"customer")).toLowerCase();
  if(accountType!=="venue"){
    try{ await supabaseClient.auth.signOut(); }catch(e){}
    document.getElementById("app").innerHTML=`<div class="shell"><div class="login-required"><div><h1 style="font-size:22px;margin:0 0 8px;">Venue account required</h1><p style="font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;">Customer accounts cannot be used in Blooma for Business.</p><button class="primary-btn" onclick="location.href=(location.protocol==='file:'?'salon-onboarding-supabase.html':'/business-auth?view=login')">Venue log in</button></div></div></div>`;
    return;
  }
  if(ownerError) cloudError=ownerError.message;
  if(!owner?.salon_id){
    document.getElementById("app").innerHTML=`<div class="shell"><div class="login-required"><div><h1 style="font-size:22px;margin:0 0 8px;">Finish venue setup</h1><p style="font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0 0 18px;">This account doesn't have a venue yet.</p><button class="primary-btn" onclick="location.href=(location.protocol==='file:'?'salon-onboarding-supabase.html':'/business-auth?view=register')">Set up venue</button></div></div></div>`;
    return;
  }
  currentSalonId=owner.salon_id;
  currentUserRole=owner.role||"owner";
  currentUserId=session.user.id;
  try{ await reloadAdminConfigFromCloud(); }catch(err){ cloudError=err.message||"Unable to load venue configuration"; }
  try{ await loadOperationalData(); }catch(err){ cloudError=err.message||"Unable to load venue data"; }
  if(isOwner()){ try{ await loadTeamData(); }catch(err){ console.warn("Blooma team load",err); } }
  cloudReady=!cloudError;
  document.title=salon.name?`${salon.name} — Blooma Admin`:"Blooma — Venue Admin";
  render();
}

/* ---------------------------------------------------
   ROOT RENDER
--------------------------------------------------- */
const TABS = [
  {key:"dashboard", label:"Home", icon:"home"},
  {key:"schedule", label:"Schedule", icon:"calendar"},
  {key:"manage", label:"Manage", icon:"grid"},
  {key:"addons", label:"Add-ons", icon:"trendingUp"},
  {key:"settings", label:"Settings", icon:"gear"},
];

let lastRenderedTab = null;
let chipRowScrollLeft = 0;
function render(){
  const pageEl = document.getElementById("pageContent");
  const prevScrollTop = pageEl ? pageEl.scrollTop : 0;
  const sameTab = lastRenderedTab === state.tab;
  lastRenderedTab = state.tab;

  // save chip-row scroll before re-render
  const prevChipRow = document.querySelector(".chip-row");
  if (prevChipRow) chipRowScrollLeft = prevChipRow.scrollLeft;

  const active = document.activeElement;
  let focusId = null, selStart = null, selEnd = null;
  if (active && active.id && (active.tagName==="INPUT" || active.tagName==="TEXTAREA")){
    focusId = active.id;
    selStart = active.selectionStart;
    selEnd = active.selectionEnd;
  }

  let content = "";
  if (state.tab==="dashboard") content = renderDashboard();
  else if (state.tab==="schedule") content = renderSchedule();
  else if (state.tab==="manage") content = renderManage();
  else if (state.tab==="addons") content = renderAddons();
  else if (state.tab==="settings") content = renderSettings();

  document.getElementById("app").innerHTML = `
    <div class="shell">
      <nav class="sidebar-nav">
        <div class="sidebar-brand">Blooma</div>
        <div class="sidebar-links">
          ${TABS.map(t=>`
            <button class="sidebar-link ${state.tab===t.key?'active':''}" data-tab="${t.key}">
              ${icon(t.icon)}
              <span>${t.label}</span>
            </button>
          `).join("")}
        </div>
        <div class="owner-badge"><span class="owner-badge-dot"></span><span class="label">Owner view</span></div>
      </nav>
      <div class="main-column">
        <div class="admin-header">
          <span class="brand-logo">Blooma</span>
          <div class="owner-badge"><span class="owner-badge-dot"></span><span class="label">Owner view</span></div>
        </div>
        <div class="page-content no-scrollbar ${state.tab==='settings'?'has-footer':''}" id="pageContent">${content}</div>
        ${state.tab==='settings' ? `
        <div class="settings-footer" id="settingsFooter">
          <button class="primary-btn" data-savesettings>${state.settingsSaved ? `${icon('check')} Saved` : "Save changes"}</button>
        </div>` : ""}
        <div class="tab-bar">
          ${TABS.map(t=>`
            <button class="tab-btn ${state.tab===t.key?'active':''}" data-tab="${t.key}">
              ${icon(t.icon)}
              <span>${t.label}</span>
            </button>
          `).join("")}
        </div>
      </div>
      ${renderConfirmModal()}
      ${state.tab==='addons' && state.viewingAddonId ? renderAddonDetail(ADDONS.find(a=>a.id===state.viewingAddonId)) : ""}
      ${state.tab==='settings' ? cityPickerMarkup() : ""}
    </div>
  `;
  bindEvents();

  const newPageEl = document.getElementById("pageContent");
  if (newPageEl) newPageEl.scrollTop = sameTab ? prevScrollTop : 0;

  // restore chip-row scroll position (prevents snap-back on re-render)
  const newChipRow = document.querySelector(".chip-row");
  if (newChipRow && sameTab) newChipRow.scrollLeft = chipRowScrollLeft;

  const settingsFooter = document.getElementById("settingsFooter");
  const tabBarEl = document.querySelector(".tab-bar");
  if (settingsFooter && tabBarEl) settingsFooter.style.bottom = tabBarEl.offsetHeight + "px";

  if (focusId){
    const el = document.getElementById(focusId);
    if (el){
      el.focus();
      if (typeof selStart==="number" && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }
    }
  }
}

/* ---------------------------------------------------
   EVENTS
--------------------------------------------------- */
function bindEvents(){
  document.querySelectorAll("[data-tab]").forEach(btn=>{
    btn.addEventListener("click", ()=> setState({ tab: btn.getAttribute("data-tab"), viewingAddonId: null }));
  });

  document.querySelectorAll("[data-addonview]").forEach(btn=>{
    btn.addEventListener("click", ()=> setState({ viewingAddonId: btn.getAttribute("data-addonview") }));
  });
  document.querySelectorAll("[data-closeaddondetail]").forEach(btn=>{
    btn.addEventListener("click", ()=> setState({ viewingAddonId: null }));
  });

  // booking card tap-to-expand — applies wherever booking cards render (dashboard + schedule)
  document.querySelectorAll("[data-bookingcard]").forEach(card=>{
    card.addEventListener("click", (e)=>{
      if (e.target.closest("button")) return;
      const id = parseInt(card.getAttribute("data-bookingcard"),10);
      const isExpanded = state.expandedBookingIds.includes(id);
      const next = isExpanded ? state.expandedBookingIds.filter(x=>x!==id) : [...state.expandedBookingIds, id];
      setState({ expandedBookingIds: next });
    });
  });

  // confirm modal — replaces native window.confirm across the app
  document.querySelectorAll("[data-dismissconfirm]").forEach(el=>{
    el.addEventListener("click", ()=> setState({ confirmDialog: null }));
  });
  document.querySelectorAll("[data-viewwaitlist]").forEach(el=>{
    el.addEventListener("click", ()=> setState({ tab:"schedule", scheduleFilter:"waitlist", scheduleSearch:"" }));
  });
  document.querySelectorAll("[data-quickaction]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const action = el.getAttribute("data-quickaction");
      if (action==="newbooking") setState({ tab:"schedule", scheduleFilter:"upcoming", addingBooking:true, bookingPrefill:null, convertingWaitlistId:null });
      else if (action==="schedule") setState({ tab:"schedule" });
      else if (action==="services") setState({ tab:"manage", manageView:"services" });
    });
  });
  const modalCard = document.querySelector("[data-modalcard]");
  if (modalCard) modalCard.addEventListener("click", e=> e.stopPropagation());
  const confirmActionBtn = document.querySelector("[data-confirmaction]");
  if (confirmActionBtn) confirmActionBtn.addEventListener("click", async ()=>{
    const cd = state.confirmDialog;
    if (!cd) return;
    if (cd.actionType==="cancelBooking"){
      const b = bookings.find(x=>x.id===cd.actionId);
      if (b){ try{ await persistBookingStatus(b.id,"cancelled"); b.status="cancelled"; }catch(err){ cloudError=err.message||"Booking could not be cancelled"; } }
    } else if (cd.actionType==="deleteService"){
      salon.services = salon.services.filter(x=>x.id!==cd.actionId);
    } else if (cd.actionType==="deleteStylist"){
      salon.stylists = salon.stylists.filter(x=>x.id!==cd.actionId);
    } else if (cd.actionType==="deleteCategory"){
      const hadServices=salon.services.some(s=>s.category===cd.actionId);
      salon.categories = salon.categories.filter(x=>x!==cd.actionId);
      salon.services.forEach(s=>{ if (s.category===cd.actionId) s.category = "Uncategorized"; });
      if(hadServices && !salon.categories.includes("Uncategorized")) salon.categories.push("Uncategorized");
    } else if (cd.actionType==="deleteAddon"){
      const idx = addons.findIndex(x=>x.id===cd.actionId);
      if (idx>-1) addons.splice(idx,1);
    } else if (cd.actionType==="deleteBlockout"){
      const idx = blockouts.findIndex(x=>x.id===cd.actionId);
      if (idx>-1){ const bo=blockouts[idx]; try{ await deleteBlockoutCloud(bo); blockouts.splice(idx,1); }catch(err){ cloudError=err.message||"Block-out could not be deleted"; } }
    } else if (cd.actionType==="deletePromo"){
      const idx = promos.findIndex(x=>x.id===cd.actionId);
      if (idx>-1) promos.splice(idx,1);
    } else if (cd.actionType==="removeWaitlist"){
      const idx = waitlist.findIndex(x=>x.id===cd.actionId);
      if (idx>-1){ const w=waitlist[idx]; try{ await deleteWaitlistCloud(w); waitlist.splice(idx,1); }catch(err){ cloudError=err.message||"Waitlist entry could not be removed"; } }
    }
    if (["deleteService","deleteStylist","deleteCategory","deleteAddon","deletePromo"].includes(cd.actionType)) setTimeout(()=>saveAdminCloud().catch(err=>{cloudError=err.message||"Sync failed";render();}),0);
    setState({ confirmDialog: null });
  });

  if (state.tab==="schedule"){
    document.querySelectorAll("[data-schedfilter]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({ scheduleFilter: btn.getAttribute("data-schedfilter") }));
    });
    document.querySelectorAll("[data-schedview]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({ scheduleView: btn.getAttribute("data-schedview") }));
    });
    const searchInput = document.getElementById("scheduleSearchInput");
    if (searchInput) searchInput.addEventListener("input", e=> setState({ scheduleSearch: e.target.value }));
    const clearBtn = document.querySelector("[data-clearsearch]");
    if (clearBtn) clearBtn.addEventListener("click", ()=> setState({ scheduleSearch: "" }));
    document.querySelectorAll("[data-complete]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const b = bookings.find(x=>x.id===parseInt(btn.getAttribute("data-complete"),10));
        if (b){ try{ await persistBookingStatus(b.id,"completed"); b.status="completed"; cloudError=""; try{ await awardLoyaltyPoints(b); }catch(e){ console.warn("Loyalty award failed",e); } }catch(err){ cloudError=err.message||"Booking could not be completed"; } }
        render();
      });
    });
    document.querySelectorAll("[data-noshow]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const b = bookings.find(x=>x.id===parseInt(btn.getAttribute("data-noshow"),10));
        if (b){ try{ await persistBookingStatus(b.id,"no_show"); b.status="no_show"; cloudError=""; }catch(err){ cloudError=err.message||"Booking could not be marked as a no-show"; } }
        render();
      });
    });
    document.querySelectorAll("[data-cancelbooking]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-cancelbooking"),10);
        setState({ confirmDialog: { title:"Cancel booking?", message:"This will mark the appointment as cancelled. The customer won't be automatically notified.", confirmLabel:"Cancel booking", actionType:"cancelBooking", actionId:id } });
      });
    });
    document.querySelectorAll("[data-booktheminbtn]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const w = waitlist.find(x=>x.id===btn.getAttribute("data-booktheminbtn"));
        if (!w) return;
        setState({
          addingBooking: true,
          convertingWaitlistId: w.id,
          pendingAdminBookingRequestId: null,
          bookingPrefill: {
            customerName: w.customerName,
            phone: w.phone,
            serviceId: w.serviceId,
            stylistName: w.stylistName,
            dayOffset: w.dayOffset,
            timePref: w.timePref,
            notes: w.timePref && w.timePref!=="Any" ? `Waitlist request: prefers ${w.timePref.toLowerCase()} appointments.` : "",
          },
        });
      });
    });
    document.querySelectorAll("[data-notifywaitlist]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const w = waitlist.find(x=>x.id===btn.getAttribute("data-notifywaitlist"));
        if (w){ try{ await persistWaitlistStatus(w,"notified"); w.notified=true; cloudError=""; }catch(err){ cloudError=err.message||"Waitlist status could not be saved"; } }
        setState({});
      });
    });
    document.querySelectorAll("[data-removewaitlist]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-removewaitlist");
        setState({ confirmDialog: { title:"Remove from waitlist?", message:"This customer will no longer be waiting for a slot to open up.", confirmLabel:"Remove", actionType:"removeWaitlist", actionId:id } });
      });
    });
    const addBookingBtn = document.querySelector("[data-addbooking]");
    if (addBookingBtn) addBookingBtn.addEventListener("click", async ()=>{
      addBookingBtn.disabled=true;
      try{ await loadOperationalData(); cloudError=""; }catch(err){ cloudError=err?.message||"Availability could not be refreshed"; }
      setState({ addingBooking:true, bookingPrefill:null, convertingWaitlistId:null, pendingAdminBookingRequestId:null });
    });
    const cancelBookingFormBtn = document.querySelector("[data-cancelbooking-form]");
    if (cancelBookingFormBtn) cancelBookingFormBtn.addEventListener("click", ()=> setState({ addingBooking:false, bookingPrefill:null, convertingWaitlistId:null, pendingAdminBookingRequestId:null }));
    const existingCustomerSelect=document.getElementById("nbExistingCustomer");
    const bookingCustomers=knownBookingCustomers();
    if(existingCustomerSelect){
      existingCustomerSelect.addEventListener("change",()=>{
        const idx=existingCustomerSelect.value===""?null:Number(existingCustomerSelect.value);
        const c=idx==null?null:bookingCustomers[idx];
        if(!c) return;
        const n=document.getElementById("nbCustomerName"), p=document.getElementById("nbPhone");
        if(n) n.value=c.name||""; if(p) p.value=c.phone||"";
      });
      const clearSelectionIfEdited=()=>{
        if(existingCustomerSelect.value==="") return;
        const c=bookingCustomers[Number(existingCustomerSelect.value)];
        const n=document.getElementById("nbCustomerName")?.value.trim()||"";
        const p=document.getElementById("nbPhone")?.value.trim()||"";
        if(!c || n!==(c.name||"").trim() || p!==(c.phone||"").trim()) existingCustomerSelect.value="";
      };
      document.getElementById("nbCustomerName")?.addEventListener("input",clearSelectionIfEdited);
      document.getElementById("nbPhone")?.addEventListener("input",clearSelectionIfEdited);
    }
    document.getElementById("nbService")?.addEventListener("change",refreshManualBookingAvailability);
    document.getElementById("nbStylist")?.addEventListener("change",refreshManualBookingAvailability);
    document.getElementById("nbDayOffset")?.addEventListener("change",()=>{
      const serviceId=document.getElementById("nbService")?.value||"";
      const stylistName=document.getElementById("nbStylist")?.value||"";
      const day=Number(document.getElementById("nbDayOffset")?.value);
      const timeEl=document.getElementById("nbTime");
      const times=manualAvailableTimes(serviceId,stylistName,day);
      if(timeEl){ timeEl.innerHTML=times.length?times.map(t=>`<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join(""):`<option value="">No available times</option>`; timeEl.disabled=!times.length; }
      const save=document.querySelector("[data-savebooking]"); if(save) save.disabled=!times.length;
    });
    const saveBookingBtn = document.querySelector("[data-savebooking]");
    if (saveBookingBtn) saveBookingBtn.addEventListener("click", async ()=>{
      const nameInput = document.getElementById("nbCustomerName");
      const customerName = nameInput.value.trim();
      if (!customerName){
        nameInput.style.borderColor = "#C13B3B";
        return;
      }
      const serviceId = document.getElementById("nbService").value;
      const service = salon.services.find(s=>s.id===serviceId);
      const stylistName = document.getElementById("nbStylist").value;
      const dayOffset = parseInt(document.getElementById("nbDayOffset").value,10);
      const timeEl = document.getElementById("nbTime");
      const time = timeEl?.value||"";
      const phoneInput = document.getElementById("nbPhone");
      const phone = phoneInput.value.trim();
      if(phone.replace(/\D/g,"").length<6){ phoneInput.style.borderColor="#C13B3B"; phoneInput.focus(); return; }
      if(!Number.isFinite(dayOffset)||!time){ cloudError="Choose an available day and time."; render(); return; }
      const notes = document.getElementById("nbNotes").value.trim();
      const selectedCustomerIndex=existingCustomerSelect&&existingCustomerSelect.value!==""?Number(existingCustomerSelect.value):null;
      const selectedCustomer=selectedCustomerIndex==null?null:bookingCustomers[selectedCustomerIndex];
      if(!state.pendingAdminBookingRequestId) state.pendingAdminBookingRequestId=makeAdminBookingRequestId();
      const newBooking = {
        clientRequestId:state.pendingAdminBookingRequestId,
        id: bookingIdCounter++, customerName, customerUserId:selectedCustomer?.userId||null, serviceName: service ? service.name : "", serviceId, stylistName,
        dayOffset, time, price: service ? service.price : 0, status: "upcoming", phone: phone || undefined, notes: notes || undefined,
      };
      saveBookingBtn.disabled=true; saveBookingBtn.textContent="Saving…";
      try{
        const waitlistIdx=state.convertingWaitlistId?waitlist.findIndex(w=>w.id===state.convertingWaitlistId):-1;
        const convertingEntry=waitlistIdx>-1?waitlist[waitlistIdx]:null;
        if(state.convertingWaitlistId && !convertingEntry) throw new Error("This waitlist entry is no longer active. Refresh and try again.");
        if(convertingEntry) await persistBookingFromWaitlist(newBooking,convertingEntry); else await persistNewBooking(newBooking);
        bookings.push(newBooking);
        if(waitlistIdx>-1) waitlist.splice(waitlistIdx,1);
        cloudError="";
        setState({ addingBooking:false, bookingPrefill:null, convertingWaitlistId:null, pendingAdminBookingRequestId:null });
      }catch(err){
        cloudError=err?.message||"Booking could not be saved";
        saveBookingBtn.disabled=false; saveBookingBtn.textContent="Add booking";
        render();
      }
    });
  }

  if (state.tab==="dashboard"){
    document.querySelectorAll("[data-complete]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const b = bookings.find(x=>x.id===parseInt(btn.getAttribute("data-complete"),10));
        if (b){ try{ await persistBookingStatus(b.id,"completed"); b.status="completed"; cloudError=""; try{ await awardLoyaltyPoints(b); }catch(e){ console.warn("Loyalty award failed",e); } }catch(err){ cloudError=err.message||"Booking could not be completed"; } }
        render();
      });
    });
    document.querySelectorAll("[data-noshow]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const b = bookings.find(x=>x.id===parseInt(btn.getAttribute("data-noshow"),10));
        if (b){ try{ await persistBookingStatus(b.id,"no_show"); b.status="no_show"; cloudError=""; }catch(err){ cloudError=err.message||"Booking could not be marked as a no-show"; } }
        render();
      });
    });
    document.querySelectorAll("[data-cancelbooking]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-cancelbooking"),10);
        setState({ confirmDialog: { title:"Cancel booking?", message:"This will mark the appointment as cancelled. The customer won't be automatically notified.", confirmLabel:"Cancel booking", actionType:"cancelBooking", actionId:id } });
      });
    });
  }

  if (state.tab==="manage"){
    document.querySelectorAll("[data-manageview]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({
        manageView: btn.getAttribute("data-manageview"),
        addingService: false, addingAddon: false, addingPromo: false, addingBlockout: false, addingStylist: false, addingCategory: false,
        editingAddonId: null, editingPromoId: null, editingBlockoutId: null, editingServiceId: null, editingStylistId: null, editingCategory: null,
      }));
    });

    if (state.manageView==="venue"){
      const visBtn=document.querySelector("[data-togglevenuevisibility]");
      if(visBtn) visBtn.addEventListener("click",async ()=>{
        const before=salon.visible!==false;
        if(!before && !String(salon.mainImage||"").trim()){
          cloudError="Add a main image before showing your venue on Blooma.";
          render();
          return;
        }
        salon.visible=!before; render();
        try{await saveAdminCloud(); cloudError="";}
        catch(err){salon.visible=before; cloudError=err.message||"Venue visibility could not be saved"; render();}
      });
      const mainBtn=document.querySelector("[data-uploadvenuemain]");
      const mainInput=document.getElementById("venueMainImageInput");
      if(mainBtn&&mainInput){
        mainBtn.addEventListener("click",()=>mainInput.click());
        mainInput.addEventListener("change",async ()=>{
          const file=mainInput.files?.[0]; if(!file) return; mainBtn.disabled=true; mainBtn.textContent="Uploading…";
          try{await replaceVenueMainImage(file); cloudError="";}catch(err){cloudError=err.message||"Image upload failed";} render();
        });
      }
      const removeMain=document.querySelector("[data-removevenuemain]");
      if(removeMain) removeMain.addEventListener("click",async ()=>{
        if(salon.visible!==false){ cloudError="Hide your venue before removing its main image."; render(); return; }
        const old=salon.mainImage||""; salon.mainImage=""; render();
        try{await saveAdminCloud(); await deleteMediaUrl(old); cloudError="";}
        catch(err){salon.mainImage=old; cloudError=err.message||"Image could not be removed"; render();}
      });
      const galleryBtn=document.querySelector("[data-uploadvenuegallery]");
      const galleryInput=document.getElementById("venueGalleryInput");
      if(galleryBtn&&galleryInput){
        galleryBtn.addEventListener("click",()=>galleryInput.click());
        galleryInput.addEventListener("change",async ()=>{
          if(!galleryInput.files?.length) return; galleryBtn.disabled=true; galleryBtn.textContent="Uploading…";
          try{await addVenueGalleryImages(galleryInput.files); cloudError="";}catch(err){cloudError=err.message||"Images could not be uploaded";} render();
        });
      }
      document.querySelectorAll("[data-removevenuegallery]").forEach(btn=>btn.addEventListener("click",async ()=>{
        const i=Number(btn.getAttribute("data-removevenuegallery")); const before=(salon.galleryImages||[]).slice(); const old=before[i];
        salon.galleryImages=before.filter((_,idx)=>idx!==i); render();
        try{await saveAdminCloud(); await deleteMediaUrl(old);}
        catch(err){salon.galleryImages=before; cloudError=err.message||"Photo could not be removed"; render();}
      }));
    } else if (state.manageView==="services"){
      document.querySelectorAll("[data-toggleservice]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const s = salon.services.find(x=>x.id===btn.getAttribute("data-toggleservice"));
          if (s) s.active = !s.active;
          render();
        });
      });
      document.querySelectorAll("[data-editservice]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ editingServiceId: btn.getAttribute("data-editservice") }));
      });
      document.querySelectorAll("[data-donesvc]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ editingServiceId: null }));
      });
      document.querySelectorAll("[data-deleteservice]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-deleteservice");
          const s = salon.services.find(x=>x.id===id);
          setState({ confirmDialog: { title:"Delete service?", message:`"${s?s.name:"This service"}" will be removed and can't be recovered.`, confirmLabel:"Delete", actionType:"deleteService", actionId:id } });

    if (saveBtn) saveBtn.addEventListener("click", async ()=>{
      saveBtn.disabled=true; saveBtn.textContent="Saving…";
      try{ await saveAdminCloud(); cloudError=""; setState({settingsSaved:true}); }
      catch(err){ cloudError=err.message||"Save failed"; setState({settingsSaved:false}); }
      setTimeout(()=>{ if(state.tab==="settings") setState({settingsSaved:false}); },1600);
    });
  }

  document.querySelectorAll("[data-saveaddservice],[data-donesvc],[data-toggleservice],[data-togglenewservice],[data-saveaddstylist],[data-donestylist],[data-togglestylist],[data-saveaddon],[data-doneaddon],[data-savepromo],[data-donepromo],[data-togglepromo],[data-saveaddcategory],[data-donecategory]").forEach(btn=>{
    btn.addEventListener("click", ()=>setTimeout(()=>queueAdminSave().catch(()=>{}),0));
  });
}

let adminOperationalRefreshBusy=false;
async function refreshAdminOperationalData(){
  if(!currentSalonId || adminOperationalRefreshBusy || document.hidden) return;
  adminOperationalRefreshBusy=true;
  try{
    await loadOperationalData();
    if(state.tab==="dashboard" || state.tab==="schedule") render();
  }catch(err){
    console.warn("Blooma admin booking refresh failed",err);
  }finally{ adminOperationalRefreshBusy=false; }
}
window.addEventListener("focus", refreshAdminOperationalData);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) refreshAdminOperationalData(); });
setInterval(()=>{ if(state.tab==="dashboard" || state.tab==="schedule") refreshAdminOperationalData(); },15000);

bootAdmin();
</script>
</body>
