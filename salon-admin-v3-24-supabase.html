<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Blooma — Venue Admin</title>
<style>
  :root{
    --ink:#241F33;
    --ink-soft:#8A80AD;
    --ink-mute:#6B6285;
    --purple:#7C5CD9;
    --purple-dark:#6D4DC7;
    --purple-pastel:#F1ECFB;
    --purple-pastel-2:#F3EEFC;
    --border:#EFECF9;
    --border-2:#E9E4F7;
    --border-hover:#C9BBEF;
    --bg:#FAF9FD;
    --white:#FFFFFF;
    --placeholder:#B3ABCB;
    --disabled:#DED4F5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-x:none;
  }
  button{
    font-family:inherit;cursor:pointer;touch-action:manipulation;
    -webkit-appearance:none;appearance:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;margin:0;background:none;border:none;padding:0;
  }
  input,textarea{font-family:inherit;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  html,body,#app{height:100%;min-height:100%;}
  #app{width:100%;min-width:0;display:flex;justify-content:center;background:var(--bg);}
  .shell{width:100%;max-width:none;height:100dvh;min-height:0;position:relative;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  @supports not (height:100dvh){.shell{height:100vh;}}
  @media (min-width:640px) and (max-width:1023px){#app{padding:24px 0;}.shell{max-width:480px;height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 18px 60px rgba(36,31,51,.10);}}

  .sidebar-nav{display:none;}
  .main-column{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;}
  @media (min-width:1024px){
    #app{padding:0;align-items:stretch;}
    .shell{max-width:1280px;margin:0 auto;flex-direction:row;border-radius:0;box-shadow:none;height:100dvh;}
    .sidebar-nav{
      display:flex;flex-direction:column;width:248px;flex-shrink:0;background:var(--white);
      border-right:1px solid var(--border);padding:24px 16px;
    }
    .sidebar-brand{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.4px;padding:0 10px;margin-bottom:28px;}
    .sidebar-links{display:flex;flex-direction:column;gap:2px;flex:1;}
    .sidebar-link{
      display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;
      font-size:14.5px;font-weight:600;color:var(--ink-soft);transition:background .15s,color .15s;text-align:left;
    }
    .sidebar-link:hover{background:var(--purple-pastel-2);color:var(--ink);}
    .sidebar-link.active{background:var(--purple-pastel-2);color:var(--purple);}
    .sidebar-link .icon{flex-shrink:0;}
    .sidebar-nav .owner-badge{align-self:flex-start;margin-top:12px;}
    .main-column .admin-header{display:none;}
    .main-column .page-content{padding:32px 40px 40px;max-width:1120px;width:100%;margin:0 auto;}
    .main-column .page-content.has-footer{padding-bottom:40px;}
    .main-column .tab-bar{display:none;}
    .main-column .settings-footer{position:static;max-width:1120px;width:100%;margin:0 auto;border-radius:0;box-shadow:none;}
    .stat-grid-desktop{grid-template-columns:repeat(4,1fr);}
    .manage-grid-desktop{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;align-items:start;}
  }

  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}

  .chip{
    min-height:38px;padding:7px 16px;border-radius:9999px;font-size:14px;font-weight:600;
    border:1px solid var(--border-2);background:var(--white);color:var(--ink);
    white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
    flex:0 0 auto;line-height:20px;display:inline-flex;align-items:center;justify-content:center;
    overflow:hidden;background-clip:padding-box;
  }
  .chip.active{border-color:var(--purple);background:var(--purple);color:#fff;}
  .loyalty-adjust-btn{
    min-width:44px;height:32px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;
    background:var(--purple-pastel-2);color:var(--purple);border:1px solid transparent;
    display:inline-flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;
  }
  .loyalty-adjust-btn:hover{border-color:var(--purple);}
  .loyalty-adjust-btn.danger{background:#FBEAEA;color:#C13B3B;}
  .loyalty-adjust-btn.danger:hover{border-color:#C13B3B;}
  .loyalty-redeem-btn{
    width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;font-size:12.5px;font-weight:700;
    background:var(--purple-pastel-2);color:var(--purple);border:1px solid transparent;transition:background .12s,border-color .12s;
  }
  .loyalty-redeem-btn:hover{border-color:var(--purple);}
  .chip-row{
    display:flex;flex-wrap:nowrap;align-items:center;gap:8px;
    width:100%;min-height:54px;
    overflow-x:auto;overflow-y:hidden;overflow-anchor:none;
    padding-top:8px;padding-bottom:8px;scrollbar-width:none;
  }
  .chip-row::after{display:none;}

  .salon-icon{
    width:56px;height:56px;border-radius:14px;background:var(--purple-pastel-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--purple);
  }
  .stylist-avatar{
    width:42px;height:42px;border-radius:50%;background:var(--purple-pastel);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    font-weight:700;font-size:15px;color:var(--purple);
  }

  .field{margin-bottom:14px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;background:var(--white);border:1px solid var(--border-2);border-radius:14px;
    padding:12px 16px;font-size:14px;line-height:1.4;outline:none;color:var(--ink);font-family:inherit;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  .field input:focus, .field textarea:focus{border-color:var(--purple);}
  .field input::placeholder, .field textarea::placeholder{color:var(--placeholder);}
  .field input.error, .field textarea.error{border-color:#C13B3B;}
  .required-mark{color:#C13B3B;font-weight:700;}
  .address-section-card{background:var(--purple-pastel-2);border-radius:18px;padding:16px;margin-bottom:14px;}
  .verify-address-btn{display:inline-flex;align-items:center;gap:8px;}
  .field textarea{-ms-overflow-style:none;scrollbar-width:none;resize:none;}
  .field textarea::-webkit-scrollbar{display:none;}
  .field-btn{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;
    background:var(--white);border:1px solid var(--border-2);border-radius:14px;box-sizing:border-box;
    padding:12px 16px;font-size:14px;line-height:1.4;color:var(--ink);font-family:inherit;
  }
  .field-btn .placeholder{color:var(--placeholder);}
  .field-btn:hover{border-color:var(--border-hover);}
  .searchbox{
    display:flex;align-items:center;gap:10px;background:var(--white);
    border:1px solid var(--border-2);border-radius:16px;padding:12px 16px;flex-shrink:0;
  }
  .searchbox input{width:100%;background:transparent;border:none;outline:none;font-size:14px;color:var(--ink);font-family:inherit;}
  .searchbox input::placeholder{color:var(--placeholder);}
  .city-row{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;
    padding:10px 12px;border-radius:16px;border:1.5px solid var(--border);background:var(--white);transition:background .15s,border-color .15s;
  }
  .city-row:hover{background:var(--purple-pastel-2);}
  .city-row.active{background:var(--purple-pastel-2);border-color:var(--purple);}
  .addr-candidate-row:hover{background:var(--purple-pastel-2);}
  .addr-candidate-row:first-of-type{border-top:none;}
  .venue-info-icon{
    width:34px;height:34px;border-radius:11px;background:var(--purple-pastel-2);color:var(--purple);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .city-picker-overlay{position:absolute;inset:0;background:rgba(20,10,40,.4);z-index:80;display:flex;align-items:flex-end;}
  .city-picker-sheet{background:var(--white);border-radius:24px 24px 0 0;width:100%;max-height:78%;display:flex;flex-direction:column;padding:20px 20px 20px;animation:cityPickerUp .22s ease;}
  @keyframes cityPickerUp{from{transform:translateY(100%);}to{transform:translateY(0);}}

  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px;}
  .empty-state{text-align:center;padding:48px 24px;color:var(--ink-soft);font-size:14px;line-height:1.5;}

  .hist-action-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:9px 0;border-radius:12px;border:1px solid var(--border-2);background:var(--white);
    color:var(--ink);font-size:12.5px;font-weight:700;transition:all .15s;white-space:nowrap;
  }
  .hist-action-btn:hover{border-color:var(--border-hover);}
  .hist-action-btn.cancel{color:#C13B3B;}
  .hist-action-btn.cancel:hover{border-color:#F3C6C6;background:#FBEAEA;}

  .booking-action-btn{
    flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 0;border-radius:12px;border:1px solid transparent;
    font-size:12.5px;font-weight:700;transition:all .15s;white-space:nowrap;
  }
  .booking-action-btn.complete{background:#E6F6EC;color:#1E8A4C;}
  .booking-action-btn.complete:hover{background:#D8F0E1;}
  .booking-action-btn.noshow{background:#FDF1E0;color:#B0700D;}
  .booking-action-btn.noshow:hover{background:#FBE7CB;}
  .booking-action-btn.cancel{background:var(--white);border-color:var(--border-2);color:#C13B3B;}
  .booking-action-btn.cancel:hover{border-color:#F3C6C6;background:#FBEAEA;}

  /* --- admin-specific --- */
  .admin-header{
    padding:18px 20px 16px;flex-shrink:0;background:var(--white);
    border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand-logo{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.4px;}
  .owner-badge{
    display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 9px;border-radius:999px;
    background:var(--white);border:1px solid var(--border-2);
  }
  .owner-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--purple);flex-shrink:0;}
  .owner-badge span.label{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--purple);text-transform:uppercase;}
  .page-content{flex:1;overflow-y:auto;padding:20px 20px 108px;}

  .tab-bar{
    position:absolute;bottom:0;left:0;right:0;background:var(--white);
    border-top:1px solid var(--border);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    flex-shrink:0;
  }
  .tab-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;
    color:var(--ink-soft);font-size:11px;font-weight:600;border-radius:12px;transition:color .15s;
  }
  .tab-btn.active{color:var(--purple);}

  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px 16px;}
  .stat-num{font-size:22px;font-weight:800;color:var(--ink);margin:0;}
  .stat-label{font-size:12px;color:var(--ink-soft);margin:4px 0 0;font-weight:600;}
  .stat-grid-mobile{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .manage-grid-desktop{display:flex;flex-direction:column;gap:10px;}

  .booking-card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:15px 16px;}
  .status-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:capitalize;flex-shrink:0;}
  .status-badge.upcoming{background:var(--purple-pastel);color:#5C4B99;}
  .status-badge.completed{background:#E6F6EC;color:#1E8A4C;}
  .status-badge.cancelled{background:#FBEAEA;color:#C13B3B;}
  .status-badge.no_show{background:#FDF1E0;color:#B0700D;}
  .status-badge.waiting{background:var(--purple-pastel);color:#5C4B99;}
  .status-badge.notified{background:#E6F6EC;color:#1E8A4C;}

  .manage-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:14px 16px;}
  .tag-pill{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--purple-pastel);color:#5C4B99;font-weight:600;}
  .text-action{font-size:12.5px;font-weight:700;color:var(--purple);}
  .text-action.danger{color:#C13B3B;}

  .add-btn{
    width:100%;padding:13px 0;border-radius:16px;border:1px solid var(--border);
    background:var(--white);color:var(--purple);font-size:13.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s;
  }
  .add-btn:hover{background:var(--purple-pastel-2);border-color:var(--purple);}

  .media-preview{width:100%;border-radius:14px;overflow:hidden;background:var(--purple-pastel-2);border:1px solid var(--border);position:relative;}
  .media-preview.main{height:180px;}
  .media-preview img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--ink-soft);font-size:12.5px;font-weight:600;text-align:center;padding:18px;}
  .media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
  .media-tile{aspect-ratio:1.25/1;border-radius:13px;overflow:hidden;background:var(--purple-pastel-2);border:1px solid var(--border);position:relative;}
  .media-tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .media-remove{position:absolute;top:7px;right:7px;width:30px;height:30px;border-radius:999px;background:rgba(25,18,35,.72);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;}
  .upload-row{display:flex;align-items:center;gap:14px;margin-top:10px;}
  .upload-note{font-size:11.5px;color:var(--ink-soft);line-height:1.4;margin:0;}
  .stylist-photo-preview{width:72px;height:72px;border-radius:50%;overflow:hidden;background:var(--purple-pastel-2);display:flex;align-items:center;justify-content:center;color:var(--purple);font-size:24px;font-weight:800;border:1px solid var(--border);}
  .stylist-photo-preview img{width:100%;height:100%;object-fit:cover;display:block;}

  .primary-btn-sm{
    padding:10px 18px;border-radius:999px;background:var(--purple);color:#fff;
    font-size:13px;font-weight:700;border:none;white-space:nowrap;
  }
  .primary-btn-sm:hover{background:var(--purple-dark);}

  .switch{
    width:42px;height:25px;border-radius:999px;background:var(--border-2);position:relative;
    flex-shrink:0;transition:background .15s;
  }
  .switch.on{background:var(--purple);}
  .switch .knob{
    position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;
    transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);
  }
  .switch.on .knob{left:19px;}

  .day-row{
    display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);
  }
  .day-row:last-child{border-bottom:none;}
  .day-name{font-size:13.5px;font-weight:700;color:var(--ink);width:44px;flex-shrink:0;}
  .day-toggle{
    width:40px;height:24px;border-radius:999px;background:var(--border-2);position:relative;transition:background .15s;flex-shrink:0;
  }
  .day-toggle.on{background:var(--purple);}
  .day-toggle .knob{
    position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;
    transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.15);
  }
  .day-toggle.on .knob{transform:translateX(16px);}
  .day-times{display:flex;align-items:center;gap:6px;flex:1;min-width:0;}
  .day-times select{
    flex:1;min-width:0;appearance:none;-webkit-appearance:none;border:1.5px solid var(--border-2);border-radius:9px;
    padding:8px 24px 8px 10px;font-size:12.5px;font-weight:600;color:var(--ink);background:var(--white);
  }
  .day-times-closed{
    flex:1;font-size:12.5px;color:var(--placeholder);font-style:italic;
    padding:8px 10px;border:1.5px solid transparent;line-height:normal;
  }
  .day-select-wrap{position:relative;flex:1;min-width:0;}
  .day-select-wrap .select-chevron{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--ink-soft);pointer-events:none;display:flex;}
  .day-select-wrap .select-chevron svg{width:12px;height:12px;}

  .select-wrap{position:relative;}
  .select-wrap select{
    width:100%;background:var(--white);border:1px solid var(--border-2);border-radius:14px;
    padding:12px 38px 12px 16px;font-size:14px;outline:none;color:var(--ink);font-family:inherit;
    appearance:none;-webkit-appearance:none;cursor:pointer;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  .select-wrap select:focus{border-color:var(--purple);}
  .select-wrap .select-chevron{
    position:absolute;right:14px;top:50%;transform:translateY(-50%);
    color:var(--ink-soft);pointer-events:none;display:flex;
  }

  .search-field{
    display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--border-2);
    border-radius:14px;padding:11px 14px;transition:border-color .15s;
  }
  .search-field:focus-within{border-color:var(--purple);}
  .search-field input{
    flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--ink);
    padding:0;font-family:inherit;min-width:0;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
  }
  .search-field input::placeholder{color:var(--placeholder);}
  .search-clear{display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;padding:2px;}
  .search-clear:hover{color:var(--ink);}

  .view-toggle{display:inline-flex;background:var(--purple-pastel-2);border-radius:11px;padding:3px;gap:2px;flex-shrink:0;}
  .view-toggle-btn{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink-soft);transition:all .15s;}
  .view-toggle-btn.active{background:var(--white);color:var(--purple);box-shadow:0 1px 3px rgba(36,31,51,.1);}
  .schedule-count{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .schedule-count strong{color:var(--ink);font-weight:800;}

  .schedule-shelf{background:var(--purple-pastel-2);border-radius:16px;padding:4px 8px;}
  .schedule-shelf .chip-row{padding-top:6px;padding-bottom:6px;}
  .schedule-shelf .chip-row::after{content:none;}
  .schedule-shelf .chip{background:var(--white);border-color:var(--white);}
  .schedule-shelf .chip.active{border-color:var(--purple);background:var(--purple);}

  .booking-card{transition:border-color .15s;}
  .booking-card.expandable{cursor:pointer;}
  .booking-card.expandable:hover{border-color:var(--border-hover);}
  .booking-chevron{transition:transform .18s;}
  .booking-chevron.open{transform:rotate(180deg);}
  .booking-detail{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:8px;
  }
  .booking-detail-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink);line-height:1.4;}
  .booking-detail-row .icon{margin-top:2px;color:var(--ink-soft);}

  .week-group{margin-bottom:22px;}
  .week-group:last-child{margin-bottom:0;}
  .week-group-header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
  .week-group-count{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
  .week-waitlist-badge{
    display:flex;align-items:center;gap:4px;margin-left:auto;
    font-size:11.5px;font-weight:700;color:var(--purple);
  }
  .week-waitlist-badge:hover{color:var(--purple-dark);}

  .dash-waitlist-banner{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--purple-pastel-2);border:1px solid var(--border-2);border-radius:16px;
    padding:12px 14px;margin-bottom:20px;text-align:left;transition:border-color .15s;
  }
  .dash-waitlist-banner:hover{border-color:var(--purple);}

  .quick-action-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;
    background:var(--purple-pastel);border:1px solid var(--purple-pastel);border-radius:16px;
    padding:14px 6px 12px;transition:border-color .15s,background-color .15s;
  }
  .quick-action-btn:hover{border-color:var(--border-hover);background:var(--purple-pastel-2);}
  .quick-action-icon{

function knownBookingCustomers(){
  const byKey=new Map();
  bookings.forEach(b=>{
    const phone=String(b.phone||"").trim();
    const userId=b.customerUserId||null;
    const key=userId?`user:${userId}`:`contact:${phone.replace(/\D/g,"")}|${String(b.customerName||"").trim().toLowerCase()}`;
    if(!byKey.has(key)) byKey.set(key,{name:b.customerName||"",phone,userId});
    else {
      const c=byKey.get(key);
      if(!c.phone&&phone) c.phone=phone;
      if(!c.userId&&userId) c.userId=userId;
    }
  });
  return [...byKey.values()].filter(c=>c.name).sort((a,b)=>a.name.localeCompare(b.name));
}
function dayOffsetLabel(offset){
  if (offset===0) return "Today";
  if (offset===1) return "Tomorrow";
  if (offset===-1) return "Yesterday";
  const d=nzDateFromKey(addDaysToDateKey(nzTodayKey(),offset));
  if (offset>1) return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:"Pacific/Auckland"});
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",timeZone:"Pacific/Auckland"});
}
function parseTimeMins(t){
  const m = t.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 0;
  let h = parseInt(m[1],10) % 12;
  if (/PM/i.test(m[3])) h += 12;
  return h*60 + parseInt(m[2],10);
}
function bookingsForOffset(offset){
  return bookings.filter(b=>b.dayOffset===offset);
}
function stylistWeekCount(stylistName){
  return bookings.filter(b=> b.stylistName===stylistName && b.dayOffset>=0 && b.dayOffset<=6 && b.status!=="cancelled").length;
}
function formatTime12(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const period = h>=12 ? "PM" : "AM";
  let h12 = h%12; if (h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,"0")} ${period}`;
}
function timeOptions(){
  const opts = [];
  for (let h=0; h<24; h++){
    for (let m=0; m<60; m+=15){
      const val = `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
      opts.push({ value: val, label: formatTime12(val) });
    }
  }
  return opts;
}

function manualBookingDayName(offset){
  return nzWeekdayShortForKey(addDaysToDateKey(nzTodayKey(),Number(offset||0)));
}
function manualBookingDuration(b){
  if(Number(b?.durationMinutes)>0) return Number(b.durationMinutes);
  const svc=salon.services.find(s=>s.id===b?.serviceId)||salon.services.find(s=>s.name===b?.serviceName);
  return Number(svc?.duration)||30;
}
function manualBookingResourceMatches(b,stylistName){
  if(stylistName) return b.stylistName===stylistName;
  return !b.stylistName || b.stylistName==="Venue team" || b.stylistName==="Any available";
}
function manualAvailableTimes(serviceId,stylistName,dayOffset){
  const service=salon.services.find(s=>s.id===serviceId && s.active);
  const hours=salon.hours?.[manualBookingDayName(dayOffset)];
  const stylist=stylistName?salon.stylists.find(st=>st.name===stylistName):null;
  if(!service||!hours?.open) return [];
  if(Number(dayOffset)===0 && stylist && stylist.availableToday===false) return [];
  const open=parseTimeMins(hours.start||"");
  const close=parseTimeMins(hours.end||"");
  const duration=Math.max(15,Number(service.duration)||30);
  const buffer=Math.max(0,Number(salon.bufferTime)||0);
  if(close<=open||open<0) return [];
  const out=[];
  for(let start=open; start+duration<=close; start+=15){
    if(Number(dayOffset)===0){
      const slot=new Date(nzLocalToIso(nzTodayKey(),formatTime12(`${String(Math.floor(start/60)).padStart(2,"0")}:${String(start%60).padStart(2,"0")}`)));
      if(slot.getTime()<=Date.now()+5*60*1000) continue;
    }
    const end=start+duration;
    const bookingConflict=bookings.some(b=>{
      if(b.status!=="upcoming"||Number(b.dayOffset)!==Number(dayOffset)||!manualBookingResourceMatches(b,stylistName)) return false;
      const bs=parseTimeMins(b.time||""); const be=bs+manualBookingDuration(b);
      return start < be+buffer && end+buffer > bs;
    });
    if(bookingConflict) continue;
    const blockConflict=blockouts.some(bo=>{
      if(Number(bo.dayOffset)!==Number(dayOffset)) return false;
      if(bo.stylistName!=="All staff" && stylistName && bo.stylistName!==stylistName) return false;
      if(bo.stylistName!=="All staff" && !stylistName) return false;
      const bs=parseTimeMins(bo.startTime||""); const be=parseTimeMins(bo.endTime||"");
      return start<be && end>bs;
    });
    if(blockConflict) continue;
    out.push(formatTime12(`${String(Math.floor(start/60)).padStart(2,"0")}:${String(start%60).padStart(2,"0")}`));
  }
  return out;
}
function manualAvailableDays(serviceId,stylistName){
  return Array.from({length:14},(_,i)=>i).filter(i=>manualAvailableTimes(serviceId,stylistName,i).length>0);
}
function refreshManualBookingAvailability(){
  const serviceEl=document.getElementById("nbService");
  const stylistEl=document.getElementById("nbStylist");
  const dayEl=document.getElementById("nbDayOffset");
  const timeEl=document.getElementById("nbTime");
  const hint=document.getElementById("nbAvailabilityHint");
  const save=document.querySelector("[data-savebooking]");
  if(!serviceEl||!dayEl||!timeEl) return;
  const serviceId=serviceEl.value;
  const stylistName=stylistEl?.value||"";
  const previousDay=dayEl.value;
  const previousTime=timeEl.value;
  const days=manualAvailableDays(serviceId,stylistName);
  dayEl.innerHTML=days.length?days.map(d=>`<option value="${d}">${dayOffsetLabel(d)}</option>`).join(""):`<option value="">No available days</option>`;
  dayEl.disabled=!days.length;
  const chosenDay=days.includes(Number(previousDay))?Number(previousDay):(days[0]??null);
  if(chosenDay!=null) dayEl.value=String(chosenDay);
  const times=chosenDay==null?[]:manualAvailableTimes(serviceId,stylistName,chosenDay);
  timeEl.innerHTML=times.length?times.map(t=>`<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join(""):`<option value="">No available times</option>`;
  timeEl.disabled=!times.length;
  if(times.includes(previousTime)) timeEl.value=previousTime;
  if(hint) hint.textContent=days.length?"Only available appointment times are shown.":"No available appointments in the next 14 days for this selection.";
  if(save) save.disabled=!times.length;
}

function renderSchedule(){
  const filters = ["upcoming","completed","cancelled","all"];
  const isWaitlist = state.scheduleFilter==="waitlist";
  const q = state.scheduleSearch.trim().toLowerCase();

  let list, body, countLabel;
  if (isWaitlist){
    list = waitlist.slice().sort((a,b)=> a.dayOffset-b.dayOffset || b.createdAt-a.createdAt);
    if (q) list = list.filter(w=>w.customerName.toLowerCase().includes(q));
    const emptyMsg = q ? `No waitlist requests match "${escapeHtml(state.scheduleSearch)}".` : `No one is on the waitlist right now.`;
    body = list.length===0
      ? `<div class="empty-state">${emptyMsg}</div>`
      : `<div style="display:flex;flex-direction:column;gap:10px;">${list.map(w=>waitlistRow(w)).join("")}</div>`;
    countLabel = `<strong>${list.length}</strong> on the waitlist`;
  } else {
    list = bookings.slice().sort((a,b)=> a.dayOffset-b.dayOffset || parseTimeMins(a.time)-parseTimeMins(b.time));
    if (state.scheduleFilter!=="all") list = list.filter(b=>b.status===state.scheduleFilter);
    if (q) list = list.filter(b=>b.customerName.toLowerCase().includes(q));
    const emptyMsg = q
      ? `No bookings match "${escapeHtml(state.scheduleSearch)}".`
      : `No ${state.scheduleFilter==="all"?"":state.scheduleFilter+" "}bookings.`;
    body = list.length===0
      ? `<div class="empty-state">${emptyMsg}</div>`
      : (state.scheduleView==="week" ? renderWeekGroups(list) : `<div style="display:flex;flex-direction:column;gap:10px;">${list.map(b=>bookingRow(b,true)).join("")}</div>`);
    countLabel = `<strong>${list.length}</strong> booking${list.length===1?"":"s"}`;
  }

  return `
    <div class="search-field" style="margin-bottom:12px;">
      ${icon('search','var(--ink-soft)')}
      <input type="text" id="scheduleSearchInput" placeholder="${isWaitlist?'Search by customer name':'Search by customer name'}" value="${escapeAttr(state.scheduleSearch)}" />

function renderBlockoutsView(){
  const stylistOptions = ["All staff", ...salon.stylists.map(s=>s.name)];
  const timeOpts = [];
  for (let h=9;h<=18;h++) for (let m=0;m<60;m+=15){
    const period=h>=12?"PM":"AM"; let h12=h%12; if(h12===0)h12=12;
    timeOpts.push(`${h12}:${String(m).padStart(2,"0")} ${period}`);
  }
  const sorted = blockouts.slice().sort((a,b)=> a.dayOffset-b.dayOffset || parseTimeMins(a.startTime)-parseTimeMins(b.startTime));

  const addForm = state.addingBlockout ? `
    <div class="manage-card" style="margin-bottom:14px;">
      <div class="field"><label>Label</label><input type="text" id="boLabel" placeholder="e.g. Lunch break" /></div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1;">
          <label>Day</label>
          <div class="select-wrap">
            <select id="boDayOffset">
              ${[-1,0,1,2,3,4,5,6,7].map(d=>`<option value="${d}">${dayOffsetLabel(d)}</option>`).join("")}
            </select>
            <span class="select-chevron">${ICONS.chevronDown}</span>
          </div>
        </div>
        <div class="field" style="flex:1;">
          <label>Stylist</label>
          <div class="select-wrap">
            <select id="boStylist">
              ${stylistOptions.map(s=>`<option value="${s}">${s}</option>`).join("")}
            </select>
            <span class="select-chevron">${ICONS.chevronDown}</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:10px;">
        <div class="field" style="flex:1;">
          <label>Start</label>
          <div class="select-wrap">
            <select id="boStart">
              ${timeOpts.map(t=>`<option value="${t}">${t}</option>`).join("")}
            </select>
            <span class="select-chevron">${ICONS.chevronDown}</span>
          </div>
        </div>
        <div class="field" style="flex:1;">
          <label>End</label>
          <div class="select-wrap">
            <select id="boEnd">
              ${timeOpts.map(t=>`<option value="${t}" ${t==="1:30 PM"?"selected":""}>${t}</option>`).join("")}
            </select>
            <span class="select-chevron">${ICONS.chevronDown}</span>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:16px;align-items:center;margin-top:4px;">
        <button class="primary-btn-sm" data-saveblockout>Add block-out</button>
        <button class="text-action" data-cancelblockout>Cancel</button>
      </div>
    </div>` : `<button class="add-btn" style="margin-bottom:14px;" data-addblockout>${icon('plusSmall')} New block-out</button>`;

  if (sorted.length===0 && !state.addingBlockout) return addForm + `<div class="empty-state">No block-outs scheduled.</div>`;

  // Group by day
  const byDay = new Map();
  sorted.forEach(b=>{
    if (!byDay.has(b.dayOffset)) byDay.set(b.dayOffset, []);
    byDay.get(b.dayOffset).push(b);
  });

  const rows = [...byDay.entries()].map(([offset, items])=>`
    <div class="week-group">
      <div class="week-group-header">
        <p class="eyebrow" style="margin:0;">${dayOffsetLabel(offset)}</p>
        <span class="week-group-count">${items.length} block-out${items.length>1?"s":""}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">
        ${items.map(bo=>{
          if (state.editingBlockoutId===bo.id){
            const stylistOptions2 = ["All staff", ...salon.stylists.map(s=>s.name)];
            return `
            <div class="manage-card">
              <div class="field"><label>Label</label><input type="text" id="editBoLabel_${bo.id}" value="${escapeAttr(bo.label)}" /></div>
              <div style="display:flex;gap:10px;">
                <div class="field" style="flex:1;">
                  <label>Day</label>
                  <div class="select-wrap">
                    <select id="editBoDayOffset_${bo.id}">
                      ${[-1,0,1,2,3,4,5,6,7].map(d=>`<option value="${d}" ${bo.dayOffset===d?"selected":""}>${dayOffsetLabel(d)}</option>`).join("")}
                    </select>
                    <span class="select-chevron">${ICONS.chevronDown}</span>
                  </div>
                </div>
                <div class="field" style="flex:1;">
                  <label>Stylist</label>
                  <div class="select-wrap">
                    <select id="editBoStylist_${bo.id}">
                      ${stylistOptions2.map(s=>`<option value="${s}" ${bo.stylistName===s?"selected":""}>${s}</option>`).join("")}
                    </select>
                    <span class="select-chevron">${ICONS.chevronDown}</span>
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:10px;">
                <div class="field" style="flex:1;">
                  <label>Start</label>
                  <div class="select-wrap">
                    <select id="editBoStart_${bo.id}">
                      ${timeOpts.map(t=>`<option value="${t}" ${bo.startTime===t?"selected":""}>${t}</option>`).join("")}
                    </select>
                    <span class="select-chevron">${ICONS.chevronDown}</span>
                  </div>
                </div>
                <div class="field" style="flex:1;">
                  <label>End</label>
                  <div class="select-wrap">
                    <select id="editBoEnd_${bo.id}">
                      ${timeOpts.map(t=>`<option value="${t}" ${bo.endTime===t?"selected":""}>${t}</option>`).join("")}
                    </select>
                    <span class="select-chevron">${ICONS.chevronDown}</span>
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:16px;align-items:center;margin-top:4px;">
                <button class="primary-btn-sm" data-doneblockout="${bo.id}">Done</button>
                <button class="text-action" data-cancelblockout>Cancel</button>
              </div>
            </div>`;
          }
          return `
          <div class="manage-card">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">
              <div>
                <p style="font-weight:700;font-size:14.5px;color:var(--ink);margin:0;">${escapeHtml(bo.label)}</p>
                <p style="font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;">${bo.startTime} – ${bo.endTime} · ${escapeHtml(bo.stylistName)}</p>
              </div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:18px;margin-top:12px;">
              <button class="text-action" data-editblockout="${bo.id}">Edit</button>
              <button class="text-action danger" data-deleteblockout="${bo.id}">Delete</button>
            </div>
          </div>`;
        }).join("")}
      </div>
    </div>`).join("");

  return addForm + rows;
}

function renderWeekGroups(list){
  const order = [];
  const byOffset = new Map();
  list.forEach(b=>{
    if (!byOffset.has(b.dayOffset)){ byOffset.set(b.dayOffset, []); order.push(b.dayOffset); }
    byOffset.get(b.dayOffset).push(b);
  });
  order.sort((a,b)=>a-b);
  return order.map(offset=>{
    const items = byOffset.get(offset);
    const waitingCount = waitlist.filter(w=>w.dayOffset===offset).length;
    return `
    <div class="week-group">
      <div class="week-group-header">
        <p class="eyebrow" style="margin:0;">${dayOffsetLabel(offset)}</p>
        <span class="week-group-count">${items.length} booking${items.length>1?"s":""}</span>
        ${waitingCount>0 ? `<button class="week-waitlist-badge" data-viewwaitlist>${icon('bell')}<span>${waitingCount} waiting</span></button>` : ""}
      </div>
      <div style="display:flex;flex-direction:column;gap:10px;">${items.map(b=>bookingRow(b,true)).join("")}</div>
    </div>`;
  }).join("");
}

/* ---------------------------------------------------
   RENDER: CUSTOMERS MANAGE
--------------------------------------------------- */
function renderCustomersManage(){
  // Build customer list from bookings
  const customerMap = new Map();
  bookings.forEach(b=>{
    if (!customerMap.has(b.customerName)){
      customerMap.set(b.customerName, { name:b.customerName, phone:b.phone||"", bookings:[] });
    }
    customerMap.get(b.customerName).bookings.push(b);
  });
  const customers = [...customerMap.values()].sort((a,b)=>a.name.localeCompare(b.name));

  if (customers.length===0) return `<div class="empty-state">No customers yet.</div>`;

  return `
    <div class="manage-grid-desktop">
      ${customers.map(c=>{
        const completed = c.bookings.filter(b=>b.status==="completed").length;
        const upcoming = c.bookings.filter(b=>b.status==="upcoming").length;
        const total = c.bookings.reduce((sum,b)=>b.status==="completed"?sum+b.price:sum,0);
        const expanded = state.expandedCustomerName===c.name;
        return `
        <div class="manage-card" style="cursor:pointer;" data-customertoggle="${escapeAttr(c.name)}">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
              <div class="stylist-avatar">${escapeHtml(c.name.charAt(0))}</div>
              <div style="min-width:0;">
                <p style="font-weight:700;font-size:14.5px;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(c.name)}</p>
                <p style="font-size:12.5px;color:var(--ink-soft);margin:3px 0 0;">${c.bookings.length} booking${c.bookings.length===1?"":"s"} · $${total} spent</p>
              </div>
            </div>
            <span class="icon booking-chevron ${expanded?'open':''}" style="color:var(--ink-soft);">${ICONS.chevronDown}</span>
          </div>
          ${expanded ? `
          <div class="booking-detail">
            ${c.phone ? `<div class="booking-detail-row">${icon('phone')}<span>${escapeHtml(c.phone)}</span></div>` : ""}
            <div style="display:flex;gap:10px;margin-top:4px;">
              <div style="flex:1;background:var(--purple-pastel-2);border-radius:12px;padding:10px 12px;text-align:center;">
                <p style="font-size:18px;font-weight:800;color:var(--ink);margin:0;">${completed}</p>
                <p style="font-size:11px;color:var(--ink-soft);font-weight:600;margin:2px 0 0;">Completed</p>
              </div>
              <div style="flex:1;background:var(--purple-pastel-2);border-radius:12px;padding:10px 12px;text-align:center;">
                <p style="font-size:18px;font-weight:800;color:var(--ink);margin:0;">${upcoming}</p>
                <p style="font-size:11px;color:var(--ink-soft);font-weight:600;margin:2px 0 0;">Upcoming</p>
              </div>
              <div style="flex:1;background:var(--purple-pastel-2);border-radius:12px;padding:10px 12px;text-align:center;">
                <p style="font-size:18px;font-weight:800;color:var(--purple);margin:0;">$${total}</p>
                <p style="font-size:11px;color:var(--ink-soft);font-weight:600;margin:2px 0 0;">Total spent</p>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px;">
              ${c.bookings.sort((a,b)=>a.dayOffset-b.dayOffset).map(b=>`
                <div style="display:flex;align-items:center;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--border);">
                  <span style="color:var(--ink-soft);">${dayOffsetLabel(b.dayOffset)} · ${b.time}</span>
                  <span style="color:var(--ink);font-weight:600;">${escapeHtml(b.serviceName)}</span>
                  <span class="status-badge ${b.status}">${b.status==="no_show"?"No-show":b.status}</span>
                </div>`).join("")}
            </div>
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
              <label style="font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.02em;">Client notes</label>
              <textarea data-clientnote="${escapeAttr(c.name)}" placeholder="Preferences, allergies, anything worth remembering…" style="width:100%;min-height:64px;margin-top:6px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;font:inherit;font-size:13px;color:var(--ink);resize:vertical;">${escapeHtml(getClientNote(c.name))}</textarea>
              <div style="display:flex;align-items:center;gap:12px;margin-top:8px;">
                <button class="primary-btn-sm" data-saveclientnote="${escapeAttr(c.name)}">${state.savingNoteFor===c.name?'Saving…':'Save note'}</button>
                ${state.noteSavedFor===c.name?`<span style="font-size:12px;color:var(--purple);font-weight:600;">Saved</span>`:""}
              </div>
            </div>
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderLoyaltyManage(){
  const L = salon.loyalty || {enabled:false,pointsPerDollar:1,rewardThreshold:100,rewardText:""};
  const accounts = loyaltyAccounts.slice().sort((a,b)=>b.points-a.points);
  return `
    <div class="manage-card" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <p style="font-weight:700;font-size:14.5px;color:var(--ink);margin:0;">Loyalty program</p>
        <button class="switch ${L.enabled?'on':''}" data-toggleloyalty aria-label="Toggle loyalty program"><span class="knob"></span></button>
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:6px 0 14px;">Customers earn points automatically when you mark a booking as completed.</p>
      <div class="field"><label>Points earned per $1 spent</label><input type="number" min="0" step="1" id="loyaltyPointsPerDollar" value="${L.pointsPerDollar}" /></div>
      <div class="field"><label>Points needed for a reward</label><input type="number" min="1" step="1" id="loyaltyThreshold" value="${L.rewardThreshold}" /></div>
      <div class="field"><label>Reward description</label><input type="text" id="loyaltyRewardText" value="${escapeAttr(L.rewardText)}" placeholder="e.g. $10 off your next visit" /></div>
      <div class="field"><label>Reward value ($ discount applied at checkout)</label><input type="number" min="0" step="0.5" id="loyaltyRewardValue" value="${L.rewardValue||0}" /></div>
      <p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 14px;">Once a customer reaches the point threshold, they can apply this dollar amount off their next booking at checkout.</p>
      <button class="primary-btn-sm" data-saveloyaltysettings style="margin-top:4px;">${state.loyaltySettingsSaved?'Saved':'Save settings'}</button>
    </div>
    <div class="manage-grid-desktop">
      ${accounts.length===0 ? `<div class="empty-state">No loyalty points earned yet.</div>` : accounts.map(a=>{
        const pct = Math.min(100, Math.round((a.points/(L.rewardThreshold||1))*100));
        const eligible = L.rewardThreshold>0 && a.points>=L.rewardThreshold;
        return `
        <div class="manage-card">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
            <div style="display:flex;align-items:center;gap:12px;min-width:0;">
              <div class="stylist-avatar">${escapeHtml(a.customerName.charAt(0))}</div>
              <div style="min-width:0;">
                <p style="font-weight:700;font-size:14.5px;color:var(--ink);margin:0;">${escapeHtml(a.customerName)}</p>
                <p style="font-size:12.5px;color:var(--ink-soft);margin:3px 0 0;">${a.points} point${a.points===1?"":"s"}${eligible?" · reward ready":""}</p>
              </div>
            </div>
            <div style="display:flex;gap:8px;flex-shrink:0;">
              <button class="loyalty-adjust-btn" data-loyaltyadjust="${escapeAttr(a.customerName)}" data-delta="10">+10</button>
              <button class="loyalty-adjust-btn danger" data-loyaltyadjust="${escapeAttr(a.customerName)}" data-delta="-10">−10</button>
            </div>
          </div>
          <div style="height:6px;border-radius:999px;background:var(--purple-pastel-2);margin-top:12px;overflow:hidden;">
            <div style="height:100%;width:${pct}%;background:var(--purple);border-radius:999px;"></div>
          </div>
          ${eligible ? `<button class="loyalty-redeem-btn" data-loyaltyredeem="${escapeAttr(a.customerName)}">Mark reward redeemed (−${L.rewardThreshold} pts)</button>` : ""}
        </div>`;
      }).join("")}
    </div>
  `;
}

let addressVerifyBusy = false;
let addressVerifyError = "";
let addressCandidates = [];
let addressMissingFields = [];
function labelAddressCandidate(r){
  const a = r.address||{};
  const streetLine = [a.house_number, a.road].filter(Boolean).join(" ") || r.display_name.split(",")[0];
  const suburb = a.suburb || a.city_district || a.neighbourhood || a.quarter || "";
  const postcode = a.postcode || "";
  const rest = [suburb, a.city||a.town||a.village||"", postcode].filter(Boolean).join(", ");
  return { streetLine, rest, suburb, postcode, lat:Number(r.lat), lng:Number(r.lon) };
}
async function saveVerifiedAddress(){
  try{ await saveAdminCloud(); addressVerifyError=""; }
  catch(err){ addressVerifyError = "Verified, but saving failed: "+(err.message||"try Save changes below."); }
}
async function verifyAddressWithGeocoder(){
  const input = document.getElementById("addressInput");
  const query = (input?input.value:salon.address||"").trim();
  addressMissingFields = [];
  if(!query) addressMissingFields.push("address");
  if(!String(salon.suburb||"").trim()) addressMissingFields.push("suburb");
  if(!String(salon.postcode||"").trim()) addressMissingFields.push("postcode");
  if(addressMissingFields.length){
    addressVerifyError = "Fill in the address, suburb and postcode before verifying.";
    addressCandidates=[]; render(); return;
  }
  addressVerifyBusy = true; addressVerifyError = ""; addressCandidates = []; render();
  try{
    const parts = [query, salon.suburb, salon.city, salon.postcode, "New Zealand"].filter(Boolean).join(", ");
    const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&countrycodes=nz&limit=5&q=${encodeURIComponent(parts)}`;
    const res = await fetch(url, { headers: { "Accept":"application/json" } });
    if(!res.ok) throw new Error("Lookup failed. Try again.");
    const results = await res.json();
    if(!results.length) throw new Error("No match found. Check the street number and spelling.");
    if(results.length===1){
      const c = labelAddressCandidate(results[0]);
      salon.address = c.streetLine; salon.lat = c.lat; salon.lng = c.lng; salon.addressVerified = true;
      if(c.suburb) salon.suburb = c.suburb;
      if(c.postcode) salon.postcode = c.postcode;
      await saveVerifiedAddress();
    } else {
      // Multiple matches (e.g. the same street name in several NZ towns/suburbs) — let the owner pick, don't guess.
      addressCandidates = results.map(labelAddressCandidate);
      salon.addressVerified = false;
    }
  }catch(err){
    addressVerifyError = err.message || "Couldn't verify that address.";
    salon.addressVerified = false;
  }finally{
    addressVerifyBusy = false; render();
  }
}
async function chooseAddressCandidate(idx){
  const c = addressCandidates[idx];
  if(!c) return;
  salon.address = c.streetLine; salon.lat = c.lat; salon.lng = c.lng; salon.addressVerified = true;
  if(c.suburb) salon.suburb = c.suburb;
  if(c.postcode) salon.postcode = c.postcode;
  addressCandidates = [];
  addressVerifyBusy = true; render();
  await saveVerifiedAddress();
  addressVerifyBusy = false; render();
}

function normalizeAndValidateAdminState(){
  const invalidDay=DAY_NAMES.find(d=>salon.hours[d]?.open && parseTimeMins(salon.hours[d].end)<=parseTimeMins(salon.hours[d].start));
  if(invalidDay) throw new Error(`${invalidDay} closing time must be after opening time.`);
  salon.name=String(salon.name||"").trim();
  if(!salon.name) throw new Error("Venue name is required.");
  salon.city=String(salon.city||"").trim(); salon.region=String(salon.region||"").trim();
  if(salon.visible!==false && !salon.city) throw new Error("Add a city before showing your venue on Blooma.");
  salon.bufferTime=Math.max(0,Math.min(240,Number(salon.bufferTime)||0));
  const seenCats=new Set();
  salon.categories=salon.categories.map(c=>String(c||"").trim()).filter(c=>{ const k=c.toLowerCase(); if(!c||seenCats.has(k)) return false; seenCats.add(k); return true; });
  salon.services.forEach(s=>{
    s.name=String(s.name||"").trim(); if(!s.name) throw new Error("Every service needs a name.");
    s.duration=Math.max(15,Math.min(480,Number(s.duration)||30));
    s.price=Math.round(Math.max(0,Number(s.price)||0)*100)/100;
    s.category=String(s.category||"").trim()||"Uncategorized";
    if(!salon.categories.some(c=>c.toLowerCase()===s.category.toLowerCase())) salon.categories.push(s.category);
    s.active=s.active!==false; s.isNew=!!s.isNew;
  });
  salon.stylists.forEach(st=>{ st.name=String(st.name||"").trim(); if(!st.name) throw new Error("Every stylist needs a name."); st.specialty=String(st.specialty||"").trim(); st.availableToday=st.availableToday!==false; if(st.availableToday){st.availableTodayDate=null;}else if(!st.availableTodayDate){st.availableTodayDate=nzTodayKey();}else if(st.availableTodayDate!==nzTodayKey()){st.availableToday=true;st.availableTodayDate=null;} });
  const serviceIds=new Set(salon.services.map(s=>String(s.id)));
  addons.forEach(a=>{ a.name=String(a.name||"").trim(); if(!a.name) throw new Error("Every add-on needs a name."); a.price=Math.round(Math.max(0,Number(a.price)||0)*100)/100; a.serviceIds=(Array.isArray(a.serviceIds)?a.serviceIds:[]).map(String).filter(id=>serviceIds.has(id)); });
  const promoCodes=new Set();
  promos.forEach(p=>{
    p.code=String(p.code||"").trim().toUpperCase(); if(!p.code) throw new Error("Every promo needs a code.");
    if(promoCodes.has(p.code)) throw new Error(`Promo code ${p.code} is duplicated.`); promoCodes.add(p.code);
    p.type=p.type==="flat"?"flat":"percent";
    p.value=Math.round(Math.max(0,Number(p.value)||0)*100)/100; if(p.type==="percent") p.value=Math.min(100,p.value);
    p.active=p.active!==false;
  });
}

function buildAdminPayload(){
  const dayIndex={Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7};
  const openDays=DAY_NAMES.filter(d=>salon.hours[d]?.open).map(d=>dayIndex[d]);
  const time24=(t)=>{ if(!t) return ""; const m=t.match(/(\d+):(\d+)\s*(AM|PM)/i); if(!m) return t; let h=Number(m[1])%12; if(m[3].toUpperCase()==="PM")h+=12; return String(h).padStart(2,"0")+":"+m[2]+":00"; };
  const openHours=DAY_NAMES.filter(d=>salon.hours[d]?.open).map(d=>salon.hours[d]);
  const legacyOpen=openHours.length?Math.min(...openHours.map(h=>parseTimeMins(h.start))):null;
  const legacyClose=openHours.length?Math.max(...openHours.map(h=>parseTimeMins(h.end))):null;
  const mins24=(m)=>m==null?"":`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}:00`;
  return {
    salon:{name:salon.name,tag:(salon.categories.length?salon.categories.join(" · "):salon.tag),phone:salon.phone,address:salon.address,city:salon.city||"",region:salon.region||"",suburb:salon.suburb||"",postcode:salon.postcode||"",lat:salon.lat,lng:salon.lng,addressVerified:!!salon.addressVerified,about:salon.about,cancellationPolicy:salon.cancellationPolicy,bufferTime:salon.bufferTime,categories:salon.categories,hours:salon.hours,openDays,openTime:mins24(legacyOpen),closeTime:mins24(legacyClose),visible:salon.visible!==false,mainImage:salon.mainImage||"",galleryImages:Array.isArray(salon.galleryImages)?salon.galleryImages:[],loyalty:salon.loyalty},
    stylists:salon.stylists.map(x=>({...x})), services:salon.services.map(x=>({...x})), addons:addons.map(x=>({...x})), promos:promos.map(x=>({...x}))
  };
}
function resolveAdminStaffAvailability(){
  const today=nzTodayKey();
  salon.stylists.forEach(st=>{
    if(st.availableToday===false){
      if(st.availableTodayDate && st.availableTodayDate!==today){ st.availableToday=true; st.availableTodayDate=null; }
      else if(!st.availableTodayDate) st.availableTodayDate=today;
    }else st.availableTodayDate=null;
  });
}
function applyAdminConfig(cfg){
  if(!cfg) return;
  const sc=cfg.salon||{};
  ["name","tag","phone","address","city","region","about","cancellationPolicy","bufferTime","visible","mainImage","galleryImages"].forEach(k=>{if(sc[k]!==undefined) salon[k]=sc[k];});

const MEDIA_BUCKET="blooma-media";
function mediaObjectPath(url){
  if(!url) return null;
  const marker=`/storage/v1/object/public/${MEDIA_BUCKET}/`;
  const idx=String(url).indexOf(marker);
  if(idx<0) return null;
  try{return decodeURIComponent(String(url).slice(idx+marker.length).split("?")[0]);}catch(e){return String(url).slice(idx+marker.length).split("?")[0];}
}
async function deleteMediaUrl(url){
  const path=mediaObjectPath(url);
  if(!path || !currentSalonId || !path.startsWith(currentSalonId+"/")) return;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).remove([path]);
  if(error) console.warn("Unable to remove old media",error);
}
async function uploadMediaFile(file,folder){
  if(!file) throw new Error("Choose an image first.");
  const allowed=["image/jpeg","image/png","image/webp","image/gif"];
  if(!allowed.includes(file.type)) throw new Error("Please use a JPG, PNG, WEBP or GIF image.");
  if(file.size>8*1024*1024) throw new Error("Images must be 8 MB or smaller.");
  if(!currentSalonId) throw new Error("Venue not loaded.");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const rand=(globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID().slice(0,8):Math.random().toString(36).slice(2,10);
  const path=`${currentSalonId}/${folder}/${Date.now()}-${rand}.${ext}`;
  const {error}=await supabaseClient.storage.from(MEDIA_BUCKET).upload(path,file,{cacheControl:"31536000",upsert:false,contentType:file.type});
  if(error) throw error;
  const {data}=supabaseClient.storage.from(MEDIA_BUCKET).getPublicUrl(path);
  if(!data?.publicUrl) throw new Error("Image uploaded but its public URL could not be created.");
  return data.publicUrl;
}
async function replaceVenueMainImage(file){

}
async function addVenueGalleryImages(files){
  const before=Array.isArray(salon.galleryImages)?salon.galleryImages.slice():[];
  const room=Math.max(0,8-before.length);
  const chosen=Array.from(files||[]).slice(0,room);
  if(!chosen.length) throw new Error(room?"Choose at least one image.":"You can add up to 8 venue photos.");
  const uploaded=[];
  try{
    for(const file of chosen) uploaded.push(await uploadMediaFile(file,"venue/gallery"));
    salon.galleryImages=[...before,...uploaded];
    await saveAdminCloud();
  }catch(err){
    salon.galleryImages=before;
    for(const url of uploaded) await deleteMediaUrl(url);
    throw err;
  }
}

async function saveClientNote(customerName,noteText){
  if(!currentSalonId) throw new Error("Venue not loaded");
  const trimmed=(noteText||"").trim();
  const existing=clientNotes.find(n=>n.customerName===customerName);
  if(!trimmed){
    if(existing?.dbId){ const {error}=await supabaseClient.from("client_notes").delete().eq("id",existing.dbId); if(error) throw error; }
    if(existing) clientNotes.splice(clientNotes.indexOf(existing),1);
    return;
  }
  const {data,error}=await supabaseClient.from("client_notes").upsert({salon_id:currentSalonId,customer_name:customerName,note:trimmed,updated_at:new Date().toISOString()},{onConflict:"salon_id,customer_name"}).select().maybeSingle();
  if(error) throw error;
  if(existing){ existing.note=trimmed; existing.dbId=data?.id||existing.dbId; }
  else clientNotes.push({dbId:data?.id||null,customerName,note:trimmed});
}

async function awardLoyaltyPoints(b){
  if(!salon.loyalty?.enabled || !currentSalonId || !b.customerUserId || !b.dbId) return;
  const pts=Math.max(0,Math.round(Number(b.price||0)*Number(salon.loyalty.pointsPerDollar||0)));
  if(pts<=0) return;
  const {error:txError}=await supabaseClient.from("loyalty_transactions").insert({salon_id:currentSalonId,customer_user_id:b.customerUserId,booking_id:b.dbId,points_change:pts,reason:"Booking completed"});
  if(txError){ if(txError.code==="23505") return; throw txError; } // duplicate booking_id = already awarded
  const existing=loyaltyAccounts.find(a=>a.customerUserId===b.customerUserId);
  const nextPoints=(existing?.points||0)+pts;
  const {error:acctError}=await supabaseClient.from("loyalty_accounts").upsert({salon_id:currentSalonId,customer_user_id:b.customerUserId,customer_name:b.customerName,points:nextPoints,updated_at:new Date().toISOString()},{onConflict:"salon_id,customer_user_id"});
  if(acctError) throw acctError;
  if(existing) existing.points=nextPoints;
  else loyaltyAccounts.push({salonId:currentSalonId,customerUserId:b.customerUserId,customerName:b.customerName,points:nextPoints});
}
async function adjustLoyaltyPoints(account,delta,reason){
  if(!currentSalonId || !delta) return;
  const {error:txError}=await supabaseClient.from("loyalty_transactions").insert({salon_id:currentSalonId,customer_user_id:account.customerUserId,points_change:delta,reason:reason||"Manual adjustment"});
  if(txError) throw txError;
  const nextPoints=Math.max(0,(account.points||0)+delta);
  const {error:acctError}=await supabaseClient.from("loyalty_accounts").upsert({salon_id:currentSalonId,customer_user_id:account.customerUserId,customer_name:account.customerName,points:nextPoints,updated_at:new Date().toISOString()},{onConflict:"salon_id,customer_user_id"});

  account.points=nextPoints;
}
