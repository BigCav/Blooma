<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarah K. — Blooma Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#131218;
    --surface:#1C1B24;
    --surface-2:#242330;
    --surface-hover:#2A2938;
    --border:#2E2D3C;
    --violet:#6D5FE8;
    --violet-soft:rgba(109,95,232,0.16);
    --violet-text:#B7ADF5;
    --text:#F2F1F7;
    --text-soft:#9F9CB0;
    --text-faint:#6C6980;
    --success:#3ED598;
    --success-soft:rgba(62,213,152,0.14);
    --warning:#F4C93A;
    --danger:#FF6B81;
    --white:#FFFFFF;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scrollbar-width:none;}
  html::-webkit-scrollbar{display:none;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    scrollbar-width:none;
  }
  body::-webkit-scrollbar{display:none;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  .btn{
    font-weight:700; font-size:13.5px;
    padding:10px 18px; border-radius:10px;
    border:1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-violet{background:var(--violet); color:var(--white);}
  .btn-violet:hover{background:#5C4EDB;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-hover);}

  /* ---------- SHELL ---------- */
  .shell{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:240px; flex:none;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:fixed; top:0; bottom:0; left:-240px; z-index:60;
    transition:left .2s ease;
  }
  .sidebar.open{left:0;}
  .sb-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 18px 14px;
  }
  .sb-logo{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .sb-logo span{color:var(--violet-text);}
  .sb-close{
    width:30px; height:30px; border-radius:8px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text-soft);
  }
  .sb-venue{
    margin:6px 14px 14px; padding:10px 12px;
    background:var(--surface-2); border-radius:10px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .sb-venue-avatar{
    width:32px; height:32px; border-radius:8px; flex:none;
    background:linear-gradient(155deg,#A9865F,#6E8268);
  }
  .sb-venue-name{font-size:13px; font-weight:700;}
  .sb-venue-sub{font-size:11px; color:var(--text-faint);}
  .sb-venue svg{margin-left:auto; color:var(--text-faint); flex:none;}

  .sb-nav{padding:6px 12px; flex:1; min-height:0; overflow-y:auto;}
  .sb-section-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-faint); padding:14px 10px 8px;
  }
  .sb-link{
    display:flex; align-items:center; gap:11px;
    padding:9px 10px; border-radius:9px;
    font-size:13.5px; font-weight:600; color:var(--text-soft);
    margin-bottom:2px;
  }
  .sb-link svg{flex:none; color:var(--text-faint);}
  .sb-link:hover{background:var(--surface-hover); color:var(--text);}
  .sb-link.active{background:var(--violet-soft); color:var(--white);}
  .sb-link.active svg{color:var(--violet-text);}
  .sb-badge{
    margin-left:auto; font-size:10px; font-weight:700;
    background:var(--violet); color:var(--white);
    padding:2px 7px; border-radius:99px;
  }

  .sb-bottom{
    padding:14px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .sb-avatar{
    width:34px; height:34px; border-radius:50%; flex:none;
    background:var(--violet); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
  }
  .sb-user-name{font-size:12.5px; font-weight:700;}
  .sb-user-role{font-size:11px; color:var(--text-faint);}
  .sb-bottom svg{margin-left:auto; color:var(--text-faint); flex:none; cursor:pointer;}

  .sb-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sb-overlay.open{opacity:1; pointer-events:auto;}

  @media (min-width:1080px){
    .sidebar{position:sticky; top:0; left:auto; height:100vh;}
    .sb-close{display:none;}
    .sb-overlay{display:none;}
  }

  @media (max-width:1079px){
    .sidebar{
      left:0; right:0; top:auto; bottom:0; width:auto; max-width:480px; margin:0 auto;
      height:auto; max-height:82vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      overflow-anchor:none; will-change:transform;
      border-radius:22px 22px 0 0;
      border-right:none; border-top:1px solid var(--border);
      box-shadow:0 -18px 40px rgba(0,0,0,.55);
      transform:translateY(100%) translateZ(0);
      transition:transform .25s ease;
    }
    .sidebar.open{transform:translateY(0) translateZ(0);}
    /* The sidebar doubles as a mobile bottom sheet, so it (not the nav list inside it) owns
       scrolling here — nav no longer has its own independent scroll container, which was
       fighting the sheet's during the open transition and causing a one-frame scroll glitch. */
    .sb-nav{overflow:visible; flex:none;}
  }

  /* ---------- MAIN ---------- */
  .main{flex:1; min-width:0;}

  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(19,18,24,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px;
    padding:0 18px; height:64px;
  }
  .menu-btn{
    width:36px; height:36px; border-radius:9px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex:none; color:var(--text-soft);
  }
  @media (min-width:1080px){ .menu-btn{display:none;} }
  .tb-logo-mobile{font-weight:800; font-size:16px; letter-spacing:-0.01em; flex:none; white-space:nowrap;}
  @media (min-width:1080px){ .tb-logo-mobile{display:none;} }

  .tb-search{
    flex:1; max-width:360px;
    display:flex; align-items:center; gap:9px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 13px;
  }
  .tb-search svg{color:var(--text-faint); flex:none;}
  .tb-search input{
    border:none; background:none; outline:none; color:var(--text);
    font-family:inherit; font-size:13.5px; width:100%;
  }
  .tb-search input::placeholder{color:var(--text-faint);}
  .tb-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .tb-right .btn{height:36px; padding:0 16px;}
  .tb-icon-btn{
    width:36px; height:36px; border-radius:9px; background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text-soft); position:relative; flex:none;
  }
  .tb-icon-btn .dot{
    position:absolute; top:7px; right:7px;
    width:7px; height:7px; border-radius:50%; background:var(--danger);
    border:1.5px solid var(--surface);
  }
  .tb-search-mobile-hide{display:none;}
  @media (min-width:640px){ .tb-search-mobile-hide{display:flex;} }
  .tb-search{position:relative;}
  .tb-search-results{
    display:none; position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,0.4); max-height:360px; overflow-y:auto; z-index:60;
    padding:6px;
  }
  .tb-search-results.open{display:block;}
  .tb-sr-heading{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-faint); padding:8px 10px 4px;
  }
  .tb-sr-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    text-decoration:none; color:var(--text);
  }
  .tb-sr-row:hover{background:var(--surface-2);}
  .tb-sr-avatar{
    width:28px; height:28px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
    color:var(--text-soft); flex:none;
  }
  .tb-sr-info{min-width:0;}
  .tb-sr-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-sr-sub{font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-sr-empty{padding:14px 10px; font-size:12.5px; color:var(--text-faint); text-align:center;}

  /* ---------- CONTENT ---------- */
  .content{padding:22px 16px 60px;}
  @media (min-width:900px){ .content{padding:30px 32px 70px;} }

  /* ---------- STAT CARDS ---------- */
  .stats-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    margin-bottom:22px;
  }
  @media (min-width:800px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px;
  }
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-label{font-size:12px; color:var(--text-soft); font-weight:600;}
  .stat-icon{
    width:28px; height:28px; border-radius:8px; background:var(--violet-soft);
    display:flex; align-items:center; justify-content:center; color:var(--violet-text);
  }
  .stat-value{font-size:26px; font-weight:800; margin-top:12px; letter-spacing:-0.01em;}
  .stat-delta{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700; margin-top:6px;
    color:var(--success);
  }
  .stat-delta span.muted{color:var(--text-faint); font-weight:500;}

  /* ---------- PANELS / GRID LAYOUT ---------- */
  .dash-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width:1100px){ .dash-grid{grid-template-columns:2fr 1fr;} }
  .dash-grid > *{min-width:0;}

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:16px;
  }
  .panel-head h2{font-size:15.5px; font-weight:700;}
  .panel-head .link{font-size:12.5px; font-weight:700; color:var(--violet-text);}

  .side-col{display:flex; flex-direction:column; gap:16px;}
  .appt-row{
    display:flex; align-items:center; gap:11px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .appt-row:last-child{border-bottom:none; padding-bottom:0;}
  .appt-avatar{
    width:36px; height:36px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; color:var(--white);
  }
  .appt-name{font-size:13px; font-weight:700;}
  .appt-service{font-size:11.5px; color:var(--text-soft); margin-top:1px;}
  .appt-time{margin-left:auto; text-align:right; flex:none;}
  .appt-time .t{font-size:12.5px; font-weight:700;}
  .status-pill{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 7px; border-radius:99px; margin-top:3px; display:inline-block;
  }
  .status-confirmed{background:var(--success-soft); color:var(--success);}

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto; overflow-y:hidden;}
  table.data{width:100%; border-collapse:collapse; min-width:560px;}
  table.data th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-faint); font-weight:700; padding:0 14px 10px;
    border-bottom:1px solid var(--border);
  }
  table.data td{padding:13px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:var(--surface-hover);}
  .status-badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 9px; border-radius:99px; display:inline-block; white-space:nowrap;
  }
  .status-completed{background:rgba(157,152,176,0.16); color:var(--text-soft);}
  .tag-pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; margin-right:4px; display:inline-block; white-space:nowrap;}
  .tag-vip{background:rgba(244,201,58,0.16); color:var(--warning);}
  .tag-new{background:var(--violet-soft); color:var(--violet-text);}

  /* ---------- BREADCRUMB ---------- */
  .crumb{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; color:var(--text-soft);
    margin-bottom:14px;
  }
  .crumb:hover{color:var(--text);}

  /* ---------- PROFILE HEADER ---------- */
  .profile-panel{margin-bottom:20px;}
  .profile-head{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .profile-avatar{
    width:64px; height:64px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; color:var(--white);
  }
  .profile-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .profile-name-row h1{font-size:20px; font-weight:800; letter-spacing:-0.01em;}
  .profile-meta{font-size:12.5px; color:var(--text-soft); margin-top:4px;}
  .profile-actions{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;}

  /* ---------- INFO ROWS ---------- */
  .info-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; gap:10px;}
  .info-row:last-child{border-bottom:none; padding-bottom:0;}
  .info-row .info-label{color:var(--text-faint); font-weight:600; flex:none;}
  .info-row .info-value{font-weight:700; text-align:right;}

  .notes-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:14px; font-size:12.5px; color:var(--text-soft); line-height:1.6;
  }
  .notes-input{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; color:var(--text); font-family:inherit; font-size:12.5px; line-height:1.6;
    resize:vertical; min-height:80px; outline:none;
  }
  .notes-input:focus{border-color:var(--violet);}
  .notes-save-row{display:flex; justify-content:flex-end; margin-top:10px;}
  .notes-save-row .btn{padding:8px 14px; font-size:12.5px;}
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:90; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .cl-loading{padding:60px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}
</style>
</head>

<body>

<div class="shell">

  <div class="sb-overlay" id="sbOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-logo">Blooma <span style="font-weight:500; color:var(--text-faint); font-size:12px;">business</span></div>
      <div class="sb-close" id="sbClose">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </div>
    </div>

    <div class="sb-venue">
      <div class="sb-venue-avatar"></div>
      <div>
        <div class="sb-venue-name">Your venue</div>
        <div class="sb-venue-sub">&nbsp;</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>

    <nav class="sb-nav">
      <div class="sb-section-label">Overview</div>
      <a href="/venue/admin" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Dashboard
      </a>
      <a href="/venue/admin/calendar" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        Calendar
      </a>
      <a href="/venue/admin/bookings" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h8l6 6v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M14 3v6h6"/></svg>
        Bookings
      </a>
      <a href="/venue/admin/messages" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Messages
      </a>
      <a href="/venue/admin/team-chat" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8-1.5 0-2.92-.32-4.16-.9L3 20l1.05-3.16A7.94 7.94 0 0 1 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8Z"/></svg>
        Team Chat
      </a>
      <div class="sb-section-label">Manage</div>
      <a href="/venue/admin/clients" class="sb-link active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/><circle cx="18" cy="8" r="2.7"/><path d="M16.5 13.6c2.6.4 4.5 2.6 4.5 5.3"/></svg>
        Clients
      </a>
      <a href="/venue/admin/team" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        Team
      </a>
      <a href="/venue/admin/services" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3c4 0 6 3 6 7v11M18 3c-4 0-6 3-6 7"/></svg>
        Services
      </a>
      <a href="/venue/admin/loyalty" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8Z"/></svg>
        Loyalty
      </a>
      <a href="/venue/admin/gift-cards" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M12 6v14M2 11h20"/><path d="M7.5 6a2.5 2.5 0 0 1 0-5C10 1 12 6 12 6S14 1 16.5 1a2.5 2.5 0 0 1 0 5"/></svg>
        Gift Cards & Packages
      </a>
      <div class="sb-section-label">Insights</div>
      <a href="/venue/admin/reports" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 16v-4M12 16V8m4 8v-6"/></svg>
        Reports
      </a>
      <a href="/venue/admin/payments" class="sb-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>
        Payments

      <a href="/venue/admin/addons" class="sb-link">

<script>
  /* ---------------------------------------------------
     LIVE DATA — Supabase wiring
     Mirrors clients.html's grouping logic exactly (no clients table —
     a "client" is just bookings grouped by customer identity). Loads
     ALL of the salon's bookings, regroups, and finds the one group
     matching ?key=. Staff notes read/write client_notes, keyed by
     customer_name (matches the reference admin's saveClientNote).
  --------------------------------------------------- */
  const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-venue-auth"}});
  let currentSalonId = null;
  let client = null;

  function clientKeyFor(b){
    return b.customer_user_id ? 'uid:'+b.customer_user_id
      : b.customer_phone ? 'ph:'+b.customer_phone.trim()
      : b.customer_email ? 'em:'+b.customer_email.trim().toLowerCase()
      : 'nm:'+String(b.customer_name||'Customer').trim().toLowerCase();
  }

  function buildClients(bookings){
    var groups = {};
    bookings.forEach(function(b){
      var key = clientKeyFor(b);
      if(!groups[key]) groups[key] = { key:key, name:b.customer_name||'Customer', email:b.customer_email||'', phone:b.customer_phone||'', bookings:[] };
      groups[key].bookings.push(b);
    });
    var now = Date.now();
    return Object.values(groups).map(function(g){
      g.bookings.sort(function(a,b){ return new Date(b.starts_at) - new Date(a.starts_at); });
      var completed = g.bookings.filter(function(b){ return b.status==='completed'; });
      var visits = completed.length;
      var spent = completed.reduce(function(sum,b){ return sum + Number(b.total||0); }, 0);
      var lastCompletedVisit = completed[0] ? completed[0].starts_at : null;
      var firstCreated = g.bookings.reduce(function(min,b){ return (!min || new Date(b.created_at)<new Date(min)) ? b.created_at : min; }, null);
      var hasUpcoming = g.bookings.some(function(b){ return b.status==='upcoming'; });
      var daysSinceLast = lastCompletedVisit ? (now - new Date(lastCompletedVisit).getTime())/86400000 : Infinity;
      var tag = null;
      if(visits>=10 || spent>=1000) tag = 'vip';
      else if(visits<=1 && !hasUpcoming) tag = 'new';
      else if(!hasUpcoming && daysSinceLast>90) tag = 'inactive';
      var stylistCounts = {}, serviceCounts = {};
      completed.forEach(function(b){
        if(b.stylist_name_snapshot) stylistCounts[b.stylist_name_snapshot] = (stylistCounts[b.stylist_name_snapshot]||0)+1;
        if(b.service_name_snapshot) serviceCounts[b.service_name_snapshot] = (serviceCounts[b.service_name_snapshot]||0)+1;
      });
      function topOf(counts){ var best=null,bestN=0; for(var k in counts){ if(counts[k]>bestN){ best=k; bestN=counts[k]; } } return best; }
      return {
        key:g.key, name:g.name, email:g.email, phone:g.phone,
        visits:visits, spent:spent, lastVisit:lastCompletedVisit, firstCreated:firstCreated,
        tag:tag, favoriteStylist:topOf(stylistCounts), favoriteService:topOf(serviceCounts),
        upcoming: g.bookings.filter(function(b){return b.status==='upcoming';}),
        allBookings: g.bookings
      };
    });
  }

  function initialsFor(name){
    var parts = String(name||'').trim().split(/\s+/);
    return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  var AVATAR_COLORS = ['#6D5FE8','#5FA8E8','#E85F9E','#5FE8A0'];
  function colorFor(seed){
    var hash = 0; var s = String(seed||'?');
    for(var i=0;i<s.length;i++){ hash = (hash*31 + s.charCodeAt(i)) >>> 0; }
    var color = AVATAR_COLORS[hash % AVATAR_COLORS.length];
    return {color:color, text: color==='#5FE8A0' ? '#131218' : '#fff'};
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function tagPill(tag){
    if(tag === 'vip') return '<span class="tag-pill tag-vip">VIP</span>';
    if(tag === 'new') return '<span class="tag-pill tag-new">New</span>';
    if(tag === 'inactive') return '<span class="tag-pill tag-inactive">Inactive</span>';
    return '';
  }
  function monthYear(iso){ return iso ? new Intl.DateTimeFormat("en-US",{month:"short",year:"numeric"}).format(new Date(iso)) : '—'; }
  function fullDate(iso){ return new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric",year:"numeric"}).format(new Date(iso)); }
  function localTimeLabel(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZone:"Pacific/Auckland"}); }
  function nzTodayKey(){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); return `${o.year}-${o.month}-${o.day}`; }
  function nzDateKeyForIso(iso){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(iso)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); return `${o.year}-${o.month}-${o.day}`; }

  function showLoginRequired(title, message, ctaLabel, ctaHref){
    document.querySelector('.shell').innerHTML = `
      <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;">
        <div style="max-width:360px;text-align:center;">
          <h1 style="font-size:22px;margin:0 0 8px;color:var(--text);">${title}</h1>
          <p style="font-size:13.5px;color:var(--text-soft);line-height:1.5;margin:0 0 18px;">${message}</p>
          <a href="${ctaHref}" class="btn btn-violet" style="justify-content:center;">${ctaLabel}</a>
        </div>
      </div>
    `;
  }
  function showNotFound(){
    document.getElementById('clientContent').innerHTML = `
      <div class="panel" style="text-align:center;padding:60px 24px;">
        <h1 style="font-size:18px;margin-bottom:8px;">Client not found</h1>
        <p style="font-size:13.5px;color:var(--text-soft);">This client doesn't have any bookings at your venue.</p>
      </div>
    `;
  }

  function statusBadge(status){
    var map = { upcoming:'Upcoming', completed:'Completed', cancelled:'Cancelled', no_show:'No-show' };
    var cls = status==='no_show' ? 'noshow' : status;
    return '<span class="status-badge status-' + cls + '">' + (map[status]||status) + '</span>';
  }

  function renderClient(noteText){
    const c = client;
    const col = colorFor(c.name);
    const upcoming = c.upcoming[0];

    document.getElementById('clientContent').innerHTML = `
      <div class="panel profile-panel">
        <div class="profile-head">
          <div class="profile-avatar" style="background:${col.color};color:${col.text};">${initialsFor(c.name)}</div>
          <div>
            <div class="profile-name-row">
              <h1>${escapeHtml(c.name)}</h1>
              ${tagPill(c.tag)}
            </div>
            <div class="profile-meta">Client since ${monthYear(c.firstCreated)} · ${escapeHtml(c.email||'No email on file')} · ${escapeHtml(c.phone||'No phone on file')}</div>
          </div>
          <div class="profile-actions">
            <a href="/venue/admin/messages" class="btn btn-ghost">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
              Message
            </a>
            <a href="/venue/admin/new-booking" class="btn btn-violet">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
              New booking
            </a>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Total visits</div>
            <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
          </div>
          <div class="stat-value">${c.visits}</div>
          <div class="stat-delta"><span class="muted">Since ${monthYear(c.firstCreated)}</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Total spent</div>
            <div class="stat-icon" style="background:rgba(244,201,58,0.16); color:var(--warning);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
          </div>
          <div class="stat-value">$${c.spent.toLocaleString()}</div>
          <div class="stat-delta"><span class="muted">Lifetime</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Avg. per visit</div>
            <div class="stat-icon" style="background:var(--success-soft); color:var(--success);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></div>
          </div>
          <div class="stat-value">$${c.visits ? Math.round(c.spent/c.visits) : 0}</div>
          <div class="stat-delta"><span class="muted">${c.visits} visit${c.visits===1?'':'s'}</span></div>
        </div>
        <div class="stat-card">
          <div class="stat-top">
            <div class="stat-label">Last visit</div>
            <div class="stat-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
          </div>
          <div class="stat-value">${c.lastVisit ? (nzDateKeyForIso(c.lastVisit)===nzTodayKey()?'Today':fullDate(c.lastVisit)) : '—'}</div>
          <div class="stat-delta"><span class="muted">${c.lastVisit ? localTimeLabel(c.lastVisit) : ''}</span></div>
        </div>
      </div>

      <div class="dash-grid">
        <div class="side-col">

          <div class="panel">
            <div class="panel-head">
              <h2>Upcoming</h2>
              <a href="/venue/admin/bookings" class="link">See all</a>
            </div>
            ${upcoming ? `
            <div class="appt-row">
              <div class="appt-avatar" style="background:${col.color};color:${col.text};">${initialsFor(c.name)}</div>
              <div>
                <div class="appt-name">${escapeHtml(upcoming.service_name_snapshot||'Service')}</div>
                <div class="appt-service">${fullDate(upcoming.starts_at)} · ${escapeHtml(upcoming.stylist_name_snapshot||'Venue team')}</div>
              </div>
              <div class="appt-time">
                <div class="t">${localTimeLabel(upcoming.starts_at)}</div>
                <div class="status-pill status-confirmed">Upcoming</div>
              </div>
            </div>` : `<p style="font-size:12.5px;color:var(--text-faint);">No upcoming appointments.</p>`}
          </div>

          <div class="panel">
            <div class="panel-head">
              <h2>Visit history</h2>
            </div>
            <div class="table-wrap">
              <table class="data">
                <thead><tr><th>Date</th><th>Service</th><th>Stylist</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody>
                  ${c.allBookings.length ? c.allBookings.map(function(b){
                    return '<tr><td>' + fullDate(b.starts_at) + '</td><td>' + escapeHtml(b.service_name_snapshot||'Service') + '</td><td>' + escapeHtml(b.stylist_name_snapshot||'Venue team') + '</td><td>$' + Number(b.total||0).toFixed(0) + '</td><td>' + statusBadge(b.status) + '</td></tr>';
                  }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-faint);padding:24px;">No bookings yet.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

        </div>

        <div class="side-col">
          <div class="panel">
            <div class="panel-head"><h2>Contact info</h2></div>
            <div class="info-row"><span class="info-label">Email</span><span class="info-value">${escapeHtml(c.email||'—')}</span></div>
            <div class="info-row"><span class="info-label">Phone</span><span class="info-value">${escapeHtml(c.phone||'—')}</span></div>
            <div class="info-row"><span class="info-label">Client since</span><span class="info-value">${monthYear(c.firstCreated)}</span></div>
          </div>

          <div class="panel">
            <div class="panel-head"><h2>Preferences</h2></div>
            <div class="info-row"><span class="info-label">Favorite stylist</span><span class="info-value">${escapeHtml(c.favoriteStylist||'—')}</span></div>
            <div class="info-row"><span class="info-label">Favorite service</span><span class="info-value">${escapeHtml(c.favoriteService||'—')}</span></div>
          </div>

          <div class="panel">
            <div class="panel-head"><h2>Staff notes</h2></div>
            <textarea class="notes-input" id="clientNoteInput" placeholder="Add notes for other staff — allergies, preferences, anything worth knowing before their next visit…">${escapeHtml(noteText||'')}</textarea>
            <div class="notes-save-row">
              <div class="btn btn-violet" onclick="saveClientNote()">Save note</div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  async function saveClientNote(){
    const text = document.getElementById('clientNoteInput').value.trim();
    try{
      if(!text){
        await supabaseClient.from("client_notes").delete().eq("salon_id",currentSalonId).eq("customer_name",client.name);
      } else {
        await supabaseClient.from("client_notes").upsert({salon_id:currentSalonId,customer_name:client.name,note:text,updated_at:new Date().toISOString()},{onConflict:"salon_id,customer_name"});
      }
      showToast('Note saved');
    }catch(err){ showToast(err.message||'Could not save note'); }
  }

  async function bootClientPage(){
    const key = new URLSearchParams(window.location.search).get('key');
    if(!key){ showNotFound(); return; }

    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){
      showLoginRequired("Log in to your venue","Use your venue account before opening this client.","Log in","/business-auth?view=login");
      return;
    }
    const [{data:profile},{data:owner}] = await Promise.all([
      supabaseClient.from("user_profiles").select("account_type,first_name,last_name").eq("user_id",session.user.id).maybeSingle(),
      supabaseClient.from("owner_profiles").select("salon_id,role").eq("user_id",session.user.id).maybeSingle()
    ]);
    const accountType=String(profile?.account_type||session.user.user_metadata?.account_type||(owner?.salon_id?"venue":"customer")).toLowerCase();
    if(accountType!=="venue"){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      showLoginRequired("Venue account required","Customer accounts cannot be used in Blooma for Business.","Venue log in","/business-auth?view=login");
      return;
    }
    if(!owner?.salon_id){
      showLoginRequired("Finish venue setup","This account doesn't have a venue yet.","Set up venue","/business-auth?view=register");
      return;
    }
    currentSalonId=owner.salon_id;
    var displayName = [profile?.first_name,profile?.last_name].filter(Boolean).join(' ').trim() || session.user.email || 'Owner';
    document.getElementById('sbAvatar').textContent = initialsFor(displayName);
    document.getElementById('sbUserName').textContent = displayName;
    document.getElementById('sbUserRole').textContent = owner.role==='owner' ? 'Owner' : (owner.role||'Team');

    const [{data:bookings,error},{data:manualClients}] = await Promise.all([
      supabaseClient.from("bookings").select("*").eq("salon_id",currentSalonId),
      supabaseClient.rpc("get_venue_clients")
    ]);
    if(error){ showToast(error.message); showNotFound(); return; }
    const clients = buildClients(bookings||[]);
    client = clients.find(function(c){ return c.key===key; });
    if(!client){
      var manualRow = (manualClients||[]).find(function(r){
        return clientKeyFor({customer_user_id:null, customer_phone:r.phone, customer_email:r.email, customer_name:r.name}) === key;
      });
      if(manualRow){
        client = {
          key:key, name:manualRow.name, email:manualRow.email||'', phone:manualRow.phone||'',
          visits:0, spent:0, lastVisit:null, firstCreated:manualRow.created_at,
          tag:'new', favoriteStylist:null, favoriteService:null,
          upcoming:[], allBookings:[]
        };
      }
    }
    if(!client){ showNotFound(); return; }

    const {data:salonRow} = await supabaseClient.from("salons").select("name,suburb,city").eq("id",currentSalonId).maybeSingle();
    if(salonRow){
      document.querySelector('.sb-venue-name').textContent = salonRow.name || "Your venue";
      document.querySelector('.sb-venue-sub').textContent = [salonRow.suburb,salonRow.city].filter(Boolean).join(", ") || "";
      document.title = `${client.name} — ${salonRow.name || 'Blooma Business'}`;
    }

    const {data:noteRow} = await supabaseClient.from("client_notes").select("note").eq("salon_id",currentSalonId).eq("customer_name",client.name).maybeSingle();
    renderClient(noteRow?.note || '');
  }

  bootClientPage();
</script>

<script>
(function(){
  var tbInput = document.getElementById('tbSearchInput');
  var tbResults = document.getElementById('tbSearchResults');
  if(!tbInput || !tbResults) return;
  var debounceTimer = null;

  function escHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    var parts = String(name||'?').trim().split(/\s+/);
    return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function hideResults(){ tbResults.classList.remove('open'); tbResults.innerHTML=''; }

  function renderResults(clients, bookings, q){
    if(!clients.length && !bookings.length){
      tbResults.innerHTML = '<div class="tb-sr-empty">No matches for "'+escHtml(q)+'"</div>';
      tbResults.classList.add('open');
      return;
    }
    var html = '';
    if(clients.length){
      html += '<div class="tb-sr-heading">Clients</div>';
      clients.slice(0,5).forEach(function(c){
        html += '<a class="tb-sr-row" href="/venue/admin/client?key='+encodeURIComponent(c.key)+'">'
          + '<div class="tb-sr-avatar">'+escHtml(initials(c.name))+'</div>'
          + '<div class="tb-sr-info"><div class="tb-sr-name">'+escHtml(c.name||'Unnamed')+'</div><div class="tb-sr-sub">'+escHtml(c.phone||c.email||'Client')+'</div></div>'
          + '</a>';
      });
    }
    if(bookings.length){
      html += '<div class="tb-sr-heading">Bookings</div>';
      bookings.slice(0,5).forEach(function(b){
        var when = '';
        try{ when = new Date(b.starts_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){}
        html += '<a class="tb-sr-row" href="/venue/admin/booking?id='+encodeURIComponent(b.id)+'">'
          + '<div class="tb-sr-avatar">'+escHtml(initials(b.customer_name))+'</div>'
          + '<div class="tb-sr-info"><div class="tb-sr-name">'+escHtml(b.customer_name||'Booking')+'</div><div class="tb-sr-sub">'+escHtml(b.service_name_snapshot||'')+(when?' • '+when:'')+'</div></div>'
          + '</a>';
      });
    }
    tbResults.innerHTML = html;
    tbResults.classList.add('open');
  }

  function clientKeyForRow(r){
    return r.phone ? 'ph:'+String(r.phone).trim()
      : r.email ? 'em:'+String(r.email).trim().toLowerCase()
      : 'nm:'+String(r.name||'Customer').trim().toLowerCase();
  }
  function clientKeyForBooking(b){
    return b.customer_user_id ? 'uid:'+b.customer_user_id
      : b.customer_phone ? 'ph:'+String(b.customer_phone).trim()
      : b.customer_email ? 'em:'+String(b.customer_email).trim().toLowerCase()
      : 'nm:'+String(b.customer_name||'Customer').trim().toLowerCase();
  }

  function runSearch(q){
    if(typeof currentSalonId === 'undefined' || !currentSalonId){ hideResults(); return; }
    var safeQ = q.replace(/[,()%*]/g,'');
    if(!safeQ){ hideResults(); return; }
    var pattern = '%'+safeQ+'%';
    Promise.all([
      supabaseClient.from('bookings').select('id,customer_user_id,customer_name,customer_phone,customer_email,service_name_snapshot,starts_at')
        .eq('salon_id',currentSalonId)
        .or('customer_name.ilike.'+pattern+',customer_phone.ilike.'+pattern+',customer_email.ilike.'+pattern+',service_name_snapshot.ilike.'+pattern)
        .order('starts_at',{ascending:false}).limit(20),
      supabaseClient.rpc('get_venue_clients')
    ]).then(function(res){
      if(tbInput.value.trim().toLowerCase()!==q) return;
      var bookingRows = (res[0] && res[0].data) || [];
      var manual = (res[1] && res[1].data) || [];
      var seen = {};
      var clientMatches = [];
      bookingRows.forEach(function(b){
        var key = clientKeyForBooking(b);
        if(!seen[key]){ seen[key]=true; clientMatches.push({key:key,name:b.customer_name,phone:b.customer_phone,email:b.customer_email}); }
      });
      manual.forEach(function(r){
        var hay = ((r.name||'')+' '+(r.phone||'')+' '+(r.email||'')).toLowerCase();
        if(hay.indexOf(q)===-1) return;
        var key = clientKeyForRow(r);
        if(!seen[key]){ seen[key]=true; clientMatches.push({key:key,name:r.name,phone:r.phone,email:r.email}); }
      });
      var bookingMatches = bookingRows.slice(0,8);
      renderResults(clientMatches, bookingMatches, q);
    }).catch(function(){ hideResults(); });
  }

  tbInput.addEventListener('input', function(){
    var q = tbInput.value.trim().toLowerCase();
    clearTimeout(debounceTimer);
    if(q.length < 2){ hideResults(); return; }
    debounceTimer = setTimeout(function(){ runSearch(q); }, 250);
  });
  tbInput.addEventListener('focus', function(){
    if(tbInput.value.trim().length>=2 && tbResults.innerHTML) tbResults.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if(e.target===tbInput) return;
    if(!tbResults.contains(e.target)) hideResults();
  });
  tbInput.addEventListener('keydown', function(e){ if(e.key==='Escape'){ hideResults(); tbInput.blur(); } });
})();
</script>

<script src="/sidebar-badges.js"></script>
