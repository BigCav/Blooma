<script>
/* ---------------------------------------------------
   Blooma — standalone checkout page.
   Reached via /book-now/:slug (vercel.json rewrites this to
   /customer-checkout?venue=:slug, optionally with &service=:id to
   pre-select a service). Ports the same booking business logic used by
   the in-app checkout in index.html (availability, discounts, intake
   questions, booking creation) onto the design supplied for this page —
   the markup/CSS above is intentionally untouched from that design.
--------------------------------------------------- */
const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-customer-auth"}});

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
// Fades the page out before actually navigating away, so leaving checkout (or handing off to
// Stripe) reads as one smooth transition instead of an abrupt cut.
function navigateWithFade(url){
  document.body.style.transition='opacity .16s ease';
  document.body.style.opacity='0';
  setTimeout(()=>{ window.location.href=url; }, 160);
}
const CLOCK_ICON=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;
const USER_ICON=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
const STAR_ICON=`<svg width="15" height="15" viewBox="0 0 24 24" fill="var(--gold)" stroke="none"><path d="M12 1.5l3.22 6.86 7.28.94-5.44 5.06 1.46 7.64L12 18.27l-6.52 3.73 1.46-7.64L1.5 9.3l7.28-.94L12 1.5z"></path></svg>`;
const CALENDAR_ICON=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>`;
function makeClientRequestId(){
  if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{ const r=Math.random()*16|0,v=c==="x"?r:(r&3|8); return v.toString(16); });
}

// Several buttons on this page disable themselves and say "Redirecting…" right before a full
// page navigation to Windcave's hosted payment page. If the customer hits the browser Back
// button instead of completing payment, some browsers restore this page from the bfcache —
// the exact frozen DOM from the moment we navigated away — without re-running any JS, so the
// button is stuck disabled forever until a manual refresh. Reloading on a bfcache restore
// forces a real re-run of boot()/handleDepositReturn() so the page reflects reality again.
window.addEventListener('pageshow', (e)=>{ if(e.persisted) location.reload(); });

/* ---------- NZ date/time helpers (same logic as the main app) ---------- */
const NZ_TIME_ZONE = "Pacific/Auckland";
function nzParts(d=new Date()){ const out={}; new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d).forEach(p=>{if(p.type!=="literal")out[p.type]=p.value;}); return out; }
function nzDateKey(d=new Date()){ const o=nzParts(d); return `${o.year}-${o.month}-${o.day}`; }
function nzTodayKey(){ return nzDateKey(new Date()); }
function addDaysToDateKey(key,days){ const [y,m,d]=String(key).split("-").map(Number),dt=new Date(Date.UTC(y,m-1,d+Number(days||0))); return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`; }
function parseTimeMins(t){ const raw=String(t||"").trim(); const m=raw.match(/(\d+):(\d+)\s*(AM|PM)/i); if(m){ let h=parseInt(m[1],10)%12; if(/PM/i.test(m[3])) h+=12; return h*60+parseInt(m[2],10); } const m24=raw.match(/^(\d{1,2}):(\d{2})/); if(m24) return Number(m24[1])*60+Number(m24[2]); return 0; }
function formatTimeMins(mins){ let h=Math.floor(mins/60)%24,m=mins%60,period=h>=12?"PM":"AM"; let h12=h%12||12; return `${h12}:${String(m).padStart(2,"0")} ${period}`; }
function bookingLocalTime24(timeStr){ const mins=parseTimeMins(timeStr); return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}:00`; }
function nzLocalToIso(dateKey,timeStr){
  const [y,mo,da]=dateKey.split("-").map(Number), mins=parseTimeMins(timeStr), hh=Math.floor(mins/60), mm=mins%60;
  const target=Date.UTC(y,mo-1,da,hh,mm,0); let guess=target;
  const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  for(let i=0;i<3;i++){ const o={}; fmt.formatToParts(new Date(guess)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); const represented=Date.UTC(Number(o.year),Number(o.month)-1,Number(o.day),Number(o.hour),Number(o.minute),0); guess+=target-represented; }
  return new Date(guess).toISOString();
}
function dateFromNzKey(key){ return new Date(nzLocalToIso(key,"12:00 PM")); }
function nzDayIndex(d){ const wd=new Intl.DateTimeFormat("en-US",{timeZone:NZ_TIME_ZONE,weekday:"short"}).format(d); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(wd); }
function nzDayNumber(d){ return Number(nzParts(d).day); }
function dayShort(d){ return d.toLocaleDateString(undefined,{weekday:"short",timeZone:NZ_TIME_ZONE}); }
function dayLabel(d){ return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:NZ_TIME_ZONE}); }
function dayLabelFull(d){ return d.toLocaleDateString("en-NZ",{weekday:"long",month:"long",day:"numeric",timeZone:NZ_TIME_ZONE}); }
function formatTimeMinsLower(mins){ let h=Math.floor(mins/60)%24,m=mins%60,period=h>=12?"pm":"am"; let h12=h%12||12; return `${h12}:${String(m).padStart(2,"0")}${period}`; }
function durationLabelCompact(mins){ const h=Math.floor(mins/60),m=mins%60; const parts=[]; if(h) parts.push(`${h}hr${h>1?'s':''}`); if(m) parts.push(`${m}min${m>1?'s':''}`); return parts.join(', ')||'0min'; }
function timeRangeWithDurationLabel(time,mins){ if(!time) return 'Not selected'; const startMins=parseTimeMins(time); return `${formatTimeMinsLower(startMins)} - ${formatTimeMinsLower(startMins+mins)} (${durationLabelCompact(mins)})`; }
const DAYS = Array.from({length:21},(_,i)=>dateFromNzKey(addDaysToDateKey(nzTodayKey(),i)));
function dayIndexForDate(d){ const key=nzDateKey(d); for(let i=0;i<DAYS.length;i++){ if(nzDateKey(DAYS[i])===key) return i; } return -1; }
function nzMinutesOfDay(d){ const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:NZ_TIME_ZONE,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}); let h=0,m=0; fmt.formatToParts(d).forEach(p=>{ if(p.type==='hour') h=Number(p.value); if(p.type==='minute') m=Number(p.value); }); return h*60+m; }
function bookingStartIso(dayIndex,timeStr){ return nzLocalToIso(nzDateKey(DAYS[dayIndex]),timeStr); }
function isPastTimeSlot(dayIndex,timeStr){ return new Date(bookingStartIso(dayIndex,timeStr)).getTime() < Date.now()+5*60000; }

/* ---------- Venue mapping + availability (ported from index.html) ---------- */
function liveVenueIcon(tag){ return "sparkles"; }
function liveDbTime(t){ return String(t||"").slice(0,5) || "09:00"; }
function liveOpenDays(days){ return (Array.isArray(days)?days:[]).map(d=>Number(d)===7?0:Number(d)).filter(d=>Number.isInteger(d)); }
function normalizedDailyHours(raw){
  const out={}; const src=raw&&typeof raw==="object"?raw:{};
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(key=>{ const h=src[key]; if(h&&typeof h==="object") out[key]={open:h.open!==false,start:String(h.start||""),end:String(h.end||"")}; });
  return out;
}
function customerDayHours(salon,dayIndex){
  const keys=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; const idx=((Number(dayIndex)%7)+7)%7;
  const h=salon?.dailyHours?.[keys[idx]];
  if(h&&typeof h==="object"){ if(h.open===false) return null; return {start:String(h.start||salon.openTime||"09:00"),end:String(h.end||salon.closeTime||"17:00")}; }
  if(!(salon?.openDays||[]).includes(idx)) return null;
  return {start:String(salon.openTime||"09:00"),end:String(salon.closeTime||"17:00")};
}
function formatAnyTime12(value){ return formatTimeMins(parseTimeMins(value)); }
function liveHoursLabel(v){
  const daily=normalizedDailyHours(v?.metadata?.hours);
  const salon={dailyHours:daily,openDays:liveOpenDays(v.open_days),openTime:liveDbTime(v.open_time),closeTime:liveDbTime(v.close_time)};
  const open=[]; [1,2,3,4,5,6,0].forEach(idx=>{ const h=customerDayHours(salon,idx); if(h) open.push(`${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][idx]} ${formatAnyTime12(h.start)}–${formatAnyTime12(h.end)}`); });
  return open.length?open.join(" · "):"Hours not set";
}
function liveVenueToSalon(v){
  const reviews=Array.isArray(v.reviews)?v.reviews:[];
  const tag=String(v.tag||"").trim() || ((v.categories||[]).map(c=>c.name).filter(Boolean).join(" · ")) || "Beauty & wellness";
  const mainImage=String(v.main_image||"").trim();
  const galleryImages=(Array.isArray(v.gallery_images)?v.gallery_images:[]).map(String).filter(Boolean);
  const stylists=(Array.isArray(v.stylists)?v.stylists:[]).map(st=>({
    id:String(st.id), name:st.name, specialty:st.specialty||"", availableDays:liveOpenDays(v.open_days),
    availableToday:st.available_today!==false, photo:st.image_url||"",
    serviceIds:Array.isArray(st.service_ids)?st.service_ids.map(String):[]
  }));
  if(!stylists.some(st=>st.name==="Any available")) stylists.unshift({id:`${v.id}-any`,name:"Any available",availableDays:liveOpenDays(v.open_days)});
  const services=(Array.isArray(v.services)?v.services:[]).map(sv=>({
    id:String(sv.id), name:sv.name, description:String(sv.description||sv.service_description||"").trim(), duration:Math.max(15,Number(sv.duration_minutes||30)), price:Math.max(0,Number(sv.price||0)),
    category:sv.category_name||tag.split("·")[0].trim()||"Services", addons:(Array.isArray(sv.addons)?sv.addons:[]).map(a=>({id:String(a.id),name:a.name,price:Number(a.price||0),duration:Number(a.duration_minutes||a.duration||0)}))
  }));
  return {
    id:String(v.id), publicSlug:String(v.public_slug||"").trim(), name:v.name||"Venue", tag, rating: reviews.length ? (reviews.reduce((sum,r)=>sum+Number(r.rating||0),0)/reviews.length).toFixed(1) : "New", reviews:reviews.length,
    city:String(v.city||"").trim(), suburb:String(v.suburb||"").trim(),
    homeImage:mainImage||galleryImages[0]||"",
    hours:liveHoursLabel(v), openDays:liveOpenDays(v.open_days), openTime:liveDbTime(v.open_time), closeTime:liveDbTime(v.close_time), dailyHours:normalizedDailyHours(v.metadata&&v.metadata.hours),
    cancellationPolicy:v.cancellation_policy||"You can cancel or reschedule this booking at any time before your appointment.",
    bufferTime:Math.max(0,Number(v.buffer_minutes||0)),
    loyalty:(v.loyalty&&typeof v.loyalty==="object")?{enabled:!!v.loyalty.enabled,pointsPerDollar:Number(v.loyalty.pointsPerDollar)||1,rewardThreshold:Number(v.loyalty.rewardThreshold)||100,rewardText:v.loyalty.rewardText||"",rewardValue:Number(v.loyalty.rewardValue)||0}:{enabled:false},
    depositEnabled:!!v.deposit_enabled, depositType:v.deposit_type==="flat"?"flat":"percent", depositValue:Math.max(0,Number(v.deposit_value)||0),
    cloudBookedSlots:Array.isArray(v.booked_slots)?v.booked_slots:[], cloudBlockouts:Array.isArray(v.blockouts)?v.blockouts:[],
    stylists, services
  };
}
function isAnyAvailableStylist(stylist){ return !stylist || String(stylist.name||stylist).trim().toLowerCase()==="any available"; }
function stylistPreferenceLabel(stylist){ return isAnyAvailableStylist(stylist) ? "Any available" : String(stylist?.name||stylist||""); }
function stylistAvailabilityPhrase(stylist){ return isAnyAvailableStylist(stylist) ? "with any available stylist" : `with ${String(stylist?.name||stylist||"this stylist")}`; }
function timeSlotsForSalon(salon,dayIndex,durationMins){
  const h=customerDayHours(salon,nzDayIndex(DAYS[dayIndex])); if(!h) return [];
  const bounds={start:parseTimeMins(h.start),end:parseTimeMins(h.end)};
  const out=[]; for(let m=bounds.start;m+Number(durationMins||0)<=bounds.end;m+=15) out.push(formatTimeMins(m)); return out;
}
function intervalOverlaps(aStart,aEnd,bStart,bEnd){ return aStart<bEnd && aEnd>bStart; }
function staffUnavailableInCloud(salon,staffId,slotStart,slotEnd){
  const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
  const booked=(salon.cloudBookedSlots||[]).some(b=>{
    if(String(b.stylist_id||"")!==String(staffId||"")) return false;
    const existingStart=new Date(b.starts_at); const existingEnd=new Date(existingStart.getTime()+Number(b.duration_minutes||30)*60000);
    return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),existingStart,new Date(existingEnd.getTime()+bufferMs));
  });
  if(booked) return true;
  return (salon.cloudBlockouts||[]).some(bo=>(bo.all_staff||String(bo.stylist_id||"")===String(staffId||"")) && intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
}
function isTimeBlocked(salon,dayIndex,stylist,timeStr,durationMins){
  const h=customerDayHours(salon,nzDayIndex(DAYS[dayIndex])); if(!h) return true;
  const bounds={start:parseTimeMins(h.start),end:parseTimeMins(h.end)};
  const slotStartMin=parseTimeMins(timeStr), slotEndMin=slotStartMin+Number(durationMins||0); if(slotStartMin<bounds.start||slotEndMin>bounds.end) return true;
  const slotStart=new Date(bookingStartIso(dayIndex,timeStr)); const slotEnd=new Date(slotStart.getTime()+Number(durationMins||0)*60000);
  if(slotStart.getTime()<Date.now()+5*60000) return true;
  const anySelected=!stylist||stylist.name==="Any available";
  const isToday=dayIndex===0;
  if(!anySelected && isToday && stylist.availableToday===false) return true;
  if(anySelected){
    const realStaff=(salon.stylists||[]).filter(st=>st.name!=="Any available" && (!isToday || st.availableToday!==false));
    if(realStaff.length) return realStaff.every(st=>staffUnavailableInCloud(salon,st.id,slotStart,slotEnd));
    const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
    const genericBooked=(salon.cloudBookedSlots||[]).some(b=>{
      if(b.stylist_id) return false;
      const bs=new Date(b.starts_at),be=new Date(bs.getTime()+Number(b.duration_minutes||30)*60000);
      return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),bs,new Date(be.getTime()+bufferMs));
    });
    const allBlock=(salon.cloudBlockouts||[]).some(bo=>bo.all_staff&&intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
    return genericBooked||allBlock;
  }
  return staffUnavailableInCloud(salon,stylist.id,slotStart,slotEnd);
}
function firstOpenDayIndex(salon){ for (let i=0;i<DAYS.length;i++){ if (customerDayHours(salon,nzDayIndex(DAYS[i]))) return i; } return 0; }
// Like firstOpenDayIndex, but skips days that are technically "open" yet have no actual bookable
// slot left for this stylist/duration (e.g. today's remaining hours are too short, or every slot
// is already booked out) -- so the time step never defaults to a day with nothing to pick.
function firstBookableDayIndex(salon,stylist,durationMins){
  for(let i=0;i<DAYS.length;i++){
    const slots=timeSlotsForSalon(salon,i,durationMins);
    if(slots.some(t=>!isTimeBlocked(salon,i,stylist,t,durationMins))) return i;
  }
  return firstOpenDayIndex(salon);
}

/* ---------- App state ---------- */
const state={
  step:0, salon:null, service:null, serviceCategory:'All',
  addons:[], stylist:null, day:0, time:null,
  intake:{}, firstVisit:null,
  authenticated:false, authUserId:null,
  name:'', phone:'', email:'', notes:'',
  promoCode:'', appliedPromo:null, promoChecking:false, promoFlash:false,
  giftCode:'', appliedGiftCard:null, giftChecking:false, giftFlash:false,
  loyaltyAccount:null, appliedLoyaltyReward:null,
  intakeQuestionsByService:{},
  saving:false, bookingError:'', done:false, lastBooking:null,
  rescheduleToken:null, rescheduleBookingId:null,
  waitlistJoining:false, waitlistJoinedKey:null, waitlistError:'',
};

function currentService(){ return state.service; }
function selectedAddonsList(){ if(!state.service) return []; return (state.service.addons||[]).filter(a=>state.addons.includes(a.id)); }
function selectedAddonsTotal(){ return selectedAddonsList().reduce((s,a)=>s+a.price,0); }
function selectedAddonsDuration(){ return selectedAddonsList().reduce((s,a)=>s+(Number(a.duration)||0),0); }
function totalDurationMins(){ return state.service ? state.service.duration + selectedAddonsDuration() : 0; }
function baseTotal(){ return state.service ? state.service.price + selectedAddonsTotal() : 0; }
function promoDiscount(){ if(!state.appliedPromo) return 0; const p=state.appliedPromo; const subtotal=baseTotal(); const raw=p.type==='percent'?Math.round(subtotal*p.value/100*100)/100:Number(p.value||0); return Math.max(0,Math.min(raw,subtotal)); }
function loyaltyDiscount(){ if(!state.appliedLoyaltyReward) return 0; const remaining=Math.max(0,baseTotal()-promoDiscount()); return Math.max(0,Math.min(Number(state.appliedLoyaltyReward.value||0),remaining)); }
function giftCardDiscount(){ if(!state.appliedGiftCard) return 0; const remaining=Math.max(0,baseTotal()-promoDiscount()-loyaltyDiscount()); return Math.max(0,Math.min(Number(state.appliedGiftCard.remaining_balance||0),remaining)); }
function finalTotal(){ return Math.max(0, baseTotal()-promoDiscount()-loyaltyDiscount()-giftCardDiscount()); }
function depositAmountFor(salon,total){
  if(!salon || !salon.depositEnabled || total<=0) return 0;
  const raw = salon.depositType==='flat' ? salon.depositValue : Math.round(total*salon.depositValue)/100;
  return Math.max(0, Math.min(raw, total));
}
function intakeQuestionsForCurrent(){ if(!state.service) return []; return state.intakeQuestionsByService[state.service.id] || []; }
function bookingContact(){ return { name:(state.name||'').trim(), phone:(state.phone||'').trim(), email:(state.email||'').trim() }; }

function stepDefs(){
  const defs=[{key:'service',label:'Services'}];
  if(state.service && state.service.addons && state.service.addons.length) defs.push({key:'addons',label:'Add-ons'});
  defs.push({key:'stylist',label:'Stylist'});
  defs.push({key:'time',label:'Time'});
  if(intakeQuestionsForCurrent().length) defs.push({key:'intake',label:'A few questions'});
  if(!state.rescheduleToken) defs.push({key:'firstVisit',label:'About you'});
  defs.push({key:'review',label:'Summary'});
  return defs;
}
function eligibleStylists(){
  if(!state.salon || !state.service) return [];
  const assigned = state.salon.stylists.filter(st=>Array.isArray(st.serviceIds)&&st.serviceIds.length&&st.serviceIds.includes(state.service.id));
  return assigned.length ? state.salon.stylists.filter(st=>isAnyAvailableStylist(st)||assigned.includes(st)) : state.salon.stylists;
}

/* ---------- Rendering ---------- */
function renderNav(smoothScroll){
  const defs=stepDefs();
  if(state.step>=defs.length) state.step=defs.length-1;
  const nav=document.getElementById('stepNav');
  const doneCheck='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
  nav.innerHTML=defs.map((s,i)=>`<button class="step-pill ${i===state.step?'active':i<state.step?'done':''}" data-goto="${i}"><span class="num">${i<state.step?doneCheck:i+1}</span>${esc(s.label)}</button>`).join('');
  nav.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ if(+b.dataset.goto<=state.step){ state.step=+b.dataset.goto; render({smoothNav:true}); } });
  requestAnimationFrame(()=>{
    const active=nav.querySelector('.step-pill.active'); if(!active) return;
    if(nav.scrollWidth>nav.clientWidth+1){
      const target=Math.max(0,active.offsetLeft-parseFloat(getComputedStyle(nav).paddingLeft||0));
      nav.scrollTo({left:target,behavior:smoothScroll?'smooth':'auto'});
    }
  });
}
function renderSummary(){
  const salon=state.salon, svc=state.service;
  document.getElementById('summary').innerHTML=`
    <div class="venue-row"><div class="venue-img">${salon.homeImage?`<img src="${esc(salon.homeImage)}" alt="Venue">`:''}</div><div><p class="venue-name">${esc(salon.name)}</p><p class="venue-meta">${STAR_ICON} ${esc(salon.rating)} · ${esc([salon.suburb,salon.city].filter(Boolean).join(', '))}</p></div></div>
    <div class="datebox">
      <div class="date-row">${CLOCK_ICON} <span>${state.time?dayLabel(DAYS[state.day])+' · '+state.time:'Choose a time'}</span></div>
      <div class="date-row">${USER_ICON} <span>${state.stylist?esc(stylistPreferenceLabel(state.stylist)):'Choose a stylist'}</span></div>
    </div>
    <div class="divider"></div>
    ${(()=>{ const lines=[
      svc?`<div class="summary-line"><div><div class="summary-name">${esc(svc.name)}</div><div class="summary-sub">${svc.duration} min</div></div><div class="summary-price">$${svc.price}</div></div>`:'',
      selectedAddonsList().map(a=>`<div class="summary-line"><div><div class="summary-name">${esc(a.name)}</div></div><div class="summary-price">+$${a.price}</div></div>`).join(''),
      state.appliedLoyaltyReward?`<div class="summary-line"><div class="summary-name" style="color:var(--purple)">${esc(state.appliedLoyaltyReward.label)}</div><div class="summary-price" style="color:var(--purple)">−$${loyaltyDiscount()}</div></div>`:'',
      state.appliedPromo?`<div class="summary-line"><div class="summary-name" style="color:var(--purple)">Promo ${esc(state.appliedPromo.code)}</div><div class="summary-price" style="color:var(--purple)">−$${promoDiscount()}</div></div>`:'',
      state.appliedGiftCard?`<div class="summary-line"><div class="summary-name" style="color:var(--purple)">Gift card</div><div class="summary-price" style="color:var(--purple)">−$${giftCardDiscount()}</div></div>`:'',
    ].join(''); return lines + (lines?'<div class="divider"></div>':''); })()}
    <div class="total"><span>Total</span><strong>$${finalTotal()}</strong></div>
    ${!state.rescheduleToken && depositAmountFor(salon,finalTotal())>0 ? `<div class="summary-line" style="margin-top:10px;"><div class="summary-name" style="color:var(--purple)">Deposit due to book</div><div class="summary-price" style="color:var(--purple)">$${depositAmountFor(salon,finalTotal())}</div></div>` : ''}
  `;
  const rewardCard=document.getElementById('rewardCard');
  if(state.authenticated && salon.loyalty && salon.loyalty.enabled && state.loyaltyAccount){
    rewardCard.style.display='';
    const L=state.loyaltyAccount;
    document.getElementById('rewardPoints').textContent=`${L.points} points available`;
    document.getElementById('rewardBarFill').style.width=Math.min(100,Math.round((L.points/(L.threshold||1))*100))+'%';
    document.getElementById('rewardNote').textContent=L.points>=L.threshold ? `You can redeem for ${L.rewardText||'a reward'} at the summary step.` : `${Math.max(0,L.threshold-L.points)} more points until ${L.rewardText||'your reward'}.`;
  } else {
    rewardCard.style.display='none';
  }
  const svcForTotal = state.service;
  document.getElementById('mobileTotal').textContent=`$${finalTotal()} total`;
  document.getElementById('mobileStep').textContent=`Step ${state.step+1} of ${stepDefs().length}`;
}
function panelHead(title,sub){ return `<div class="panel-head"><div><p class="section-label" style="display:none;">${esc(stepDefs()[state.step]?.label||'')}</p><h2>${esc(title)}</h2><p class="panel-sub" style="display:none;">${esc(sub)}</p></div></div>`; }

function renderPanel(){
  const salon=state.salon; const svc=state.service;
  const key=stepDefs()[state.step]?.key;
  let h='';

  if(key==='service'){
    const categories=['All', ...Array.from(new Set(salon.services.map(s=>s.category)))];
    const filtered = state.serviceCategory==='All' ? salon.services : salon.services.filter(s=>s.category===state.serviceCategory);
    h = panelHead('Choose your service','Select the treatment you would like to book. You can change this before moving on.')
      + `<div class="service-cats" aria-label="Service categories">${categories.map(c=>`<button class="service-cat ${state.serviceCategory===c?'selected':''}" data-service-category="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
      + `<div class="stack">${filtered.length?filtered.map(x=>`<button class="choice-card ${svc&&svc.id===x.id?'selected':''}" data-service="${esc(x.id)}"><div class="choice-left"><div><p class="choice-title">${esc(x.name)}</p><p class="choice-sub">${x.duration} min${x.addons&&x.addons.length?' · add-ons available':''}${x.description?' · '+esc(x.description):''}</p></div></div><div class="choice-price">$${x.price}</div></button>`).join(''):`<div class="service-empty">No services in this category yet.</div>`}</div>`;
  } else if(key==='addons'){
    h = panelHead('Add anything extra?','Optional extras can be added now and included in the final appointment time.')
      + `<div class="stack">${svc.addons.map(a=>`<button class="choice-card ${state.addons.includes(a.id)?'selected':''}" data-addon="${esc(a.id)}"><div class="choice-left"><div><p class="choice-title">${esc(a.name)}</p>${a.duration?`<p class="choice-sub">${a.duration} min</p>`:''}</div></div><div class="choice-price">+$${a.price}</div></button>`).join('')}</div>`
      + `<div class="inline-note" style="margin-top:16px">No extras needed? You can simply continue.</div>`;

  } else if(key==='time'){
    const slots = timeSlotsForSalon(salon,state.day,totalDurationMins()).filter(t=>!isPastTimeSlot(state.day,t));
    const allBlocked = slots.length===0 || slots.every(t=>isTimeBlocked(salon,state.day,state.stylist,t,totalDurationMins()));
    h = panelHead('Choose a time','Pick a day first, then choose from the available appointment times below.')
      + `<p class="section-label">Day</p><div class="days">${DAYS.map((d,i)=>{ const open=!!customerDayHours(salon,nzDayIndex(d)); return `<button class="day ${state.day===i?'selected':''}" data-day="${i}" ${open?'':'disabled'}><span>${dayShort(d)}</span><span>${nzDayNumber(d)}</span></button>`; }).join('')}</div>`
      + `<p class="section-label">Available times</p><div class="time-list">${slots.length?slots.map(t=>{ const blocked=isTimeBlocked(salon,state.day,state.stylist,t,totalDurationMins()); return `<button class="time ${state.time===t?'selected':''}" data-time="${esc(t)}" ${blocked?'disabled':''}><strong>${esc(t)}</strong><span>${blocked?'Unavailable':'Available'}</span></button>`; }).join(''):'<p class="panel-sub">This venue is closed on this day.</p>'}</div>`
      + (allBlocked ? (()=>{
          const wKey=state.day+'|'+(state.stylist?state.stylist.id:'');
          const joined=state.waitlistJoinedKey===wKey;
          return `<div class="inline-note" style="margin-top:16px;">
            <p style="margin:0 0 ${joined?'0':'12px'};">No times are available ${esc(stylistAvailabilityPhrase(state.stylist))} on ${esc(dayLabel(DAYS[state.day]))}. Try another day or stylist${state.rescheduleToken?'.':', or join the waitlist and we\'ll text you if a spot opens up.'}</p>
            ${state.rescheduleToken ? '' : joined
              ? `<p style="margin:0;font-weight:700;color:var(--purple);">You're on the waitlist for this day. We'll be in touch if a spot opens up.</p>`
              : `<button class="btn primary" type="button" id="joinWaitlistBtn" style="width:100%;" ${state.waitlistJoining?'disabled':''}>${state.waitlistJoining?'Joining…':'Join waitlist for this day'}</button>
                 ${state.waitlistError?`<p style="margin:8px 0 0;color:var(--red);font-size:12.5px;">${esc(state.waitlistError)}</p>`:''}`}
          </div>`;
        })() : '');
  } else if(key==='intake'){
    h = panelHead('A few questions',`These help ${salon.name} prepare for your appointment.`)
      + `<div class="stack">${intakeQuestionsForCurrent().map(q=>`
        <div class="field">

          <div class="yesno">
            <button type="button" data-intakeyesno="${esc(q.id)}|No" class="${state.intake[q.id]==='No'?'selected':''}">No</button>
            <button type="button" data-intakeyesno="${esc(q.id)}|Yes" class="${state.intake[q.id]==='Yes'?'selected':''}">Yes</button>

          <div class="stack">${(q.options||[]).map(opt=>`<button type="button" class="choice-card ${state.intake[q.id]===opt?'selected':''}" data-intakechoice="${esc(q.id)}|${esc(opt)}"><div class="choice-left"><p class="choice-title">${esc(opt)}</p></div></button>`).join('')}</div>` : `
          <input type="text" data-intaketext="${esc(q.id)}" value="${esc(state.intake[q.id]||'')}">`}
        </div>`).join('')}</div>`;
  } else if(key==='firstVisit'){
    h = panelHead(`Is this your first visit to ${salon.name}?`, "This just helps them prepare for your appointment.")
      + `<div class="stack">
          <button type="button" class="choice-card ${state.firstVisit==='Yes'?'selected':''}" data-first="Yes"><div class="choice-left"><div><p class="choice-title">Yes</p><p class="choice-sub">This is my first visit</p></div></div></button>
          <button type="button" class="choice-card ${state.firstVisit==='No'?'selected':''}" data-first="No"><div class="choice-left"><div><p class="choice-title">No</p><p class="choice-sub">I've visited before</p></div></div></button>
        </div>`;
  } else {
    const svcOnly=svc.price, addonsList=selectedAddonsList();
    const eligibleForReward = state.authenticated && salon.loyalty && salon.loyalty.enabled && state.loyaltyAccount && state.loyaltyAccount.points >= state.loyaltyAccount.threshold;
    h = `<div id="reviewContent">${panelHead('Review and confirm','Check the booking details below, then confirm to send this booking to the venue.')}

      <div class="review-block">

          <div class="mini-row"><span>Service</span><strong>${esc(svc.name)}</strong></div>

          <div class="mini-row"><span>Artist</span><strong>${esc(stylistPreferenceLabel(state.stylist))}</strong></div>
          <div class="mini-row"><span>Date & time</span><strong>${state.time?esc(dayLabel(DAYS[state.day]))+' · '+esc(state.time):'Not selected'}</strong></div>
          <div class="mini-row"><span>Total</span><strong>$${finalTotal()}</strong></div>
          ${!state.rescheduleToken && depositAmountFor(salon,finalTotal())>0 ? `<div class="mini-row" style="color:var(--purple)"><span>Deposit due now</span><strong>$${depositAmountFor(salon,finalTotal())}</strong></div>` : ''}

        <div class="review-card review-appt-mobile">
          <div class="venue-row"><div class="venue-img">${salon.homeImage?`<img src="${esc(salon.homeImage)}" alt="Venue">`:''}</div><div><p class="venue-name">${esc(salon.name)}</p><p class="venue-meta">${STAR_ICON} ${esc(salon.rating)} · ${esc([salon.suburb,salon.city].filter(Boolean).join(', '))}</p></div></div>
          <div class="divider"></div>
          <div class="date-row">${CALENDAR_ICON} <span>${state.time?esc(dayLabelFull(DAYS[state.day])):'Not selected'}</span></div>
          <div class="date-row">${CLOCK_ICON} <span>${esc(timeRangeWithDurationLabel(state.time,totalDurationMins()))}</span></div>
          <div class="date-row">${USER_ICON} <span>${esc(stylistPreferenceLabel(state.stylist))}</span></div>
          <div class="divider"></div>
          <div class="summary-line"><div><div class="summary-name">${esc(svc.name)}</div><div class="summary-sub">${svc.duration} min</div></div><div class="summary-price">$${svc.price}</div></div>
          ${addonsList.map(a=>`<div class="summary-line"><div><div class="summary-name">${esc(a.name)}</div></div><div class="summary-price">+$${a.price}</div></div>`).join('')}
          <div class="divider"></div>
          <div class="total"><span>Total</span><strong>$${finalTotal()}</strong></div>
          ${!state.rescheduleToken && depositAmountFor(salon,finalTotal())>0 ? `<div class="mini-row" style="margin-top:10px;"><span>Pay now</span><strong>$${depositAmountFor(salon,finalTotal())}</strong></div><div class="mini-row"><span>Pay in store</span><span>$${finalTotal()-depositAmountFor(salon,finalTotal())}</span></div>` : ''}
        </div>
        ${!state.rescheduleToken && depositAmountFor(salon,finalTotal())>0 ? `<div class="review-card"><h3>Deposit required</h3><p>${esc(salon.name)} requires a $${depositAmountFor(salon,finalTotal())} deposit to secure this booking. You'll pay by card on the next step; the rest is due at your appointment.</p></div>` : ''}
        <div class="review-card"><h3>Cancellation policy</h3><p>${esc(salon.cancellationPolicy)}</p></div>
        <div class="field"><label>Comments</label><textarea id="notesInput">${esc(state.notes)}</textarea></div>
        <div>
          <p class="section-label">Rewards & offers</p>
          <div class="stack">
            ${eligibleForReward ? `<button class="offer-card" id="rewardToggle" type="button"><div><strong>${state.appliedLoyaltyReward?'Reward applied':'Redeem '+esc(state.loyaltyAccount.rewardText||'reward')}</strong><p>${state.loyaltyAccount.points} points available</p></div><span class="toggle ${state.appliedLoyaltyReward?'on':''}"></span></button>` : ''}
            <div class="promo-row"><input id="promoInput" placeholder="Promo code" value="${esc(state.promoCode)}" ${state.appliedPromo?'disabled':''} style="${state.promoFlash?'border-color:var(--red);box-shadow:0 0 0 3px rgba(193,59,59,.12);':''}"><button class="small-btn" id="promoBtn" type="button">${state.promoChecking?'Checking…':state.appliedPromo?'Remove':'Apply'}</button></div>
            <div class="promo-row"><input id="giftInput" placeholder="Gift card code" value="${esc(state.giftCode)}" style="${state.giftFlash?'border-color:var(--red);box-shadow:0 0 0 3px rgba(193,59,59,.12);':''}"><button class="small-btn" id="giftBtn" type="button">${state.giftChecking?'Checking…':state.appliedGiftCard?'Remove':'Apply'}</button></div>

        <div class="success-mark">✓</div>
        <h2>${state.rescheduleToken?'Booking updated':"You're all booked in"}</h2>
        <p>${state.rescheduleToken ? `Your appointment for ${esc(svc.name)} at ${esc(salon.name)} has been moved to ${esc(dayLabel(DAYS[state.day]))} at ${esc(state.time)}.` : `${esc(salon.name)} has received your booking for ${esc(svc.name)}${state.lastBooking?', '+esc(dayLabel(DAYS[state.day]))+' at '+esc(state.time):''}.`}</p>
        <button class="success-booking-btn" id="viewBookingBtn" type="button">View booking</button>
      </div>`;
  }

  // Re-rendering swaps in a fresh .days node, which would otherwise reset its
  // scroll position to 0 on every click (picking a day visibly "snapped back to the start").
  const prevDaysScroll = document.querySelector('.days')?.scrollLeft;
  document.getElementById('panel').innerHTML = h + `<div class="actions" id="desktopActions"><button class="btn ghost" id="back">${state.step?'Back':'Cancel'}</button><button class="btn primary${state.saving?' loading':''}" id="next" ${state.saving?'disabled':''}>${state.saving?'<span class="btn-spinner"></span>Confirming…':(key==='review'?(state.rescheduleToken?'Confirm changes':'Confirm booking'):'Continue')}</button></div>`;
  const newDays = document.querySelector('.days'); if(newDays && prevDaysScroll) newDays.scrollLeft = prevDaysScroll;
  bind();
}

function canNext(){
  const key=stepDefs()[state.step]?.key;
  if(key==='service') return !!state.service;
  if(key==='stylist') return !!state.stylist;
  if(key==='time') return !!state.time && !isTimeBlocked(state.salon,state.day,state.stylist,state.time,totalDurationMins());
  if(key==='intake') return intakeQuestionsForCurrent().every(q=>!q.required || String(state.intake[q.id]||'').trim().length>0);
  if(key==='firstVisit') return !!state.firstVisit;
  return true;
}

function bind(){
  document.querySelectorAll('[data-service-category]').forEach(b=>b.onclick=()=>{ state.serviceCategory=b.dataset.serviceCategory; render(); });
  document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{
    const svc = state.salon.services.find(s=>s.id===b.dataset.service);
    if(!svc) return;
    state.service=svc; state.addons=[]; state.stylist=null; state.time=null; state.intake={};
    loadIntakeQuestionsFor(svc);
    render();
  });
  document.querySelectorAll('[data-addon]').forEach(b=>b.onclick=()=>{ const id=b.dataset.addon; state.addons=state.addons.includes(id)?state.addons.filter(x=>x!==id):[...state.addons,id]; render(); });
  document.querySelectorAll('[data-stylist]').forEach(b=>b.onclick=()=>{
    state.stylist=eligibleStylists().find(s=>s.id===b.dataset.stylist)||null; state.time=null;
    if(!state.rescheduleToken) state.day=firstBookableDayIndex(state.salon,state.stylist,totalDurationMins());
    render();
  });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ state.day=+b.dataset.day; state.time=null; render(); });
  document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ state.time=b.dataset.time; render(); });
  const joinWaitlistBtn=document.getElementById('joinWaitlistBtn'); if(joinWaitlistBtn) joinWaitlistBtn.onclick=joinCheckoutWaitlist;
  document.querySelectorAll('[data-intaketext]').forEach(el=>el.oninput=()=>{ state.intake[el.getAttribute('data-intaketext')]=el.value; });
  document.querySelectorAll('[data-intakeyesno]').forEach(b=>b.onclick=()=>{ const [qid,val]=b.getAttribute('data-intakeyesno').split('|'); state.intake[qid]=val; render(); });
  document.querySelectorAll('[data-intakechoice]').forEach(b=>b.onclick=()=>{ const idx=b.getAttribute('data-intakechoice').indexOf('|'); const qid=b.getAttribute('data-intakechoice').slice(0,idx); const val=b.getAttribute('data-intakechoice').slice(idx+1); state.intake[qid]=val; render(); });
  document.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{ state.firstVisit=b.dataset.first; render(); });
  const notesEl=document.getElementById('notesInput'); if(notesEl) notesEl.oninput=()=>{ state.notes=notesEl.value; };

  const rt=document.getElementById('rewardToggle');
  if(rt) rt.onclick=()=>{
    if(state.appliedLoyaltyReward){ state.appliedLoyaltyReward=null; }
    else { const L=state.loyaltyAccount; state.appliedLoyaltyReward={label:L.rewardText||'Loyalty reward',value:Number(L.rewardValue||0)}; }
    render();
  };
  function flashError(field){ state[field]=true; render(); setTimeout(()=>{ state[field]=false; render(); },900); }
  const pb=document.getElementById('promoBtn');
  if(pb) pb.onclick=async ()=>{
    if(state.appliedPromo){ state.appliedPromo=null; state.promoCode=''; render(); return; }
    const raw=(document.getElementById('promoInput').value||'').trim().toUpperCase();
    if(!raw){ flashError('promoFlash'); return; }
    state.promoChecking=true; render();
    try{
      const {data,error}=await supabaseClient.rpc('validate_promo_code',{p_salon_id:state.salon.id,p_code:raw});
      if(error) throw error;
      if(!data) throw new Error('Invalid code');
      state.appliedPromo=data; state.promoCode=raw;
    }catch(e){ state.appliedPromo=null; state.promoChecking=false; render(); flashError('promoFlash'); return; }
    state.promoChecking=false; render();
  };
  const gb=document.getElementById('giftBtn');
  if(gb) gb.onclick=async ()=>{
    if(state.appliedGiftCard){ state.appliedGiftCard=null; state.giftCode=''; render(); return; }
    const raw=(document.getElementById('giftInput').value||'').trim().toUpperCase();
    if(!raw){ flashError('giftFlash'); return; }
    state.giftChecking=true; render();
    try{
      const {data,error}=await supabaseClient.rpc('get_gift_card_by_code',{p_salon_id:state.salon.id,p_code:raw});
      if(error) throw error;
      state.appliedGiftCard=data; state.giftCode='';
    }catch(e){ state.appliedGiftCard=null; state.giftChecking=false; render(); flashError('giftFlash'); return; }
    state.giftChecking=false; render();
  };

  document.getElementById('back').onclick=back;
  document.getElementById('next').onclick=next;
  const viewBtn=document.getElementById('viewBookingBtn');
  if(viewBtn) viewBtn.onclick=()=>{
    if(state.authenticated && state.lastBooking?.id) navigateWithFade('/explore?openBooking='+encodeURIComponent(state.lastBooking.id));
    else navigateWithFade('/'+encodeURIComponent(state.salon.publicSlug||state.salon.id));
  };
}

function shakePanel(){
  document.getElementById('panel').animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:180});
}

let stepTransitioning=false;
async function next(){
  if(stepTransitioning) return;
  const defs=stepDefs();
  const key=defs[state.step]?.key;
  if(key==='review'){
    await confirmBooking();
    return;
  }
  if(!canNext()){ shakePanel(); return; }
  // Contact details now come from the signed-in profile, not a form on this page, so a
  // guest needs to log in right after picking a time — before the questions/summary steps
  // that assume a real profile exists. savePendingCheckoutState() lets them pick back up
  // here (see restorePendingCheckoutState()) instead of starting the whole flow over.
  if(key==='time' && !state.rescheduleToken && !state.authenticated){
    savePendingCheckoutState();
    navigateWithFade('/login?next='+encodeURIComponent(location.pathname+location.search));
    return;
  }
  // Covers stylists preselected via a deep link (skipping the stylist choice-card click that
  // normally recomputes this) -- catch it here too, right before the time step first appears.
  if(defs[state.step+1]?.key==='time' && !state.rescheduleToken && !state.time){
    state.day=firstBookableDayIndex(state.salon,state.stylist,totalDurationMins());
  }
  animateStepChange(()=>{ state.step++; render({smoothNav:true}); });
}
// Fades #panel out, applies the step change, then fades it back in — used for step-to-step
// moves (next/back) only, not for in-step interactions like picking a card, which stay instant.
function animateStepChange(applyChange){
  const panel=document.getElementById('panel');
  if(!panel){ applyChange(); return; }
  stepTransitioning=true;
  panel.classList.add('step-transitioning');
  setTimeout(()=>{
    applyChange();
    stepTransitioning=false;
    window.scrollTo({top:0,behavior:'smooth'});
    requestAnimationFrame(()=>{ document.getElementById('panel')?.classList.remove('step-transitioning'); });
  },160);
}
function savePendingCheckoutState(){
  if(!state.salon) return;
  try{
    localStorage.setItem('bloomaPendingCheckout', JSON.stringify({
      venueId: state.salon.id,
      serviceId: state.service ? state.service.id : null,
      addons: state.addons,
      stylistId: state.stylist ? state.stylist.id : null,
      dateKey: nzDateKey(DAYS[state.day]),
      time: state.time,
      notes: state.notes,
      intake: state.intake,
      savedAt: Date.now()
    }));
  }catch(e){}
}
function restorePendingCheckoutState(){
  let raw;
  try{ raw=JSON.parse(localStorage.getItem('bloomaPendingCheckout')||'null'); }catch(e){ raw=null; }
  if(!raw) return false;
  const fresh = raw.venueId===state.salon.id && (Date.now()-Number(raw.savedAt||0))<2*60*60*1000;
  localStorage.removeItem('bloomaPendingCheckout');
  if(!fresh) return false;
  const svc=state.salon.services.find(s=>s.id===raw.serviceId);
  if(!svc) return false;
  state.service=svc;
  state.addons=Array.isArray(raw.addons)?raw.addons:[];
  const anyAvailable=state.salon.stylists.find(st=>st.name==='Any available')||null;
  state.stylist=(raw.stylistId && state.salon.stylists.find(st=>st.id===raw.stylistId)) || anyAvailable;
  const idx=raw.dateKey ? dayIndexForDate(dateFromNzKey(raw.dateKey)) : -1;
  state.day=idx>=0 ? idx : firstOpenDayIndex(state.salon);
  state.time=raw.time||null;
  state.notes=raw.notes||'';
  state.intake=raw.intake||{};
  loadIntakeQuestionsFor(svc);
  const defs=stepDefs();
  const resumeIdx=defs.findIndex(d=>d.key==='firstVisit');
  state.step = resumeIdx>=0 ? resumeIdx : Math.max(0, defs.length-1);
  return true;
}
function back(){ if(!stepTransitioning && state.step>0){ animateStepChange(()=>{ state.step--; render({smoothNav:true}); }); } }

async function confirmBooking(){
  if(state.saving) return;
  const contact=bookingContact();
  if(!state.rescheduleToken && !state.authenticated){ savePendingCheckoutState(); navigateWithFade('/login?next='+encodeURIComponent(location.pathname+location.search)); return; }
  if(!state.rescheduleToken && (contact.name.length<2 || contact.phone.length<6)){ state.bookingError="We couldn't load your account details — please refresh and try again."; render(); return; }
  if(!state.time || isTimeBlocked(state.salon,state.day,state.stylist,state.time,totalDurationMins())){ state.bookingError='That time is no longer available — please choose another.'; state.step=stepDefs().findIndex(d=>d.key==='time'); render(); return; }
  state.saving=true; state.bookingError=''; render();
  try{
    // Already created this booking on a previous attempt (e.g. the customer tapped back from
    // Stripe without paying, then hit Pay again) — don't create a second, duplicate booking,
    // just start a fresh checkout session for the one that already exists.
    if(state.lastBooking?.id && state.lastBooking?.deposit_status==='pending'){
      const res=await fetch('/api/windcave?action=create-deposit-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_id:state.lastBooking.id})});
      const out=await res.json().catch(()=>null);
      if(!res.ok || !out?.url){ throw new Error(out?.error || "Couldn't start the deposit payment. Please try again."); }
      state.saving=false; render();
      navigateWithFade(out.url);
      return;
    }
    const notes=[state.notes, state.appliedLoyaltyReward?`[Loyalty reward redeemed: ${state.appliedLoyaltyReward.label}]`:'', state.appliedGiftCard?`[Gift card ${state.appliedGiftCard.code} applied: $${giftCardDiscount()}]`:''].filter(Boolean).join(' ').trim();
    let data, error;
    if(state.rescheduleToken){
      const payload={
        salon_id: state.salon.id,
        service_id: state.service.id,
        stylist_id: isAnyAvailableStylist(state.stylist) ? null : state.stylist.id,
        starts_at: bookingStartIso(state.day,state.time),
        local_date: nzDateKey(DAYS[state.day]),
        local_time: bookingLocalTime24(state.time),
        duration_minutes: totalDurationMins(),
        subtotal: baseTotal(),
        discount: promoDiscount()+loyaltyDiscount()+giftCardDiscount(),
        total: finalTotal(),
        promo_code: state.appliedPromo ? state.appliedPromo.code : null,
        notes,
        preferences: state.firstVisit==='Yes' ? ['First time here'] : [],
        addons: selectedAddonsList(),
      };
      ({data,error}=await supabaseClient.rpc('reschedule_public_booking',{token:state.rescheduleToken,payload}));
    } else {
      const payload={
        salon_id: state.salon.id,
        service_id: state.service.id,
        stylist_id: isAnyAvailableStylist(state.stylist) ? null : state.stylist.id,
        customer_name: contact.name,
        customer_phone: contact.phone,
        customer_email: contact.email||'',
        starts_at: bookingStartIso(state.day,state.time),
        local_date: nzDateKey(DAYS[state.day]),
        local_time: bookingLocalTime24(state.time),
        duration_minutes: totalDurationMins(),
        subtotal: baseTotal(),
        discount: promoDiscount()+loyaltyDiscount()+giftCardDiscount(),
        total: finalTotal(),
        promo_code: state.appliedPromo ? state.appliedPromo.code : null,
        notes,
        preferences: state.firstVisit==='Yes' ? ['First time here'] : [],
        addons: selectedAddonsList(),
        client_request_id: makeClientRequestId(),
        applied_loyalty: !!state.appliedLoyaltyReward,
        applied_gift_card_id: state.appliedGiftCard ? state.appliedGiftCard.id : null,
      };
      ({data,error}=await supabaseClient.rpc('create_public_booking',{payload}));
    }
    if(error) throw error;
    state.lastBooking=data||{};

    if(state.appliedLoyaltyReward){ try{ await supabaseClient.rpc('redeem_loyalty_reward',{p_salon_id:state.salon.id}); }catch(e){ console.error('redeem_loyalty_reward failed after booking was created with the discount applied — points not deducted', e); } }
    if(state.appliedGiftCard && giftCardDiscount()>0){ try{ await supabaseClient.rpc('redeem_gift_card',{p_gift_card_id:state.appliedGiftCard.id,p_amount:giftCardDiscount(),p_booking_id:state.lastBooking.id||null}); }catch(e){ console.error('redeem_gift_card failed after booking was created with the discount applied — balance not deducted', e); } }
    const intakeQs=intakeQuestionsForCurrent();
    if(intakeQs.length && state.lastBooking.public_token){
      const answers=intakeQs.filter(q=>state.intake[q.id]!==undefined && String(state.intake[q.id]).trim()!=='').map(q=>({question_id:q.id,label:q.label,answer:state.intake[q.id]}));
      if(answers.length){ try{ await supabaseClient.rpc('submit_public_intake_form',{token:state.lastBooking.public_token,answers}); }catch(e){} }
    }

    if(state.lastBooking.deposit_status==='pending' && Number(state.lastBooking.deposit_amount)>0){
      const res=await fetch('/api/windcave?action=create-deposit-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_id:state.lastBooking.id})});
      const out=await res.json().catch(()=>null);
      if(!res.ok || !out?.url){ throw new Error(out?.error || "Booking was saved, but we couldn't start the deposit payment. Please try again."); }
      // The booking itself is already saved at this point — leaving state.saving=true (and the
      // Pay button disabled in the already-rendered DOM) here would permanently block the button
      // if the browser restores this page from bfcache when the customer taps back from Stripe
      // without paying (see the pageshow listener below too).
      state.saving=false;
      render();
      navigateWithFade(out.url);
      return;
    }

    state.saving=false; state.done=true; render();
    document.getElementById('reviewContent').style.display='none';
    document.getElementById('desktopActions').style.display='none';
    document.getElementById('success').style.display='block';
    const mb=document.querySelector('.mobile-bar'); if(mb) mb.style.display='none';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    state.saving=false; state.bookingError=err?.message||"We couldn't save this booking. Please try again.";
    render();
  }
}

async function joinCheckoutWaitlist(){
  if(state.waitlistJoining || !state.salon || !state.service) return;
  const contact=bookingContact();
  if(contact.name.length<2 || contact.phone.length<6){ state.waitlistError="We couldn't find your contact details — please refresh and try again."; render(); return; }
  const wKey=state.day+'|'+(state.stylist?state.stylist.id:'');
  state.waitlistJoining=true; state.waitlistError=''; render();
  try{
    const payload={
      salon_id:state.salon.id,
      service_id:state.service.id,
      stylist_id:isAnyAvailableStylist(state.stylist)?null:(state.stylist?.id||null),
      desired_date:nzDateKey(DAYS[state.day]),
      customer_name:contact.name,
      customer_phone:contact.phone,
      time_preference:'Any',
      client_request_id:makeClientRequestId(),
    };
    const {error}=await supabaseClient.rpc('create_public_waitlist',{payload});
    if(error) throw error;
    state.waitlistJoining=false; state.waitlistJoinedKey=wKey;
    render();
  }catch(err){
    state.waitlistJoining=false; state.waitlistError=err?.message||"Couldn't join the waitlist. Please try again.";
    render();
  }
}

/* ---------- Data loading ---------- */
async function loadIntakeQuestionsFor(service){
  if(!state.salon?.id || state.intakeQuestionsByService[service.id]!==undefined) return;
  try{
    const {data,error}=await supabaseClient.rpc('get_public_intake_questions',{p_salon_id:state.salon.id});
    if(error) throw error;
    state.intakeQuestionsByService = data || {};
  }catch(e){ /* nice-to-have, fail quietly */ }
  render();
}
async function loadLoyaltyAccount(){
  if(!state.authenticated || !state.authUserId || !state.salon?.loyalty?.enabled) return;
  try{
    const {data,error}=await supabaseClient.from('loyalty_accounts').select('points').eq('salon_id',state.salon.id).eq('customer_user_id',state.authUserId).maybeSingle();
    if(!error){
      const cfg=state.salon.loyalty;
      state.loyaltyAccount={points:Number(data?.points||0),threshold:cfg.rewardThreshold,rewardText:cfg.rewardText,rewardValue:cfg.rewardValue||0};
    }
  }catch(e){}
  render();
}
async function loadAuth(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session) return;
    const {data:row}=await supabaseClient.from('user_profiles').select('account_type,first_name,last_name,phone').eq('user_id',session.user.id).maybeSingle();
    const accountType=String(row?.account_type||session.user.user_metadata?.account_type||'customer').toLowerCase();
    if(accountType!=='customer') return;
    const first=(row?.first_name||session.user.user_metadata?.first_name||'').trim();
    const last=(row?.last_name||session.user.user_metadata?.last_name||'').trim();
    state.authenticated=true; state.authUserId=session.user.id;
    state.name=[first,last].filter(Boolean).join(' ').trim() || state.name;
    state.phone=(row?.phone||'').trim() || state.phone;
    state.email=(session.user.user_metadata?.actual_email||session.user.email||'').trim() || state.email;
    if(!state.rescheduleToken) restorePendingCheckoutState();
    loadLoyaltyAccount();
    render();
  }catch(e){}
}

function requestedSlug(){
  const q=new URLSearchParams(location.search).get('venue'); if(q) return q;
  const cleanPath=location.pathname.replace(/\/+$/,'');
  let m=cleanPath.match(/^\/book-now\/([^/]+)$/i);
  if(m) return decodeURIComponent(m[1]);
  // Backward compat: /venue/:slug/checkout links shared before the /book-now/:slug rename.
  m=cleanPath.match(/^\/venue\/([^/]+)\/checkout$/i);
  return m ? decodeURIComponent(m[1]) : '';
}

// Clears the skeleton placeholders in #stepNav and #summary — used on boot() error paths,
// which otherwise only replace #panel and leave the rest shimmering forever.
function clearBootSkeleton(){
  const nav=document.getElementById('stepNav'); if(nav) nav.innerHTML='';
  const summary=document.getElementById('summary'); if(summary) summary.innerHTML='';
}
async function boot(){
  const slug=requestedSlug();
  const requestedServiceId=new URLSearchParams(location.search).get('service');
  if(!slug){ clearBootSkeleton(); document.getElementById('panel').innerHTML='<div class="panel-head"><h2>Venue not found</h2><p class="panel-sub">This checkout link is missing a venue.</p></div>'; return; }
  try{
    // Sweep expired deposit holds first, so a slot someone abandoned mid-checkout shows as
    // available again in the same load rather than waiting for whoever loads next.
    try{ await fetch('/api/bookings/expire-stale-holds',{method:'POST'}); }catch(e){}
    const {data,error}=await supabaseClient.rpc('get_marketplace_venues');
    if(error) throw error;
    const wanted=slug.toLowerCase();
    const match=(data||[]).find(v=>String(v.public_slug||'').toLowerCase()===wanted || String(v.id).toLowerCase()===wanted);
    if(!match) throw new Error('not found');
    state.salon=liveVenueToSalon(match);
  }catch(e){
    clearBootSkeleton();
    document.getElementById('panel').innerHTML='<div class="panel-head"><h2>We couldn\'t load this venue</h2><p class="panel-sub">Please go back and try again.</p></div>';
    return;
  }
  const anyAvailable = state.salon.stylists.find(st=>st.name==='Any available') || null;
  const rescheduleToken=new URLSearchParams(location.search).get('reschedule');
  if(rescheduleToken){
    try{
      const {data,error}=await supabaseClient.rpc('get_public_bookings',{tokens:[rescheduleToken]});
      if(error) throw error;
      const booking=(data||[])[0];
      if(!booking || String(booking.salon_id)!==String(state.salon.id) || booking.status!=='upcoming') throw new Error('not found');
      state.rescheduleToken=rescheduleToken;
      state.rescheduleBookingId=booking.id;
      state.service = state.salon.services.find(s=>s.id===booking.service_id) || state.salon.services[0] || null;
      const stylistMatch = booking.stylist_id ? state.salon.stylists.find(st=>st.id===booking.stylist_id) : null;
      state.stylist = stylistMatch || anyAvailable;
      const startDate = new Date(booking.starts_at);
      const idx = dayIndexForDate(startDate);
      state.day = idx>=0 ? idx : firstOpenDayIndex(state.salon);
      // The booking's original date can fall outside the 21-day rolling window DAYS covers
      // (e.g. rescheduling a booking made months ago). In that case we fall back to the
      // first open day, but the original time is very unlikely to still be a valid slot on
      // that different day — leave it unselected so the customer actively picks a real one,
      // instead of silently pre-selecting a time that was never checked against the new day.
      state.time = idx>=0 ? formatTimeMins(nzMinutesOfDay(startDate)) : '';
      state.addons = Array.isArray(booking.addons) ? booking.addons.map(a=>a && a.id).filter(Boolean) : [];
      state.notes = booking.notes || '';
      state.firstVisit = (Array.isArray(booking.preferences) && booking.preferences.length) ? 'Yes' : 'No';
      state.name = booking.customer_name || '';
      state.phone = booking.customer_phone || '';
      state.email = booking.customer_email || '';
    }catch(e){
      clearBootSkeleton();
      document.getElementById('panel').innerHTML='<div class="panel-head"><h2>We couldn\'t load that booking</h2><p class="panel-sub">This reschedule link may have expired — please go back to Activity and try again.</p></div>';
      return;
    }
  } else {
    // No ?service= means the customer tapped a generic "Book now" CTA, not a specific
    // service's Book button — leave it unselected so they actually choose one, rather than
    // silently defaulting to whichever service happens to sort first.
    state.service = requestedServiceId ? (state.salon.services.find(s=>s.id===requestedServiceId) || null) : null;
    state.day = firstOpenDayIndex(state.salon);
    const requestedStylistId=new URLSearchParams(location.search).get('stylist');
    state.stylist = (requestedStylistId && state.salon.stylists.find(st=>st.id===requestedStylistId)) || anyAvailable;
    const requestedCategory=new URLSearchParams(location.search).get('category');
    if(requestedCategory && state.salon.services.some(s=>s.category===requestedCategory)) state.serviceCategory=requestedCategory;
  }
  document.getElementById('closeBtn').onclick=()=>{ navigateWithFade('/'+encodeURIComponent(state.salon.publicSlug||state.salon.id)); };
  document.getElementById('brandBtn').onclick=()=>{ navigateWithFade('/explore'); };
  if(state.service) loadIntakeQuestionsFor(state.service);
  if(state.rescheduleToken){
    const timeIdx=stepDefs().findIndex(d=>d.key==='time');
    if(timeIdx>=0) state.step=timeIdx;
  }
  render();
  loadAuth();
}
function render(opts){ renderNav(opts&&opts.smoothNav); renderPanel(); renderSummary(); const mn=document.getElementById('mobileNext'); mn.disabled=!!state.saving; mn.classList.toggle('loading',!!state.saving); mn.innerHTML = state.saving ? '<span class="btn-spinner"></span>Confirming…' : (stepDefs()[state.step]?.key==='review' ? 'Confirm' : 'Continue'); mn.onclick=next; }

// Stripe redirects back here after a deposit payment (or cancellation) with no venue/service
// context in the URL, so this renders a standalone confirmation instead of running the normal
// multi-step booking flow — it works for guests too, since it's looked up by the booking's
// unguessable public token rather than requiring a logged-in session.
async function handleDepositReturn(){
  const params=new URLSearchParams(location.search);
  const status=params.get('depositReturn');
  const token=params.get('token');
  if(!status || !token) return false;

  document.querySelector('.step-nav').style.display='none';
  document.querySelector('.aside').style.display='none';
  const mb=document.querySelector('.mobile-bar'); if(mb) mb.style.display='none';
  // This whole return path skips boot() entirely (see the bottom of this file), which is the
  // only place the brand logo's click handler otherwise gets wired up — bind it here too so it
  // isn't silently dead on every deposit-return/hold screen.
  document.getElementById('brandBtn').onclick=()=>{ navigateWithFade('/explore'); };
  const panel=document.getElementById('panel');
  panel.innerHTML='<div class="panel-head"><h2>Loading your booking…</h2></div>';

  try{
    let b, attempts=0;
    // Stripe redirects back here the instant checkout completes, but the row's deposit_status
    // only flips to 'paid' once the async webhook lands — which can trail the redirect by a
    // second or more. Poll briefly before ever showing "hasn't been paid yet" to someone who
    // just paid, rather than alarming them (and risking a double-charge if they retry).
    while(true){
      const {data,error}=await supabaseClient.rpc('get_booking_by_public_token',{p_token:token});
      if(error) throw error;
      b=data;
      if(status!=='success' || b.deposit_status==='paid' || attempts>=6) break;
      attempts++;
      panel.innerHTML='<div class="panel-head"><h2>Confirming your payment…</h2></div>';
      await new Promise(r=>setTimeout(r,1200));
    }
    const when=b.starts_at ? new Date(b.starts_at).toLocaleString(undefined,{weekday:'long',day:'numeric',month:'long',hour:'numeric',minute:'2-digit',timeZone:NZ_TIME_ZONE}) : '';
    if(status==='success' && b.deposit_status==='paid'){
      navigateWithFade('/explore?openBooking='+encodeURIComponent(b.public_token||token));
    } else {
      document.getElementById('closeBtn').onclick=()=>{ navigateWithFade('/explore?openBooking='+encodeURIComponent(b.public_token||token)); };
      panel.innerHTML=`<div class="panel-head"><div><h2>Your booking is on hold</h2><p class="panel-sub">${esc(b.salon_name)} is holding ${esc(b.service_name_snapshot||'your appointment')}${when?' for '+esc(when):''}, but the $${Number(b.deposit_amount).toFixed(2)} deposit hasn't been paid yet. Pay now to confirm it. Unpaid holds are only kept for 15 minutes after booking, after which the time may be given up.</p></div></div>
        <div class="actions" style="display:flex;"><button class="btn primary" type="button" id="retryDepositBtn" style="width:100%;">Pay deposit</button></div>`;
      const retryBtn=document.getElementById('retryDepositBtn');
      if(retryBtn) retryBtn.onclick=async ()=>{
        retryBtn.disabled=true; retryBtn.textContent='Redirecting…';
        try{
          const res=await fetch('/api/windcave?action=create-deposit-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({booking_id:b.id})});
          const out=await res.json().catch(()=>null);
          if(!res.ok || !out?.url) throw new Error(out?.error||'Could not start checkout');
          navigateWithFade(out.url);
        }catch(e){ retryBtn.disabled=false; retryBtn.textContent='Pay deposit'; alert(e.message||'Something went wrong. Please try again.'); }
      };
    }
  }catch(e){
    panel.innerHTML='<div class="panel-head"><h2>We couldn\'t load this booking</h2><p class="panel-sub">The link may have expired. Please contact the venue directly.</p></div>';
  }
  return true;
}

handleDepositReturn().then(handled=>{ if(!handled) boot(); });

// Safety net: if the browser restores this page from bfcache (e.g. the customer tapped back
// from Stripe without paying), make sure a stuck "saving" flag from before the navigation away
// can never permanently disable the Pay/Confirm button.
window.addEventListener('pageshow', (e)=>{
  if(e.persisted && state.saving){ state.saving=false; render(); }
});
</script>
