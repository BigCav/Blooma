<body>
<header class="topbar"><div class="shell topbar-inner"><button class="brand" id="brandBtn" style="border:none;background:none;padding:0;cursor:pointer;color:inherit;" aria-label="Go to home">Blooma</button><div class="header-right"><button class="icon-btn" id="closeBtn" aria-label="Close">✕</button></div></div></header>
<main class="shell">
 <section class="page-head"><p class="eyebrow">Booking</p><h1>Complete your appointment</h1><p>Choose the extras, artist and time that suit you, then review everything before confirming.</p></section>
 <div class="checkout-layout">
  <div class="main">
   <div class="step-nav" id="stepNav"></div>
   <section class="panel" id="panel"></section>
  </div>
  <aside class="aside">
   <div class="summary-card" id="summary"></div>
   <div class="reward-card" id="rewardCard" style="display:none;"><p class="eyebrow">Blooma rewards</p><div class="reward-points" id="rewardPoints"></div><div class="reward-bar"><span id="rewardBarFill"></span></div><p class="reward-note" id="rewardNote"></p></div>
  </aside>
 </div>
</main>
<div class="mobile-bar"><div class="mobile-bar-inner"><div class="mobile-copy"><strong id="mobileTotal">$0 total</strong><span id="mobileStep">Step 1</span></div><button class="btn primary" id="mobileNext">Continue</button></div></div>
<script>
/* ---------------------------------------------------
   Blooma — standalone checkout page.
   Reached via /venue/:slug/checkout (vercel.json rewrites this to
   /customer-checkout?venue=:slug, optionally with &service=:id to
   pre-select a service). Ports the same booking business logic used by
   the in-app checkout in index.html (availability, discounts, intake
   questions, booking creation) onto the design supplied for this page —
   the markup/CSS above is intentionally untouched from that design.
--------------------------------------------------- */
const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-customer-auth"}});

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function makeClientRequestId(){
  if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{ const r=Math.random()*16|0,v=c==="x"?r:(r&3|8); return v.toString(16); });
}

/* ---------- NZ date/time helpers (same logic as the main app) ---------- */
const NZ_TIME_ZONE = "Pacific/Auckland";
function nzParts(d=new Date()){ const out={}; new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d).forEach(p=>{if(p.type!=="literal")out[p.type]=p.value;}); return out; }
function nzDateKey(d=new Date()){ const o=nzParts(d); return `${o.year}-${o.month}-${o.day}`; }
function nzTodayKey(){ return nzDateKey(new Date()); }
function addDaysToDateKey(key,days){ const [y,m,d]=String(key).split("-").map(Number),dt=new Date(Date.UTC(y,m-1,d+Number(days||0))); return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth()+1).padStart(2,"0")}-${String(dt.getUTCDate()).padStart(2,"0")}`; }
function parseTimeMins(t){ const raw=String(t||"").trim(); const m=raw.match(/(\d+):(\d+)\s*(AM|PM)/i); if(m){ let h=parseInt(m[1],10)%12; if(/PM/i.test(m[3])) h+=12; return h*60+parseInt(m[2],10); } const m24=raw.match(/^(\d{1,2}):(\d{2})/); if(m24) return Number(m24[1])*60+Number(m24[2]); return 0; }
function formatTimeMins(mins){ let h=Math.floor(mins/60)%24,m=mins%60,period=h>=12?"PM":"AM"; let h12=h%12||12; return `${h12}:${String(m).padStart(2,"0")} ${period}`; }
function bookingLocalTime24(timeStr){ const mins=parseTimeMins(timeStr); return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}:00`; }
function nzLocalToIso(dateKey,timeStr){
  const [y,mo,da]=dateKey.split("-").map(Number), mins=parseTimeMins(timeStr), hh=Math.floor(mins/60), mm=mins%60;
  const target=Date.UTC(y,mo-1,da,hh,mm,0); let guess=target;
  const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  for(let i=0;i<3;i++){ const o={}; fmt.formatToParts(new Date(guess)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); const represented=Date.UTC(Number(o.year),Number(o.month)-1,Number(o.day),Number(o.hour),Number(o.minute),0); guess+=target-represented; }
  return new Date(guess).toISOString();
}
function dateFromNzKey(key){ return new Date(nzLocalToIso(key,"12:00 PM")); }
function nzDayIndex(d){ const wd=new Intl.DateTimeFormat("en-US",{timeZone:NZ_TIME_ZONE,weekday:"short"}).format(d); return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(wd); }
function nzDayNumber(d){ return Number(nzParts(d).day); }
function dayShort(d){ return d.toLocaleDateString(undefined,{weekday:"short",timeZone:NZ_TIME_ZONE}); }
function dayLabel(d){ return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:NZ_TIME_ZONE}); }
const DAYS = Array.from({length:21},(_,i)=>dateFromNzKey(addDaysToDateKey(nzTodayKey(),i)));
function dayIndexForDate(d){ const key=nzDateKey(d); for(let i=0;i<DAYS.length;i++){ if(nzDateKey(DAYS[i])===key) return i; } return -1; }
function nzMinutesOfDay(d){ const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:NZ_TIME_ZONE,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}); let h=0,m=0; fmt.formatToParts(d).forEach(p=>{ if(p.type==='hour') h=Number(p.value); if(p.type==='minute') m=Number(p.value); }); return h*60+m; }
function bookingStartIso(dayIndex,timeStr){ return nzLocalToIso(nzDateKey(DAYS[dayIndex]),timeStr); }
function isPastTimeSlot(dayIndex,timeStr){ return new Date(bookingStartIso(dayIndex,timeStr)).getTime() < Date.now()+5*60000; }

/* ---------- Venue mapping + availability (ported from index.html) ---------- */
function liveVenueIcon(tag){ return "sparkles"; }
function liveDbTime(t){ return String(t||"").slice(0,5) || "09:00"; }
function liveOpenDays(days){ return (Array.isArray(days)?days:[]).map(d=>Number(d)===7?0:Number(d)).filter(d=>Number.isInteger(d)); }
function normalizedDailyHours(raw){
  const out={}; const src=raw&&typeof raw==="object"?raw:{};
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(key=>{ const h=src[key]; if(h&&typeof h==="object") out[key]={open:h.open!==false,start:String(h.start||""),end:String(h.end||"")}; });
  return out;
}
function customerDayHours(salon,dayIndex){
  const keys=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; const idx=((Number(dayIndex)%7)+7)%7;
  const h=salon?.dailyHours?.[keys[idx]];
  if(h&&typeof h==="object"){ if(h.open===false) return null; return {start:String(h.start||salon.openTime||"09:00"),end:String(h.end||salon.closeTime||"17:00")}; }
  if(!(salon?.openDays||[]).includes(idx)) return null;
  return {start:String(salon.openTime||"09:00"),end:String(salon.closeTime||"17:00")};
}
function formatAnyTime12(value){ return formatTimeMins(parseTimeMins(value)); }
function liveHoursLabel(v){
  const daily=normalizedDailyHours(v?.metadata?.hours);
  const salon={dailyHours:daily,openDays:liveOpenDays(v.open_days),openTime:liveDbTime(v.open_time),closeTime:liveDbTime(v.close_time)};
  const open=[]; [1,2,3,4,5,6,0].forEach(idx=>{ const h=customerDayHours(salon,idx); if(h) open.push(`${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][idx]} ${formatAnyTime12(h.start)}–${formatAnyTime12(h.end)}`); });
  return open.length?open.join(" · "):"Hours not set";
}
function liveVenueToSalon(v){
  const reviews=Array.isArray(v.reviews)?v.reviews:[];
  const tag=String(v.tag||"").trim() || ((v.categories||[]).map(c=>c.name).filter(Boolean).join(" · ")) || "Beauty & wellness";

  const galleryImages=(Array.isArray(v.gallery_images)?v.gallery_images:[]).map(String).filter(Boolean);
  const stylists=(Array.isArray(v.stylists)?v.stylists:[]).map(st=>({
    id:String(st.id), name:st.name, specialty:st.specialty||"", availableDays:liveOpenDays(v.open_days),
    availableToday:st.available_today!==false, photo:st.image_url||"",
    serviceIds:Array.isArray(st.service_ids)?st.service_ids.map(String):[]
  }));
  if(!stylists.some(st=>st.name==="Any available")) stylists.unshift({id:`${v.id}-any`,name:"Any available",availableDays:liveOpenDays(v.open_days)});
  const services=(Array.isArray(v.services)?v.services:[]).map(sv=>({
    id:String(sv.id), name:sv.name, description:String(sv.description||sv.service_description||"").trim(), duration:Math.max(15,Number(sv.duration_minutes||30)), price:Math.max(0,Number(sv.price||0)),
    category:sv.category_name||tag.split("·")[0].trim()||"Services", addons:(Array.isArray(sv.addons)?sv.addons:[]).map(a=>({id:String(a.id),name:a.name,price:Number(a.price||0),duration:Number(a.duration_minutes||a.duration||0)}))
  }));
  return {
    id:String(v.id), publicSlug:String(v.public_slug||"").trim(), name:v.name||"Venue", tag, rating: reviews.length ? (reviews.reduce((sum,r)=>sum+Number(r.rating||0),0)/reviews.length).toFixed(1) : "New", reviews:reviews.length,
    city:String(v.city||"").trim(), suburb:String(v.suburb||"").trim(),
    homeImage:mainImage||galleryImages[0]||"",
    hours:liveHoursLabel(v), openDays:liveOpenDays(v.open_days), openTime:liveDbTime(v.open_time), closeTime:liveDbTime(v.close_time), dailyHours:normalizedDailyHours(v.metadata&&v.metadata.hours),
    cancellationPolicy:v.cancellation_policy||"You can cancel or reschedule this booking at any time before your appointment.",
    bufferTime:Math.max(0,Number(v.buffer_minutes||0)),
    loyalty:(v.loyalty&&typeof v.loyalty==="object")?{enabled:!!v.loyalty.enabled,pointsPerDollar:Number(v.loyalty.pointsPerDollar)||1,rewardThreshold:Number(v.loyalty.rewardThreshold)||100,rewardText:v.loyalty.rewardText||"",rewardValue:Number(v.loyalty.rewardValue)||0}:{enabled:false},
    cloudBookedSlots:Array.isArray(v.booked_slots)?v.booked_slots:[], cloudBlockouts:Array.isArray(v.blockouts)?v.blockouts:[],
    stylists, services
  };
}
function isAnyAvailableStylist(stylist){ return !stylist || String(stylist.name||stylist).trim().toLowerCase()==="any available"; }
function stylistPreferenceLabel(stylist){ return isAnyAvailableStylist(stylist) ? "Any available" : String(stylist?.name||stylist||""); }
function stylistAvailabilityPhrase(stylist){ return isAnyAvailableStylist(stylist) ? "with any available stylist" : `with ${String(stylist?.name||stylist||"this stylist")}`; }
function timeSlotsForSalon(salon,dayIndex,durationMins){
  const h=customerDayHours(salon,nzDayIndex(DAYS[dayIndex])); if(!h) return [];
  const bounds={start:parseTimeMins(h.start),end:parseTimeMins(h.end)};
  const out=[]; for(let m=bounds.start;m+Number(durationMins||0)<=bounds.end;m+=15) out.push(formatTimeMins(m)); return out;
}
function intervalOverlaps(aStart,aEnd,bStart,bEnd){ return aStart<bEnd && aEnd>bStart; }
function staffUnavailableInCloud(salon,staffId,slotStart,slotEnd){
  const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
  const booked=(salon.cloudBookedSlots||[]).some(b=>{
    if(String(b.stylist_id||"")!==String(staffId||"")) return false;
    const existingStart=new Date(b.starts_at); const existingEnd=new Date(existingStart.getTime()+Number(b.duration_minutes||30)*60000);
    return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),existingStart,new Date(existingEnd.getTime()+bufferMs));
  });
  if(booked) return true;
  return (salon.cloudBlockouts||[]).some(bo=>(bo.all_staff||String(bo.stylist_id||"")===String(staffId||"")) && intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
}
function isTimeBlocked(salon,dayIndex,stylist,timeStr,durationMins){
  const h=customerDayHours(salon,nzDayIndex(DAYS[dayIndex])); if(!h) return true;
  const bounds={start:parseTimeMins(h.start),end:parseTimeMins(h.end)};
  const slotStartMin=parseTimeMins(timeStr), slotEndMin=slotStartMin+Number(durationMins||0); if(slotStartMin<bounds.start||slotEndMin>bounds.end) return true;
  const slotStart=new Date(bookingStartIso(dayIndex,timeStr)); const slotEnd=new Date(slotStart.getTime()+Number(durationMins||0)*60000);
  if(slotStart.getTime()<Date.now()+5*60000) return true;
  const anySelected=!stylist||stylist.name==="Any available";
  const isToday=dayIndex===0;
  if(!anySelected && isToday && stylist.availableToday===false) return true;
  if(anySelected){
    const realStaff=(salon.stylists||[]).filter(st=>st.name!=="Any available" && (!isToday || st.availableToday!==false));
    if(realStaff.length) return realStaff.every(st=>staffUnavailableInCloud(salon,st.id,slotStart,slotEnd));
    const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
    const genericBooked=(salon.cloudBookedSlots||[]).some(b=>{
      if(b.stylist_id) return false;
      const bs=new Date(b.starts_at),be=new Date(bs.getTime()+Number(b.duration_minutes||30)*60000);
      return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),bs,new Date(be.getTime()+bufferMs));
    });
    const allBlock=(salon.cloudBlockouts||[]).some(bo=>bo.all_staff&&intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
    return genericBooked||allBlock;
  }
  return staffUnavailableInCloud(salon,stylist.id,slotStart,slotEnd);
}
function firstOpenDayIndex(salon){ for (let i=0;i<DAYS.length;i++){ if (customerDayHours(salon,nzDayIndex(DAYS[i]))) return i; } return 0; }

  loyaltyAccount:null, appliedLoyaltyReward:null,
  intakeQuestionsByService:{},
  saving:false, bookingError:'', done:false, lastBooking:null,
  rescheduleToken:null, rescheduleBookingId:null,
};

function currentService(){ return state.service; }
function selectedAddonsList(){ if(!state.service) return []; return (state.service.addons||[]).filter(a=>state.addons.includes(a.id)); }
function selectedAddonsTotal(){ return selectedAddonsList().reduce((s,a)=>s+a.price,0); }
function baseTotal(){ return state.service ? state.service.price + selectedAddonsTotal() : 0; }
function promoDiscount(){ if(!state.appliedPromo) return 0; const p=state.appliedPromo; const subtotal=baseTotal(); const raw=p.type==='percent'?Math.round(subtotal*p.value/100*100)/100:Number(p.value||0); return Math.max(0,Math.min(raw,subtotal)); }
function loyaltyDiscount(){ if(!state.appliedLoyaltyReward) return 0; const remaining=Math.max(0,baseTotal()-promoDiscount()); return Math.max(0,Math.min(Number(state.appliedLoyaltyReward.value||0),remaining)); }
function giftCardDiscount(){ if(!state.appliedGiftCard) return 0; const remaining=Math.max(0,baseTotal()-promoDiscount()-loyaltyDiscount()); return Math.max(0,Math.min(Number(state.appliedGiftCard.remaining_balance||0),remaining)); }
function finalTotal(){ return Math.max(0, baseTotal()-promoDiscount()-loyaltyDiscount()-giftCardDiscount()); }
function intakeQuestionsForCurrent(){ if(!state.service) return []; return state.intakeQuestionsByService[state.service.id] || []; }
function bookingContact(){ return { name:(state.name||'').trim(), phone:(state.phone||'').trim(), email:(state.email||'').trim() }; }

function stepDefs(){
  const defs=[{key:'service',label:'Services'}];
  if(state.service && state.service.addons && state.service.addons.length) defs.push({key:'addons',label:'Add-ons'});
  defs.push({key:'stylist',label:'Stylist'});
  defs.push({key:'time',label:'Time'});
  if(intakeQuestionsForCurrent().length) defs.push({key:'intake',label:'A few questions'});
  if(!state.rescheduleToken) defs.push({key:'details',label:'Details'});
  defs.push({key:'review',label:'Summary'});
  return defs;
}
function eligibleStylists(){
  if(!state.salon || !state.service) return [];
  const assigned = state.salon.stylists.filter(st=>Array.isArray(st.serviceIds)&&st.serviceIds.length&&st.serviceIds.includes(state.service.id));
  return assigned.length ? state.salon.stylists.filter(st=>isAnyAvailableStylist(st)||assigned.includes(st)) : state.salon.stylists;
}

  nav.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ if(+b.dataset.goto<=state.step){ state.step=+b.dataset.goto; render(); } });

function canNext(){
  const key=stepDefs()[state.step]?.key;
  if(key==='service') return !!state.service;
  if(key==='stylist') return !!state.stylist;
  if(key==='time') return !!state.time && !isTimeBlocked(state.salon,state.day,state.stylist,state.time,state.service.duration);
  if(key==='intake') return intakeQuestionsForCurrent().every(q=>!q.required || String(state.intake[q.id]||'').trim().length>0);
  if(key==='details') return !!state.firstVisit && state.name.trim().length>1 && state.phone.trim().length>5 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim());
  return true;
}

function bind(){
  document.querySelectorAll('[data-service-category]').forEach(b=>b.onclick=()=>{ state.serviceCategory=b.dataset.serviceCategory; render(); });
  document.querySelectorAll('[data-service]').forEach(b=>b.onclick=()=>{
    const svc = state.salon.services.find(s=>s.id===b.dataset.service);
    if(!svc) return;
    state.service=svc; state.addons=[]; state.stylist=null; state.time=null; state.intake={};
    loadIntakeQuestionsFor(svc);
    render();
  });
  document.querySelectorAll('[data-addon]').forEach(b=>b.onclick=()=>{ const id=b.dataset.addon; state.addons=state.addons.includes(id)?state.addons.filter(x=>x!==id):[...state.addons,id]; render(); });
  document.querySelectorAll('[data-stylist]').forEach(b=>b.onclick=()=>{ state.stylist=eligibleStylists().find(s=>s.id===b.dataset.stylist)||null; state.time=null; render(); });
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{ state.day=+b.dataset.day; state.time=null; render(); });
  document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{ state.time=b.dataset.time; render(); });
  document.querySelectorAll('[data-intaketext]').forEach(el=>el.oninput=()=>{ state.intake[el.getAttribute('data-intaketext')]=el.value; });
  document.querySelectorAll('[data-intakeyesno]').forEach(b=>b.onclick=()=>{ const [qid,val]=b.getAttribute('data-intakeyesno').split('|'); state.intake[qid]=val; render(); });
  document.querySelectorAll('[data-intakechoice]').forEach(b=>b.onclick=()=>{ const idx=b.getAttribute('data-intakechoice').indexOf('|'); const qid=b.getAttribute('data-intakechoice').slice(0,idx); const val=b.getAttribute('data-intakechoice').slice(idx+1); state.intake[qid]=val; render(); });
  document.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{ state.firstVisit=b.dataset.first; render(); });
  ['nameInput','phoneInput','emailInput','notesInput'].forEach(id=>{ const el=document.getElementById(id); if(el) el.oninput=()=>{ if(id==='nameInput') state.name=el.value; else if(id==='phoneInput') state.phone=el.value; else if(id==='emailInput') state.email=el.value; else state.notes=el.value; }; });

  const rt=document.getElementById('rewardToggle');
  if(rt) rt.onclick=()=>{
    if(state.appliedLoyaltyReward){ state.appliedLoyaltyReward=null; }
    else { const L=state.loyaltyAccount; state.appliedLoyaltyReward={label:L.rewardText||'Loyalty reward',value:Number(L.rewardValue||0)}; }
    render();
  };
  const pb=document.getElementById('promoBtn');
  function flashError(field){ state[field]=true; render(); setTimeout(()=>{ state[field]=false; render(); },900); }
  if(pb) pb.onclick=async ()=>{
    if(state.appliedPromo){ state.appliedPromo=null; state.promoCode=''; render(); return; }
    const raw=(document.getElementById('promoInput').value||'').trim().toUpperCase();
    if(!raw){ flashError('promoFlash'); return; }
    state.promoChecking=true; render();
    try{
      const {data,error}=await supabaseClient.rpc('validate_promo_code',{p_salon_id:state.salon.id,p_code:raw});
      if(error) throw error;
      if(!data?.valid){ state.appliedPromo=null; state.promoChecking=false; render(); flashError('promoFlash'); return; }
      state.appliedPromo={code:data.code,type:data.type,value:Number(data.value||0)}; state.promoCode='';
    }catch(e){ state.appliedPromo=null; state.promoChecking=false; render(); flashError('promoFlash'); return; }
    state.promoChecking=false; render();
  };
  const gb=document.getElementById('giftBtn');
  if(gb) gb.onclick=async ()=>{
    if(state.appliedGiftCard){ state.appliedGiftCard=null; state.giftCode=''; render(); return; }
    const raw=(document.getElementById('giftInput').value||'').trim().toUpperCase();
    if(!raw){ flashError('giftFlash'); return; }
    state.giftChecking=true; render();
    try{
      const {data,error}=await supabaseClient.rpc('get_gift_card_by_code',{p_salon_id:state.salon.id,p_code:raw});
      if(error) throw error;
      state.appliedGiftCard=data; state.giftCode='';
    }catch(e){ state.appliedGiftCard=null; state.giftChecking=false; render(); flashError('giftFlash'); return; }
    state.giftChecking=false; render();
  };

  document.getElementById('back').onclick=back;
  document.getElementById('next').onclick=next;
  const viewBtn=document.getElementById('viewBookingBtn');
  if(viewBtn) viewBtn.onclick=()=>{
    if(state.authenticated && state.lastBooking?.id) location.href='/?openBooking='+encodeURIComponent(state.lastBooking.id);
    else location.href='/venue/'+encodeURIComponent(state.salon.publicSlug||state.salon.id);
  };
}

function shakePanel(){
  document.getElementById('panel').animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:180});
}

async function next(){
  const defs=stepDefs();
  const key=defs[state.step]?.key;
  if(key==='review'){
    await confirmBooking();
    return;
  }
  if(!canNext()){ shakePanel(); return; }
  state.step++; render(); window.scrollTo({top:0,behavior:'smooth'});
}
function back(){ if(state.step>0){ state.step--; render(); window.scrollTo({top:0,behavior:'smooth'}); } }

async function confirmBooking(){
  if(state.saving) return;
  const contact=bookingContact();
  if(!state.rescheduleToken && (contact.name.length<2 || contact.phone.length<6)){ state.bookingError='Add a valid name and mobile number in Details before confirming.'; render(); return; }
  if(!state.time || isTimeBlocked(state.salon,state.day,state.stylist,state.time,state.service.duration)){ state.bookingError='That time is no longer available — please choose another.'; state.step=stepDefs().findIndex(d=>d.key==='time'); render(); return; }
  state.saving=true; state.bookingError=''; render();
  try{
    const notes=[state.notes, state.appliedLoyaltyReward?`[Loyalty reward redeemed: ${state.appliedLoyaltyReward.label}]`:'', state.appliedGiftCard?`[Gift card ${state.appliedGiftCard.code} applied: $${giftCardDiscount()}]`:''].filter(Boolean).join(' ').trim();
    let data, error;
    if(state.rescheduleToken){
      const payload={
        salon_id: state.salon.id,
        service_id: state.service.id,
        stylist_id: isAnyAvailableStylist(state.stylist) ? null : state.stylist.id,
        starts_at: bookingStartIso(state.day,state.time),
        local_date: nzDateKey(DAYS[state.day]),
        local_time: bookingLocalTime24(state.time),
        duration_minutes: state.service.duration,
        subtotal: baseTotal(),
        discount: promoDiscount()+loyaltyDiscount()+giftCardDiscount(),
        total: finalTotal(),
        promo_code: state.appliedPromo ? state.appliedPromo.code : null,
        notes,
        preferences: state.firstVisit==='Yes' ? ['First time here'] : [],
        addons: selectedAddonsList(),
      };
      ({data,error}=await supabaseClient.rpc('reschedule_public_booking',{token:state.rescheduleToken,payload}));
    } else {
      const payload={
        salon_id: state.salon.id,
        service_id: state.service.id,
        stylist_id: isAnyAvailableStylist(state.stylist) ? null : state.stylist.id,
        customer_name: contact.name,
        customer_phone: contact.phone,
        customer_email: contact.email||'',
        starts_at: bookingStartIso(state.day,state.time),
        local_date: nzDateKey(DAYS[state.day]),
        local_time: bookingLocalTime24(state.time),
        duration_minutes: state.service.duration,
        subtotal: baseTotal(),
        discount: promoDiscount()+loyaltyDiscount()+giftCardDiscount(),
        total: finalTotal(),
        promo_code: state.appliedPromo ? state.appliedPromo.code : null,
        notes,
        preferences: state.firstVisit==='Yes' ? ['First time here'] : [],
        addons: selectedAddonsList(),
        client_request_id: makeClientRequestId(),
      };
      ({data,error}=await supabaseClient.rpc('create_public_booking',{payload}));
    }
    if(error) throw error;
    state.lastBooking=data||{};

    if(state.appliedLoyaltyReward){ try{ await supabaseClient.rpc('redeem_loyalty_reward',{p_salon_id:state.salon.id}); }catch(e){} }
    if(state.appliedGiftCard && giftCardDiscount()>0){ try{ await supabaseClient.rpc('redeem_gift_card',{p_gift_card_id:state.appliedGiftCard.id,p_amount:giftCardDiscount(),p_booking_id:state.lastBooking.id||null}); }catch(e){} }
    const intakeQs=intakeQuestionsForCurrent();
    if(intakeQs.length && state.lastBooking.public_token){
      const answers=intakeQs.filter(q=>state.intake[q.id]!==undefined && String(state.intake[q.id]).trim()!=='').map(q=>({question_id:q.id,label:q.label,answer:state.intake[q.id]}));
      if(answers.length){ try{ await supabaseClient.rpc('submit_public_intake_form',{token:state.lastBooking.public_token,answers}); }catch(e){} }
    }

    state.saving=false; state.done=true; render();
    document.getElementById('reviewContent').style.display='none';
    document.getElementById('desktopActions').style.display='none';
    document.getElementById('success').style.display='block';
    const mb=document.querySelector('.mobile-bar'); if(mb) mb.style.display='none';
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){
    state.saving=false; state.bookingError=err?.message||"We couldn't save this booking. Please try again.";
    render();
  }
}

/* ---------- Data loading ---------- */
async function loadIntakeQuestionsFor(service){
  if(!state.salon?.id || state.intakeQuestionsByService[service.id]!==undefined) return;
  try{
    const {data,error}=await supabaseClient.rpc('get_public_intake_questions',{p_salon_id:state.salon.id});
    if(error) throw error;
    state.intakeQuestionsByService = data || {};
  }catch(e){ /* nice-to-have, fail quietly */ }
  render();
}
async function loadLoyaltyAccount(){
  if(!state.authenticated || !state.authUserId || !state.salon?.loyalty?.enabled) return;
  try{
    const {data,error}=await supabaseClient.from('loyalty_accounts').select('points').eq('salon_id',state.salon.id).eq('customer_user_id',state.authUserId).maybeSingle();
    if(!error){
      const cfg=state.salon.loyalty;
      state.loyaltyAccount={points:Number(data?.points||0),threshold:cfg.rewardThreshold,rewardText:cfg.rewardText,rewardValue:cfg.rewardValue||0};
    }
  }catch(e){}
  render();
}
async function loadAuth(){
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    if(!session) return;
    const {data:row}=await supabaseClient.from('user_profiles').select('account_type,first_name,last_name,phone').eq('user_id',session.user.id).maybeSingle();
    const accountType=String(row?.account_type||session.user.user_metadata?.account_type||'customer').toLowerCase();
    if(accountType!=='customer') return;
    const first=(row?.first_name||session.user.user_metadata?.first_name||'').trim();
    const last=(row?.last_name||session.user.user_metadata?.last_name||'').trim();
    state.authenticated=true; state.authUserId=session.user.id;
    state.name=[first,last].filter(Boolean).join(' ').trim() || state.name;
    state.phone=(row?.phone||'').trim() || state.phone;
    state.email=(session.user.user_metadata?.actual_email||session.user.email||'').trim() || state.email;
    loadLoyaltyAccount();
    render();
  }catch(e){}
}

function requestedSlug(){
  const q=new URLSearchParams(location.search).get('venue'); if(q) return q;
  const m=location.pathname.replace(/\/+$/,'').match(/^\/venue\/([^/]+)\/checkout$/i);
  return m ? decodeURIComponent(m[1]) : '';
}

async function boot(){
  const slug=requestedSlug();
  const requestedServiceId=new URLSearchParams(location.search).get('service');
  if(!slug){ document.getElementById('panel').innerHTML='<div class="panel-head"><h2>Venue not found</h2><p class="panel-sub">This checkout link is missing a venue.</p></div>'; return; }
  try{
    const {data,error}=await supabaseClient.rpc('get_marketplace_venues');
    if(error) throw error;
    const wanted=slug.toLowerCase();
    const match=(data||[]).find(v=>String(v.public_slug||'').toLowerCase()===wanted || String(v.id).toLowerCase()===wanted);
    if(!match) throw new Error('not found');
    state.salon=liveVenueToSalon(match);
  }catch(e){
    document.getElementById('panel').innerHTML='<div class="panel-head"><h2>We couldn\'t load this venue</h2><p class="panel-sub">Please go back and try again.</p></div>';
    return;
  }
  const anyAvailable = state.salon.stylists.find(st=>st.name==='Any available') || null;
  const rescheduleToken=new URLSearchParams(location.search).get('reschedule');
  if(rescheduleToken){
    try{
      const {data,error}=await supabaseClient.rpc('get_public_bookings',{tokens:[rescheduleToken]});
      if(error) throw error;
      const booking=(data||[])[0];
      if(!booking || String(booking.salon_id)!==String(state.salon.id) || booking.status!=='upcoming') throw new Error('not found');
      state.rescheduleToken=rescheduleToken;
      state.rescheduleBookingId=booking.id;
      state.service = state.salon.services.find(s=>s.id===booking.service_id) || state.salon.services[0] || null;
      const stylistMatch = booking.stylist_id ? state.salon.stylists.find(st=>st.id===booking.stylist_id) : null;
      state.stylist = stylistMatch || anyAvailable;
      const startDate = new Date(booking.starts_at);
      const idx = dayIndexForDate(startDate);
      state.day = idx>=0 ? idx : firstOpenDayIndex(state.salon);
      state.time = formatTimeMins(nzMinutesOfDay(startDate));
      state.addons = Array.isArray(booking.addons) ? booking.addons.map(a=>a && a.id).filter(Boolean) : [];
      state.notes = booking.notes || '';
      state.firstVisit = (Array.isArray(booking.preferences) && booking.preferences.length) ? 'Yes' : 'No';
      state.name = booking.customer_name || '';
      state.phone = booking.customer_phone || '';
      state.email = booking.customer_email || '';
    }catch(e){
      document.getElementById('panel').innerHTML='<div class="panel-head"><h2>We couldn\'t load that booking</h2><p class="panel-sub">This reschedule link may have expired — please go back to Activity and try again.</p></div>';
      return;
    }
  } else {
    state.service = (requestedServiceId && state.salon.services.find(s=>s.id===requestedServiceId)) || state.salon.services[0] || null;
    state.day = firstOpenDayIndex(state.salon);
    const requestedStylistId=new URLSearchParams(location.search).get('stylist');
    state.stylist = (requestedStylistId && state.salon.stylists.find(st=>st.id===requestedStylistId)) || anyAvailable;
  }
  document.getElementById('closeBtn').onclick=()=>{ location.href='/venue/'+encodeURIComponent(state.salon.publicSlug||state.salon.id); };
  document.getElementById('brandBtn').onclick=()=>{ location.href='/'; };
  if(state.service) loadIntakeQuestionsFor(state.service);
  if(state.rescheduleToken){
    const timeIdx=stepDefs().findIndex(d=>d.key==='time');
    if(timeIdx>=0) state.step=timeIdx;
  }
  render();
  loadAuth();
}
function render(){ renderNav(); renderPanel(); renderSummary(); const mn=document.getElementById('mobileNext'); mn.textContent = stepDefs()[state.step]?.key==='review' ? 'Confirm' : 'Continue'; mn.onclick=next; }

boot();
</script>
