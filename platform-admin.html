<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Platform Admin — Blooma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Blooma: kill the blue mouse-click highlight/outline everywhere; keep it for keyboard nav */
  *{-webkit-tap-highlight-color:transparent;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid #6C4FD6;outline-offset:2px;}

  :root{
    --bg:#0E0D13;
    --surface:#18171F;
    --surface-2:#201F29;
    --surface-hover:#26252F;
    --border:#2A2933;
    --accent:#3ED598;
    --accent-soft:rgba(62,213,152,0.14);
    --accent-text:#3ED598;
    --text:#F2F1F7;
    --text-soft:#9F9CB0;
    --text-faint:#6C6980;
    --warning:#F4C93A;
    --warning-soft:rgba(244,201,58,0.14);
    --danger:#FF6B81;
    --danger-soft:rgba(255,107,129,0.14);
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scrollbar-width:none;}
  html::-webkit-scrollbar{display:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; scrollbar-width:none;
  }
  body::-webkit-scrollbar{display:none;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(14,13,19,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; height:64px;
  }
  .tb-brand{font-weight:800; font-size:16px; letter-spacing:-0.01em; display:flex; align-items:center; gap:9px;}
  .tb-brand .tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-text); background:var(--accent-soft); padding:3px 8px; border-radius:99px;}
  .tb-logout{font-size:12.5px; font-weight:700; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); padding:8px 14px; border-radius:9px;}
  .tb-logout:hover{background:var(--surface-hover); color:var(--text);}

  .content{max-width:1280px; margin:0 auto; padding:28px 20px 60px;}
  @media (min-width:900px){ .content{padding:36px 32px 70px;} }

  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:24px; font-weight:800; letter-spacing:-0.01em;}
  .page-head .sub{font-size:13px; color:var(--text-soft); margin-top:4px;}
  @media (min-width:900px){ .page-head h1{font-size:28px;} }

  .stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px;}
  @media (min-width:760px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 18px;}
  .stat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);}
  .stat-value{font-size:24px; font-weight:800; margin-top:6px;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:0; overflow:hidden;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border);}
  .panel-title{font-size:15px; font-weight:700;}
  .panel-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .filter-search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; min-width:220px;
  }
  .filter-search input{background:none; border:none; outline:none; color:var(--text); font-size:13px; font-family:inherit; width:100%;}
  .filter-search svg{flex:none; color:var(--text-faint);}

  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:760px;}
  th{
    text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-faint); padding:12px 20px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  td{padding:14px 20px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-hover);}
  .venue-name{font-weight:700;}
  .venue-city{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .owner-name{color:var(--text); font-size:13px; font-weight:600;}
  .owner-email{color:var(--text-soft); font-size:12.5px; margin-top:1px;}
  .row-empty{padding:36px 20px; text-align:center; color:var(--text-faint); font-size:13px;}

  .pill{display:inline-flex; align-items:center; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; background:var(--surface-2); color:var(--text-soft);}
  .pill-active{background:var(--accent-soft); color:var(--accent-text);}
  .pill-trialing{background:rgba(124,92,217,0.14); color:#7C5CD9;}
  .pill-past_due,.pill-incomplete{background:var(--danger-soft); color:var(--danger);}
  .pill-canceled,.pill-unpaid{background:var(--surface-2); color:var(--text-faint);}

  .btn-mark-paid{background:var(--accent-soft); color:var(--accent-text); border:1px solid transparent; padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700;}
  .btn-mark-paid:hover{background:var(--accent); color:var(--bg);}
  .btn-mark-paid:disabled{opacity:0.5; cursor:default;}

  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{max-width:380px; text-align:center;}
  .gate-card h1{font-size:20px; margin-bottom:8px;}
  .gate-card p{font-size:13.5px; color:var(--text-soft); line-height:1.55; margin-bottom:18px;}
  .gate-card a{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:700;}
  .gate-card a:hover{background:var(--surface-hover);}
</style>
<!-- Blooma favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
</head>
<body>

<div id="root">
  <div class="gate"><div class="gate-card"><p style="color:var(--text-faint);">Loading…</p></div></div>
</div>

<script>
  const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-venue-auth"}});
  let venues = [];
  let depositOwed = [];
  let revenue = [];
  let searchQuery = "";

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function fmtDate(iso){
    if(!iso) return '—';
    try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return '—'; }
  }
  // venue_billing.status defaults to 'inactive' the moment a venue is created — before they've
  // done anything with billing at all — so it must never be trusted over an active trial. Only
  // a status Stripe/the app has actually set to something definitive (active/past_due/etc)
  // should override what the trial dates say.
  var DEFINITIVE_STATUSES = ['active','past_due','unpaid','incomplete','canceled'];
  function inTrial(v){ return !!v.trial_ends_at && new Date(v.trial_ends_at) > new Date(); }
  function statusLabel(v){
    if(v.status && DEFINITIVE_STATUSES.indexOf(v.status)!==-1) return v.status.replace(/_/g,' ').replace(/^./,function(c){return c.toUpperCase();});
    if(inTrial(v)) return 'Trial';
    if(v.trial_ends_at) return 'Trial expired';
    return 'No plan';
  }
  function statusPillClass(v){
    if(v.status && DEFINITIVE_STATUSES.indexOf(v.status)!==-1) return 'pill-' + v.status;
    if(inTrial(v)) return 'pill-trialing';
    return 'pill-canceled';
  }

  function showGate(title, message, ctaLabel, ctaHref){
    document.getElementById('root').innerHTML =
      '<div class="gate"><div class="gate-card">' +
        '<h1>' + escapeHtml(title) + '</h1>' +
        '<p>' + escapeHtml(message) + '</p>' +
        '<a href="' + ctaHref + '">' + escapeHtml(ctaLabel) + '</a>' +
      '</div></div>';
  }

  function renderShell(){
    document.getElementById('root').innerHTML =
      '<header class="topbar">' +
        '<div class="tb-brand">Blooma <span class="tag">Platform Admin</span></div>' +
        '<button class="tb-logout" id="logoutBtn">Log out</button>' +
      '</header>' +
      '<div class="content">' +
        '<div class="page-head"><h1>All venues</h1><div class="sub">Every venue on Blooma, across every plan and trial state</div></div>' +
        '<div class="stats-grid" id="statsGrid"></div>' +
        '<div class="panel" id="revenuePanel" style="margin-bottom:22px;">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title">Platform revenue</div><div class="panel-sub">In-store card payments (1.79% + $0.30) are pure profit. Online deposits (2.49% + $0.30) are charged at cost — $0 profit — shown for volume only.</div></div>' +
          '</div>' +
          '<div class="stats-grid" id="revenueStatsGrid" style="padding:18px 20px 0;"></div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>In-store card processed</th><th>In-store profit</th><th>Online deposits (at cost)</th><th>Total profit</th></tr></thead>' +
              '<tbody id="revenueTbody"><tr><td colspan="5" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="panel" id="depositPanel" style="margin-bottom:22px;">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title">Deposit payouts owed</div><div class="panel-sub">Online deposits held by Blooma, not yet sent to the venue</div></div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>Owed</th><th></th></tr></thead>' +
              '<tbody id="depositTbody"><tr><td colspan="3" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title" id="panelTitle">Venues</div><div class="panel-sub" id="panelSub">Loading…</div></div>' +
            '<div class="filter-search">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>' +
              '<input type="text" id="searchInput" placeholder="Search venue or owner email…">' +
            '</div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>Owner</th><th>Plan</th><th>Status</th><th>Trial ends</th><th>Subscribed</th><th>Signed up</th></tr></thead>' +
              '<tbody id="venuesTbody"><tr><td colspan="7" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('logoutBtn').addEventListener('click', async function(){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      location.href = '/business-auth?view=login';
    });
    document.getElementById('searchInput').addEventListener('input', function(e){
      searchQuery = e.target.value.trim().toLowerCase();
      renderVenues();
    });
  }

  function renderStats(){
    var total = venues.length;
    var active = venues.filter(function(v){ return v.status==='active'; }).length;
    var trialing = venues.filter(function(v){ return statusLabel(v)==='Trial'; }).length;
    var pastDue = venues.filter(function(v){ return v.status==='past_due' || v.status==='canceled' || v.status==='unpaid'; }).length;
    document.getElementById('statsGrid').innerHTML =
      '<div class="stat-card"><div class="stat-label">Total venues</div><div class="stat-value">' + total + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Paying</div><div class="stat-value">' + active + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Trialing</div><div class="stat-value">' + trialing + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Past due / cancelled</div><div class="stat-value">' + pastDue + '</div></div>';
  }

  function renderVenues(){
    var filtered = venues.filter(function(v){
      if(!searchQuery) return true;
      return (v.name||'').toLowerCase().includes(searchQuery) || (v.owner_email||'').toLowerCase().includes(searchQuery);
    });
    document.getElementById('panelSub').textContent = filtered.length + ' venue' + (filtered.length===1?'':'s') + (searchQuery ? ' matching "'+searchQuery+'"' : '');
    var tbody = document.getElementById('venuesTbody');
    if(!filtered.length){
      tbody.innerHTML = '<tr><td colspan="7" class="row-empty">No venues found.</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||'Unnamed venue') + '</div><div class="venue-city">' + escapeHtml([v.city,v.region].filter(Boolean).join(', ')) + '</div></td>' +
        '<td><div class="owner-name">' + escapeHtml(v.owner_name||'—') + '</div><div class="owner-email">' + escapeHtml(v.owner_email||'—') + '</div></td>' +
        '<td>' + escapeHtml(v.plan_id ? (v.plan_id + (v.seat_count>1?' · '+v.seat_count+' seats':'')) : '—') + '</td>' +
        '<td><span class="pill ' + statusPillClass(v) + '">' + escapeHtml(statusLabel(v)) + '</span></td>' +
        '<td>' + fmtDate(v.trial_ends_at) + '</td>' +
        '<td>' + (v.status==='active' ? fmtDate(v.subscribed_at) : '—') + '</td>' +
        '<td>' + fmtDate(v.signup_at) + '</td>' +
      '</tr>';
    }).join('');
  }

  function renderDepositOwed(){
    var tbody = document.getElementById('depositTbody');
    if(!tbody) return;
    if(!depositOwed.length){
      tbody.innerHTML = '<tr><td colspan="3" class="row-empty">Nothing owed right now.</td></tr>';
      return;
    }
    tbody.innerHTML = depositOwed.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||v.salon_id) + '</div></td>' +
        '<td>$' + (Number(v.owed_cents||0)/100).toFixed(2) + '</td>' +
        '<td><button class="btn-mark-paid" data-salon="' + escapeHtml(v.salon_id) + '" data-amt="' + (Number(v.owed_cents||0)/100).toFixed(2) + '" data-name="' + escapeHtml(v.name||v.salon_id) + '">Mark paid out</button></td>' +
      '</tr>';
    }).join('');
    tbody.querySelectorAll('.btn-mark-paid').forEach(function(btn){
      btn.addEventListener('click', function(){ markPaidOut(btn.dataset.salon, btn.dataset.name, btn.dataset.amt, btn); });
    });
  }

  async function loadDepositOwed(){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_deposit_summary");
      if(error) throw error;
      depositOwed = (data && data.venues) || [];
    }catch(err){ depositOwed = []; }
    renderDepositOwed();
  }

  function renderRevenue(){
    var totalInStore = revenue.reduce(function(s,v){ return s+Number(v.in_store_card_total||0); },0);
    var totalProfit = revenue.reduce(function(s,v){ return s+Number(v.in_store_profit||0); },0);
    var totalDeposits = revenue.reduce(function(s,v){ return s+Number(v.deposits_total||0); },0);
    document.getElementById('revenueStatsGrid').innerHTML =
      '<div class="stat-card"><div class="stat-label">Total profit</div><div class="stat-value">$' + totalProfit.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">In-store card volume</div><div class="stat-value">$' + totalInStore.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Deposits processed (at cost)</div><div class="stat-value">$' + totalDeposits.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Venues with activity</div><div class="stat-value">' + revenue.length + '</div></div>';

    var tbody = document.getElementById('revenueTbody');
    if(!revenue.length){
      tbody.innerHTML = '<tr><td colspan="5" class="row-empty">No card payments or deposits yet.</td></tr>';
      return;
    }
    tbody.innerHTML = revenue.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||v.salon_id) + '</div></td>' +
        '<td>$' + Number(v.in_store_card_total||0).toFixed(2) + ' <span style="color:var(--text-faint);">(' + (v.in_store_card_count||0) + ')</span></td>' +
        '<td>$' + Number(v.in_store_profit||0).toFixed(2) + '</td>' +
        '<td>$' + Number(v.deposits_total||0).toFixed(2) + ' <span style="color:var(--text-faint);">(' + (v.deposits_count||0) + ')</span></td>' +
        '<td style="font-weight:700;">$' + Number(v.in_store_profit||0).toFixed(2) + '</td>' +
      '</tr>';
    }).join('');
  }

  async function loadRevenue(){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_revenue");
      if(error) throw error;
      revenue = (data && data.venues) || [];
    }catch(err){ revenue = []; }
    renderRevenue();
  }

  async function markPaidOut(salonId, name, amt, btn){
    if(!confirm('Mark $' + amt + ' as paid out to ' + name + '? This assumes you\'ve already sent the bank transfer.')) return;
    btn.disabled = true; btn.textContent = 'Marking…';
    try{
      const {error} = await supabaseClient.rpc("platform_mark_deposit_payout", {p_salon_id:salonId, p_note:'Marked paid via Platform Admin'});
      if(error) throw error;
      await loadDepositOwed();
    }catch(err){
      alert(err.message || 'Could not mark as paid out');
      btn.disabled = false; btn.textContent = 'Mark paid out';
    }
  }

  async function boot(){
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){
      showGate("Log in required", "Log in with your Blooma account to continue.", "Log in", "/business-auth?view=login");
      return;
    }
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_venues");
      if(error) throw error;
      venues = (data && data.venues) || [];
      renderShell();
      renderStats();
      renderVenues();
      loadDepositOwed();
      loadRevenue();
    }catch(err){
      showGate("Access denied", "This account doesn't have access to this page.", "Go to Blooma", "/");
    }
  }

  boot();
</script>

</body>
</html>
