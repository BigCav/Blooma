<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Platform Admin - Blooma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* Blooma: kill the blue mouse-click highlight/outline everywhere; keep it for keyboard nav */
  *{-webkit-tap-highlight-color:transparent;}
  :focus{outline:none;}
  :focus-visible{outline:2px solid #6C4FD6;outline-offset:2px;}

  :root{
    --bg:#0E0D13;
    --surface:#18171F;
    --surface-2:#201F29;
    --surface-hover:#26252F;
    --border:#2A2933;
    --accent:#3ED598;
    --accent-soft:rgba(62,213,152,0.14);
    --accent-text:#3ED598;
    --text:#F2F1F7;
    --text-soft:#9F9CB0;
    --text-faint:#6C6980;
    --warning:#F4C93A;
    --warning-soft:rgba(244,201,58,0.14);
    --danger:#FF6B81;
    --danger-soft:rgba(255,107,129,0.14);
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scrollbar-width:none;}
  html::-webkit-scrollbar{display:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; scrollbar-width:none;
  }
  body::-webkit-scrollbar{display:none;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer;}

  .topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(14,13,19,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; height:64px;
  }
  .tb-brand{font-weight:800; font-size:16px; letter-spacing:-0.01em; display:flex; align-items:center; gap:9px;}
  .tb-brand .tag{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent-text); background:var(--accent-soft); padding:3px 8px; border-radius:99px;}
  .tb-logout{font-size:12.5px; font-weight:700; color:var(--text-soft); background:var(--surface-2); border:1px solid var(--border); padding:8px 14px; border-radius:9px;}
  .tb-logout:hover{background:var(--surface-hover); color:var(--text);}

  .content{max-width:1280px; margin:0 auto; padding:28px 20px 60px;}
  @media (min-width:900px){ .content{padding:36px 32px 70px;} }

  .page-head{margin-bottom:22px;}
  .page-head h1{font-size:24px; font-weight:800; letter-spacing:-0.01em;}
  .page-head .sub{font-size:13px; color:var(--text-soft); margin-top:4px;}
  @media (min-width:900px){ .page-head h1{font-size:28px;} }

  .stats-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px;}
  @media (min-width:760px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{
    position:relative; overflow:hidden;
    background:linear-gradient(165deg, var(--surface-2) 0%, var(--surface) 60%);
    border:1px solid var(--border); border-radius:16px;
    padding:17px 19px;
    box-shadow:0 1px 2px rgba(0,0,0,.24), 0 10px 24px -16px rgba(0,0,0,.5);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .stat-card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, var(--accent) 0%, transparent 75%);
    opacity:.85;
  }
  .stat-card:hover{
    transform:translateY(-2px); border-color:#34333F;
    box-shadow:0 2px 4px rgba(0,0,0,.28), 0 18px 34px -16px rgba(0,0,0,.55);
  }
  .stat-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);}
  .stat-value{font-size:26px; font-weight:800; margin-top:8px; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}

  .panel{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:0; overflow:hidden;}
  .panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; border-bottom:1px solid var(--border);}
  .panel-title{font-size:15px; font-weight:700;}
  .panel-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .filter-search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:8px 12px; min-width:220px;
  }
  .filter-search input{background:none; border:none; outline:none; color:var(--text); font-size:13px; font-family:inherit; width:100%;}
  .filter-search svg{flex:none; color:var(--text-faint);}

  .table-wrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:760px;}
  th{
    text-align:left; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-faint); padding:12px 20px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  td{padding:14px 20px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:var(--surface-hover);}
  .venue-name{font-weight:700;}
  .venue-city{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .owner-name{color:var(--text); font-size:13px; font-weight:600;}
  .owner-email{color:var(--text-soft); font-size:12.5px; margin-top:1px;}
  .row-empty{padding:36px 20px; text-align:center; color:var(--text-faint); font-size:13px;}

  .pill{display:inline-flex; align-items:center; padding:4px 10px; border-radius:99px; font-size:11px; font-weight:700; white-space:nowrap; background:var(--surface-2); color:var(--text-soft);}
  .pill-active{background:var(--accent-soft); color:var(--accent-text);}
  .pill-trialing{background:rgba(124,92,217,0.14); color:#7C5CD9;}
  .pill-past_due,.pill-incomplete{background:var(--danger-soft); color:var(--danger);}
  .pill-canceled,.pill-unpaid{background:var(--surface-2); color:var(--text-faint);}

  .btn-mark-paid{background:var(--accent-soft); color:var(--accent-text); border:1px solid transparent; padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700;}
  .btn-mark-paid:hover{background:var(--accent); color:var(--bg);}
  .btn-mark-paid:disabled{opacity:0.5; cursor:default;}

  .sup-name{font-weight:700;}
  .sup-preview{font-size:12.5px; color:var(--text-faint); margin-top:2px; max-width:420px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sup-row{cursor:pointer;}
  .sup-unread-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px;}
  .sup-open-btn{background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700;}
  .sup-open-btn:hover{background:var(--surface-hover);}

  .sup-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:80;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .sup-overlay.open{display:flex;}
  .sup-modal{
    width:100%; max-width:560px; height:min(640px, 86vh);
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sup-modal-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .sup-modal-title{font-size:14.5px; font-weight:700;}
  .sup-modal-sub{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
  .sup-modal-close{
    width:30px; height:30px; border-radius:8px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-soft); flex:none;
  }
  .sup-modal-close:hover{background:var(--surface-hover);}

  .sup-thread{flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:4px;}
  .sup-empty{margin:auto; text-align:center; color:var(--text-faint); font-size:13px;}
  .sup-row-msg{display:flex; gap:10px; max-width:80%; margin-top:12px;}
  .sup-row-msg.out{align-self:flex-end; flex-direction:row-reverse;}
  .sup-bubble-col{display:flex; flex-direction:column; min-width:0;}
  .sup-row-msg.out .sup-bubble-col{align-items:flex-end;}
  .sup-sender{font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:3px;}
  .sup-bubble{padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5; background:var(--surface-2); color:var(--text); word-break:break-word; white-space:pre-wrap;}
  .sup-row-msg.out .sup-bubble{background:var(--accent); color:#0E0D13; border-bottom-right-radius:4px;}
  .sup-row-msg.in .sup-bubble{border-bottom-left-radius:4px;}
  .sup-time{font-size:10.5px; color:var(--text-faint); margin-top:4px;}
  .sup-row-msg.out .sup-time{text-align:right;}

  .sup-composer{display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid var(--border);}
  .sup-composer input{
    flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:99px;
    padding:12px 16px; color:var(--text); font-family:inherit; font-size:13.5px; outline:none;
  }
  .sup-composer input:focus{border-color:var(--accent);}
  .sup-composer input:disabled{opacity:.5;}
  .sup-send{width:40px; height:40px; border-radius:50%; background:var(--accent); color:#0E0D13; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; border:none;}
  .sup-send:disabled{opacity:.5; cursor:not-allowed;}

  .gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;}
  .gate-card{max-width:380px; text-align:center;}
  .gate-card h1{font-size:20px; margin-bottom:8px;}
  .gate-card p{font-size:13.5px; color:var(--text-soft); line-height:1.55; margin-bottom:18px;}
  .gate-card a{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 20px; border-radius:10px; font-size:13.5px; font-weight:700;}
  .gate-card a:hover{background:var(--surface-hover);}
</style>
<!-- Blooma favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png">
</head>
<body>

<div id="root">
  <div class="gate"><div class="gate-card"><p style="color:var(--text-faint);">Loading…</p></div></div>
</div>

<script>
  const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-venue-auth"}});
  let venues = [];
  let depositOwed = [];
  let revenue = [];
  let searchQuery = "";
  let supportConversations = [];
  let supportMessages = [];
  let currentSupportSalonId = null;
  let supportPollTimer = null;

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function fmtDate(iso){
    if(!iso) return '-';
    try{ return new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }catch(e){ return '-'; }
  }
  // Billing is manual Windcave payments now (no autobill, no webhook) — venue_billing.status
  // gets set to 'active' by a payment but never gets flipped back automatically once
  // current_period_end passes, so it can't be trusted as a live status. Status is derived
  // purely from dates: current_period_end (paid through), trial_ends_at (trial window) and
  // subscribed_at (has this venue ever paid at all).
  function inTrial(v){ return !!v.trial_ends_at && new Date(v.trial_ends_at) > new Date(); }
  function isActive(v){ return !!v.current_period_end && new Date(v.current_period_end) > new Date(); }
  function statusLabel(v){
    if(isActive(v)) return 'Active';
    if(v.subscribed_at) return 'Payment overdue';
    if(inTrial(v)) return 'Trial';
    if(v.trial_ends_at) return 'Trial expired';
    return 'No plan';
  }
  function statusPillClass(v){
    if(isActive(v)) return 'pill-active';
    if(v.subscribed_at) return 'pill-past_due';
    if(inTrial(v)) return 'pill-trialing';
    return 'pill-canceled';
  }

  function showGate(title, message, ctaLabel, ctaHref){
    document.getElementById('root').innerHTML =
      '<div class="gate"><div class="gate-card">' +
        '<h1>' + escapeHtml(title) + '</h1>' +
        '<p>' + escapeHtml(message) + '</p>' +
        '<a href="' + ctaHref + '">' + escapeHtml(ctaLabel) + '</a>' +
      '</div></div>';
  }

  function renderShell(){
    document.getElementById('root').innerHTML =
      '<header class="topbar">' +
        '<div class="tb-brand">Blooma <span class="tag">Platform Admin</span></div>' +
        '<button class="tb-logout" id="logoutBtn">Log out</button>' +
      '</header>' +
      '<div class="content">' +
        '<div class="page-head"><h1>All venues</h1><div class="sub">Every venue on Blooma, across every plan and trial state</div></div>' +
        '<div class="stats-grid" id="statsGrid"></div>' +
        '<div class="panel" id="revenuePanel" style="margin-bottom:22px;">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title">Platform revenue</div><div class="panel-sub">In-store card payments (1.79% + $0.30) are pure profit. Online deposits (2.49% + $0.30) are charged at cost - $0 profit - shown for volume only.</div></div>' +
          '</div>' +
          '<div class="stats-grid" id="revenueStatsGrid" style="padding:18px 20px 0;"></div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>In-store card processed</th><th>In-store profit</th><th>Online deposits (at cost)</th><th>Total profit</th></tr></thead>' +
              '<tbody id="revenueTbody"><tr><td colspan="5" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="panel" id="supportPanel" style="margin-bottom:22px;">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title">Support inbox</div><div class="panel-sub" id="supportSub">Loading…</div></div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>Last message</th><th>When</th><th></th></tr></thead>' +
              '<tbody id="supportTbody"><tr><td colspan="4" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="panel" id="depositPanel" style="margin-bottom:22px;">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title">Deposit payouts owed</div><div class="panel-sub">Online deposits held by Blooma, not yet sent to the venue</div></div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>Owed</th><th></th></tr></thead>' +
              '<tbody id="depositTbody"><tr><td colspan="3" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="panel-head">' +
            '<div><div class="panel-title" id="panelTitle">Venues</div><div class="panel-sub" id="panelSub">Loading…</div></div>' +
            '<div class="filter-search">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>' +
              '<input type="text" id="searchInput" placeholder="Search venue or owner email…">' +
            '</div>' +
          '</div>' +
          '<div class="table-wrap">' +
            '<table>' +
              '<thead><tr><th>Venue</th><th>Owner</th><th>Plan</th><th>Status</th><th>Trial ends</th><th>Subscribed</th><th>Signed up</th></tr></thead>' +
              '<tbody id="venuesTbody"><tr><td colspan="7" class="row-empty">Loading…</td></tr></tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="sup-overlay" id="supportOverlay">' +
        '<div class="sup-modal">' +
          '<div class="sup-modal-head">' +
            '<div><div class="sup-modal-title" id="supportModalTitle">Venue</div><div class="sup-modal-sub">Support conversation</div></div>' +
            '<div class="sup-modal-close" id="supportModalClose">' +
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>' +
            '</div>' +
          '</div>' +
          '<div class="sup-thread" id="supportThread"></div>' +
          '<div class="sup-composer">' +
            '<input type="text" id="supportReplyInput" placeholder="Reply to this venue…" disabled>' +
            '<button class="sup-send" id="supportReplyBtn" disabled>' +
              '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m3 3 18 9-18 9 4-9-4-9Z"/></svg>' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.getElementById('supportModalClose').addEventListener('click', closeSupportThread);
    document.getElementById('supportOverlay').addEventListener('click', function(e){ if(e.target===this) closeSupportThread(); });
    document.getElementById('supportReplyInput').addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); sendSupportReply(); } });
    document.getElementById('supportReplyInput').addEventListener('input', function(e){ document.getElementById('supportReplyBtn').disabled = !e.target.value.trim(); });
    document.getElementById('supportReplyBtn').addEventListener('click', sendSupportReply);
    document.getElementById('logoutBtn').addEventListener('click', async function(){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      location.href = '/business-auth?view=login';
    });
    document.getElementById('searchInput').addEventListener('input', function(e){
      searchQuery = e.target.value.trim().toLowerCase();
      renderVenues();
    });
  }

  function renderStats(){
    var total = venues.length;
    var active = venues.filter(function(v){ return isActive(v); }).length;
    var trialing = venues.filter(function(v){ return statusLabel(v)==='Trial'; }).length;
    var pastDue = venues.filter(function(v){ return statusLabel(v)==='Payment overdue'; }).length;
    document.getElementById('statsGrid').innerHTML =
      '<div class="stat-card"><div class="stat-label">Total venues</div><div class="stat-value">' + total + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Paying</div><div class="stat-value">' + active + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Trialing</div><div class="stat-value">' + trialing + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Past due / cancelled</div><div class="stat-value">' + pastDue + '</div></div>';
  }

  function nzDateKeyForIso(iso){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(iso)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); return `${o.year}-${o.month}-${o.day}`; }
  function nzTodayKey(){ return nzDateKeyForIso(new Date().toISOString()); }
  function localTimeLabel(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZone:"Pacific/Auckland"}); }
  function dateSepLabel(dateKey){
    if(dateKey===nzTodayKey()) return 'Today';
    var y = new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland'}).format(new Date(Date.now()-86400000));
    if(dateKey===y) return 'Yesterday';
    return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long',month:'short',day:'numeric'}).format(new Date(dateKey+'T12:00:00Z'));
  }

  function renderSupportInbox(){
    var sub = document.getElementById('supportSub');
    var tbody = document.getElementById('supportTbody');
    if(!sub || !tbody) return;
    var totalUnread = supportConversations.reduce(function(s,c){ return s+Number(c.unread_count||0); },0);
    sub.textContent = supportConversations.length + ' conversation' + (supportConversations.length===1?'':'s') + (totalUnread ? ' · ' + totalUnread + ' unread' : '');
    if(!supportConversations.length){
      tbody.innerHTML = '<tr><td colspan="4" class="row-empty">No support messages yet.</td></tr>';
      return;
    }
    tbody.innerHTML = supportConversations.map(function(c){
      var unread = Number(c.unread_count||0)>0;
      return '<tr class="sup-row" data-salon="' + escapeHtml(c.salon_id) + '">' +
        '<td><div class="sup-name">' + (unread?'<span class="sup-unread-dot"></span>':'') + escapeHtml(c.venue_name||c.salon_id) + '</div></td>' +
        '<td><div class="sup-preview">' + (c.last_sender_type==='platform'?'<strong>You: </strong>':'') + escapeHtml(c.last_message||'') + '</div></td>' +
        '<td>' + fmtDate(c.last_message_at) + '</td>' +
        '<td><div class="sup-open-btn">' + (unread?'Reply':'Open') + '</div></td>' +
      '</tr>';
    }).join('');
    tbody.querySelectorAll('.sup-row').forEach(function(row){
      row.addEventListener('click', function(){
        var conv = supportConversations.find(function(c){ return c.salon_id===row.dataset.salon; });
        openSupportThread(row.dataset.salon, conv ? conv.venue_name : row.dataset.salon);
      });
    });
  }

  async function loadSupportConversations(){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_support_conversations");
      if(error) throw error;
      supportConversations = data || [];
    }catch(err){ supportConversations = []; }
    renderSupportInbox();
  }

  function renderSupportThread(){
    var wrap = document.getElementById('supportThread');
    if(!supportMessages.length){
      wrap.innerHTML = '<div class="sup-empty">No messages yet.</div>';
      return;
    }
    var html = '';
    var lastDateKey = null;
    supportMessages.forEach(function(m){
      var dateKey = nzDateKeyForIso(m.created_at);
      if(dateKey !== lastDateKey){
        html += '<div style="text-align:center;font-size:11px;color:var(--text-faint);font-weight:600;margin:14px 0 6px;">' + dateSepLabel(dateKey) + '</div>';
        lastDateKey = dateKey;
      }
      var isOut = m.sender_type === 'platform';
      html += '<div class="sup-row-msg ' + (isOut?'out':'in') + '">' +
        '<div class="sup-bubble-col">' +
          '<div class="sup-sender">' + (isOut?'You':escapeHtml(document.getElementById('supportModalTitle').textContent)) + '</div>' +
          '<div class="sup-bubble">' + escapeHtml(m.body) + '</div>' +
          '<div class="sup-time">' + localTimeLabel(m.created_at) + '</div>' +
        '</div>' +
      '</div>';
    });
    wrap.innerHTML = html;
    wrap.scrollTop = wrap.scrollHeight;
  }

  async function loadSupportThread(salonId, silent){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_support_thread", {p_salon_id:salonId});
      if(error) throw error;
      supportMessages = data || [];
      renderSupportThread();
    }catch(err){ if(!silent) alert(err.message||"Could not load conversation"); }
  }

  function openSupportThread(salonId, venueName){
    currentSupportSalonId = salonId;
    document.getElementById('supportModalTitle').textContent = venueName || salonId;
    document.getElementById('supportThread').innerHTML = '<div class="sup-empty">Loading…</div>';
    document.getElementById('supportOverlay').classList.add('open');
    var input = document.getElementById('supportReplyInput');
    var btn = document.getElementById('supportReplyBtn');
    input.disabled = false; input.value = ''; btn.disabled = true;
    loadSupportThread(salonId);
    clearInterval(supportPollTimer);
    supportPollTimer = setInterval(function(){ loadSupportThread(salonId, true); }, 8000);
  }

  function closeSupportThread(){
    document.getElementById('supportOverlay').classList.remove('open');
    clearInterval(supportPollTimer);
    currentSupportSalonId = null;
    loadSupportConversations();
  }

  var sendingSupportReply = false;
  async function sendSupportReply(){
    var input = document.getElementById('supportReplyInput');
    var body = input.value.trim();
    if(!body || !currentSupportSalonId || sendingSupportReply) return;
    sendingSupportReply = true;
    input.disabled = true;
    document.getElementById('supportReplyBtn').disabled = true;
    try{
      const {error} = await supabaseClient.rpc("send_platform_support_reply", {p_salon_id:currentSupportSalonId, p_body:body});
      if(error) throw error;
      input.value = '';
      await loadSupportThread(currentSupportSalonId);
    }catch(err){ alert(err.message||"Message failed to send"); }
    input.disabled = false;
    document.getElementById('supportReplyBtn').disabled = !input.value.trim();
    sendingSupportReply = false;
    input.focus();
  }

  function renderVenues(){
    var filtered = venues.filter(function(v){
      if(!searchQuery) return true;
      return (v.name||'').toLowerCase().includes(searchQuery) || (v.owner_email||'').toLowerCase().includes(searchQuery);
    });
    document.getElementById('panelSub').textContent = filtered.length + ' venue' + (filtered.length===1?'':'s') + (searchQuery ? ' matching "'+searchQuery+'"' : '');
    var tbody = document.getElementById('venuesTbody');
    if(!filtered.length){
      tbody.innerHTML = '<tr><td colspan="7" class="row-empty">No venues found.</td></tr>';
      return;
    }
    tbody.innerHTML = filtered.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||'Unnamed venue') + '</div><div class="venue-city">' + escapeHtml([v.city,v.region].filter(Boolean).join(', ')) + '</div></td>' +
        '<td><div class="owner-name">' + escapeHtml(v.owner_name||'-') + '</div><div class="owner-email">' + escapeHtml(v.owner_email||'-') + '</div></td>' +
        '<td>' + escapeHtml(v.plan_id ? (v.plan_id + (v.seat_count>1?' · '+v.seat_count+' seats':'')) : '-') + '</td>' +
        '<td><span class="pill ' + statusPillClass(v) + '">' + escapeHtml(statusLabel(v)) + '</span></td>' +
        '<td>' + fmtDate(v.trial_ends_at) + '</td>' +
        '<td>' + fmtDate(v.subscribed_at) + '</td>' +
        '<td>' + fmtDate(v.signup_at) + '</td>' +
      '</tr>';
    }).join('');
  }

  function renderDepositOwed(){
    var tbody = document.getElementById('depositTbody');
    if(!tbody) return;
    if(!depositOwed.length){
      tbody.innerHTML = '<tr><td colspan="3" class="row-empty">Nothing owed right now.</td></tr>';
      return;
    }
    tbody.innerHTML = depositOwed.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||v.salon_id) + '</div></td>' +
        '<td>$' + (Number(v.owed_cents||0)/100).toFixed(2) + '</td>' +
        '<td><button class="btn-mark-paid" data-salon="' + escapeHtml(v.salon_id) + '" data-amt="' + (Number(v.owed_cents||0)/100).toFixed(2) + '" data-name="' + escapeHtml(v.name||v.salon_id) + '">Mark paid out</button></td>' +
      '</tr>';
    }).join('');
    tbody.querySelectorAll('.btn-mark-paid').forEach(function(btn){
      btn.addEventListener('click', function(){ markPaidOut(btn.dataset.salon, btn.dataset.name, btn.dataset.amt, btn); });
    });
  }

  async function loadDepositOwed(){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_deposit_summary");
      if(error) throw error;
      depositOwed = (data && data.venues) || [];
    }catch(err){ depositOwed = []; }
    renderDepositOwed();
  }

  function renderRevenue(){
    var totalInStore = revenue.reduce(function(s,v){ return s+Number(v.in_store_card_total||0); },0);
    var totalProfit = revenue.reduce(function(s,v){ return s+Number(v.in_store_profit||0); },0);
    var totalDeposits = revenue.reduce(function(s,v){ return s+Number(v.deposits_total||0); },0);
    document.getElementById('revenueStatsGrid').innerHTML =
      '<div class="stat-card"><div class="stat-label">Total profit</div><div class="stat-value">$' + totalProfit.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">In-store card volume</div><div class="stat-value">$' + totalInStore.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Deposits processed (at cost)</div><div class="stat-value">$' + totalDeposits.toFixed(2) + '</div></div>' +
      '<div class="stat-card"><div class="stat-label">Venues with activity</div><div class="stat-value">' + revenue.length + '</div></div>';

    var tbody = document.getElementById('revenueTbody');
    if(!revenue.length){
      tbody.innerHTML = '<tr><td colspan="5" class="row-empty">No card payments or deposits yet.</td></tr>';
      return;
    }
    tbody.innerHTML = revenue.map(function(v){
      return '<tr>' +
        '<td><div class="venue-name">' + escapeHtml(v.name||v.salon_id) + '</div></td>' +
        '<td>$' + Number(v.in_store_card_total||0).toFixed(2) + ' <span style="color:var(--text-faint);">(' + (v.in_store_card_count||0) + ')</span></td>' +
        '<td>$' + Number(v.in_store_profit||0).toFixed(2) + '</td>' +
        '<td>$' + Number(v.deposits_total||0).toFixed(2) + ' <span style="color:var(--text-faint);">(' + (v.deposits_count||0) + ')</span></td>' +
        '<td style="font-weight:700;">$' + Number(v.in_store_profit||0).toFixed(2) + '</td>' +
      '</tr>';
    }).join('');
  }

  async function loadRevenue(){
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_revenue");
      if(error) throw error;
      revenue = (data && data.venues) || [];
    }catch(err){ revenue = []; }
    renderRevenue();
  }

  async function markPaidOut(salonId, name, amt, btn){
    if(!confirm('Mark $' + amt + ' as paid out to ' + name + '? This assumes you\'ve already sent the bank transfer.')) return;
    btn.disabled = true; btn.textContent = 'Marking…';
    try{
      const {error} = await supabaseClient.rpc("platform_mark_deposit_payout", {p_salon_id:salonId, p_note:'Marked paid via Platform Admin'});
      if(error) throw error;
      await loadDepositOwed();
    }catch(err){
      alert(err.message || 'Could not mark as paid out');
      btn.disabled = false; btn.textContent = 'Mark paid out';
    }
  }

  async function boot(){
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){
      showGate("Log in required", "Log in with your Blooma account to continue.", "Log in", "/business-auth?view=login");
      return;
    }
    try{
      const {data,error} = await supabaseClient.rpc("get_platform_admin_venues");
      if(error) throw error;
      venues = (data && data.venues) || [];
      renderShell();
      renderStats();
      renderVenues();
      loadSupportConversations();
      loadDepositOwed();
      loadRevenue();
    }catch(err){
      showGate("Access denied", "This account doesn't have access to this page.", "Go to Blooma", "/");
    }
  }

  boot();
</script>

</body>
</html>
