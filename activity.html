<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Blooma — Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#201a2e; --muted:#766e8f; --soft:#a39ab9; --purple:#7c5cd9; --purple-dark:#6948c4;
  --lav:#f4f0fc; --lav2:#ece5fb; --line:#ebe7f3; --bg:#faf9fc; --card:#fff; --green:#18874b;
  --red:#b94a55; --shadow:0 16px 44px rgba(44,31,72,.08); --shadow-sm:0 8px 24px rgba(44,31,72,.06);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button,input{font:inherit}.shell{max-width:1400px;margin:0 auto;padding:0 32px}
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,249,252,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(235,231,243,.9)}
.topbar-inner{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:22px;font-weight:800;letter-spacing:-.6px;background:none;border:0;padding:0;font-family:inherit;color:var(--ink);cursor:pointer;}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{border:1px solid var(--line);background:#fff;color:var(--ink);width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.icon-btn:hover{background:var(--lav2);}
.icon-btn svg{display:block}
.menu-overlay{position:fixed;inset:0;background:rgba(20,10,40,.4);z-index:49;animation:menuOverlayIn .22s ease;}
.menu-overlay.closing{animation:menuOverlayOut .22s ease forwards;pointer-events:none;}
.menu-sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:420px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -14px 36px rgba(36,31,51,.14);padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:menuSheetUp .22s ease;will-change:transform;}
.menu-sheet.closing{animation:menuSheetDown .22s ease forwards;pointer-events:none;}
.menu-sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.menu-sheet-title{font-size:22px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em;}
.menu-sheet-close{width:32px;height:32px;border-radius:50%;background:var(--lav2);border:0;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex-shrink:0;}
.menu-list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;}
.menu-row{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 12px;border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);background:none;border:0;font-family:inherit;cursor:pointer;transition:background .12s;}
.menu-row:hover{background:var(--lav2);}
.menu-row.current{color:var(--purple);}
@keyframes menuSheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@keyframes menuSheetDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
@keyframes menuOverlayIn{from{opacity:0;}to{opacity:1;}}
@keyframes menuOverlayOut{from{opacity:1;}to{opacity:0;}}
@media(min-width:900px){
  .menu-overlay{background:transparent;}
  .menu-sheet{
    left:auto;bottom:auto;right:max(32px,calc((100vw - 1400px)/2 + 32px));top:88px;
    max-width:288px;width:288px;border-radius:18px;padding:10px;
    box-shadow:0 16px 44px rgba(44,31,72,.16),0 2px 8px rgba(44,31,72,.06);
    border:1px solid var(--line);
    animation:menuDropdownIn .14s ease;
    transform-origin:top right;
  }
  .menu-sheet.closing{animation:menuDropdownOut .12s ease forwards;}
  .menu-sheet-header{display:none;}
  .menu-list{border:none;padding:0;}
  .menu-row{padding:11px 12px;font-size:14px;}
}
@keyframes menuDropdownIn{from{transform:scale(.96) translateY(-4px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
@keyframes menuDropdownOut{from{transform:scale(1) translateY(0);opacity:1;}to{transform:scale(.96) translateY(-4px);opacity:0;}}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;padding:46px 0 26px;border-bottom:1px solid var(--line)}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--purple);font-weight:800;margin:0 0 8px}.page-title{font-size:42px;line-height:1.04;letter-spacing:-1.6px;margin:0;font-weight:800}.page-sub{font-size:15px;color:var(--muted);line-height:1.65;margin:12px 0 0;max-width:650px}
.head-cta{background:#fff;border:1px solid var(--line);border-radius:999px;padding:13px 22px;display:flex;gap:10px;align-items:center;font-weight:800;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow-sm);flex:none;cursor:pointer}.head-cta:hover{border-color:#d9cffa}
.activity-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:42px;align-items:start;padding:34px 0 88px}.main-col{min-width:0}.side{position:sticky;top:102px}
.tabs{display:flex;gap:9px;margin-bottom:28px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}
.section{padding:0 0 36px;margin-bottom:36px;border-bottom:1px solid var(--line)}.section:last-child{border-bottom:none}.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.section h2{font-size:30px;letter-spacing:-.8px;margin:0}.section-count{font-size:12px;color:var(--purple);background:var(--lav2);border-radius:999px;padding:7px 10px;font-weight:800}
.booking-list{display:flex;flex-direction:column;gap:14px}.booking-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:124px minmax(0,1fr) auto;gap:20px;align-items:center;cursor:pointer;transition:.18s ease;box-shadow:0 1px 0 rgba(30,20,50,.02)}.booking-card:hover{border-color:#d9cffa;box-shadow:var(--shadow-sm);transform:translateY(-1px)}.booking-img{width:124px;height:106px;border-radius:17px;overflow:hidden;background:var(--lav);position:relative}.booking-img img{width:100%;height:100%;object-fit:cover;display:block}.booking-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--purple)}.status-badge{position:absolute;left:10px;bottom:10px;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:800;background:rgba(255,255,255,.94);box-shadow:0 4px 14px rgba(0,0,0,.08)}.status-badge.upcoming{color:var(--green)}.status-badge.completed{color:var(--purple)}.status-badge.cancelled,.status-badge.no_show{color:var(--red)}
.booking-venue{font-size:12px;color:var(--purple);font-weight:800;text-transform:uppercase;letter-spacing:.08em}.booking-service{font-size:19px;font-weight:800;margin-top:5px;letter-spacing:-.25px}.booking-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;margin-top:8px}.meta-dot{width:4px;height:4px;border-radius:50%;background:#c9c2d7}.booking-foot{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.mini-pill{font-size:11.5px;font-weight:700;color:var(--muted);background:var(--lav);padding:7px 10px;border-radius:999px}.booking-total{text-align:right;align-self:center}.booking-total strong{display:block;font-size:18px}.booking-total span{display:block;font-size:12px;color:var(--soft);margin-top:4px}.chev{margin-top:12px;color:var(--purple);display:inline-flex}
.empty{background:#fff;border:1px dashed #dcd4ef;border-radius:22px;padding:34px;text-align:center;color:var(--muted)}
.summary-card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.summary-card h3{font-size:24px;letter-spacing:-.5px;margin:0}.summary-card>p{font-size:13.5px;color:var(--muted);line-height:1.5;margin:8px 0 20px}.summary-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid #f1eef6}.summary-row:last-child{border-bottom:none}.summary-row span{font-size:13px;color:var(--muted)}.summary-row strong{font-size:15px}
.help-card{margin-top:14px;background:linear-gradient(145deg,#251d35,#15111d);color:#fff;border-radius:22px;padding:22px}.help-card .eyebrow{color:#cdbcf7}.help-card h4{font-size:20px;margin:0 0 8px}.help-card p{font-size:13px;color:#bdb4ca;line-height:1.55;margin:0}
.loading-state{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;}
@media(max-width:900px){.shell{padding:0 18px}.topbar-inner{height:66px}.page-head{padding:32px 0 22px;display:block}.page-title{font-size:34px;letter-spacing:-1.15px}.page-sub{font-size:14px;margin-top:10px}.head-cta{margin-top:20px;width:100%;justify-content:center;box-shadow:none}.activity-layout{display:block;padding:28px 0 60px}.side{display:none}.section{padding-bottom:30px;margin-bottom:30px}.section h2{font-size:25px}.booking-card{grid-template-columns:96px minmax(0,1fr);gap:14px;padding:14px}.booking-img{width:96px;height:92px;border-radius:15px}.booking-service{font-size:16px}.booking-meta{font-size:12.5px;gap:6px}.booking-foot{margin-top:10px}.booking-total{grid-column:2;text-align:left;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f1eef6;padding-top:12px}.booking-total strong{font-size:16px}.booking-total span{display:none}.chev{margin:0}}
@media(max-width:520px){.shell{padding:0 16px}.page-title{font-size:31px}.section h2{font-size:23px}.section-title-row{align-items:center}.tabs{margin-bottom:24px}.tab{padding:10px 15px}.booking-card{grid-template-columns:82px minmax(0,1fr);gap:12px}.booking-img{width:82px;height:86px}.booking-service{font-size:15.5px}.mini-pill{padding:6px 8px}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar-inner"><a class="brand" href="/">Blooma</a><div class="top-actions"><button class="icon-btn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button></div></div></header>

<div id="menuOverlay"></div>
<main class="shell">
  <section class="page-head">
    <div><p class="eyebrow">Your bookings</p><h1 class="page-title">Activity</h1><p class="page-sub">Keep track of upcoming appointments, revisit past bookings, and open any booking to see the full details.</p></div>
    <a class="head-cta" href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Book again</a>
  </section>
  <div class="activity-layout">
    <div class="main-col">
      <div class="tabs"><button class="tab active" data-tab="upcoming">Upcoming</button><button class="tab" data-tab="past">Past</button></div>
      <div id="activityContent"><div class="loading-state">Loading your bookings…</div></div>
    </div>
    <aside class="side" id="sideSummary"></aside>
  </div>
</main>


<script>
const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
const NZ_TIME_ZONE = "Pacific/Auckland";
const customerSupabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-customer-auth"}});

let bookings = [];
let salonImages = {};
let activeTab = "upcoming";

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }
function dayLabel(d){ return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",timeZone:NZ_TIME_ZONE}); }
function bookingStatusLabel(status){ return status==="completed"?"Completed":status==="cancelled"?"Cancelled":status==="no_show"?"No-show":"Upcoming"; }

function bookingFromRow(r){
  const dt = new Date(r.starts_at);
  return {
    dbId:r.id, publicToken:r.public_token, salonId:r.salon_id, salonName:r.salon_name||"Venue",
    serviceName:r.service_name||"Service", stylistName:r.stylist_name||"Venue team",
    dateLabel:dayLabel(dt), time:dt.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZone:NZ_TIME_ZONE}),
    startsAt:r.starts_at, duration:Number(r.duration_minutes||30), price:Number(r.total||0),
    addons:Array.isArray(r.addons)?r.addons:[], status:r.status||"upcoming"
  };
}

async function loadSalonImages(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_marketplace_venues`,{
      method:"POST", headers:{"apikey":SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"}, body:"{}"
    });
    if(!res.ok) return;
    const rows = await res.json();
    (Array.isArray(rows)?rows:[]).forEach(v=>{
      const main = String(v.main_image||"").trim();
      const gallery = Array.isArray(v.gallery_images) ? v.gallery_images.map(String).filter(Boolean) : [];
      salonImages[String(v.id)] = main || gallery[0] || "";
    });
  }catch(err){ console.warn("Blooma could not load venue images.", err); }
}

function renderEmpty(kind){
  return `<div class="empty">${kind==="upcoming" ? "No upcoming bookings.<br/>Book a service and it'll show up here." : "No past bookings yet."}</div>`;
}

function bookingCard(b){
  const addonsTotal = (b.addons||[]).reduce((sum,a)=>sum+(Number(a.price)||0),0);
  const thumb = salonImages[b.salonId] || "";
  return `
    <article class="booking-card" data-booking="${escapeAttr(b.dbId)}">
      <div class="booking-img">
        ${thumb ? `<img src="${escapeAttr(thumb)}" alt="${escapeAttr(b.salonName)}" loading="lazy" decoding="async">` : `<div class="booking-img-fallback"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-6h16l1 6"></path><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"></path></svg></div>`}
        <span class="status-badge ${b.status}">${bookingStatusLabel(b.status)}</span>
      </div>
      <div>
        <div class="booking-venue">${escapeHtml(b.salonName)}</div>
        <div class="booking-service">${escapeHtml(b.serviceName)}</div>
        <div class="booking-meta"><span>${escapeHtml(b.dateLabel)}</span><span class="meta-dot"></span><span>${escapeHtml(b.time)}</span><span class="meta-dot"></span><span>${escapeHtml(b.stylistName)}</span></div>
        <div class="booking-foot"><span class="mini-pill">${b.duration} min</span>${b.addons&&b.addons.length?`<span class="mini-pill">+ ${escapeHtml(b.addons.map(a=>a.name).join(", "))}</span>`:""}</div>
      </div>
      <div class="booking-total">
        <strong>$${b.price}</strong>
        <span>${addonsTotal ? `incl. $${addonsTotal} add-ons` : (b.status==="completed"?"paid":b.status==="cancelled"?"cancelled":"total")}</span>
        <span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></span>
      </div>
    </article>
  `;
}

function renderContent(){
  const upcoming = bookings.filter(b=>b.status==="upcoming").sort((a,b)=>new Date(a.startsAt)-new Date(b.startsAt));
  const past = bookings.filter(b=>b.status!=="upcoming").sort((a,b)=>new Date(b.startsAt)-new Date(a.startsAt));
  const list = activeTab==="upcoming" ? upcoming : past;

  document.getElementById("activityContent").innerHTML = `
    <section class="section">
      <div class="section-title-row">
        <h2>${activeTab==="upcoming"?"Upcoming bookings":"Past bookings"}</h2>
        <span class="section-count">${list.length} booking${list.length===1?"":"s"}</span>
      </div>
      <div class="booking-list">
        ${list.length ? list.map(bookingCard).join("") : renderEmpty(activeTab)}
      </div>
    </section>
  `;

  document.querySelectorAll("[data-booking]").forEach(card=>{
    card.addEventListener("click", ()=>{
      const id = card.getAttribute("data-booking");
      window.location.href = `/?openBooking=${encodeURIComponent(id)}`;
    });
  });

  document.getElementById("sideSummary").innerHTML = `
    <div class="summary-card">
      <h3>Your activity</h3>
      <p>A quick look at what you have coming up and what you've booked before.</p>
      <div class="summary-row"><span>Upcoming</span><strong>${upcoming.length}</strong></div>
      <div class="summary-row"><span>Completed</span><strong>${bookings.filter(b=>b.status==="completed").length}</strong></div>
    </div>
    <div class="help-card">
      <p class="eyebrow">Need a hand?</p>
      <h4>Questions about a booking?</h4>
      <p>Message the venue directly from any booking's details, or reach out to Blooma support.</p>
    </div>
  `;
}

function openMenuSheet(){
  document.getElementById("menuBtn").setAttribute("aria-expanded","true");
  document.getElementById("menuOverlay").innerHTML = `
    <div class="menu-overlay" id="menuOverlayBg"></div>
    <div class="menu-sheet" id="menuSheetCard">
      <div class="menu-sheet-header">
        <h2 class="menu-sheet-title">Menu</h2>
        <button class="menu-sheet-close" id="closeMenuSheet" aria-label="Close menu">${iconX}</button>
      </div>
      <div class="menu-list">
        <button class="menu-row" id="menuProfileBtn"><span>Profile</span>${iconChevron}</button>
        <button class="menu-row current" id="menuActivityBtn"><span>Activity</span>${iconChevron}</button>
        <button class="menu-row" id="menuBusinessBtn"><span>Blooma for Business</span>${iconChevron}</button>
      </div>
    </div>
  `;
  document.getElementById("menuOverlayBg").addEventListener("click", closeMenuSheet);
  document.getElementById("closeMenuSheet").addEventListener("click", closeMenuSheet);
  document.getElementById("menuProfileBtn").addEventListener("click", ()=>{ window.location.href = "/?openProfile=1"; });
  document.getElementById("menuActivityBtn").addEventListener("click", closeMenuSheet);
  document.getElementById("menuBusinessBtn").addEventListener("click", ()=>{ window.location.href = "/for-business"; });
}
let menuCloseTimer=null;
function closeMenuSheet(){
  const sheet = document.getElementById("menuSheetCard");
  const overlay = document.getElementById("menuOverlayBg");
  if(!sheet) return;
  if(sheet.classList.contains("closing")) return;
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
  sheet.classList.add("closing");
  overlay?.classList.add("closing");
  clearTimeout(menuCloseTimer);
  menuCloseTimer = setTimeout(()=>{ document.getElementById("menuOverlay").innerHTML = ""; }, 230);
}
const iconX = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
const iconChevron = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>`;
document.getElementById("menuBtn").addEventListener("click", openMenuSheet);
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeMenuSheet(); });

document.querySelectorAll(".tab").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeTab = btn.dataset.tab;
    renderContent();
  });
});

async function boot(){
  const {data:{session}} = await customerSupabaseClient.auth.getSession();
  if(!session){
    window.location.href = "/login";
    return;
  }
  await loadSalonImages();
  try{
    const {data, error} = await customerSupabaseClient.rpc("get_my_customer_state");
    if(error) throw error;
    bookings = (data?.bookings||[]).map(bookingFromRow);
  }catch(err){
    console.warn("Blooma could not load your bookings.", err);
    document.getElementById("activityContent").innerHTML = `<div class="empty">We couldn't load your bookings. Please try again.</div>`;
    return;
  }
  renderContent();
}
boot();
</script>
</body>
</html>
