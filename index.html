<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no, address=no, email=no" />
<title>Salon Booking</title>
<style>
  :root{
    --ink:#241F33;
    --ink-soft:#8A80AD;
    --ink-mute:#6B6285;
    --purple:#7C5CD9;
    --purple-dark:#6D4DC7;
    --purple-pastel:#F1ECFB;
    --purple-pastel-2:#F3EEFC;
    --border:#EFECF9;
    --border-2:#E9E4F7;
    --border-hover:#C9BBEF;
    --bg:#FAF9FD;
    --white:#FFFFFF;
    --placeholder:#B3ABCB;
    --disabled:#DED4F5;
    --gold:#F5A623;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-x:none;
  }
  button{
    font-family:inherit;cursor:pointer;touch-action:manipulation;
    -webkit-appearance:none;appearance:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;margin:0;background:none;border:none;padding:0;
  }
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  a:visited,a:active,a:hover,a:focus{color:inherit;text-decoration:none;}
  input,textarea{font-family:inherit;max-width:100%;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  html,body,#app{height:100%;min-height:100%;}
  #app{width:100%;min-width:0;display:flex;justify-content:center;background:var(--bg);}
  .shell{width:100%;max-width:none;height:100dvh;min-height:0;position:relative;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  .page{height:auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overflow-anchor:none;-ms-overflow-style:none;scrollbar-width:none;}
  .page::-webkit-scrollbar{display:none;}
  @supports not (height:100dvh){.shell{height:100vh;}}
  @media (min-width:640px){
    #app{padding:24px 0;}
    .shell{max-width:480px;height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 18px 60px rgba(36,31,51,.10);}
  }
  .page.no-scroll{overflow:hidden;}

  /* icons (inline SVG helpers) sized via span wrapper */
  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-star{position:relative;top:-1px;}

  .chip{
    min-height:38px;padding:7px 16px;border-radius:9999px;font-size:14px;font-weight:600;
    border:1px solid var(--border-2);background:var(--white);color:var(--ink);
    white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
    flex:0 0 auto;line-height:20px;display:inline-flex;align-items:center;justify-content:center;
    overflow:hidden;background-clip:padding-box;
  }
  .chip.active{border-color:var(--purple);background:var(--purple);color:#fff;}
  .chip-row{
    display:flex;flex-wrap:nowrap;align-items:center;gap:8px;
    width:100%;min-height:54px;
    overflow-x:auto;overflow-y:hidden;
    overflow-anchor:none;
    scroll-padding-inline:20px;
    padding-top:8px;padding-bottom:8px;
    scrollbar-width:none;
  }
  .chip-row::after{
    content:"";
    flex:0 0 12px;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    border-bottom:1px solid var(--border);background:var(--white);
    position:sticky;top:0;z-index:10;
  }
  .backbtn{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid var(--border-2);background:var(--white);
  }
  .backbtn:hover{background:var(--purple-pastel-2);}
  .toptitle{font-size:15px;font-weight:700;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;gap:16px;}
  .row .label{color:var(--ink-soft);flex-shrink:0;}
  .row .value{font-weight:600;color:var(--ink);text-align:right;}

  .searchbox{
    display:flex;align-items:center;gap:10px;background:var(--white);
    border:1px solid var(--border-2);border-radius:16px;padding:12px 16px;
  }
  .searchbox input{width:100%;background:transparent;border:none;outline:none;font-size:14px;color:var(--ink);}
  .searchbox input::placeholder{color:var(--placeholder);}

  .home-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;flex-shrink:0;border-bottom:1px solid var(--border);}
  .greeting-desktop{display:none;}
  .brand-logo{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.4px;-webkit-tap-highlight-color:transparent;}
  .brand-mark{width:26px;height:26px;border-radius:9px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark .icon svg{width:15px;height:15px;}
  .menu-btn{
    width:38px;height:38px;border-radius:50%;background:var(--white);color:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border-2);
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{background:var(--purple-pastel-2);}
  .menu-btn.has-badge{position:relative;}
  .menu-btn.active-fav{color:#E0466D;border-color:#F6D2DC;background:#FCEEF2;}
  .menu-badge{position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--purple);border:2px solid var(--white);}

  .home-menu-sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:50;
    background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -14px 36px rgba(36,31,51,.14);
    max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:homeMenuSheetUp .22s ease;
    will-change:transform;
  }
  .home-menu-sheet.closing{animation:homeMenuSheetDown .22s ease forwards;pointer-events:none;}
  #homeMenuOverlay{animation:homeMenuOverlayIn .22s ease;}
  #homeMenuOverlay.closing{animation:homeMenuOverlayOut .22s ease forwards;pointer-events:none;}
  @keyframes homeMenuSheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes homeMenuSheetDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
  @keyframes homeMenuOverlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes homeMenuOverlayOut{from{opacity:1;}to{opacity:0;}}
  .city-picker-sheet{animation:homeMenuSheetUp .22s ease;will-change:transform;}
  .city-picker-sheet.closing{animation:homeMenuSheetDown .22s ease forwards;pointer-events:none;}
  #cityPickerOverlay{animation:homeMenuOverlayIn .22s ease;}
  #cityPickerOverlay.closing{animation:homeMenuOverlayOut .22s ease forwards;pointer-events:none;}
  .home-menu-sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .home-menu-sheet-title{font-size:26px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.5px;}
  .home-menu-sheet-close{width:32px;height:32px;border-radius:50%;background:var(--purple-pastel-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;-webkit-tap-highlight-color:transparent;}
  .home-menu-list{background:var(--white);border:1px solid var(--border-2);border-radius:18px;padding:6px;margin-bottom:14px;}
  .home-menu-row{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 12px;
    border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);transition:background .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .home-menu-row:hover{background:var(--purple-pastel-2);}
  .home-menu-row:active{background:var(--purple);color:#fff;}
  .home-menu-row:active .icon{color:#fff!important;}
  .home-menu-row-left{display:flex;align-items:center;gap:12px;}
  .home-menu-row .icon{color:var(--ink-soft);flex-shrink:0;}
  .home-menu-row.danger{color:#C13B3B;}
  .home-menu-row.danger .icon{color:#C13B3B;}
  .home-menu-row.danger:active{background:var(--purple);color:#fff;}
  .home-menu-row.danger:active .icon{color:#fff!important;}
  .home-menu-divider{height:1px;background:var(--border);margin:6px 4px;}
  .home-menu-business-card{
    display:flex;align-items:center;justify-content:space-between;width:100%;
    background:var(--white);border:1px solid var(--border-2);border-radius:18px;padding:16px;
    font-size:15px;font-weight:700;color:var(--ink);-webkit-tap-highlight-color:transparent;transition:background .12s;
  }
  .home-menu-business-card:hover{background:var(--purple-pastel-2);}
  .home-menu-business-card:active{background:var(--purple);color:#fff;border-color:var(--purple);}
  .home-menu-business-card:active .icon{color:#fff!important;}
  .home-menu-business-card .icon{color:var(--ink-soft);}

  .location-pill{
    display:inline-flex;align-items:center;gap:6px;padding:0 12px;border-radius:9999px;height:38px;box-sizing:border-box;
    background:var(--white);border:1px solid var(--border-2);-webkit-tap-highlight-color:transparent;max-width:150px;
  }
  .location-pill .icon{color:var(--purple);flex-shrink:0;}
  .location-pill span.loc-name{font-size:12.5px;font-weight:700;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .category-shelf{
    background:var(--purple-pastel-2);border-radius:20px;padding:4px 8px;
  }
  .category-shelf .chip-row{padding-top:6px;padding-bottom:6px;}
  .category-shelf .chip-row::after{content:none;}
  .category-shelf .chip{background:var(--white);border-color:var(--white);}
  .category-shelf .chip.active{border-color:var(--purple);background:var(--purple);}
  .salon-list{padding:0 20px 32px;display:flex;flex-direction:column;gap:12px;}

  .salon-card{
    text-align:left;background:var(--white);border:1px solid var(--border);border-radius:18px;
    padding:16px;display:flex;align-items:center;gap:14px;transition:border-color .15s,background-color .15s;width:100%;
    cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  }
  .salon-card img{pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .salon-card:focus,.salon-card:active{outline:none;}
  .salon-card:hover{border-color:var(--border-hover);}
  .salon-icon{
    width:56px;height:56px;border-radius:14px;background:var(--purple-pastel-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--purple);
  }
  .tag-pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--purple-pastel);color:#5C4B99;font-weight:600;}

  .featured-salon-card{display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:18px;padding:0;width:100%;overflow:hidden;box-shadow:0 1px 2px rgba(36,31,51,.04);transition:border-color .15s;}
  .featured-salon-card:hover{border-color:var(--border-hover);}
  .featured-salon-image{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--purple-pastel-2);flex-shrink:0;}
  .featured-salon-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .featured-salon-body{padding:12px 14px 16px;min-width:0;}
  .featured-salon-name{font-weight:700;color:var(--ink);font-size:15px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .featured-salon-rating{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:13px;font-weight:600;color:var(--ink);}
  .featured-salon-rating .star-row{display:flex;align-items:center;gap:1px;}
  .featured-salon-rating .star-row .icon svg{width:13px;height:13px;}
  .featured-salon-rating-count{color:var(--ink-soft);font-weight:500;}
  .featured-salon-location,.featured-salon-status{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .featured-salon-status.is-open{color:#1E8A4C;font-weight:600;}
  .checkout-summary-strip-time{font-size:12px;color:var(--purple);font-weight:600;margin:4px 0 0;}
  .checkout-day-row{gap:8px;}
  .gallery-group{display:flex;flex-direction:column;gap:16px;}
  .venue-carousel-section{display:none;}
  .checkout-summary-desktop{display:none;}
  .checkout-summary-mobile{display:flex;}
  .checkout-sidebar-venue-row{display:flex;gap:12px;align-items:flex-start;}
  .checkout-sidebar-venue-img{width:56px;height:56px;border-radius:12px;overflow:hidden;flex-shrink:0;background:var(--purple-pastel-2);}
  .checkout-sidebar-venue-img img{width:100%;height:100%;object-fit:cover;display:block;}
  .checkout-sidebar-venue-img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .checkout-sidebar-venue-name{font-size:15px;font-weight:700;color:var(--ink);margin:0;}
  .checkout-sidebar-venue-rating{display:flex;align-items:center;gap:5px;margin:4px 0 0;font-size:13px;font-weight:600;color:var(--ink);}
  .checkout-sidebar-venue-rating .star-row{display:flex;align-items:center;gap:1px;}
  .checkout-sidebar-venue-rating .star-row .icon svg{width:12px;height:12px;}
  .checkout-sidebar-venue-rating-count{color:var(--ink-soft);font-weight:500;}
  .checkout-sidebar-venue-address{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .checkout-sidebar-divider{height:1px;background:var(--border);margin:16px 0;}
  .checkout-sidebar-datetime{display:flex;flex-direction:column;gap:8px;}
  .checkout-sidebar-datetime-row{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);font-weight:600;}
  .checkout-sidebar-datetime-row .icon svg{width:15px;height:15px;}
  .checkout-sidebar-item-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .checkout-sidebar-item-name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .checkout-sidebar-item-price{font-size:13.5px;font-weight:700;color:var(--ink);flex-shrink:0;}
  .checkout-sidebar-item-sub{font-size:12px;color:var(--ink-soft);margin:3px 0 0;}
  .checkout-sidebar-total-row{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--ink);}

  .service-card{
    background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;
  }
  .book-btn{
    padding:9px 18px;border-radius:999px;background:var(--purple);color:#fff;
    font-size:13px;font-weight:700;border:none;white-space:nowrap;
  }
  .book-btn:hover{background:var(--purple-dark);}
  .service-card[data-service-row]{cursor:pointer;transition:border-color .15s,background .15s;}
  .service-card[data-service-row]:active{background:var(--purple-pastel-2);}
  .service-detail-overlay{
    position:absolute;inset:0;background:rgba(20,10,40,.42);z-index:69;
    animation:serviceDetailOverlayIn .24s ease;
  }
  .service-detail-overlay.closing{animation:serviceDetailOverlayOut .24s ease forwards;pointer-events:none;}
  .service-detail-sheet{
    position:absolute;left:0;right:0;bottom:0;z-index:70;height:58%;min-height:390px;max-height:620px;
    background:var(--white);border-radius:26px 26px 0 0;box-shadow:0 -14px 38px rgba(36,31,51,.16);
    padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
    animation:serviceDetailUp .24s ease;will-change:transform;
  }
  .service-detail-sheet.closing{animation:serviceDetailDown .24s ease forwards;pointer-events:none;}
  .service-detail-close{
    width:34px;height:34px;border-radius:50%;background:var(--purple-pastel-2);color:var(--ink);
    display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0;
  }
  .service-detail-title{font-size:27px;font-weight:800;color:var(--ink);letter-spacing:-.5px;margin:12px 0 0;}
  .service-detail-description{font-size:15px;line-height:1.55;color:var(--ink-mute);margin:18px 0 0;white-space:pre-line;}
  .service-detail-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-top:auto;padding-top:18px;}
  .service-detail-price{font-size:22px;font-weight:800;color:var(--ink);margin:0;}
  .service-detail-duration{font-size:13.5px;color:var(--ink-soft);margin:4px 0 0;}
  .service-detail-book{
    min-width:112px;padding:13px 24px;border-radius:999px;background:var(--purple);color:#fff;
    font-size:14.5px;font-weight:800;box-shadow:0 6px 16px rgba(124,92,217,.24);
  }
  @keyframes serviceDetailUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes serviceDetailDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
  @keyframes serviceDetailOverlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes serviceDetailOverlayOut{from{opacity:1;}to{opacity:0;}}

  .day-pill{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:56px;padding:10px 0;border-radius:14px;border:1px solid var(--border-2);
    background:var(--white);color:var(--ink);flex-shrink:0;transition:border-color .15s,background-color .15s,color .15s;
  }
  .day-pill.active{border-color:var(--purple);background:var(--purple);color:#fff;}
  .day-pill:disabled{opacity:.4;cursor:not-allowed;}
  .day-pill:disabled:hover{border-color:var(--border-2);}
  .day-pill .dname{font-size:11px;font-weight:600;opacity:.7;color:var(--ink-soft);}
  .day-pill.active .dname{opacity:.85;color:#fff;}
  .day-pill .dnum{font-size:15px;font-weight:700;margin-top:2px;color:var(--ink);}
  .day-pill.active .dnum{color:#fff;}

  .time-pill{
    padding:11px 0;border-radius:14px;font-size:13.5px;font-weight:600;
    border:1px solid var(--border-2);background:var(--white);color:var(--ink);transition:all .15s;
  }
  .time-pill.active{border-color:var(--purple);background:var(--purple);color:#fff;}
  .time-pill:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through;}
  .time-pill:disabled:hover{border-color:var(--border-2);}

  .field label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px;}
  .field input, .field textarea{
    width:100%;background:var(--white);border:1px solid var(--border-2);border-radius:14px;
    padding:12px 16px;font-size:14px;outline:none;color:var(--ink);font-family:inherit;
  }
  .field input::placeholder, .field textarea::placeholder{color:var(--placeholder);}

  .summary-card{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:16px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase;margin:0 0 12px;}
  .contact-hero-row{display:flex;align-items:center;gap:12px;margin:-2px 0 14px;padding-bottom:14px;border-bottom:1px dashed var(--border-2);}
  .contact-avatar{
    width:42px;height:42px;border-radius:50%;background:var(--purple-pastel-2);color:var(--purple);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
  }
  .pref-tag{
    display:inline-flex;align-items:center;background:var(--purple-pastel-2);color:var(--purple-dark);
    font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;
  }
  .confirm-page-title{font-size:25px;font-weight:800;color:var(--ink);margin:2px 0 20px;line-height:1.15;letter-spacing:-.3px;}
  .confirm-stylist-row{display:flex;align-items:center;gap:12px;}
  .confirm-total-drawer{background:var(--purple-pastel-2);border-radius:14px;padding:12px 14px;margin-bottom:12px;}
  .profile-rewards-card{background:var(--purple-pastel-2);border-radius:18px;padding:16px;}
  .section-rule{display:flex;align-items:center;gap:12px;margin:26px 0 12px;}
  .section-rule:first-of-type{margin-top:0;}
  .section-rule .lbl{font-size:12px;font-weight:700;letter-spacing:.6px;color:var(--ink-soft);text-transform:uppercase;white-space:nowrap;}
  .section-rule .line{flex:1;height:1px;background:var(--border);}

  .promo-input{
    flex:1;min-width:0;background:var(--white);border:1px solid var(--border-2);border-radius:14px;
    padding:12px 16px;font-size:14px;outline:none;color:var(--ink);font-family:inherit;
    text-transform:uppercase;letter-spacing:.3px;
  }
  .promo-input::placeholder{color:var(--placeholder);text-transform:none;letter-spacing:0;}
  .promo-input.error{border-color:#E37373;}
  .promo-apply-btn{
    padding:0 20px;border-radius:14px;background:var(--purple);color:#fff;
    font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0;
  }
  .promo-apply-btn:hover{background:var(--purple-dark);}
  .promo-applied-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  <script>
  // If Supabase ever falls back to the customer home URL after a venue email
  // confirmation, hand the untouched auth callback to the venue client first.
  (function(){
    try{
      if(!location.hash || !location.hash.includes("access_token=")) return;
      const hp=new URLSearchParams(location.hash.slice(1));
      const token=hp.get("access_token");
      if(!token) return;
      const part=token.split(".")[1];
      if(!part) return;
      const normalized=part.replace(/-/g,"+").replace(/_/g,"/");
      const padded=normalized+"=".repeat((4-normalized.length%4)%4);
      const payload=JSON.parse(decodeURIComponent(Array.from(atob(padded),c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
      const accountType=String(payload?.user_metadata?.account_type||"").toLowerCase();
      if(accountType==="venue"){
        location.replace("/business-auth?confirmed=1"+location.hash);
      }
    }catch(e){}
  })();
  </script>

  const [y,mo,da]=dateKey.split("-").map(Number), mins=parseTimeMins(timeStr), hh=Math.floor(mins/60), mm=mins%60;
  const target=Date.UTC(y,mo-1,da,hh,mm,0); let guess=target;
  const fmt=new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  for(let i=0;i<3;i++){ const o={}; fmt.formatToParts(new Date(guess)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); const represented=Date.UTC(Number(o.year),Number(o.month)-1,Number(o.day),Number(o.hour),Number(o.minute),0); guess+=target-represented; }
  return new Date(guess).toISOString();
}

function downloadIcsFile(evt){
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Blooma//Booking//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT",
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@blooma.co.nz`,
    `DTSTAMP:${icsDateStamp(new Date())}`,
    `DTSTART:${icsDateStamp(evt.start)}`,
    `DTEND:${icsDateStamp(evt.end)}`,
    `SUMMARY:${icsEscape(evt.title)}`,
    evt.description ? `DESCRIPTION:${icsEscape(evt.description)}` : "",
    evt.location ? `LOCATION:${icsEscape(evt.location)}` : "",
    "END:VEVENT","END:VCALENDAR"
  ].filter(Boolean).join("\r\n");
  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "blooma-appointment.ics";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

    details:evt.description||"", location:evt.location||""
  });
  return `https://calendar.google.com/calendar/render?${params.toString()}`;
}

  if(t.includes("lash")||t.includes("brow")||t.includes("makeup")) return "sparkles";

  const parts=liveDbTime(t).split(":"); let h=Number(parts[0]||9), m=parts[1]||"00";

    const h=src[key];

async function loadMarketplaceVenues(applyRouteAfterLoad=false){
  const hadLiveData=state.marketplaceReady && SALONS.length>0;
  try{
    const res=await fetch(`${MARKETPLACE_SUPABASE_URL}/rest/v1/rpc/get_marketplace_venues`,{
      method:"POST",
      headers:{"apikey":MARKETPLACE_SUPABASE_KEY,"Content-Type":"application/json"},
      body:"{}"
    });
    if(!res.ok) throw new Error(`Marketplace request failed (${res.status})`);
    const rows=await res.json();
    const liveRows=Array.isArray(rows)?rows:[];
    SALONS.splice(0,SALONS.length,...liveRows.map(v=>liveVenueToSalon(v)));
    if(state.salon?.id){
      const previousSalon=state.salon;
      const refreshedSalon=SALONS.find(s=>s.id===previousSalon.id);
      if(!refreshedSalon && previousSalon._cloud){
        Object.assign(state,{page:"home",salon:null,service:null,selectedStylist:null,selectedTime:null,selectedAddons:[],step:0,bookingError:""});
        if(location.protocol!=="file:") history.replaceState({blooma:true},"","/");

        if(state.service?.id){
          const refreshedService=(refreshedSalon.services||[]).find(s=>s.id===state.service.id);
          if(refreshedService) state.service=refreshedService;
          else { state.service=null; state.selectedAddons=[]; state.selectedTime=null; state.step=0; if(state.page==="checkout") state.page="salon"; }
        }
        if(state.selectedStylist?.id){
          const refreshedStylist=(refreshedSalon.stylists||[]).find(st=>st.id===state.selectedStylist.id);
          if(refreshedStylist) state.selectedStylist=refreshedStylist;
          else { state.selectedStylist=null; state.selectedTime=null; if(state.page==="checkout") state.step=0; }
        }

function dateKeyDayDiff(aKey,bKey){ const [ay,am,ad]=aKey.split("-").map(Number),[by,bm,bd]=bKey.split("-").map(Number); return Math.round((Date.UTC(ay,am-1,ad)-Date.UTC(by,bm-1,bd))/86400000); }
function countdownLabel(iso){
  const diff=dateKeyDayDiff(nzDateKey(new Date(iso)),nzTodayKey());
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff > 1) return `In ${diff} days`;

}
function firstOpenDayIndex(salon){
  for (let i=0;i<DAYS.length;i++){
    if (customerDayHours(salon,nzDayIndex(DAYS[i]))) return i;
  }

function parseTimeMins(t){
  const raw=String(t||"").trim();
  const m=raw.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(m){ let h=parseInt(m[1],10)%12; if(/PM/i.test(m[3])) h+=12; return h*60+parseInt(m[2],10); }
  const m24=raw.match(/^(\d{1,2}):(\d{2})/); if(m24) return Number(m24[1])*60+Number(m24[2]);
  return 0;
}
function formatTimeMins(mins){ let h=Math.floor(mins/60)%24,m=mins%60,period=h>=12?"PM":"AM"; let h12=h%12||12; return `${h12}:${String(m).padStart(2,"0")} ${period}`; }
function selectedDayHours(salon,dayIndex){
  const d=DAYS[dayIndex];
  const h=customerDayHours(salon,nzDayIndex(d));
  if(!h) return null;
  return {start:parseTimeMins(h.start),end:parseTimeMins(h.end)};
}
function timeSlotsForSalon(salon,dayIndex,durationMins){
  const bounds=selectedDayHours(salon,dayIndex); if(!bounds) return [];
  const out=[]; for(let m=bounds.start;m+Number(durationMins||0)<=bounds.end;m+=15) out.push(formatTimeMins(m)); return out;
}
function intervalOverlaps(aStart,aEnd,bStart,bEnd){ return aStart<bEnd && aEnd>bStart; }
function staffUnavailableInCloud(salon,staffId,slotStart,slotEnd){
  const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
  const booked=(salon.cloudBookedSlots||[]).some(b=>{
    if(String(b.stylist_id||"")!==String(staffId||"")) return false;
    const existingStart=new Date(b.starts_at);
    const existingEnd=new Date(existingStart.getTime()+Number(b.duration_minutes||30)*60000);
    return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),existingStart,new Date(existingEnd.getTime()+bufferMs));
  });
  if(booked) return true;
  return (salon.cloudBlockouts||[]).some(bo=>(bo.all_staff||String(bo.stylist_id||"")===String(staffId||"")) && intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
}
function isTimeBlocked(salon,dayIndex,stylist,timeStr,durationMins){
  const d=DAYS[dayIndex];
  const bounds=selectedDayHours(salon,dayIndex); if(!bounds) return true;
  const slotStartMin=parseTimeMins(timeStr), slotEndMin=slotStartMin+Number(durationMins||0); if(slotStartMin<bounds.start||slotEndMin>bounds.end) return true;
  const slotStart=new Date(bookingStartIso(dayIndex,timeStr)); const slotEnd=new Date(slotStart.getTime()+Number(durationMins||0)*60000);
  if(slotStart.getTime()<Date.now()+5*60000) return true;
  const localBlocked=(salon.blockouts||[]).some(bo=>{ if(bo.dayOffset!==dayIndex) return false; if(bo.stylistName!=="All staff"&&(!stylist||bo.stylistName!==stylist.name)) return false; return intervalOverlaps(slotStartMin,slotEndMin,parseTimeMins(bo.startTime),parseTimeMins(bo.endTime)); });
  if(localBlocked) return true;
  const anySelected=!stylist||stylist.name==="Any available";
  const isToday=dayIndex===0;
  if(!anySelected && isToday && stylist.availableToday===false) return true;
  if(anySelected){
    const realStaff=(salon.stylists||[]).filter(st=>st.name!=="Any available" && (!isToday || st.availableToday!==false));
    if(realStaff.length) return realStaff.every(st=>staffUnavailableInCloud(salon,st.id,slotStart,slotEnd));
    const bufferMs=Math.max(0,Number(salon.bufferTime||0))*60000;
    const genericBooked=(salon.cloudBookedSlots||[]).some(b=>{
      if(b.stylist_id) return false;
      const bs=new Date(b.starts_at),be=new Date(bs.getTime()+Number(b.duration_minutes||30)*60000);
      return intervalOverlaps(slotStart,new Date(slotEnd.getTime()+bufferMs),bs,new Date(be.getTime()+bufferMs));
    });
    const allBlock=(salon.cloudBlockouts||[]).some(bo=>bo.all_staff&&intervalOverlaps(slotStart,slotEnd,new Date(bo.starts_at),new Date(bo.ends_at)));
    return genericBooked||allBlock;
  }
  return staffUnavailableInCloud(salon,stylist.id,slotStart,slotEnd);
}
function availableTimeSlots(salon,dayIndex,stylist,durationMins){ return timeSlotsForSalon(salon,dayIndex,durationMins).filter(t=>!isTimeBlocked(salon,dayIndex,stylist,t,durationMins)); }
function selectedAddonsList(){
  if (!state.service || !state.service.addons) return [];
  return state.service.addons.filter(a=>state.selectedAddons.includes(a.id));
}
function selectedAddonsTotal(){
  return selectedAddonsList().reduce((sum,a)=>sum+a.price,0);
}
function baseTotal(){
  if (!state.service) return 0;
  return state.service.price + selectedAddonsTotal();
}
function promoDiscount(){
  if (!state.appliedPromo) return 0;
  const p = state.appliedPromo;
  const subtotal = baseTotal();
  const raw = p.type === "percent" ? Math.round((subtotal * p.value / 100) * 100) / 100 : Number(p.value||0);
  return Math.max(0,Math.min(raw, subtotal));
}
function loyaltyDiscount(){
  if (!state.appliedLoyaltyReward) return 0;
  const remaining = Math.max(0, baseTotal() - promoDiscount());
  return Math.max(0, Math.min(Number(state.appliedLoyaltyReward.value||0), remaining));
}
function finalTotal(){
  return baseTotal() - promoDiscount() - loyaltyDiscount();
}
function loyaltyPointsForThisBooking(){
  if (!state.loyaltyAccount || !state.loyaltyAccount.pointsPerDollar) return 0;
  return Math.max(0, Math.round(finalTotal() * state.loyaltyAccount.pointsPerDollar));
}

const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function formatTime12(hhmm){
  const [h,m] = hhmm.split(":").map(Number);
  const period = h>=12 ? "PM" : "AM";
  let h12 = h%12; if (h12===0) h12=12;
  return `${h12}:${String(m).padStart(2,"0")} ${period}`;
}
function nzNowInfo(){
  const o={};
  new Intl.DateTimeFormat("en-CA",{timeZone:NZ_TIME_ZONE,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;});
  return {dayIndex:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(o.weekday),minutes:Number(o.hour)*60+Number(o.minute)};
}
function getSalonOpenStatus(salon){
  const now=nzNowInfo();
  const todayIdx=now.dayIndex;
  const todayHours=customerDayHours(salon,todayIdx);
  let isOpenNow=false;
  let minutesUntilClose=null;
  if(todayHours){
    const openMins=parseTimeMins(todayHours.start), closeMins=parseTimeMins(todayHours.end);
    isOpenNow=now.minutes>=openMins&&now.minutes<closeMins;
    if(isOpenNow) minutesUntilClose=closeMins-now.minutes;
  }
  return {
    isOpenNow,
    minutesUntilClose,
    todayName:DAY_NAMES[todayIdx],
    todayHoursLabel:todayHours?`${formatAnyTime12(todayHours.start)} – ${formatAnyTime12(todayHours.end)}`:"Closed today",
  };
}
function nextOpenLabel(salon){
  const now=nzNowInfo();
  const todayHours=customerDayHours(salon,now.dayIndex);
  if(todayHours&&now.minutes<parseTimeMins(todayHours.start)) return `Opens today at ${formatAnyTime12(todayHours.start)}`;
  const today=nzTodayKey();
  for(let i=1;i<=7;i++){
    const d=dateFromNzKey(addDaysToDateKey(today,i));
    const idx=nzDayIndex(d),h=customerDayHours(salon,idx);
    if(h){
      const label=i===1?"tomorrow":DAY_NAMES[idx];
      return `Opens ${label} at ${formatAnyTime12(h.start)}`;
    }
  }
  return "";
}
function venueStatusLine(salon,status){
  if(status.isOpenNow){
    const now=nzNowInfo();
    const todayHours=customerDayHours(salon,now.dayIndex);
    return todayHours?`Open until ${formatAnyTime12(todayHours.end)}`:"Open";
  }
  const next=nextOpenLabel(salon);
  return next?`Closed · ${next}`:"Closed";
}

function finishServiceDetailClose(afterClose){
  clearTimeout(serviceDetailCloseTimer);
  document.getElementById("serviceDetailSheet")?.remove();
  document.getElementById("serviceDetailOverlay")?.remove();
  activeServiceDetailId=null;
  if(typeof afterClose==="function") afterClose();
}
function closeServiceDetailSheet(afterClose,animated=true){
  const sheet=document.getElementById("serviceDetailSheet");
  const overlay=document.getElementById("serviceDetailOverlay");
  if(!sheet){ finishServiceDetailClose(afterClose); return; }
  if(!animated){ finishServiceDetailClose(afterClose); return; }
  if(sheet.classList.contains("closing")) return;
  sheet.classList.add("closing");
  overlay?.classList.add("closing");
  serviceDetailCloseTimer=setTimeout(()=>finishServiceDetailClose(afterClose),250);
}
function openServiceDetailSheet(service){
  if(!service) return;
  if(document.getElementById("homeMenuCard")) closeHomeMenuSheet(null,false);
  finishServiceDetailClose();
  const shell=document.querySelector(".shell");
  if(!shell) return;
  activeServiceDetailId=String(service.id);
  shell.insertAdjacentHTML("beforeend",serviceDetailSheetMarkup(service));
  const closeBtn=document.getElementById("closeServiceDetail");
  const overlay=document.getElementById("serviceDetailOverlay");
  const bookBtn=document.getElementById("serviceDetailBookBtn");
  closeBtn?.addEventListener("click",()=>closeServiceDetailSheet());
  overlay?.addEventListener("click",()=>closeServiceDetailSheet());
  bookBtn?.addEventListener("click",()=>closeServiceDetailSheet(()=>{
    rememberVenueScroll();
    goCheckout(service,"salon");
  }));
}
function bindSalonServiceButtons(scope=document){
  scope.querySelectorAll("[data-service]").forEach(btn=>{
    if(btn.dataset.boundService==="1") return;
    btn.dataset.boundService="1";
    btn.addEventListener("click",(event)=>{
      event.stopPropagation();
      const service=state.salon?.services?.find(s=>String(s.id)===btn.getAttribute("data-service"));
      if(!service) return;
      rememberVenueScroll();
      goCheckout(service,"salon");
    });
  });
  scope.querySelectorAll("[data-service-row]").forEach(row=>{
    if(row.dataset.boundServiceRow==="1") return;
    row.dataset.boundServiceRow="1";
    const open=()=>{
      const service=state.salon?.services?.find(s=>String(s.id)===row.getAttribute("data-service-row"));
      if(service) openServiceDetailSheet(service);
    };
    row.addEventListener("click",open);
    row.addEventListener("keydown",(event)=>{
      if(event.key==="Enter"||event.key===" "){event.preventDefault();open();}
    });
  });
}
function updateSalonCategory(category){
  state.salonCategory=category;
  document.querySelectorAll("[data-salcat]").forEach(btn=>btn.classList.toggle("active",btn.getAttribute("data-salcat")===category));
  const section=document.getElementById("salonServicesSection");
  if(section&&state.salon){
    section.innerHTML=salonServicesMarkup(state.salon,category);
    bindSalonServiceButtons(section);

}

  const services = state.salonCategory==="All" ? salon.services : salon.services.filter(s=>s.category===state.salonCategory);
  const pickedService = services.find(s=>s.id===state.selectedServiceId) || salon.services.find(s=>s.id===state.selectedServiceId);
  return `
    <div class="page checkout-shell service-select-shell">
      <div class="topbar"><div style="display:flex;align-items:center;gap:12px;min-width:0;"><button class="backbtn" id="backBtn" aria-label="Go back">${icon('chevronLeft','var(--ink)')}</button><h1 class="toptitle">Choose a service</h1></div></div>

function galleryTileArea(posInGroup,groupSize,mirrored){
  if (groupSize===1) return {col:'1', row:'1'};
  if (groupSize===2) return {col:String(posInGroup+1), row:'1'};
  if (!mirrored){
    if (posInGroup===0) return {col:'1', row:'1 / span 2'};
    if (posInGroup===1) return {col:'2', row:'1'};
    return {col:'2', row:'2'};
  }
  if (posInGroup===0) return {col:'1', row:'1'};
  if (posInGroup===1) return {col:'1', row:'2'};
  return {col:'2', row:'1 / span 2'};
}
function galleryGroupMarkup(groupTiles,groupStartIndex,mirrored,photos,salon){
  const cols = groupTiles.length===3 ? (mirrored?'1fr 2fr':'2fr 1fr') : groupTiles.length===2 ? '1fr 1fr' : '1fr';
  const rows = groupTiles.length===3 ? '260px 260px' : '260px';
  return `
  <div class="gallery-group" style="--gallery-group-cols:${cols};--gallery-group-rows:${rows};">
    ${groupTiles.map((tile,pos)=>{
      const globalIndex = groupStartIndex+pos;
      const area = galleryTileArea(pos,groupTiles.length,mirrored);
      return `
      <div class="gallery-tile" style="height:220px;flex-shrink:0;border-radius:18px;position:relative;overflow:hidden;background:${photos ? 'var(--purple-pastel-2)' : `linear-gradient(135deg, ${tile[0]}, ${tile[1]})`};grid-column:${area.col};grid-row:${area.row};">
        ${photos ? `<img src="${escapeAttr(tile)}" alt="${escapeAttr(salon.name)} photo ${globalIndex+1}" style="width:100%;height:100%;object-fit:cover;display:block;">` : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);">${bigIcon(salon.icon,96)}</div>`}
      </div>`;
    }).join("")}
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatPreferences(items){
  return (items || []).map((item,index)=>{
    const text = String(item || "").trim();
    if (!text) return "";
    if (index === 0) return escapeHtml(text);
    return escapeHtml(text.charAt(0).toLowerCase() + text.slice(1));
  }).filter(Boolean).join(", ");
}

const scrollPositions = {};
let homeSearchRenderTimer = null;
let citySearchRenderTimer = null;

function saveScrollPositions(){
  document.querySelectorAll("[data-scrollkey]").forEach(el=>{
    scrollPositions[el.getAttribute("data-scrollkey")] = el.scrollLeft;
  });
}
function restoreScrollPositions(){
  document.querySelectorAll("[data-scrollkey]").forEach(el=>{
    const key = el.getAttribute("data-scrollkey");
    if (scrollPositions[key] != null) el.scrollLeft = scrollPositions[key];
  });
}

function primeVenueMap(){
  if(state.page!=="salon") return;
  const iframe=document.querySelector(".map-embed");
  if(!iframe) return;

  // Android/Chrome can download an eager off-screen Google Maps iframe but defer
  // its first proper viewport paint until it nears the screen. Nudging its rendered
  // dimensions forces Google's internal map to receive resize/paint work now, while
  // keeping the same iframe and src (so there is no reload or flicker).
  const nudge=()=>{
    if(!iframe.isConnected) return;
    iframe.style.width="calc(100% + 221px)";
    iframe.style.height="calc(100% + 221px)";
    void iframe.offsetWidth;
    requestAnimationFrame(()=>{
      if(!iframe.isConnected) return;
      iframe.style.width="calc(100% + 220px)";
      iframe.style.height="calc(100% + 220px)";
      void iframe.offsetWidth;
    });
  };

  requestAnimationFrame(nudge);
  setTimeout(nudge,180);
  setTimeout(nudge,650);
  setTimeout(nudge,1400);
}

function render(opts){
  opts = opts || {};
  const activeBefore=opts.samePage?document.activeElement:null;
  const activeId=activeBefore?.id||"";
  const activeSelection=(activeBefore && typeof activeBefore.selectionStart==="number")?{start:activeBefore.selectionStart,end:activeBefore.selectionEnd}:null;
  saveScrollPositions();
  const pageEl = document.querySelector(".page");
  const prevScrollTop = pageEl ? pageEl.scrollTop : 0;
  const checkoutBodyEl = document.getElementById("checkoutBody");
  const prevCheckoutScrollTop = checkoutBodyEl ? checkoutBodyEl.scrollTop : 0;
  const root = document.getElementById("app");
  if(!state.marketplaceReady || !state.authReady){
    document.title = "Blooma";
    root.innerHTML = `<div class="shell"><div class="page" style="background:var(--bg);"><div class="home-topbar"><span class="brand-logo">Blooma</span><span class="menu-btn" style="visibility:hidden;">${icon('menu')}</span></div><div style="padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px;"><div style="height:112px;border-radius:18px;background:var(--purple-pastel-2);"></div><div style="height:112px;border-radius:18px;background:var(--purple-pastel-2);opacity:.72;"></div><div style="height:112px;border-radius:18px;background:var(--purple-pastel-2);opacity:.5;"></div></div></div></div>`;
    return;
  }
  document.title = (state.page==="salon" && state.salon) ? `${state.salon.name} — Blooma` : "Blooma";
  let html = "";
  if (state.page === "home") html = renderHome();
  else if (state.page === "salon") html = renderSalon();
  else if (state.page === "serviceSelect") html = renderServiceSelect();
  else if (state.page === "checkout") html = renderCheckout();
  else if (state.page === "stylist") html = renderStylistProfile();
  else if (state.page === "stylistGallery") html = renderStylistPortfolioGallery();
  else if (state.page === "gallery") html = renderGallery();
  else if (state.page === "reviews") html = renderReviews();
  else if (state.page === "history") html = renderHistory();
  else if (state.page === "profile") html = renderProfile();

  root.innerHTML = `<div class="shell">${html}${renderConfirmModal()}${renderWaitlistModal()}</div>`;
  restoreScrollPositions();
  const newPageEl = document.querySelector(".page");
  if (newPageEl){
    if (opts.restoreScrollTop != null) newPageEl.scrollTop = opts.restoreScrollTop;
    else newPageEl.scrollTop = opts.samePage ? prevScrollTop : 0;
  }
  const newCheckoutBodyEl = document.getElementById("checkoutBody");
  if (newCheckoutBodyEl) newCheckoutBodyEl.scrollTop = opts.samePage ? prevCheckoutScrollTop : 0;
  bindEvents();
  primeVenueMap();
  if((location.protocol==="http:" || location.protocol==="https:") && !history.state?.bloomaUi) replaceCustomerHistoryState();
  if(opts.samePage && activeId){
    const restored=document.getElementById(activeId);
    if(restored){ restored.focus({preventScroll:true}); if(activeSelection && typeof restored.setSelectionRange==="function") restored.setSelectionRange(activeSelection.start,activeSelection.end); }
  }
}

function bindEvents(){
  const shareVenueBtn = document.getElementById("shareVenueBtn");
  if (shareVenueBtn) shareVenueBtn.addEventListener("click", async ()=>{
    const title = shareVenueBtn.getAttribute("data-sharetitle")||"";
    const url = shareVenueBtn.getAttribute("data-shareurl")||"";
    if (navigator.share){
      try{ await navigator.share({ title, url }); }catch(e){ /* user cancelled the native share sheet */ }
      return;
    }
    try{
      await navigator.clipboard.writeText(url);
      alert(`Link copied — share ${title} with: ${url}`);
    }catch(e){ /* clipboard unavailable — nothing more we can do */ }
  });
  document.querySelectorAll("[data-scrollcarousel]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const row = document.getElementById(btn.getAttribute("data-scrollcarousel"));
      if (!row) return;
      const dir = Number(btn.getAttribute("data-dir"))||1;
      row.scrollBy({left: dir*row.clientWidth*0.9, behavior:"smooth"});
    });
  });
  // confirm modal — replaces native window.confirm across the app
  document.querySelectorAll("[data-dismissconfirm]").forEach(el=>{
    el.addEventListener("click", ()=> setState({ confirmDialog: null }, { samePage:true }));
  });
  const modalCard = document.querySelector("[data-modalcard]");
  if (modalCard) modalCard.addEventListener("click", e=> e.stopPropagation());
  const globalMenuBtn=document.getElementById("menuBtn");
  if(globalMenuBtn){
    globalMenuBtn.addEventListener("click",()=>{
      if(document.getElementById("homeMenuCard")) closeHomeMenuSheet();
      else openHomeMenuSheet();
    });
  }
  if(document.getElementById("homeMenuCard")) bindHomeMenuSheetControls();

  const confirmActionBtn = document.querySelector("[data-confirmaction]");
  if (confirmActionBtn) confirmActionBtn.addEventListener("click", ()=>{
    const cd = state.confirmDialog;
    if (!cd) return;
    if (cd.actionType==="cancelBooking"){
      performCancelBooking(cd.actionId);
      return;
    }
    setState({ confirmDialog: null }, { samePage:true });
  });

  // waitlist modal
  document.querySelectorAll("[data-dismisswaitlist]").forEach(el=>{
    el.addEventListener("click", ()=> setState({ waitlistModalOpen:false, pendingWaitlistRequestId:null }, { samePage:true }));
  });
  document.querySelectorAll("[data-dismisswaitlistsuccess]").forEach(el=>{
    el.addEventListener("click", ()=> setState({ waitlistSuccess:null }, { samePage:true }));

  document.querySelectorAll("[data-waitlistpref]").forEach(btn=>{
    btn.addEventListener("click", ()=> setState({ waitlistTimePref: btn.getAttribute("data-waitlistpref") }, { samePage:true }));

  const waitlistNameInput = document.getElementById("waitlistNameInput");
  if (waitlistNameInput) waitlistNameInput.addEventListener("input", (e)=>{ state.waitlistName = e.target.value; syncWaitlistBtn(); });
  const waitlistPhoneInput = document.getElementById("waitlistPhoneInput");
  if (waitlistPhoneInput) waitlistPhoneInput.addEventListener("input", (e)=>{ state.waitlistPhone = e.target.value; syncWaitlistBtn(); });
  const submitWaitlistBtn = document.getElementById("submitWaitlistBtn");
  if (submitWaitlistBtn) submitWaitlistBtn.addEventListener("click", async ()=>{
    const contact=bookingContact(); if(contact.name.length<=1||contact.phone.length<=5) return;
    const salon=state.salon,service=state.service; const day=DAYS[state.selectedDay]; const desiredDate=nzDateKey(day);
    if(!state.pendingWaitlistRequestId) state.pendingWaitlistRequestId=makeClientRequestId();
    const entry={id:waitlistCounter++,clientRequestId:state.pendingWaitlistRequestId,salonId:salon.id,salonName:salon.name,serviceId:service.id,serviceName:service.name,stylistId:state.selectedStylist?.name==="Any available"?null:(state.selectedStylist?.id||null),stylistName:state.selectedStylist?.name||"Any available",dayLabel:dayLabel(day),desiredDate,timePref:state.waitlistTimePref,name:contact.name,phone:contact.phone,createdAt:Date.now()};
    submitWaitlistBtn.disabled=true;
    try{ const saved=await createCloudWaitlist(entry); entry.dbId=saved.id||null; entry.publicToken=saved.public_token||null; state.waitlist.push(entry); setState({waitlistModalOpen:false,waitlistSuccess:entry,pendingWaitlistRequestId:null},{samePage:true}); }
    catch(err){ submitWaitlistBtn.disabled=false; alert(err?.message||"We couldn't join the waitlist. Please try again."); }
  });

  if (state.page === "home"){
    const retryMarketplaceBtn=document.getElementById("retryMarketplaceBtn");
    if(retryMarketplaceBtn) retryMarketplaceBtn.addEventListener("click",()=>{ state.marketplaceReady=false; state.marketplaceError=""; render({samePage:true}); loadMarketplaceVenues(); });
    const locBtn = document.getElementById("locationBtn");
    if (locBtn) locBtn.addEventListener("click", ()=> setState({ showCityPicker:true, cityQuery:"" }));
    const overlay = document.getElementById("cityPickerOverlay");
    if (overlay) overlay.addEventListener("click", (e)=>{ if (e.target===overlay) closeCityPickerSheet(); });
    const closeBtn = document.getElementById("closeCityPicker");
    if (closeBtn) closeBtn.addEventListener("click", ()=> closeCityPickerSheet());
    document.querySelectorAll("[data-city]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        closeCityPickerSheet({ city: { name: btn.getAttribute("data-city"), region: btn.getAttribute("data-region") } }, queueCustomerPrefsSave);
      });
    });
    const citySearchInput = document.getElementById("citySearchInput");
    if (citySearchInput){
      citySearchInput.addEventListener("input", (e)=>{
        state.cityQuery = e.target.value;
        clearTimeout(citySearchRenderTimer);
        citySearchRenderTimer=setTimeout(()=>{
          if(state.page==="home"&&state.showCityPicker) render({samePage:true});
        },120);
      });
    }
    const input = document.getElementById("searchInput");
    if (input){
      input.addEventListener("input", (e)=>{
        state.homeQuery = e.target.value;
        clearTimeout(homeSearchRenderTimer);
        homeSearchRenderTimer=setTimeout(()=>{
          if(state.page==="home"&&!state.showCityPicker) render({samePage:true});
        },120);
      });
    }
    document.querySelectorAll("[data-salon]").forEach(card=>{
      card.addEventListener("click", ()=>{
        const salon = SALONS.find(s=>s.id===card.getAttribute("data-salon"));
        goSalon(salon);
      });
    });
    document.querySelectorAll("[data-fav]").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const id = btn.getAttribute("data-fav");
        toggleFavorite(id);
      });
    });
    document.querySelectorAll("[data-filter]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const filter = btn.getAttribute("data-filter");
        if (filter === "All") scrollPositions["home-filter"] = 0;
        setState({ homeFilter: filter }, { samePage:true });
      });
    });
  }

  if (state.page === "history"){
    document.getElementById("backBtn").addEventListener("click", goHome);
    document.querySelectorAll("[data-historyfilter]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({ historyFilter: btn.getAttribute("data-historyfilter"), expandedBookingId:null, calendarSheetEvent:null }, { samePage:true }));
    });
    document.querySelectorAll("[data-bookingtoggle]").forEach(card=>{
      card.addEventListener("click", (e)=>{
        if (e.target.closest("button") || e.target.closest("a")) return;
        const id = parseInt(card.getAttribute("data-bookingtoggle"),10);
        setState({ expandedBookingId: state.expandedBookingId===id ? null : id, calendarSheetEvent:null }, { samePage:true });
      });
    });
    document.querySelectorAll("[data-viewvenue]").forEach(btn=>{
      btn.addEventListener("click", (e)=>{
        e.stopPropagation();
        const salon = SALONS.find(s=>s.id===btn.getAttribute("data-viewvenue"));
        if (salon) goSalon(salon);
      });
    });
    document.querySelectorAll("[data-reschedule]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-reschedule"),10);
        const booking = state.bookings.find(b=>b.id===id);
        const historyPage = document.querySelector(".page");
        state.historyReturnScrollTop = historyPage ? historyPage.scrollTop : 0;
        if (booking) goReschedule(booking);
      });
    });
    document.querySelectorAll("[data-cancel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-cancel"),10);
        cancelBooking(id);
      });
    });
    document.querySelectorAll("[data-opencalendarsheet]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-opencalendarsheet"),10);
        const b = state.bookings.find(x=>x.id===id);
        if (!b) return;
        const salon = SALONS.find(s=>s.id===b.salonId);
        const evt = buildCalendarEvent({
          title: `${b.serviceName} at ${b.salonName}`,
          description: `Booked via Blooma${b.stylistName && b.stylistName!=="Any available"?` with ${b.stylistName}`:""}`,
          location: salon?.address||"",
          startIso: b.date,
          durationMinutes: b.duration,
        });
        setState({ calendarSheetEvent: evt }, { samePage:true });
      });
    });
    bindCalendarSheetControls();
    document.querySelectorAll("[data-leavewaitlist]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id=parseInt(btn.getAttribute("data-leavewaitlist"),10), entry=state.waitlist.find(w=>w.id===id); if(!entry)return;
        try{ await cancelCloudWaitlist(entry); state.waitlist=state.waitlist.filter(w=>w.id!==id); setState({}, {samePage:true}); }catch(err){ alert(err?.message||"We couldn't remove that waitlist entry."); }
      });
    });
    document.querySelectorAll("[data-open-review]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-open-review"),10);
        openReview(id);
      });
    });
    document.querySelectorAll("[data-cancel-review]").forEach(btn=>{
      btn.addEventListener("click", closeReview);
    });
    document.querySelectorAll("[data-star]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const n = parseInt(btn.getAttribute("data-star"),10);
        setState({ reviewDraftRating: n }, { samePage:true });
      });
    });
    const noteInput = document.getElementById("reviewNoteInput");
    if (noteInput){
      noteInput.addEventListener("input", (e)=>{
        state.reviewDraftNote = e.target.value;
        const submitBtn = document.querySelector("[data-submit-review]");
        if (submitBtn) submitBtn.disabled = !state.reviewDraftRating;
      });
    }
    document.querySelectorAll("[data-submit-review]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = parseInt(btn.getAttribute("data-submit-review"),10);
        submitReview(id);
      });
    });
  }

  if (state.page === "profile"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.profileOrigin==="salon" && state.salon) returnToVenue();
      else goHome();
    });
    const phoneInput = document.getElementById("profilePhoneInput");
    if (phoneInput) phoneInput.addEventListener("input", (e)=>{ state.profile.phone = e.target.value; });
    const profileSaveBtn = document.getElementById("profileSaveBtn");
    if (profileSaveBtn) profileSaveBtn.addEventListener("click", async ()=>{
      profileSaveBtn.disabled = true;
      profileSaveBtn.textContent = "Saving…";
      try{
        if (customerSupabaseClient && state.authenticated && state.authUserId){
          const phone=(state.profile.phone||"").trim(); const {error}=await customerSupabaseClient.from("user_profiles").update({phone,updated_at:new Date().toISOString()}).eq("user_id",state.authUserId); if(error) throw error; await customerSupabaseClient.auth.updateUser({data:{phone}}); state.phone=phone;
        }
        profileSaveBtn.textContent = "Saved";
      }catch(err){
        profileSaveBtn.textContent = "Try again";
      }
      setTimeout(()=>{ profileSaveBtn.textContent = "Save changes"; profileSaveBtn.disabled = false; }, 1200);
    });
    const profileLogoutBtn = document.getElementById("profileLogoutBtn");
    if (profileLogoutBtn) profileLogoutBtn.addEventListener("click", async ()=>{
      profileLogoutBtn.disabled = true;
      profileLogoutBtn.textContent = "Logging out…";
      try{ if (customerSupabaseClient) await customerSupabaseClient.auth.signOut(); }catch(e){}
      state.authenticated=false; state.authUserId=null; state.accountType=null; state.hasVenue=false;
      window.location.href = (location.protocol === "http:" || location.protocol === "https:") ? "/" : "https://blooma.co.nz/";
    });
  }

  if (state.page === "salon"){
    document.getElementById("backBtn").addEventListener("click", goHome);
    document.querySelectorAll("[data-fav]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-fav");
        toggleFavorite(id);
      });
    });
    const carousel = document.querySelector(".hero-carousel");
    if (carousel){
      let heroScrollFrame=0;
      carousel.addEventListener("scroll", ()=>{
        if(heroScrollFrame) return;
        heroScrollFrame=requestAnimationFrame(()=>{
          heroScrollFrame=0;
          const idx=Math.round(carousel.scrollLeft / Math.max(1,carousel.clientWidth));
          document.querySelectorAll("#heroDots .hero-dot").forEach((d,i)=>d.classList.toggle("active",i===idx));
        });
      },{passive:true});
    }
    document.querySelectorAll("[data-gallery]").forEach(btn=>{
      btn.addEventListener("click", ()=> goGallery(state.salon));
    });
    document.querySelectorAll("[data-reviews]").forEach(btn=>{
      btn.addEventListener("click", ()=> goReviews(state.salon));
    });
    document.querySelectorAll("[data-salcat]").forEach(btn=>{
      btn.addEventListener("click", ()=> updateSalonCategory(btn.getAttribute("data-salcat")));
    });
    bindSalonServiceButtons();
    const venueBookNowBtn = document.getElementById("venueBookNowBtn");
    if (venueBookNowBtn) venueBookNowBtn.addEventListener("click", goServiceSelect);
    const venueBookNowBtnDesktop = document.getElementById("venueBookNowBtnDesktop");
    if (venueBookNowBtnDesktop) venueBookNowBtnDesktop.addEventListener("click", goServiceSelect);
    document.querySelectorAll("[data-stylistprofile]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const stylist = state.salon.stylists.find(st=>st.id===btn.getAttribute("data-stylistprofile"));
        if (stylist) goStylistProfile(stylist);
      });
    });
  }

  if (state.page === "serviceSelect"){
    document.getElementById("backBtn").addEventListener("click", ()=> returnToVenue());
    document.querySelectorAll("[data-servicecat]").forEach(btn=>btn.addEventListener("click", ()=>setState({ salonCategory:btn.getAttribute("data-servicecat") }, { samePage:true })));
    document.querySelectorAll("[data-pickservice]").forEach(btn=>btn.addEventListener("click", ()=>{ setState({ selectedServiceId: btn.getAttribute("data-pickservice") }, { samePage:true }); }));
    const serviceContinueBtn = document.getElementById("serviceContinueBtn");
    if (serviceContinueBtn) serviceContinueBtn.addEventListener("click", ()=>{
      const service = state.salon.services.find(s=>s.id===state.selectedServiceId);
      if (service) goCheckout(service, "serviceSelect");
    });
  }

  if (state.page === "checkout"){
    if (state.done){
      document.getElementById("backHomeBtn").addEventListener("click", goHome);
      const addToCalendarBtn = document.getElementById("addToCalendarBtn");
      if (addToCalendarBtn) addToCalendarBtn.addEventListener("click", ()=>{
        const evt = buildCalendarEvent({
          title: `${state.service.name} at ${state.salon.name}`,
          description: `Booked via Blooma${state.selectedStylist && !isAnyAvailableStylist(state.selectedStylist) ? ` with ${state.selectedStylist.name}` : ""}`,
          location: state.salon.address,
          startIso: bookingStartIso(state.selectedDay, state.selectedTime),
          durationMinutes: state.service.duration,
        });
        setState({ calendarSheetEvent: evt }, { samePage:true });
      });
      bindCalendarSheetControls();
      return;
    }
    const stepKeys = checkoutStepKeys(state.service);
    const stepKey = stepKeys[state.step] || "confirm";
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.checkoutOrigin === "history" && state.step === stepKeys.indexOf("time")){
        setState({ page:"history", checkoutOrigin:null, rescheduleBookingId:null }, { restoreScrollTop: state.historyReturnScrollTop || 0 });
      } else if (state.step===0){
        if (state.checkoutOrigin === "serviceSelect") {
          setState({ page:"serviceSelect", checkoutOrigin:null });
        } else {
          returnToVenue({ checkoutOrigin:null });
        }
      } else {
        setState({ step: state.step-1 });
      }
    });

    if (stepKey==="addons"){
      document.querySelectorAll("[data-addon]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-addon");
          const addons = state.selectedAddons.includes(id)
            ? state.selectedAddons.filter(a=>a!==id)
            : [...state.selectedAddons, id];
          setState({ selectedAddons: addons }, { samePage:true });
        });
      });
    }

    if (stepKey==="stylist"){
      document.querySelectorAll("[data-stylist]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const stylist = state.salon.stylists.find(st=>st.id===btn.getAttribute("data-stylist"));
          if (!stylist) return;
          setState({ selectedStylist: stylist }, { samePage:true });
        });
      });
    }

    if (stepKey==="time"){
      document.querySelectorAll("[data-day]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ selectedDay: parseInt(btn.getAttribute("data-day"),10), selectedTime:null }, { samePage:true }));
      });
      document.querySelectorAll("[data-time]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ selectedTime: btn.getAttribute("data-time") }, { samePage:true }));
      });
      const openWaitlist = ()=>{ const c=bookingContact(); setState({ waitlistModalOpen:true, waitlistName:c.name, waitlistPhone:c.phone, waitlistTimePref:"Any", pendingWaitlistRequestId:null }, { samePage:true }); };
      const joinWaitlistBtn = document.getElementById("joinWaitlistBtn");
      if (joinWaitlistBtn) joinWaitlistBtn.addEventListener("click", openWaitlist);
      const joinWaitlistLink = document.getElementById("joinWaitlistLink");
      if (joinWaitlistLink) joinWaitlistLink.addEventListener("click", openWaitlist);
    }

    if (stepKey==="details"){
      const nameInput = document.getElementById("nameInput");
      const phoneInput = document.getElementById("phoneInput");
      const guestEmailInput = document.getElementById("guestEmailInput");
      const notesInput = document.getElementById("notesInput");
      if (nameInput) nameInput.addEventListener("input", (e)=>{ state.name = e.target.value; syncContinueBtn(); });
      if (phoneInput) phoneInput.addEventListener("input", (e)=>{ state.phone = e.target.value; syncContinueBtn(); });
      if (guestEmailInput) guestEmailInput.addEventListener("input", (e)=>{ state.guestEmail = e.target.value; syncContinueBtn(); });
      if (notesInput) notesInput.addEventListener("input", (e)=>{ state.notes = e.target.value; });
      document.querySelectorAll("[data-notechip]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const phrase = btn.getAttribute("data-notechip");
          const selected = state.selectedNotes.includes(phrase)
            ? state.selectedNotes.filter(p=>p!==phrase)
            : [...state.selectedNotes, phrase];
          setState({ selectedNotes: selected }, { samePage:true });
        });
      });
    }

    if (stepKey==="confirm"){
      const promoInput = document.getElementById("promoInput");
      if (promoInput){
        promoInput.addEventListener("input", (e)=>{ state.promoCode = e.target.value; });
        promoInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter"){ e.preventDefault(); applyPromoCode(); } });
      }
      const applyBtn = document.getElementById("applyPromoBtn");
      if (applyBtn) applyBtn.addEventListener("click", applyPromoCode);
      const removeBtn = document.getElementById("removePromoBtn");
      if (removeBtn) removeBtn.addEventListener("click", ()=>{
        setState({ appliedPromo:null, promoCode:"", promoError:"" }, { samePage:true });
      });
      const openLoyaltyBtn = document.getElementById("openLoyaltySheet");
      if (openLoyaltyBtn) openLoyaltyBtn.addEventListener("click", ()=>{ setState({ showLoyaltySheet:true }, { samePage:true }); });
      const removeLoyaltyBtn = document.getElementById("removeLoyaltyBtn");
      if (removeLoyaltyBtn) removeLoyaltyBtn.addEventListener("click", ()=>{ setState({ appliedLoyaltyReward:null }, { samePage:true }); });
      const loyaltyOverlay = document.getElementById("loyaltySheetOverlay");
      if (loyaltyOverlay) loyaltyOverlay.addEventListener("click", ()=>closeLoyaltySheetEl());
      const closeLoyaltyBtn = document.getElementById("closeLoyaltySheet");
      if (closeLoyaltyBtn) closeLoyaltyBtn.addEventListener("click", ()=>closeLoyaltySheetEl());
      const applyLoyaltyBtn = document.getElementById("applyLoyaltyBtn");
      if (applyLoyaltyBtn) applyLoyaltyBtn.addEventListener("click", ()=>{
        const L = state.loyaltyAccount;
        if (!L) return;
        state.appliedLoyaltyReward = { label: L.rewardText, value: Number(L.rewardValue||0) };
        closeLoyaltySheetEl(()=>render({samePage:true}));
      });
    }

    const continueBtn = document.getElementById("continueBtn");
    continueBtn.addEventListener("click", async ()=>{
      if (state.step < stepKeys.length-1){
        setState({ step: state.step+1, bookingError:"" });
        pushCustomerHistoryState();
      } else {
        continueBtn.disabled=true; continueBtn.textContent="Checking…";
        try{ await loadMarketplaceVenues(); }catch(e){}
        const latestSalon=SALONS.find(s=>s.id===state.salon?.id);
        const latestService=latestSalon?.services?.find(s=>s.id===state.service?.id);
        if(!latestSalon || !latestService){
          state.bookingSaving=false;
          setState({bookingError:"This service is no longer available. Please choose a service again."},{samePage:true});
          return;
        }
        state.salon=latestSalon; state.service=latestService;
        state.selectedAddons=state.selectedAddons.filter(id=>(latestService.addons||[]).some(a=>a.id===id));
        const latestStylist=(latestSalon.stylists||[]).find(st=>st.id===state.selectedStylist?.id);
        if(state.selectedStylist?.name!=="Any available" && !latestStylist){
          state.selectedStylist=null;
          setState({step:checkoutStepKeys(latestService).indexOf("stylist"),selectedTime:null,bookingError:"That stylist is no longer available. Please choose a stylist again."},{samePage:true});
          return;
        }
        if(latestStylist) state.selectedStylist=latestStylist;
        if(!state.selectedTime || isTimeBlocked(latestSalon,state.selectedDay,state.selectedStylist,state.selectedTime,latestService.duration)){
          setState({step:checkoutStepKeys(latestService).indexOf("time"),selectedTime:null,bookingError:"That appointment time is no longer available. Please choose another time."},{samePage:true});
          return;
        }
        const contact = bookingContact();
        const booking = {
          id: bookingCounter++,
          salonId: state.salon.id,
          salonName: state.salon.name,
          salonIcon: state.salon.icon,
          serviceId: state.service.id,
          serviceName: state.service.name,
          stylistId: state.selectedStylist.id,
          stylistName: state.selectedStylist.name,
          date: bookingStartIso(state.selectedDay,state.selectedTime),
          dateLabel: dayLabel(DAYS[state.selectedDay]),
          time: state.selectedTime,
          duration: state.service.duration,
          price: finalTotal(),
          subtotal: baseTotal(),
          promoCode: state.appliedPromo ? state.appliedPromo.code : null,
          discount: promoDiscount() + loyaltyDiscount(),
          addons: selectedAddonsList(),
          name: contact.name,
          phone: contact.phone,
          email: contact.email,
          notes: state.appliedLoyaltyReward ? `${state.notes ? state.notes+" " : ""}[Loyalty reward redeemed: ${state.appliedLoyaltyReward.label}]`.trim() : state.notes,
          preferences: state.selectedNotes,
          status: "upcoming",
        };
        if(contact.name.length<2 || contact.phone.length<6){
          setState({bookingError:"Your account is missing a valid name or mobile number. Update your Profile and try again."},{samePage:true});
          return;
        }
        continueBtn.disabled=true; continueBtn.textContent="Confirming…"; state.bookingSaving=true; state.bookingError="";
        try{
          if(state.checkoutOrigin==="history"&&state.rescheduleBookingId){
            const original=state.bookings.find(b=>b.id===state.rescheduleBookingId); const saved=await rescheduleCloudBooking(original,booking);
            Object.assign(original,booking); applyCanonicalBookingResult(original,saved); original.stylistName=(SALONS.find(s=>s.id===booking.salonId)?.stylists||[]).find(st=>st.id===saved.stylist_id)?.name||booking.stylistName; if(saved.stylist_id){ const assigned=(state.salon?.stylists||[]).find(st=>st.id===saved.stylist_id); if(assigned) state.selectedStylist=assigned; }
          }else{
            if(!state.pendingBookingRequestId) state.pendingBookingRequestId=makeClientRequestId(); booking.clientRequestId=state.pendingBookingRequestId;
            const saved=await createCloudBooking(booking); applyCanonicalBookingResult(booking,saved); if(saved.stylist_id){ const st=(state.salon.stylists||[]).find(x=>x.id===saved.stylist_id); if(st){ booking.stylistName=st.name; state.selectedStylist=st; } }
            state.bookings.push(booking); state.pendingBookingRequestId=null;
          }
          if(state.appliedLoyaltyReward && customerSupabaseClient){
            try{ await customerSupabaseClient.rpc("redeem_loyalty_reward",{p_salon_id:state.salon.id}); }
            catch(redeemErr){ console.warn("Loyalty redemption could not be recorded",redeemErr); }
          }
          state.bookingSaving=false; setState({done:true,bookingError:""}); await loadMarketplaceVenues();
        }catch(err){ state.bookingSaving=false; setState({bookingError:err?.message||"We couldn't save this booking. Please try again."},{samePage:true}); }
      }
    });
  }

  if (state.page === "stylist"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      returnToVenue({ stylistProfile:null });
    });
    const ctaBtn = document.getElementById("backBtnCta");
    if (ctaBtn){
      ctaBtn.addEventListener("click", ()=>{
        returnToVenue({ stylistProfile:null });
      });
    }
    document.querySelectorAll("[data-stylistgallery]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({ page:"stylistGallery" }));
    });
  }

  if (state.page === "stylistGallery"){
    document.getElementById("backBtn").addEventListener("click", ()=> setState({ page:"stylist" }));
  }

  if (state.page === "gallery"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.salon) returnToVenue({ gallerySalon:null });
      else setState({ page:"home", gallerySalon:null });
    });
  }

  if (state.page === "reviews"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.salon) returnToVenue({ reviewSalon:null });
      else setState({ page:"home", reviewSalon:null });
    });
  }
}

function syncContinueBtn(){
  const contact=bookingContact();
  const canContinueDetails = isLoggedInCustomer() ? (contact.name.length > 1 && contact.phone.length > 5) : (contact.name.length > 1 && contact.phone.length > 5 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.guestEmail.trim()));
  const btn = document.getElementById("continueBtn");
  if (btn) btn.disabled = !canContinueDetails;
}

function syncWaitlistBtn(){ const c=bookingContact(); const btn=document.getElementById("submitWaitlistBtn"); if(btn) btn.disabled=!(c.name.length>1&&c.phone.length>5); }

render();
loadMarketplaceVenues(true);
loadCustomerAuth();
let marketplaceRefreshBusy=false;
async function refreshMarketplaceData(){
  // Keep an open venue page completely stable. The marketplace loader calls render()
  // internally, which would destroy/recreate the Google Maps iframe and cause flicker.
  if(marketplaceRefreshBusy || document.hidden || state.page==="salon") return;
  marketplaceRefreshBusy=true;
  try{
    await loadMarketplaceVenues();
    if(state.salon){
      const live=SALONS.find(s=>s.id===state.salon.id);
      if(live) state.salon=live;
    }
    if(["home"].includes(state.page)) render({samePage:true});
  }catch(err){
    console.warn("Blooma marketplace refresh failed",err);
  }finally{ marketplaceRefreshBusy=false; }
}
window.addEventListener("focus",refreshMarketplaceData);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshMarketplaceData(); });
setInterval(refreshMarketplaceData,15000);

window.addEventListener("popstate",(event)=>{
  if(restoreCustomerHistoryState(event.state)) return;
  const slug=requestedVenueSlug();
  if(slug){
    const salon=findSalonByPublicSlug(slug);
    if(salon){ goSalon(salon,{updateUrl:false}); replaceCustomerHistoryState(); return; }
  }
  goHome({updateUrl:false});
  replaceCustomerHistoryState();
});
if(customerSupabaseClient){
  customerSupabaseClient.auth.onAuthStateChange((event)=>{
    if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="USER_UPDATED") loadCustomerAuth();
  });
}
</script>
</body>
</html>
