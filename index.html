<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no, address=no, email=no" />
<title>Salon Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F33;
    --ink-soft:#8A80AD;
    --ink-mute:#6B6285;
    --purple:#7C5CD9;
    --purple-dark:#6D4DC7;
    --purple-pastel:#F1ECFB;
    --purple-pastel-2:#F3EEFC;
    --border:#EFECF9;
    --border-2:#E9E4F7;
    --border-hover:#C9BBEF;
    --bg:#FAF9FD;
    --white:#FFFFFF;
    --placeholder:#B3ABCB;
    --disabled:#DED4F5;
    --gold:#F5A623;
    --near-black:#000000;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    overscroll-behavior-x:none;
  }
  button{
    font-family:inherit;cursor:pointer;touch-action:manipulation;
    -webkit-appearance:none;appearance:none;
    -webkit-tap-highlight-color:transparent;
    outline:none;margin:0;background:none;border:none;padding:0;
  }
  a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;}
  a:visited,a:active,a:hover,a:focus{color:inherit;text-decoration:none;}
  input,textarea{font-family:inherit;max-width:100%;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  html,body,#app{height:100%;min-height:100%;}
  #app{width:100%;min-width:0;display:flex;justify-content:center;background:var(--bg);}
  .shell{width:100%;max-width:none;height:100dvh;min-height:0;position:relative;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  .page{height:auto;flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;overflow-anchor:none;-ms-overflow-style:none;scrollbar-width:none;}
  .page::-webkit-scrollbar{display:none;}
  @supports not (height:100dvh){.shell{height:100vh;}}
  @media (min-width:640px){
    #app{padding:24px 0;}
    .shell{max-width:480px;height:calc(100dvh - 48px);border-radius:24px;box-shadow:0 18px 60px rgba(36,31,51,.10);}
  }
  .page.no-scroll{overflow:hidden;}

  /* icons (inline SVG helpers) sized via span wrapper */
  .icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .icon-star{position:relative;top:-1px;}

  .chip{
    min-height:38px;padding:7px 16px;border-radius:9999px;font-size:14px;font-weight:600;
    border:1px solid var(--border-2);background:var(--white);color:var(--ink);
    white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
    flex:0 0 auto;line-height:20px;display:inline-flex;align-items:center;justify-content:center;
    overflow:hidden;background-clip:padding-box;
  }
  .chip.active{border-color:var(--purple);background:var(--purple);color:#fff;}
  .chip-row{
    display:flex;flex-wrap:nowrap;align-items:center;gap:8px;
    width:100%;min-height:54px;
    overflow-x:auto;overflow-y:hidden;
    overflow-anchor:none;
    scroll-padding-inline:20px;
    padding-top:8px;padding-bottom:8px;
    scrollbar-width:none;
  }
  .chip-row::after{
    content:"";
    flex:0 0 12px;
  }

  .topbar{
    display:flex;align-items:center;justify-content:space-between;padding:16px 20px;
    border-bottom:1px solid var(--border);background:var(--white);
    position:sticky;top:0;z-index:10;
  }
  .backbtn{
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid var(--border-2);background:var(--white);
  }
  .backbtn:hover{background:var(--purple-pastel-2);}
  .toptitle{font-size:15px;font-weight:700;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;gap:16px;}
  .row .label{color:var(--ink-soft);flex-shrink:0;}
  .row .value{font-weight:600;color:var(--ink);text-align:right;}

  .searchbox{
    display:flex;align-items:center;gap:10px;background:var(--white);
    border:1px solid var(--border-2);border-radius:16px;padding:12px 16px;
  }
  .searchbox input{width:100%;background:transparent;border:none;outline:none;font-size:14px;color:var(--ink);}
  .searchbox input::placeholder{color:var(--placeholder);}

  .home-topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;flex-shrink:0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;background:rgba(250,249,253,.92);backdrop-filter:blur(6px);}
  .greeting{padding:18px 20px 0;}
  .greeting h1{font-size:26px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em;}
  .greeting p{font-size:14px;color:var(--ink-soft);margin:4px 0 0;}
  .search-wrap{padding:16px 20px 6px;}
  .brand-logo{display:flex;align-items:center;gap:7px;font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.4px;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0;font-family:inherit;cursor:pointer;}
  .brand-mark{width:26px;height:26px;border-radius:9px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .brand-mark .icon svg{width:15px;height:15px;}
  .menu-btn{
    width:38px;height:38px;border-radius:50%;background:var(--white);color:var(--ink);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border-2);
    transition:background .15s,border-color .15s;
  }
  .menu-btn:hover{background:var(--purple-pastel-2);}
  .menu-btn.active-fav{color:#E0466D;border-color:#F6D2DC;background:#FCEEF2;}
  /* Match the home page's topbar logo/icon-button sizing to the venue page's (v2-brand/v2-icon-btn). */
  body.page-home .brand-logo{font-size:22px;letter-spacing:-.6px;}
  body.page-home .home-topbar{gap:20px;}
  body.page-home .home-topbar>div{gap:10px;}
  body.page-home .menu-btn{width:42px;height:42px;border-radius:50%;}
  body.page-home .location-pill{height:42px;padding:0 14px;}
  /* Match the topbar's height AND horizontal padding to the venue/activity pages, which both
     switch to their desktop layout at 900px (the whole home page's desktop breakpoint below
     was also moved from 1024px to 900px to match, so this lines up with that same cutoff). */
  @media(max-width:899px){ .home-topbar{padding:12px 18px;} }
  @media(min-width:900px){ .home-topbar{padding:18px 32px;} }

  .home-menu-sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:480px;margin:0 auto;
    background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -14px 36px rgba(36,31,51,.14);
    max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:homeMenuSheetUp .22s ease;
    will-change:transform;
  }
  .home-menu-sheet.closing{animation:homeMenuSheetDown .22s ease forwards;pointer-events:none;}
  #homeMenuOverlay{background:rgba(20,10,40,.4);animation:homeMenuOverlayIn .22s ease;}
  #homeMenuOverlay.closing{animation:homeMenuOverlayOut .22s ease forwards;pointer-events:none;}
  @keyframes homeMenuSheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
  @keyframes homeMenuSheetDown{from{transform:translateY(0);}to{transform:translateY(100%);}}
  @keyframes homeMenuOverlayIn{from{opacity:0;}to{opacity:1;}}
  @keyframes homeMenuOverlayOut{from{opacity:1;}to{opacity:0;}}
  .city-picker-sheet{animation:homeMenuSheetUp .22s ease;will-change:transform;}
  .city-picker-sheet.closing{animation:homeMenuSheetDown .22s ease forwards;pointer-events:none;}
  #cityPickerOverlay{animation:homeMenuOverlayIn .22s ease;}
  #cityPickerOverlay.closing{animation:homeMenuOverlayOut .22s ease forwards;pointer-events:none;}
  .home-menu-sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .home-menu-sheet-title{font-size:22px;font-weight:800;color:var(--ink);margin:0;letter-spacing:-.01em;}
  .home-menu-sheet-close{width:32px;height:32px;border-radius:50%;background:var(--purple-pastel-2);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);flex-shrink:0;-webkit-tap-highlight-color:transparent;}
  .home-menu-list{background:var(--white);border:1px solid var(--border-2);border-radius:16px;padding:6px;margin-bottom:14px;}
  .home-menu-row{
    display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:14px 12px;
    border-radius:12px;font-size:15px;font-weight:600;color:var(--ink);transition:background .12s;
    -webkit-tap-highlight-color:transparent;
  }
  .home-menu-row:hover{background:var(--purple-pastel-2);}
  .home-menu-row:active{background:var(--purple);color:#fff;}
  .home-menu-row:active .icon{color:#fff!important;}
  .home-menu-row-left{display:flex;align-items:center;gap:12px;}
  .home-menu-row .icon{color:var(--ink-soft);flex-shrink:0;}
  .home-menu-row.danger{color:#C13B3B;}
  .home-menu-row.danger .icon{color:#C13B3B;}
  .home-menu-row.danger:active{background:var(--purple);color:#fff;}
  .home-menu-row.danger:active .icon{color:#fff!important;}
  .home-menu-divider{height:1px;background:var(--border);margin:6px 4px;}
  /* On wide screens, open the menu as a small dropdown anchored under the hamburger button instead
     of a full-width bottom sheet — matches the Activity page's PC menu treatment. */
  @media(min-width:900px){
    #homeMenuOverlay{background:transparent;}
    .home-menu-sheet{
      left:auto;bottom:auto;right:max(32px,calc((100vw - 1400px)/2 + 32px));top:88px;
      max-width:288px;width:288px;border-radius:18px;padding:10px;
      box-shadow:0 16px 44px rgba(44,31,72,.16),0 2px 8px rgba(44,31,72,.06);
      border:1px solid var(--border-2);
      animation:homeMenuDropdownIn .14s ease;
      transform-origin:top right;
    }
    .home-menu-sheet.closing{animation:homeMenuDropdownOut .12s ease forwards;}
    .home-menu-sheet-header{display:none;}
    .home-menu-list{border:none;padding:0;margin-bottom:0;}
    .home-menu-row{padding:11px 12px;font-size:14px;}
  }
  @keyframes homeMenuDropdownIn{from{transform:scale(.96) translateY(-4px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
  @keyframes homeMenuDropdownOut{from{transform:scale(1) translateY(0);opacity:1;}to{transform:scale(.96) translateY(-4px);opacity:0;}}

  .no-bg-scroll{overflow:hidden!important;}
  /* A standalone bottom sheet (mobile) that becomes a centered modal on wider screens —
     independent of .home-menu-sheet, which instead collapses to a small anchored dropdown
     on desktop (right for the hamburger menu, wrong for a purchase flow). */
  .gc-sheet-overlay{
    position:fixed;inset:0;z-index:150;background:rgba(20,10,40,.45);
    animation:homeMenuOverlayIn .22s ease;
  }
  .gc-sheet-overlay.closing{animation:homeMenuOverlayOut .22s ease forwards;pointer-events:none;}
  .gc-sheet-card{
    position:fixed;left:0;right:0;bottom:0;z-index:151;max-width:480px;margin:0 auto;
    background:var(--bg);border-radius:24px 24px 0 0;box-shadow:0 -14px 36px rgba(36,31,51,.14);
    max-height:88%;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    animation:homeMenuSheetUp .22s ease;will-change:transform;
  }
  .gc-sheet-card.closing{animation:homeMenuSheetDown .22s ease forwards;pointer-events:none;}
  @media(min-width:900px){
    .gc-sheet-card{
      left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);
      max-width:440px;width:92%;border-radius:20px;max-height:85vh;
      animation:gcModalIn .16s ease;
    }
    .gc-sheet-card.closing{animation:gcModalOut .14s ease forwards;}
  }
  @keyframes gcModalIn{from{transform:translate(-50%,-50%) scale(.96);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}
  @keyframes gcModalOut{from{transform:translate(-50%,-50%) scale(1);opacity:1;}to{transform:translate(-50%,-50%) scale(.96);opacity:0;}}

  .location-pill{
    display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;max-width:150px;
    background:var(--white);border:1px solid var(--border-2);font-size:13px;font-weight:700;color:var(--ink);
    transition:background .15s,border-color .15s;-webkit-tap-highlight-color:transparent;
  }
  .location-pill:hover{background:var(--purple-pastel-2);border-color:var(--border-hover);}
  .location-pill .icon{color:var(--purple);flex-shrink:0;}
  .location-pill span.loc-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .cats-wrap{padding:16px 0 6px;}
  .cats-wrap .chip-row{
    padding-left:20px;padding-right:20px;
    -webkit-mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
    mask-image:linear-gradient(to right, black calc(100% - 28px), transparent);
  }
  .cats-wrap .chip-row::after{content:none;}
  @media(max-width:899px){
    .cats-wrap{padding:8px 0 2px;}
    .cats-wrap .chip-row{padding-top:4px;padding-bottom:4px;}
    /* Match the gap below the pills to the gap above them (search bar -> pills is 14px total;
       .venue-featured-section's own 34px margin-top made the gap below the pills much bigger). */
    .upcoming-bookings-section{margin-top:12px!important;}
  }

  .home-promo-banner{display:none;position:relative;background:var(--near-black);border-radius:24px;padding:22px 20px;margin:18px 20px 4px;color:#fff;overflow:hidden;flex-shrink:0;}
  .home-promo-banner::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(circle at 88% 10%, rgba(183,157,245,.28), transparent 55%);
  }
  .home-promo-banner > *{position:relative;z-index:1;}
  .home-promo-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-pastel);margin:0 0 8px;}
  .home-promo-banner h2{color:#fff;font-size:21px;font-weight:800;line-height:1.2;letter-spacing:-.01em;margin:0;max-width:320px;}
  .home-promo-banner p{color:rgba(255,255,255,.65);font-size:12.5px;margin:6px 0 0;max-width:280px;}
  .home-trust-strip{
    display:none;flex-shrink:0;background:var(--white);border:1px solid var(--border);border-radius:16px;
    margin:26px 20px 4px;padding:16px 6px;box-shadow:0 1px 2px rgba(36,31,51,.04),0 10px 24px -18px rgba(36,31,51,.2);
  }
  .home-trust-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 8px;gap:2px;}
  .home-trust-item strong{font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
  .home-trust-item span{font-size:10.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}
  .home-trust-divider{width:1px;background:var(--border);margin:2px 0;}
  .home-trust-item-4,.home-trust-divider-3{display:none;}
  .salon-list{padding:0 20px 32px;display:flex;flex-direction:column;gap:12px;}

  .salon-card{
    text-align:left;background:var(--white);border:1px solid var(--border);border-radius:16px;
    padding:16px;display:flex;align-items:center;gap:14px;transition:border-color .15s,background-color .15s;width:100%;
    cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  }
  .salon-card img{pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .salon-card:focus,.salon-card:active{outline:none;}
  .salon-card:hover{border-color:var(--border-hover);}
  .salon-icon{
    width:56px;height:56px;border-radius:14px;background:var(--purple-pastel-2);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--purple);
  }
  .tag-pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--purple-pastel);color:#5C4B99;font-weight:600;}

  .featured-salon-card{display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:16px;padding:0;width:100%;overflow:hidden;box-shadow:0 1px 2px rgba(36,31,51,.03),0 10px 22px -18px rgba(36,31,51,.18);transition:transform .15s ease,box-shadow .15s ease;}
  .featured-salon-card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(36,31,51,.05),0 16px 28px -16px rgba(36,31,51,.22);}
  .featured-salon-image{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--purple-pastel-2);flex-shrink:0;}
  .featured-salon-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .featured-salon-body{padding:12px 14px 16px;min-width:0;}
  .featured-salon-name{font-weight:700;color:var(--ink);font-size:14.5px;letter-spacing:-.005em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .featured-salon-rating{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:13px;font-weight:600;color:var(--ink);}
  .featured-salon-rating .star-row{display:flex;align-items:center;gap:1px;}
  .featured-salon-rating .star-row .icon svg{width:13px;height:13px;}
  .featured-salon-rating-count{color:var(--ink-soft);font-weight:500;}
  .featured-salon-location,.featured-salon-status{font-size:12.5px;color:var(--ink-soft);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .featured-salon-status.is-open{color:#1E8A4C;font-weight:600;}
  .checkout-summary-strip-time{font-size:12px;color:var(--purple);font-weight:600;margin:4px 0 0;}
  .checkout-day-row{gap:8px;}
  .gallery-group{display:flex;flex-direction:column;gap:16px;}
  .venue-carousel-section{padding:30px 0 0;}
  .venue-carousel-header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:16px;}
  .venue-carousel-header h2{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0;}
  .venue-carousel-arrows{display:none;}
  .venue-carousel-row{display:flex;gap:14px;overflow-x:auto;scroll-behavior:smooth;padding:0 20px 4px;-ms-overflow-style:none;scrollbar-width:none;}
  .venue-carousel-row::-webkit-scrollbar{display:none;}
  .venue-carousel-row .featured-salon-card,.venue-carousel-row .salon-card{width:220px;flex-shrink:0;}
  .venue-featured-section{background:var(--near-black);margin-top:34px;padding:34px 0 38px;}
  .venue-featured-banner{position:relative;max-width:1400px;margin:0 auto;padding:0 20px;color:#fff;overflow:hidden;box-sizing:border-box;}
  .venue-featured-banner > *{position:relative;z-index:1;}
  .venue-dark-row + .venue-dark-row{margin-top:24px;padding-top:24px;border-top:1px solid rgba(255,255,255,.14);}
  .venue-featured-eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-pastel);margin:0 0 6px;}
  .venue-featured-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .venue-featured-title{font-size:19px;font-weight:800;margin:0;line-height:1.3;letter-spacing:-.01em;color:#fff;}
  .venue-featured-arrows{display:none;}
  .carousel-arrow-btn.light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.24);color:#fff;}
  .carousel-arrow-btn.light:hover{background:rgba(255,255,255,.22);}
  .venue-featured-row{display:flex;gap:14px;overflow-x:auto;padding:0 0 4px;-ms-overflow-style:none;scrollbar-width:none;}
  .venue-featured-row::-webkit-scrollbar{display:none;}
  .venue-featured-row .featured-salon-card{width:220px;flex-shrink:0;background:#2A2A2E;border-color:#3A3A40;}
  .venue-featured-row .featured-salon-name{color:#fff;}
  .venue-featured-row .featured-salon-rating{color:#fff;}
  .venue-featured-row .featured-salon-location,
  .venue-featured-row .featured-salon-status{color:#9A97A8;}
  .venue-featured-row .featured-salon-status.is-open{color:#3ED17A;}

  .upcoming-booking-card{display:flex;flex-direction:column;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left;background:#2A2A2E;border:1px solid #3A3A40;border-radius:16px;overflow:hidden;width:220px;flex-shrink:0;}
  .upcoming-booking-image{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;background:var(--purple-pastel-2);}
  .upcoming-booking-image img{width:100%;height:100%;object-fit:cover;display:block;}
  .upcoming-booking-pin{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
  .upcoming-booking-pin:hover{background:rgba(0,0,0,.75);}
  .upcoming-booking-body{padding:12px 14px 14px;min-width:0;}

  /* ============ V2 VENUE PAGE (desktop-style redesign, scoped/prefixed so it never touches existing pages) ============ */

  <script>
  // If Supabase ever falls back to the customer home URL after a venue email
  // confirmation, hand the untouched auth callback to the venue client first.
  (function(){
    try{
      if(!location.hash || !location.hash.includes("access_token=")) return;
      const hp=new URLSearchParams(location.hash.slice(1));
      const token=hp.get("access_token");
      if(!token) return;
      const part=token.split(".")[1];
      if(!part) return;
      const normalized=part.replace(/-/g,"+").replace(/_/g,"/");
      const padded=normalized+"=".repeat((4-normalized.length%4)%4);
      const payload=JSON.parse(decodeURIComponent(Array.from(atob(padded),c=>"%"+c.charCodeAt(0).toString(16).padStart(2,"0")).join("")));
      const accountType=String(payload?.user_metadata?.account_type||"").toLowerCase();
      if(accountType==="venue"){
        location.replace("/business-auth?confirmed=1"+location.hash);
      }
    }catch(e){}
  })();
  </script>

function downloadIcsFile(evt){
  const ics = [

    "BEGIN:VEVENT",
    `UID:${Date.now()}-${Math.random().toString(36).slice(2)}@blooma.co.nz`,

    `DTSTART:${icsDateStamp(evt.start)}`,

    "END:VEVENT","END:VCALENDAR"

  const blob = new Blob([ics], {type:"text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "blooma-appointment.ics";

  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

async function loadMarketplaceVenues(applyRouteAfterLoad=false){
  const hadLiveData=state.marketplaceReady && SALONS.length>0;
  try{
    const res=await fetch(`${MARKETPLACE_SUPABASE_URL}/rest/v1/rpc/get_marketplace_venues`,{
      method:"POST",
      headers:{"apikey":MARKETPLACE_SUPABASE_KEY,"Content-Type":"application/json"},
      body:"{}"
    });
    if(!res.ok) throw new Error(`Marketplace request failed (${res.status})`);
    const rows=await res.json();
    const liveRows=Array.isArray(rows)?rows:[];
    SALONS.splice(0,SALONS.length,...liveRows.map(v=>liveVenueToSalon(v)));
    if(state.salon?.id){
      const previousSalon=state.salon;
      const refreshedSalon=SALONS.find(s=>s.id===previousSalon.id);
      if(!refreshedSalon && previousSalon._cloud){
        Object.assign(state,{page:"home",salon:null,service:null,selectedStylist:null,selectedTime:null,selectedAddons:[],step:0,bookingError:""});
        if(location.protocol!=="file:") history.replaceState({blooma:true},"","/");
      }else if(refreshedSalon){
        state.salon=refreshedSalon;
        if(state.service?.id){
          const refreshedService=(refreshedSalon.services||[]).find(s=>s.id===state.service.id);
          if(refreshedService) state.service=refreshedService;
          else { state.service=null; state.selectedAddons=[]; state.selectedTime=null; state.step=0; if(state.page==="checkout") state.page="salon"; }
        }
        if(state.selectedStylist?.id){
          const refreshedStylist=(refreshedSalon.stylists||[]).find(st=>st.id===state.selectedStylist.id);
          if(refreshedStylist) state.selectedStylist=refreshedStylist;
          else { state.selectedStylist=null; state.selectedTime=null; if(state.page==="checkout") state.step=0; }
        }
      }
    }
    state.marketplaceReady=true;
    state.marketplaceError="";
    if(applyRouteAfterLoad){
      const requested=requestedVenueSlug();
      const found=applyVenueRoute();
      if(requested&&!found){
        if(location.protocol!=="file:") history.replaceState({blooma:true},"","/");
        Object.assign(state,{page:"home",salon:null,salonCategory:"All"});
      }
      if(found && state.page==="salon"){ loadLoyaltyAccount(); loadMyGiftCardsAndPackages(); }
      const purchaseResult = new URLSearchParams(location.search).get("purchase");
      if(purchaseResult==="giftcard-success" || purchaseResult==="package-success"){
        showBloomaToast(purchaseResult==="giftcard-success" ? "Gift card purchased! Check your Profile to see it." : "Package purchased! It'll be ready to use next time you book this service.");
        const cleanUrl=location.pathname; if(location.protocol!=="file:") history.replaceState({blooma:true},"",cleanUrl);
      }
    }
    render({samePage:!applyRouteAfterLoad});
  }catch(err){
    console.warn("Blooma marketplace data could not be refreshed.",err);
    if(!hadLiveData){
      SALONS.splice(0,SALONS.length);
      state.marketplaceReady=true;
      state.marketplaceError=err?.message||"Unable to load venues";
      render({samePage:!applyRouteAfterLoad});
    }else{
      // A transient polling/network failure must never wipe already-loaded Supabase data from the screen.
      state.marketplaceError="";
    }
  }
}

function salonServicesMarkup(salon,category){
  const services=category==="All"?salon.services:salon.services.filter(s=>s.category===category);
  const fmtDuration=(d)=>d>=60?`${Math.floor(d/60)} hr${d%60?` ${d%60} min`:''}`:`${d} min`;
  const fallbackDesc="A relaxing treatment designed to help you unwind, feel refreshed and enjoy a little time for yourself.";
  return `
    ${services.map(s=>`
      <div class="v2-service" data-service-row="${escapeAttr(s.id)}" role="button" tabindex="0" aria-label="View ${escapeAttr(s.name)} details">
        <div>
          <h3 class="v2-service-name">${escapeHtml(s.name)}${s.isNew?`<span class="new-badge">New</span>`:""}</h3>
          <p class="v2-service-desc">${escapeHtml((s.description||"").trim() || fallbackDesc)}</p>
          <div class="v2-service-meta"><span>${fmtDuration(s.duration)}</span><span class="v2-dot v2-meta-pricesep"></span><span class="v2-service-price">$${s.price}</span>${s.addons&&s.addons.length?`<span class="v2-dot v2-meta-addonsep"></span><span class="v2-meta-addons">add-ons available</span>`:""}</div>
        </div>
        <button class="v2-book-small" data-service="${escapeAttr(s.id)}">Book</button>
      </div>`).join("")}
  `;
}
let serviceDetailCloseTimer=null;
let activeServiceDetailId=null;
function serviceDetailSheetMarkup(service){
  const savedDescription=String(service?.description||"").trim();
  const description=savedDescription||"A relaxing treatment designed to help you unwind, feel refreshed and enjoy a little time for yourself.";
  return `
    <div class="service-detail-overlay" id="serviceDetailOverlay"></div>
    <div class="service-detail-sheet" id="serviceDetailSheet" role="dialog" aria-modal="true" aria-labelledby="serviceDetailTitle">
      <button class="service-detail-close" id="closeServiceDetail" aria-label="Close service details">${icon('x')}</button>
      <h2 class="service-detail-title" id="serviceDetailTitle">${escapeHtml(service.name)}</h2>
      ${description?`<p class="service-detail-description">${escapeHtml(description)}</p>`:""}
      <div class="service-detail-footer">
        <div>
          <p class="service-detail-price">$${service.price}</p>
          <p class="service-detail-duration">${service.duration} min${service.addons&&service.addons.length?' · add-ons available':''}</p>
        </div>
        <button class="service-detail-book" id="serviceDetailBookBtn">Book</button>
      </div>
    </div>
  `;
}
function finishServiceDetailClose(afterClose){
  clearTimeout(serviceDetailCloseTimer);
  document.getElementById("serviceDetailSheet")?.remove();
  document.getElementById("serviceDetailOverlay")?.remove();
  activeServiceDetailId=null;
  if(typeof afterClose==="function") afterClose();
}
function closeServiceDetailSheet(afterClose,animated=true){
  const sheet=document.getElementById("serviceDetailSheet");
  const overlay=document.getElementById("serviceDetailOverlay");
  if(!sheet){ finishServiceDetailClose(afterClose); return; }
  if(!animated){ finishServiceDetailClose(afterClose); return; }
  if(sheet.classList.contains("closing")) return;
  sheet.classList.add("closing");
  overlay?.classList.add("closing");
  serviceDetailCloseTimer=setTimeout(()=>finishServiceDetailClose(afterClose),250);
}
function openServiceDetailSheet(service){
  if(!service) return;
  if(document.getElementById("homeMenuCard")) closeHomeMenuSheet(null,false);
  finishServiceDetailClose();
  const shell=document.querySelector(".shell");
  if(!shell) return;
  activeServiceDetailId=String(service.id);
  shell.insertAdjacentHTML("beforeend",serviceDetailSheetMarkup(service));
  const closeBtn=document.getElementById("closeServiceDetail");
  const overlay=document.getElementById("serviceDetailOverlay");
  const bookBtn=document.getElementById("serviceDetailBookBtn");
  closeBtn?.addEventListener("click",()=>closeServiceDetailSheet());
  overlay?.addEventListener("click",()=>closeServiceDetailSheet());
  bookBtn?.addEventListener("click",()=>closeServiceDetailSheet(()=>{
    rememberVenueScroll();
    goCheckout(service,"salon");
  }));
}
function bindSalonServiceButtons(scope=document){
  scope.querySelectorAll("[data-service]").forEach(btn=>{
    if(btn.dataset.boundService==="1") return;
    btn.dataset.boundService="1";
    btn.addEventListener("click",(event)=>{
      event.stopPropagation();
      const service=state.salon?.services?.find(s=>String(s.id)===btn.getAttribute("data-service"));
      if(!service) return;
      rememberVenueScroll();
      goCheckout(service,"salon");
    });
  });
  scope.querySelectorAll("[data-service-row]").forEach(row=>{
    if(row.dataset.boundServiceRow==="1") return;
    row.dataset.boundServiceRow="1";
    const open=()=>{
      const service=state.salon?.services?.find(s=>String(s.id)===row.getAttribute("data-service-row"));
      if(service) openServiceDetailSheet(service);
    };
    row.addEventListener("click",open);
    row.addEventListener("keydown",(event)=>{
      if(event.key==="Enter"||event.key===" "){event.preventDefault();open();}
    });
  });
}
function updateVenueSidebarStick(){
  // Give the sidebar's own column an explicit height exactly matching the main column, so
  // native position:sticky (on the child) has a correctly-bounded containing block and stops
  // itself at exactly the right point — no JS position-toggling needed for the sticking itself.
  const mainCol = document.querySelector(".v2-main-col");
  const outer = document.querySelector(".v2-side-outer");
  if (!mainCol || !outer) return;
  outer.style.height = mainCol.offsetHeight + "px";
}
function updateSalonCategory(category){
  state.salonCategory=category;
  document.querySelectorAll("[data-salcat]").forEach(btn=>btn.classList.toggle("active",btn.getAttribute("data-salcat")===category));
  const section=document.getElementById("salonServicesSection");
  if(section&&state.salon){
    section.innerHTML=salonServicesMarkup(state.salon,category);
    bindSalonServiceButtons(section);
    updateVenueSidebarStick();
  }else render({samePage:true});
}

        <div class="section-rule"><span class="lbl">Overview</span><span class="line"></span></div>

          <div class="row"><span style="font-weight:700;color:var(--ink);">${escapeHtml(booking.serviceName)}</span><span class="value">$${servicePrice}</span></div>
          <p style="font-size:12px;color:var(--ink-soft);margin:2px 0 0;">${booking.duration} min</p>
          ${addonsList.map(a=>`

function bindBookingConfirmedEvents(booking, onBack){
  const doneBackBtn = document.getElementById("doneBackBtn");
  if (doneBackBtn) doneBackBtn.addEventListener("click", onBack);
  if (!booking) return;
  const salon = SALONS.find(s=>s.id===booking.salonId) || null;
  const addToCalendarBtn = document.getElementById("addToCalendarBtn");
  if (addToCalendarBtn) addToCalendarBtn.addEventListener("click", ()=>{
    const evt = buildCalendarEvent({
      title: `${booking.serviceName} at ${booking.salonName}`,
      description: `Booked via Blooma${booking.stylistName && !isAnyAvailableStylist(booking.stylistName) ? ` with ${booking.stylistName}` : ""}`,
      location: salon ? salon.address : "",
      startIso: booking.date,
      durationMinutes: booking.duration,
    });
    setState({ calendarSheetEvent: evt }, { samePage:true });
  });
  const doneDirectionsBtn = document.getElementById("doneDirectionsBtn");
  if (doneDirectionsBtn && salon) doneDirectionsBtn.addEventListener("click", ()=>{
    window.open(venueMapUrl(salon,false), "_blank", "noopener");
  });
  const doneMessageBtn = document.getElementById("doneMessageBtn");
  if (doneMessageBtn && salon) doneMessageBtn.addEventListener("click", ()=> goVenueMessage(salon, booking));
  const doneVenueBtn = document.getElementById("doneVenueBtn");
  if (doneVenueBtn && salon) doneVenueBtn.addEventListener("click", ()=> goSalon(salon));
  const doneRescheduleBtn = document.getElementById("doneRescheduleBtn");
  if (doneRescheduleBtn) doneRescheduleBtn.addEventListener("click", ()=> goReschedule(booking));
  const doneCancelBtn = document.getElementById("doneCancelBtn");
  if (doneCancelBtn) doneCancelBtn.addEventListener("click", ()=> cancelBooking(booking.id));
  bindCalendarSheetControls();
}

function renderCheckout(){
  const salon = state.salon, service = state.service;

  if (state.done){
    const doneBooking = state.bookings.find(b=>b.id===state.lastBookingId) || null;
    return renderBookingConfirmed(doneBooking);
  }

  const stepKeys = checkoutStepKeys(service);
  const step = state.step; // index into stepKeys
  const stepKey = stepKeys[step] || "confirm";
  const canContinueStylist = state.selectedStylist !== null;
  const canContinueTime = state.selectedTime !== null && !isTimeBlocked(salon, state.selectedDay, state.selectedStylist, state.selectedTime, service.duration);
  const contact = bookingContact();
  const canContinueDetails = state.firstVisitAnswered && (isLoggedInCustomer() ? (contact.name.length > 1 && contact.phone.length > 5) : (state.name.trim().length > 1 && state.phone.trim().length > 5 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.guestEmail.trim())));
  const canContinueIntake = intakeQuestionsFor(service).every(q=> !q.required || String(state.intakeAnswers[q.id]||"").trim().length>0);
  const disabled = state.bookingSaving || (stepKey==="stylist" && !canContinueStylist) || (stepKey==="time" && !canContinueTime) || (stepKey==="intake" && !canContinueIntake) || (stepKey==="details" && !canContinueDetails);

  let body = "";
  if (stepKey==="addons"){
    body = `

function galleryTileArea(posInGroup,groupSize,mirrored){
  if (groupSize===1) return {col:'1', row:'1'};
  if (groupSize===2) return {col:String(posInGroup+1), row:'1'};
  if (!mirrored){
    if (posInGroup===0) return {col:'1', row:'1 / span 2'};
    if (posInGroup===1) return {col:'2', row:'1'};
    return {col:'2', row:'2'};
  }
  if (posInGroup===0) return {col:'1', row:'1'};
  if (posInGroup===1) return {col:'1', row:'2'};
  return {col:'2', row:'1 / span 2'};
}
function galleryGroupMarkup(groupTiles,groupStartIndex,mirrored,photos,salon){
  const cols = groupTiles.length===3 ? (mirrored?'1fr 2fr':'2fr 1fr') : groupTiles.length===2 ? '1fr 1fr' : '1fr';
  const rows = groupTiles.length===3 ? '260px 260px' : '260px';
  return `
  <div class="gallery-group" style="--gallery-group-cols:${cols};--gallery-group-rows:${rows};">
    ${groupTiles.map((tile,pos)=>{
      const globalIndex = groupStartIndex+pos;
      const area = galleryTileArea(pos,groupTiles.length,mirrored);
      return `
      <div class="gallery-tile" style="height:220px;flex-shrink:0;border-radius:16px;position:relative;overflow:hidden;background:${photos ? 'var(--purple-pastel-2)' : `linear-gradient(135deg, ${tile[0]}, ${tile[1]})`};grid-column:${area.col};grid-row:${area.row};">
        ${photos ? `<img src="${escapeAttr(tile)}" alt="${escapeAttr(salon.name)} photo ${globalIndex+1}" style="width:100%;height:100%;object-fit:cover;display:block;">` : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.3);">${bigIcon(salon.icon,96)}</div>`}
      </div>`;
    }).join("")}
  </div>`;
}
function renderGallery(){
  const salon = state.gallerySalon;
  if (!salon){
    return `
      <div class="page">
        <div class="topbar"><div style="display:flex;align-items:center;gap:12px;"><button class="backbtn" id="backBtn" aria-label="Go back">${icon('chevronLeft','var(--ink)')}</button><h1 class="toptitle">Photos</h1></div></div>
        <div class="empty-state">No photos to show.</div>
      </div>
    `;
  }
  const photos = salon.photos && salon.photos.length ? salon.photos : null;
  const palette = HERO_THEMES[salon.id] || [["#B79CF0","#7C5CD9"],["#7C5CD9","#5A3FA8"],["#D8C6F5","#9C7FE0"]];
  const tiles = photos || [...palette, ...palette].slice(0,8);

  return `
    <div class="page">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:12px;min-width:0;">
          <button class="backbtn" id="backBtn" aria-label="Go back">${icon('chevronLeft','var(--ink)')}</button>
          <h1 class="toptitle">${escapeHtml(salon.name)}</h1>
        </div>
      </div>
      <div class="gallery-grid" style="flex:1;overflow-y:auto;min-height:0;padding:16px 20px 32px;display:flex;flex-direction:column;gap:16px;">
        ${(() => {
          const groups = [];
          for (let i=0;i<tiles.length;i+=3) groups.push(tiles.slice(i,i+3));
          return groups.map((grp,gi)=>galleryGroupMarkup(grp,gi*3,gi%2===1,photos,salon)).join("");
        })()}
      </div>
    </div>
  `;
}

          ${[1,2,3,4,5].map(n=>`<span class="star-btn ${n<=r.rating?'filled':''}">${icon('starOutline')}</span>`).join("")}

  const waitlist = state.waitlist.slice().reverse();

            <div class="waitlist-card" style="margin-bottom:10px;">

                <span class="tag-pill" style="background:var(--purple-pastel-2);color:var(--purple);flex-shrink:0;">${icon('bell')}<span>${w.status==="notified"?"Contacted":"Waiting"}</span></span>

}

/* ---------------------------------------------------
   HELPERS
--------------------------------------------------- */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }
function formatPreferences(items){
  return (items || []).map((item,index)=>{
    const text = String(item || "").trim();
    if (!text) return "";
    if (index === 0) return escapeHtml(text);
    return escapeHtml(text.charAt(0).toLowerCase() + text.slice(1));
  }).filter(Boolean).join(", ");
}

        </div>

const scrollPositions = {};
let homeSearchRenderTimer = null;
let citySearchRenderTimer = null;

function saveScrollPositions(){
  document.querySelectorAll("[data-scrollkey]").forEach(el=>{
    scrollPositions[el.getAttribute("data-scrollkey")] = el.scrollLeft;
  });
}
function restoreScrollPositions(){
  document.querySelectorAll("[data-scrollkey]").forEach(el=>{
    const key = el.getAttribute("data-scrollkey");
    if (scrollPositions[key] != null) el.scrollLeft = scrollPositions[key];
  });
}

let venueMapInstances = [];
const VENUE_MAPBOX_STYLE = "mapbox://styles/cavauk/cmt9r64um005201sse4weevll";
function venueMapPinEl(rating){
  const isNew = (!rating || rating==="New");
  const label = isNew ? "New" : rating;
  const el = document.createElement("div");
  el.className = "venue-map-pin-wrap";
  el.innerHTML = `<div class="venue-map-pin-badge"><span>${escapeHtml(String(label))}</span>${isNew?"":icon('star','var(--gold)')}</div><div class="venue-map-pin-tail"></div>`;
  return el;
}
function createVenueMap(el, lat, lng, rating){
  const map = new mapboxgl.Map({
    container: el,
    style: VENUE_MAPBOX_STYLE,
    center: [lng, lat],
    zoom: window.innerWidth < 1024 ? 11 : 13,
    interactive: false,
    accessToken: MAPBOX_ACCESS_TOKEN,
  });
  new mapboxgl.Marker({ element: venueMapPinEl(rating), anchor: "bottom" }).setLngLat([lng, lat]).addTo(map);
  map.on("load", ()=>{ if (typeof updateVenueSidebarStick==="function") updateVenueSidebarStick(); });
  venueMapInstances.push(map);
}
function initVenueMaps(){
  venueMapInstances.forEach(m=>{ try{ m.remove(); }catch(e){} });
  venueMapInstances = [];
  if(typeof mapboxgl==="undefined") return;
  document.querySelectorAll("[data-leaflet-map]").forEach(el=>{
    const rating=el.getAttribute("data-rating");
    const lat=parseFloat(el.getAttribute("data-lat"));
    const lng=parseFloat(el.getAttribute("data-lng"));
    if(Number.isFinite(lat) && Number.isFinite(lng)){
      createVenueMap(el, lat, lng, rating);
      return;
    }
    const query=el.getAttribute("data-geocode");
    const wrap=document.getElementById(el.id+"Wrap");
    if(!query){ if(wrap) wrap.style.display="none"; return; }
    fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json?access_token=${MAPBOX_ACCESS_TOKEN}&limit=1`)
      .then(res=>res.json())
      .then(data=>{
        if(!el.isConnected) return;
        const feature=(data.features||[])[0];
        if(!feature){ if(wrap) wrap.style.display="none"; return; }
        const [lng2,lat2]=feature.center;
        createVenueMap(el, lat2, lng2, rating);
      })
      .catch(()=>{ if(wrap) wrap.style.display="none"; });
  });
}

function render(opts){
  opts = opts || {};
  const activeBefore=opts.samePage?document.activeElement:null;
  const activeId=activeBefore?.id||"";
  const activeSelection=(activeBefore && typeof activeBefore.selectionStart==="number")?{start:activeBefore.selectionStart,end:activeBefore.selectionEnd}:null;
  saveScrollPositions();
  const pageEl = document.querySelector(".page");
  const prevScrollTop = pageEl ? pageEl.scrollTop : 0;
  const checkoutBodyEl = document.getElementById("checkoutBody");
  const prevCheckoutScrollTop = checkoutBodyEl ? checkoutBodyEl.scrollTop : 0;
  const root = document.getElementById("app");
  if(!state.marketplaceReady || !state.authReady){
    document.title = "Blooma";
    root.innerHTML = `<div class="shell"><div class="page" style="background:var(--bg);"><div class="home-topbar"><span class="brand-logo">Blooma</span><span class="menu-btn" style="visibility:hidden;">${icon('menu')}</span></div><div style="padding:20px 20px 24px;display:flex;flex-direction:column;gap:12px;"><div style="height:112px;border-radius:16px;background:var(--purple-pastel-2);"></div><div style="height:112px;border-radius:16px;background:var(--purple-pastel-2);opacity:.72;"></div><div style="height:112px;border-radius:16px;background:var(--purple-pastel-2);opacity:.5;"></div></div></div></div>`;
    return;
  }
  document.title = (state.page==="salon" && state.salon) ? `${state.salon.name} — Blooma` : "Blooma";
  document.body.classList.toggle("page-home", state.page==="home");
  document.body.classList.toggle("page-salon", state.page==="salon");
  let html = "";
  if (state.page === "home") html = renderHome();
  else if (state.page === "salon") html = renderSalon();
  else if (state.page === "serviceSelect") html = renderServiceSelect();
  else if (state.page === "checkout") html = renderCheckout();
  else if (state.page === "stylistGallery") html = renderStylistPortfolioGallery();
  else if (state.page === "gallery") html = renderGallery();
  else if (state.page === "reviews") html = renderReviews();

  else if (state.page === "bookingDetail") html = renderBookingConfirmed(state.bookings.find(b=>b.id===state.viewBookingId));
  else if (state.page === "history") html = renderHistory();
  else if (state.page === "profile") html = renderProfile();

  root.innerHTML = `<div class="shell">${html}${renderConfirmModal()}${renderWaitlistModal()}${stylistSheetMarkup()}</div>`;
  restoreScrollPositions();
  const newPageEl = document.querySelector(".page");
  if (newPageEl){
    if (opts.restoreScrollTop != null) newPageEl.scrollTop = opts.restoreScrollTop;
    else newPageEl.scrollTop = opts.samePage ? prevScrollTop : 0;
  }
  const newCheckoutBodyEl = document.getElementById("checkoutBody");
  if (newCheckoutBodyEl) newCheckoutBodyEl.scrollTop = opts.samePage ? prevCheckoutScrollTop : 0;
  bindEvents();
  initVenueMaps();
  if((location.protocol==="http:" || location.protocol==="https:") && !history.state?.bloomaUi) replaceCustomerHistoryState();
  if(opts.samePage && activeId){
    const restored=document.getElementById(activeId);
    if(restored){ restored.focus({preventScroll:true}); if(activeSelection && typeof restored.setSelectionRange==="function") restored.setSelectionRange(activeSelection.start,activeSelection.end); }
  }
}

    document.querySelectorAll("[data-reviews]").forEach(btn=>{
      btn.addEventListener("click", ()=> goReviews(state.salon));
    });
    document.querySelectorAll("[data-salcat]").forEach(btn=>{
      btn.addEventListener("click", ()=> updateSalonCategory(btn.getAttribute("data-salcat")));
    });
    bindSalonServiceButtons();
    const venueBookNowBtn = document.getElementById("venueBookNowBtn");
    if (venueBookNowBtn) venueBookNowBtn.addEventListener("click", goServiceSelect);
    const venueBookNowBtnDesktop = document.getElementById("venueBookNowBtnDesktop");
    if (venueBookNowBtnDesktop) venueBookNowBtnDesktop.addEventListener("click", goServiceSelect);
    document.querySelectorAll("[data-stylistprofile]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const stylist = state.salon.stylists.find(st=>st.id===btn.getAttribute("data-stylistprofile"));
        if (stylist) goStylistProfile(stylist);
      });
    });
    document.querySelectorAll("[data-salon]").forEach(card=>{
      card.addEventListener("click", ()=>{
        const salon = SALONS.find(s=>s.id===card.getAttribute("data-salon"));
        if (salon) goSalon(salon);
      });
    });
    if (document.querySelector(".v2-side-outer")){
      window.addEventListener("resize", updateVenueSidebarStick);
      updateVenueSidebarStick();
      requestAnimationFrame(updateVenueSidebarStick);
    }
    if (state.salon?.id && state._venuePackagesLoadedFor !== state.salon.id){
      state._venuePackagesLoadedFor = state.salon.id;
      loadVenuePackages();
      loadVenueIntakeQuestions();
    }
    const giftCardCta = document.getElementById("giftCardCtaBtn");
    if (giftCardCta) giftCardCta.addEventListener("click", ()=> openGiftCardSheet());
    document.querySelectorAll("[data-buypackage]").forEach(btn=>{
      btn.addEventListener("click", ()=> buyPackage(btn.getAttribute("data-buypackage")));
    });
    if (state.showGiftCardSheet){
      const gcOverlay = document.getElementById("giftCardSheetOverlay");
      if (gcOverlay) gcOverlay.addEventListener("click", ()=>closeGiftCardSheetEl());
      const gcClose = document.getElementById("closeGiftCardSheet");
      if (gcClose) gcClose.addEventListener("click", ()=>closeGiftCardSheetEl());
      document.querySelectorAll("[data-gcamount]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ purchaseAmount:Number(btn.getAttribute("data-gcamount")), purchaseError:"" }, { samePage:true }));
      });
      const gcCustom = document.getElementById("gcCustomAmount");
      if (gcCustom) gcCustom.addEventListener("input", (e)=>{ state.purchaseAmount="custom"; state.purchaseCustomAmount=e.target.value; });
      const gcRecipName = document.getElementById("gcRecipientName");
      if (gcRecipName) gcRecipName.addEventListener("input", (e)=>{ state.purchaseRecipientName=e.target.value; });
      const gcRecipEmail = document.getElementById("gcRecipientEmail");
      if (gcRecipEmail) gcRecipEmail.addEventListener("input", (e)=>{ state.purchaseRecipientEmail=e.target.value; });
      const buyGcBtn = document.getElementById("buyGiftCardBtn");
      if (buyGcBtn) buyGcBtn.addEventListener("click", buyGiftCard);
    }
  }

  if (state.page === "serviceSelect"){
    document.getElementById("backBtn").addEventListener("click", ()=> returnToVenue());
    document.querySelectorAll("[data-servicecat]").forEach(btn=>btn.addEventListener("click", ()=>setState({ salonCategory:btn.getAttribute("data-servicecat") }, { samePage:true })));
    document.querySelectorAll("[data-pickservice]").forEach(btn=>btn.addEventListener("click", ()=>{ setState({ selectedServiceId: btn.getAttribute("data-pickservice") }, { samePage:true }); }));
    const serviceContinueBtn = document.getElementById("serviceContinueBtn");
    if (serviceContinueBtn) serviceContinueBtn.addEventListener("click", ()=>{
      const service = state.salon.services.find(s=>s.id===state.selectedServiceId);
      if (service) goCheckout(service, "serviceSelect");
    });
  }

  if (state.page === "checkout"){
    if (state.done){
      const doneBooking = state.bookings.find(b=>b.id===state.lastBookingId) || null;
      bindBookingConfirmedEvents(doneBooking, goHome);
      return;
    }
    const stepKeys = checkoutStepKeys(state.service);
    const stepKey = stepKeys[state.step] || "confirm";
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.checkoutOrigin === "history" && state.step === stepKeys.indexOf("time")){
        setState({ page:"history", checkoutOrigin:null, rescheduleBookingId:null }, { restoreScrollTop: state.historyReturnScrollTop || 0 });
      } else if (state.step===0){
        if (state.checkoutOrigin === "serviceSelect") {
          setState({ page:"serviceSelect", checkoutOrigin:null });
        } else {
          returnToVenue({ checkoutOrigin:null });
        }
      } else {
        setState({ step: state.step-1 });
      }
    });

    if (stepKey==="addons"){
      document.querySelectorAll("[data-addon]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-addon");
          const addons = state.selectedAddons.includes(id)
            ? state.selectedAddons.filter(a=>a!==id)
            : [...state.selectedAddons, id];
          setState({ selectedAddons: addons }, { samePage:true });
        });
      });
    }

    if (stepKey==="stylist"){
      document.querySelectorAll("[data-stylist]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const stylist = state.salon.stylists.find(st=>st.id===btn.getAttribute("data-stylist"));
          if (!stylist) return;
          setState({ selectedStylist: stylist }, { samePage:true });
        });
      });
    }

    if (stepKey==="time"){
      document.querySelectorAll("[data-day]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ selectedDay: parseInt(btn.getAttribute("data-day"),10), selectedTime:null }, { samePage:true }));
      });
      document.querySelectorAll("[data-time]").forEach(btn=>{
        btn.addEventListener("click", ()=> setState({ selectedTime: btn.getAttribute("data-time") }, { samePage:true }));
      });
      const openWaitlist = ()=>{ const c=bookingContact(); setState({ waitlistModalOpen:true, waitlistName:c.name, waitlistPhone:c.phone, waitlistTimePref:"Any", pendingWaitlistRequestId:null }, { samePage:true }); };
      const joinWaitlistBtn = document.getElementById("joinWaitlistBtn");
      if (joinWaitlistBtn) joinWaitlistBtn.addEventListener("click", openWaitlist);
      const joinWaitlistLink = document.getElementById("joinWaitlistLink");
      if (joinWaitlistLink) joinWaitlistLink.addEventListener("click", openWaitlist);
    }

    if (stepKey==="details"){
      const nameInput = document.getElementById("nameInput");
      const phoneInput = document.getElementById("phoneInput");
      const guestEmailInput = document.getElementById("guestEmailInput");
      if (nameInput) nameInput.addEventListener("input", (e)=>{ state.name = e.target.value; syncContinueBtn(); });
      if (phoneInput) phoneInput.addEventListener("input", (e)=>{ state.phone = e.target.value; syncContinueBtn(); });
      if (guestEmailInput) guestEmailInput.addEventListener("input", (e)=>{ state.guestEmail = e.target.value; syncContinueBtn(); });
      document.querySelectorAll("[data-firstvisit]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const isFirst = btn.getAttribute("data-firstvisit")==="yes";
          setState({ selectedNotes: isFirst?["First time here"]:[], firstVisitAnswered:true }, { samePage:true });
        });
      });
    }

    if (stepKey==="intake"){
      document.querySelectorAll("[data-intaketext]").forEach(el=>{
        el.addEventListener("input", (e)=>{ state.intakeAnswers[el.getAttribute("data-intaketext")] = e.target.value; syncIntakeContinueBtn(); });
      });
      document.querySelectorAll("[data-intakeyesno]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const [qid,val] = btn.getAttribute("data-intakeyesno").split("|");
          setState({ intakeAnswers: Object.assign({}, state.intakeAnswers, { [qid]: val }) }, { samePage:true });
        });
      });
      document.querySelectorAll("[data-intakechoice]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const idx = btn.getAttribute("data-intakechoice").indexOf("|");
          const qid = btn.getAttribute("data-intakechoice").slice(0,idx);
          const val = btn.getAttribute("data-intakechoice").slice(idx+1);
          setState({ intakeAnswers: Object.assign({}, state.intakeAnswers, { [qid]: val }) }, { samePage:true });
        });
      });
    }

    if (stepKey==="confirm"){
      const promoInput = document.getElementById("promoInput");
      if (promoInput){
        promoInput.addEventListener("input", (e)=>{ state.promoCode = e.target.value; });
        promoInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter"){ e.preventDefault(); applyPromoCode(); } });
      }
      const notesInput = document.getElementById("notesInput");
      if (notesInput) notesInput.addEventListener("input", (e)=>{ state.notes = e.target.value; });
      const applyBtn = document.getElementById("applyPromoBtn");
      if (applyBtn) applyBtn.addEventListener("click", applyPromoCode);
      const removeBtn = document.getElementById("removePromoBtn");
      if (removeBtn) removeBtn.addEventListener("click", ()=>{
        setState({ appliedPromo:null, promoCode:"", promoError:"" }, { samePage:true });
      });
      const giftCardInput = document.getElementById("giftCardInput");
      if (giftCardInput){
        giftCardInput.addEventListener("input", (e)=>{ state.giftCardCode = e.target.value; });
        giftCardInput.addEventListener("keydown", (e)=>{ if (e.key==="Enter"){ e.preventDefault(); applyGiftCardCode(); } });
      }
      const applyGiftCardBtn = document.getElementById("applyGiftCardBtn");
      if (applyGiftCardBtn) applyGiftCardBtn.addEventListener("click", applyGiftCardCode);
      const removeGiftCardBtn = document.getElementById("removeGiftCardBtn");
      if (removeGiftCardBtn) removeGiftCardBtn.addEventListener("click", ()=>{
        setState({ appliedGiftCard:null, giftCardCode:"", giftCardError:"" }, { samePage:true });
      });
      const togglePackageBtn = document.getElementById("togglePackageBtn");
      if (togglePackageBtn) togglePackageBtn.addEventListener("click", ()=>{
        setState({ packageApplied: togglePackageBtn.getAttribute("data-active")!=="1" }, { samePage:true });
      });
      const openLoyaltyBtn = document.getElementById("openLoyaltySheet");
      if (openLoyaltyBtn) openLoyaltyBtn.addEventListener("click", ()=>{ setState({ showLoyaltySheet:true }, { samePage:true }); });
      const removeLoyaltyBtn = document.getElementById("removeLoyaltyBtn");
      if (removeLoyaltyBtn) removeLoyaltyBtn.addEventListener("click", ()=>{ setState({ appliedLoyaltyReward:null }, { samePage:true }); });
      const loyaltyOverlay = document.getElementById("loyaltySheetOverlay");
      if (loyaltyOverlay) loyaltyOverlay.addEventListener("click", ()=>closeLoyaltySheetEl());
      const closeLoyaltyBtn = document.getElementById("closeLoyaltySheet");
      if (closeLoyaltyBtn) closeLoyaltyBtn.addEventListener("click", ()=>closeLoyaltySheetEl());
      const applyLoyaltyBtn = document.getElementById("applyLoyaltyBtn");
      if (applyLoyaltyBtn) applyLoyaltyBtn.addEventListener("click", ()=>{
        const L = state.loyaltyAccount;
        if (!L) return;
        state.appliedLoyaltyReward = { label: L.rewardText, value: Number(L.rewardValue||0) };
        closeLoyaltySheetEl(()=>render({samePage:true}));
      });
    }

    const continueBtn = document.getElementById("continueBtn");
    continueBtn.addEventListener("click", async ()=>{
      if (state.step < stepKeys.length-1){
        setState({ step: state.step+1, bookingError:"" });
        pushCustomerHistoryState();
      } else {
        continueBtn.disabled=true; continueBtn.textContent="Checking…";
        try{ await loadMarketplaceVenues(); }catch(e){}
        const latestSalon=SALONS.find(s=>s.id===state.salon?.id);
        const latestService=latestSalon?.services?.find(s=>s.id===state.service?.id);
        if(!latestSalon || !latestService){
          state.bookingSaving=false;
          setState({bookingError:"This service is no longer available. Please choose a service again."},{samePage:true});
          return;
        }
        state.salon=latestSalon; state.service=latestService;
        state.selectedAddons=state.selectedAddons.filter(id=>(latestService.addons||[]).some(a=>a.id===id));
        const latestStylist=(latestSalon.stylists||[]).find(st=>st.id===state.selectedStylist?.id);
        if(state.selectedStylist?.name!=="Any available" && !latestStylist){
          state.selectedStylist=null;
          setState({step:checkoutStepKeys(latestService).indexOf("stylist"),selectedTime:null,bookingError:"That stylist is no longer available. Please choose a stylist again."},{samePage:true});
          return;
        }
        if(latestStylist) state.selectedStylist=latestStylist;
        if(!state.selectedTime || isTimeBlocked(latestSalon,state.selectedDay,state.selectedStylist,state.selectedTime,latestService.duration)){
          setState({step:checkoutStepKeys(latestService).indexOf("time"),selectedTime:null,bookingError:"That appointment time is no longer available. Please choose another time."},{samePage:true});
          return;
        }
        const contact = bookingContact();
        const booking = {
          id: bookingCounter++,
          salonId: state.salon.id,
          salonName: state.salon.name,
          salonIcon: state.salon.icon,
          serviceId: state.service.id,
          serviceName: state.service.name,
          stylistId: state.selectedStylist.id,
          stylistName: state.selectedStylist.name,
          date: bookingStartIso(state.selectedDay,state.selectedTime),
          dateLabel: dayLabel(DAYS[state.selectedDay]),
          time: state.selectedTime,
          duration: state.service.duration,
          price: finalTotal(),
          subtotal: baseTotal(),
          promoCode: state.appliedPromo ? state.appliedPromo.code : null,
          discount: promoDiscount() + loyaltyDiscount() + packageDiscount() + giftCardDiscount(),
          addons: selectedAddonsList(),
          name: contact.name,
          phone: contact.phone,
          email: contact.email,
          notes: [
            state.notes,
            state.appliedLoyaltyReward ? `[Loyalty reward redeemed: ${state.appliedLoyaltyReward.label}]` : "",
            packageDiscount() ? `[Package session redeemed]` : "",
            state.appliedGiftCard ? `[Gift card ${state.appliedGiftCard.code} applied: $${giftCardDiscount()}]` : "",
          ].filter(Boolean).join(" ").trim(),
          preferences: state.selectedNotes,
          status: "upcoming",
        };
        if(contact.name.length<2 || contact.phone.length<6){
          setState({bookingError:"Your account is missing a valid name or mobile number. Update your Profile and try again."},{samePage:true});
          return;
        }
        continueBtn.disabled=true; continueBtn.textContent="Confirming…"; state.bookingSaving=true; state.bookingError="";
        try{
          if(state.checkoutOrigin==="history"&&state.rescheduleBookingId){
            const original=state.bookings.find(b=>b.id===state.rescheduleBookingId); const saved=await rescheduleCloudBooking(original,booking);
            Object.assign(original,booking); applyCanonicalBookingResult(original,saved); original.stylistName=(SALONS.find(s=>s.id===booking.salonId)?.stylists||[]).find(st=>st.id===saved.stylist_id)?.name||booking.stylistName; if(saved.stylist_id){ const assigned=(state.salon?.stylists||[]).find(st=>st.id===saved.stylist_id); if(assigned) state.selectedStylist=assigned; }
            state.lastBookingId=original.id;
          }else{
            if(!state.pendingBookingRequestId) state.pendingBookingRequestId=makeClientRequestId(); booking.clientRequestId=state.pendingBookingRequestId;
            const saved=await createCloudBooking(booking); applyCanonicalBookingResult(booking,saved); if(saved.stylist_id){ const st=(state.salon.stylists||[]).find(x=>x.id===saved.stylist_id); if(st){ booking.stylistName=st.name; state.selectedStylist=st; } }
            state.bookings.push(booking); state.pendingBookingRequestId=null;
            state.lastBookingId=booking.id;
          }
          if(state.appliedLoyaltyReward && customerSupabaseClient){
            try{ await customerSupabaseClient.rpc("redeem_loyalty_reward",{p_salon_id:state.salon.id}); }
            catch(redeemErr){ console.warn("Loyalty redemption could not be recorded",redeemErr); }
          }
          if(state.appliedGiftCard && giftCardDiscount()>0 && customerSupabaseClient){
            try{ await customerSupabaseClient.rpc("redeem_gift_card",{p_gift_card_id:state.appliedGiftCard.id, p_amount:giftCardDiscount(), p_booking_id:booking.dbId||null}); }
            catch(redeemErr){ console.warn("Gift card redemption could not be recorded",redeemErr); }
          }
          if(state.myPackage && state.packageApplied && customerSupabaseClient){
            try{ await customerSupabaseClient.rpc("redeem_package_session",{p_customer_package_id:state.myPackage.id, p_booking_id:booking.dbId||null}); }
            catch(redeemErr){ console.warn("Package redemption could not be recorded",redeemErr); }
          }
          const intakeQs = intakeQuestionsFor(state.service);
          if(intakeQs.length && booking.publicToken && customerSupabaseClient){
            const answersPayload = intakeQs.filter(q=>state.intakeAnswers[q.id]!==undefined && String(state.intakeAnswers[q.id]).trim()!=="").map(q=>({question_id:q.id, label:q.label, answer:state.intakeAnswers[q.id]}));
            if(answersPayload.length){
              try{ await customerSupabaseClient.rpc("submit_public_intake_form",{token:booking.publicToken, answers:answersPayload}); }
              catch(intakeErr){ console.warn("Intake form could not be recorded",intakeErr); }
            }
          }
          state.bookingSaving=false; setState({done:true,bookingError:""}); await loadMarketplaceVenues();
        }catch(err){ state.bookingSaving=false; setState({bookingError:err?.message||"We couldn't save this booking. Please try again."},{samePage:true}); }
      }
    });
  }

  if (state.stylistSheetOpen){
    const stylistOverlay = document.getElementById("stylistSheetOverlay");
    if (stylistOverlay) stylistOverlay.addEventListener("click", ()=> closeStylistSheet());
    const closeStylistBtn = document.getElementById("closeStylistSheet");
    if (closeStylistBtn) closeStylistBtn.addEventListener("click", ()=> closeStylistSheet());
    document.querySelectorAll("[data-stylistgallery]").forEach(btn=>{
      btn.addEventListener("click", ()=> setState({ page:"stylistGallery", stylistSheetOpen:false }));
    });
    document.querySelectorAll("[data-bookservice]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const svc = (state.salon?.services||[]).find(sv=>sv.id===btn.getAttribute("data-bookservice"));
        if (svc){ state.stylistSheetOpen=false; goCheckout(svc, "stylist", state.stylistProfile); }
      });
    });
    const seeAllReviewsBtn = document.getElementById("stylistSeeAllReviews");
    if (seeAllReviewsBtn) seeAllReviewsBtn.addEventListener("click", ()=> setState({ page:"reviews", reviewSalon: state.salon, stylistSheetOpen:false }));
  }
  document.querySelectorAll("[data-reviewstylist]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const stylist = (state.salon?.stylists||[]).find(st=>st.id===btn.getAttribute("data-reviewstylist"));
      if (stylist) goStylistProfile(stylist);
    });
  });
  {
    const footerSignupBtn2=document.getElementById("footerSignupBtn");
    if(footerSignupBtn2 && !footerSignupBtn2.dataset.bound){ footerSignupBtn2.dataset.bound="1"; footerSignupBtn2.addEventListener("click",()=>{ window.location.href = customerSignupDestination(); }); }
    const footerLoginBtn2=document.getElementById("footerLoginBtn");
    if(footerLoginBtn2 && !footerLoginBtn2.dataset.bound){ footerLoginBtn2.dataset.bound="1"; footerLoginBtn2.addEventListener("click",()=>{ window.location.href = customerLoginDestination(); }); }
    const footerBusinessBtn2=document.getElementById("footerBusinessBtn");
    if(footerBusinessBtn2 && !footerBusinessBtn2.dataset.bound){ footerBusinessBtn2.dataset.bound="1"; footerBusinessBtn2.addEventListener("click",()=>{ window.location.href = businessDestination(); }); }
  }

  if (state.page === "stylistGallery"){
    document.getElementById("backBtn").addEventListener("click", ()=> setState({ page:"salon", stylistSheetOpen:true }, { samePage:true }));
  }

  if (state.page === "gallery"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.salon) returnToVenue({ gallerySalon:null });
      else setState({ page:"home", gallerySalon:null });
    });
  }

  if (state.page === "reviews"){
    document.getElementById("backBtn").addEventListener("click", ()=>{
      if (state.salon) returnToVenue({ reviewSalon:null });
      else setState({ page:"home", reviewSalon:null });
    });
  }

  if (state.page === "venueMessage"){
    const backBtn = document.getElementById("backBtn");
    if (backBtn) backBtn.addEventListener("click", ()=>{
      if (state.salon) returnToVenue({ messageSalon:null });
      else setState({ page:"home", messageSalon:null });
    });
    const input = document.getElementById("msgComposeInput");
    const sendBtn = document.getElementById("msgSendBtn");
    if (input) input.addEventListener("input", e=>{
      state.messageDraft = e.target.value;
      if (sendBtn) sendBtn.disabled = !state.messageDraft.trim();
    });
    if (sendBtn) sendBtn.addEventListener("click", sendVenueMessageDraft);
    if (input) input.addEventListener("keydown", e=>{ if (e.key==="Enter"){ e.preventDefault(); sendVenueMessageDraft(); } });
  }

  if (state.page === "bookingDetail"){
    const booking = state.bookings.find(b=>b.id===state.viewBookingId) || null;
    const returnPage = state.bookingDetailReturnPage || "history";
    bindBookingConfirmedEvents(booking, ()=>{
      if (returnPage === "activityExternal"){ window.location.href = "/activity"; return; }
      setState({ page:returnPage, viewBookingId:null }, { restoreScrollTop: state.historyReturnScrollTop || 0 });
    });
  }
}

function syncContinueBtn(){
  const contact=bookingContact();
  const canContinueDetails = state.firstVisitAnswered && (isLoggedInCustomer() ? (contact.name.length > 1 && contact.phone.length > 5) : (contact.name.length > 1 && contact.phone.length > 5 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.guestEmail.trim())));
  const btn = document.getElementById("continueBtn");
  if (btn) btn.disabled = !canContinueDetails;
}

function syncIntakeContinueBtn(){
  const canContinueIntake = intakeQuestionsFor(state.service).every(q=> !q.required || String(state.intakeAnswers[q.id]||"").trim().length>0);
  const btn = document.getElementById("continueBtn");
  if (btn) btn.disabled = !canContinueIntake;
}
function syncWaitlistBtn(){ const c=bookingContact(); const btn=document.getElementById("submitWaitlistBtn"); if(btn) btn.disabled=!(c.name.length>1&&c.phone.length>5); }

render();
loadMarketplaceVenues(true);
loadCustomerAuth().then(()=>{
  if (!state.authenticated) return;
  const params = new URLSearchParams(location.search);
  const openId = params.get("openBooking");
  if (openId){
    const match = state.bookings.find(b=> String(b.dbId)===openId || String(b.publicToken)===openId);
    if (match) goBookingDetail(match.id, { returnPage:"activityExternal" });
    return;
  }
  if (params.get("openProfile")) goProfile();
});
let marketplaceRefreshBusy=false;
async function refreshMarketplaceData(){
  // Only refresh silently on the home listing — re-rendering while someone is mid-checkout,
  // filling in a form, or otherwise engaged elsewhere in the app is jarring and unprofessional.
  if(marketplaceRefreshBusy || document.hidden || state.page!=="home") return;
  marketplaceRefreshBusy=true;
  try{
    await loadMarketplaceVenues();
  }catch(err){
    console.warn("Blooma marketplace refresh failed",err);
  }finally{ marketplaceRefreshBusy=false; }
}
window.addEventListener("focus",refreshMarketplaceData);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) refreshMarketplaceData(); });

window.addEventListener("popstate",(event)=>{
  if(restoreCustomerHistoryState(event.state)) return;
  const slug=requestedVenueSlug();
  if(slug){
    const salon=findSalonByPublicSlug(slug);
    if(salon){ goSalon(salon,{updateUrl:false}); replaceCustomerHistoryState(); return; }
  }
  goHome({updateUrl:false});
  replaceCustomerHistoryState();
});
if(customerSupabaseClient){
  customerSupabaseClient.auth.onAuthStateChange((event)=>{
    if(event==="SIGNED_IN" || event==="SIGNED_OUT" || event==="USER_UPDATED") loadCustomerAuth();
  });
}
</script>
</body>
</html>
