<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Blooma Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#131218;
    --surface:#1C1B24;
    --surface-2:#242330;
    --surface-hover:#2A2938;
    --border:#2E2D3C;
    --violet:#6D5FE8;
    --violet-soft:rgba(109,95,232,0.16);
    --violet-text:#B7ADF5;
    --text:#F2F1F7;
    --text-soft:#9F9CB0;
    --text-faint:#6C6980;
    --success:#3ED598;
    --success-soft:rgba(62,213,152,0.14);
    --warning:#F4C93A;
    --danger:#FF6B81;
    --white:#FFFFFF;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%; scrollbar-width:none;}
  html::-webkit-scrollbar{display:none;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    scrollbar-width:none;
  }
  body::-webkit-scrollbar{display:none;}
  img{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  .btn{
    font-weight:700; font-size:13.5px;
    padding:10px 18px; border-radius:10px;
    border:1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px;
  }
  .btn-violet{background:var(--violet); color:var(--white);}
  .btn-violet:hover{background:#5C4EDB;}
  .btn-ghost{background:var(--surface-2); color:var(--text); border-color:var(--border);}
  .btn-ghost:hover{background:var(--surface-hover);}

  /* ---------- SHELL ---------- */
  .shell{display:flex; min-height:100vh;}

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:240px; flex:none;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    position:fixed; top:0; bottom:0; left:-240px; z-index:60;
    transition:left .2s ease;
  }
  .sidebar.open{left:0;}
  .sb-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 18px 14px;
  }
  .sb-logo{font-weight:800; font-size:18px; letter-spacing:-0.01em;}
  .sb-logo span{color:var(--violet-text);}
  .sb-close{
    width:30px; height:30px; border-radius:8px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text-soft);
  }
  .sb-venue{
    margin:6px 14px 14px; padding:10px 12px;
    background:var(--surface-2); border-radius:10px;
    display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .sb-venue-avatar{
    width:32px; height:32px; border-radius:8px; flex:none;
    background:linear-gradient(155deg,#A9865F,#6E8268);
  }
  .sb-venue-name{font-size:13px; font-weight:700;}
  .sb-venue-sub{font-size:11px; color:var(--text-faint);}
  .sb-venue svg{margin-left:auto; color:var(--text-faint); flex:none;}

  .sb-nav{padding:6px 12px; flex:1; min-height:0; overflow-y:auto;}
  .sb-section-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--text-faint); padding:14px 10px 8px;
  }
  .sb-link{
    display:flex; align-items:center; gap:11px;
    padding:9px 10px; border-radius:9px;
    font-size:13.5px; font-weight:600; color:var(--text-soft);
    margin-bottom:2px;
  }
  .sb-link svg{flex:none; color:var(--text-faint);}
  .sb-link:hover{background:var(--surface-hover); color:var(--text);}
  .sb-link.active{background:var(--violet-soft); color:var(--white);}
  .sb-link.active svg{color:var(--violet-text);}
  .sb-badge{
    margin-left:auto; font-size:10px; font-weight:700;
    background:var(--violet); color:var(--white);
    padding:2px 7px; border-radius:99px;
  }

  .sb-bottom{
    padding:14px; border-top:1px solid var(--border);
    display:flex; align-items:center; gap:10px;
  }
  .sb-avatar{
    width:34px; height:34px; border-radius:50%; flex:none;
    background:var(--violet); color:var(--white);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700;
  }
  .sb-user-name{font-size:12.5px; font-weight:700;}
  .sb-user-role{font-size:11px; color:var(--text-faint);}
  .sb-bottom svg{margin-left:auto; color:var(--text-faint); flex:none; cursor:pointer;}

  .sb-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:55;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sb-overlay.open{opacity:1; pointer-events:auto;}

  @media (min-width:1080px){
    .sidebar{position:sticky; top:0; left:auto; height:100vh;}
    .sb-close{display:none;}
    .sb-overlay{display:none;}
  }

  @media (max-width:1079px){
    .sidebar{
      left:0; right:0; top:auto; bottom:0; width:auto; max-width:480px; margin:0 auto;
      height:auto; max-height:82vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
      overflow-anchor:none; will-change:transform;
      border-radius:22px 22px 0 0;
      border-right:none; border-top:1px solid var(--border);
      box-shadow:0 -18px 40px rgba(0,0,0,.55);
      transform:translateY(100%) translateZ(0);
      transition:transform .25s ease;
    }
    .sidebar.open{transform:translateY(0) translateZ(0);}
    /* The sidebar doubles as a mobile bottom sheet, so it (not the nav list inside it) owns
       scrolling here — nav no longer has its own independent scroll container, which was
       fighting the sheet's during the open transition and causing a one-frame scroll glitch. */
    .sb-nav{overflow:visible; flex:none;}
  }

  /* ---------- MAIN ---------- */
  .main{flex:1; min-width:0;}

  .topbar{
    position:sticky; top:0; z-index:40;
    background:rgba(19,18,24,0.9); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:14px;
    padding:0 18px; height:64px;
  }
  .menu-btn{
    width:36px; height:36px; border-radius:9px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    flex:none; color:var(--text-soft);
  }
  @media (min-width:1080px){ .menu-btn{display:none;} }
  .tb-logo-mobile{font-weight:800; font-size:16px; letter-spacing:-0.01em; flex:none; white-space:nowrap;}
  @media (min-width:1080px){ .tb-logo-mobile{display:none;} }

  .tb-search{
    flex:1; max-width:360px;
    display:flex; align-items:center; gap:9px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 13px;
  }
  .tb-search svg{color:var(--text-faint); flex:none;}
  .tb-search input{
    border:none; background:none; outline:none; color:var(--text);
    font-family:inherit; font-size:13.5px; width:100%;
  }
  .tb-search input::placeholder{color:var(--text-faint);}
  .tb-right{display:flex; align-items:center; gap:10px; margin-left:auto;}
  .tb-right .btn{height:36px; padding:0 16px;}
  .tb-icon-btn{
    width:36px; height:36px; border-radius:9px; background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--text-soft); position:relative; flex:none;
  }
  .tb-icon-btn .dot{
    position:absolute; top:7px; right:7px;
    width:7px; height:7px; border-radius:50%; background:var(--danger);
    border:1.5px solid var(--surface);
  }
  .tb-search-mobile-hide{display:none;}
  @media (min-width:640px){ .tb-search-mobile-hide{display:flex;} }
  .tb-search{position:relative;}
  .tb-search-results{
    display:none; position:absolute; top:calc(100% + 8px); left:0; right:0;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 12px 32px rgba(0,0,0,0.4); max-height:360px; overflow-y:auto; z-index:60;
    padding:6px;
  }
  .tb-search-results.open{display:block;}
  .tb-sr-heading{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--text-faint); padding:8px 10px 4px;
  }
  .tb-sr-row{
    display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px;
    text-decoration:none; color:var(--text);
  }
  .tb-sr-row:hover{background:var(--surface-2);}
  .tb-sr-avatar{
    width:28px; height:28px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700;
    color:var(--text-soft); flex:none;
  }
  .tb-sr-info{min-width:0;}
  .tb-sr-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-sr-sub{font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tb-sr-empty{padding:14px 10px; font-size:12.5px; color:var(--text-faint); text-align:center;}

  /* ---------- CONTENT ---------- */
  .content{padding:22px 16px 60px;}
  @media (min-width:900px){ .content{padding:30px 32px 70px;} }

  .greet-row{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:14px; margin-bottom:22px;
  }
  .greet-row h1{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .greet-row .sub{font-size:13px; color:var(--text-soft); margin-top:3px;}
  @media (min-width:900px){ .greet-row h1{font-size:26px;} }

  /* ---------- STAT CARDS ---------- */
  .stats-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    margin-bottom:22px;
  }
  @media (min-width:800px){ .stats-grid{grid-template-columns:repeat(4,1fr);} }
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px;
  }
  .stat-top{display:flex; align-items:center; justify-content:space-between;}
  .stat-label{font-size:12px; color:var(--text-soft); font-weight:600;}
  .stat-icon{
    width:28px; height:28px; border-radius:8px; background:var(--violet-soft);
    display:flex; align-items:center; justify-content:center; color:var(--violet-text);
  }
  .stat-value{font-size:26px; font-weight:800; margin-top:12px; letter-spacing:-0.01em;}
  .stat-delta{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700; margin-top:6px;
    color:var(--success);
  }
  .stat-delta.down{color:var(--danger);}
  .stat-delta span.muted{color:var(--text-faint); font-weight:500;}

  /* ---------- PANELS / GRID LAYOUT ---------- */
  .dash-grid{display:grid; grid-template-columns:1fr; gap:16px;}
  @media (min-width:1100px){ .dash-grid{grid-template-columns:2fr 1fr;} }

  .panel{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:18px;
  }
  .panel-head{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:16px;
  }
  .panel-head h2{font-size:15.5px; font-weight:700;}
  .panel-head .link{font-size:12.5px; font-weight:700; color:var(--violet-text);}
  .panel-tabs{display:flex; gap:6px;}
  .panel-tab{
    font-size:12px; font-weight:700; padding:6px 12px; border-radius:99px;
    background:var(--surface-2); color:var(--text-soft); cursor:pointer;
  }
  .panel-tab.active{background:var(--violet); color:var(--white);}

  /* ---------- TIMELINE ---------- */
  .timeline-wrap{overflow-x:auto; overflow-y:hidden; scrollbar-width:none;}
  .timeline-wrap::-webkit-scrollbar{display:none;}
  .timeline{
    display:flex; min-width:560px;
  }
  .tl-times{
    flex:none; width:52px; position:relative; height:600px;
  }
  .tl-times span{
    position:absolute; left:0; transform:translateY(-50%);
    font-size:10.5px; color:var(--text-faint); font-weight:600;
  }
  .tl-staff{flex:1; display:flex; gap:10px;}
  .tl-col{
    flex:1; position:relative; height:600px; min-width:118px;
    background-image:repeating-linear-gradient(to bottom, var(--border) 0, var(--border) 1px, transparent 1px, transparent 60px);
    border-left:1px solid var(--border);
  }
  .tl-col-head{
    text-align:center; font-size:11.5px; font-weight:700; color:var(--text-soft);
    margin-bottom:8px;
  }
  .tl-appt{
    position:absolute; left:3px; right:3px;
    border-radius:8px; padding:6px 8px;
    border-left:3px solid; overflow:hidden;
  }
  .tl-appt .t1{font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-appt .t2{font-size:10px; opacity:0.75; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-c-violet{background:rgba(109,95,232,0.18); border-color:var(--violet);}
  .tl-c-blue{background:rgba(95,168,232,0.18); border-color:#5FA8E8;}
  .tl-c-pink{background:rgba(232,95,158,0.18); border-color:#E85F9E;}
  .tl-c-green{background:rgba(95,232,160,0.18); border-color:#5FE8A0;}

  .tl-heads{display:flex; gap:10px; padding-left:52px; min-width:560px;}
  .tl-heads .tl-col-head{flex:1; min-width:118px;}

  /* ---------- UPCOMING LIST ---------- */
  .side-col{display:flex; flex-direction:column; gap:16px;}
  .appt-row{
    display:flex; align-items:center; gap:11px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .appt-row:last-child{border-bottom:none; padding-bottom:0;}
  .appt-avatar{
    width:36px; height:36px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; color:var(--white);
  }
  .appt-name{font-size:13px; font-weight:700;}
  .appt-service{font-size:11.5px; color:var(--text-soft); margin-top:1px;}
  .appt-time{margin-left:auto; text-align:right; flex:none;}
  .appt-time .t{font-size:12.5px; font-weight:700;}
  .status-pill{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:2px 7px; border-radius:99px; margin-top:3px; display:inline-block;
  }
  .status-confirmed{background:var(--success-soft); color:var(--success);}
  .status-pending{background:rgba(244,201,58,0.16); color:var(--warning);}

  /* ---------- MINI CHART ---------- */
  .chart-row{
    display:flex; align-items:flex-end; gap:8px; height:120px; margin-top:6px;
  }
  .chart-bar{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .chart-bar .bar{
    width:100%; border-radius:5px 5px 0 0; background:var(--surface-2);
  }
  .chart-bar.today .bar{background:var(--violet);}
  .chart-bar span{font-size:10px; color:var(--text-faint); font-weight:600;}

  /* ---------- TEAM MINI LIST ---------- */
  .team-row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
  }
  .team-avatar{
    width:32px; height:32px; border-radius:50%; flex:none;
  }
  .team-name{font-size:12.5px; font-weight:700;}
  .team-meta{font-size:11px; color:var(--text-faint);}
  .team-status{
    margin-left:auto; font-size:10.5px; font-weight:700; flex:none;
  }
  .team-status.busy{color:var(--warning);}
  .team-status.free{color:var(--success);}

  /* ---------- PAGE HEAD ---------- */
  .page-head{margin-bottom:20px;}
  .page-head h1{font-size:22px; font-weight:800; letter-spacing:-0.01em;}
  .page-head .sub{font-size:13px; color:var(--text-soft); margin-top:3px;}
  @media (min-width:900px){ .page-head h1{font-size:26px;} }

  /* ---------- FILTER BAR ---------- */
  .filter-bar{
    display:flex; flex-direction:column; gap:12px;
    margin-bottom:18px;
  }
  .filter-tabs{
    display:flex; gap:6px; flex-wrap:nowrap;
    overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  }
  .filter-tabs::-webkit-scrollbar{display:none;}
  .filter-tab{
    flex:none;
    font-size:12.5px; font-weight:700; padding:8px 14px; border-radius:99px;
    background:var(--surface-2); color:var(--text-soft); cursor:pointer;
    border:1px solid var(--border); white-space:nowrap;
  }
  .filter-tab.active{background:var(--violet); color:var(--white); border-color:var(--violet);}
  .filter-actions{display:flex; align-items:center; gap:10px;}
  .filter-search{
    display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:9px 13px; flex:1; min-width:0; max-width:280px;
  }
  .filter-search input{border:none; background:none; outline:none; color:var(--text); font-family:inherit; font-size:13px; width:100%;}
  .filter-search input::placeholder{color:var(--text-faint);}
  @media (min-width:900px){
    .filter-bar{flex-direction:row; align-items:center;}
    .filter-tabs{flex:none;}
    .filter-actions{margin-left:auto; flex:none;}
  }

  /* ---------- TABLE ---------- */
  .table-wrap{overflow-x:auto; overflow-y:hidden;}
  table.data{width:100%; border-collapse:collapse; min-width:760px;}
  table.data th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-faint); font-weight:700; padding:0 14px 10px;
    border-bottom:1px solid var(--border);
  }
  table.data td{padding:13px 14px; border-bottom:1px solid var(--border); font-size:13px; vertical-align:middle;}
  table.data tr:last-child td{border-bottom:none;}
  table.data tr:hover td{background:var(--surface-hover);}
  .cell-person{display:flex; align-items:center; gap:10px;}
  .cell-avatar{
    width:32px; height:32px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; color:#fff;
  }
  .cell-name{font-weight:700; font-size:13px;}
  .cell-sub{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
  .status-badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 9px; border-radius:99px; display:inline-block; white-space:nowrap;
  }
  .status-confirmed{background:var(--success-soft); color:var(--success);}
  .status-pending{background:rgba(244,201,58,0.16); color:var(--warning);}
  .status-completed{background:rgba(157,152,176,0.16); color:var(--text-soft);}
  .status-cancelled{background:rgba(255,107,129,0.14); color:var(--danger);}
  .row-action{
    width:30px; height:30px; border-radius:8px; background:var(--surface-2);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); cursor:pointer; flex:none;
  }
  .tag-pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:99px; margin-right:4px; display:inline-block; white-space:nowrap;}
  .tag-vip{background:rgba(244,201,58,0.16); color:var(--warning);}
  .tag-new{background:var(--violet-soft); color:var(--violet-text);}
  .tag-inactive{background:rgba(157,152,176,0.14); color:var(--text-soft);}

  /* ---------- PAGINATION ---------- */
  .pagination{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:16px; margin-top:2px; flex-wrap:wrap; gap:10px;
  }
  .pagination .info{font-size:12px; color:var(--text-faint);}
  .pg-btns{display:flex; gap:8px;}
  .pg-btn{
    width:32px; height:32px; border-radius:8px; background:var(--surface-2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:var(--text-soft); cursor:pointer; font-size:12px; font-weight:700;
  }
  .pg-btn.active{background:var(--violet); color:#fff; border-color:var(--violet);}

  /* ---------- BREADCRUMB ---------- */
  .crumb{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; font-weight:700; color:var(--text-soft);
    margin-bottom:14px;
  }
  .crumb:hover{color:var(--text);}

  .co-wrap{max-width:640px; margin:0 auto;}

  /* ---------- ORDER SUMMARY ---------- */
  .co-client-row{
    display:flex; align-items:center; gap:12px;
    padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border);
  }
  .co-client-avatar{
    width:44px; height:44px; border-radius:50%; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--white); background:#6D5FE8;
  }
  .co-client-name{font-size:15px; font-weight:800;}
  .co-client-sub{font-size:12.5px; color:var(--text-soft); margin-top:2px;}

  .line-item{display:flex; justify-content:space-between; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--border);}
  .line-item:last-child{border-bottom:none;}
  .li-name{font-size:13.5px; font-weight:700;}
  .li-sub{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .li-price{font-size:13.5px; font-weight:700; flex:none;}

  .tip-label{font-size:12.5px; font-weight:700; color:var(--text-soft); margin:18px 0 10px;}
  .tip-row{display:flex; gap:8px; flex-wrap:wrap;}
  .tip-btn{
    flex:1; min-width:64px; text-align:center; padding:10px 8px;
    border-radius:10px; border:1px solid var(--border); background:var(--surface-2);
    cursor:pointer; font-size:12.5px; font-weight:700; color:var(--text-soft);
  }
  .tip-btn.active{background:var(--violet); color:var(--white); border-color:var(--violet);}

  .total-row{
    display:flex; justify-content:space-between; align-items:center;
    padding-top:16px; margin-top:18px; border-top:2px solid var(--border);
  }
  .total-row .t-label{font-size:14px; font-weight:700;}
  .total-row .t-amount{font-size:26px; font-weight:800;}

  /* ---------- PAYMENT METHOD ---------- */
  .pm-label{font-size:13px; font-weight:700; margin:24px 0 12px;}
  .pm-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .pm-card{
    border:1px solid var(--border); background:var(--surface-2); border-radius:14px;
    padding:20px; text-align:center; cursor:pointer;
  }
  .pm-card.active{background:var(--violet-soft); border-color:var(--violet);}
  .pm-card svg{margin-bottom:8px; color:var(--text-soft);}
  .pm-card.active svg{color:var(--violet-text);}
  .pm-card .pm-name{font-weight:700; font-size:13.5px;}

  .co-charge-btn{width:100%; justify-content:center; padding:15px; font-size:14.5px; margin-top:22px;}

  /* ---------- TERMINAL / TRANSACTION ---------- */
  .terminal-card{
    background:var(--surface-2); border:1px solid var(--border); border-radius:18px;
    padding:38px 24px; text-align:center;
  }
  .terminal-eyebrow{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint);}
  .terminal-amount{font-size:42px; font-weight:800; margin:10px 0 12px;}
  .terminal-method{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--text-soft);
    background:var(--surface); padding:6px 14px; border-radius:99px; border:1px solid var(--border);
  }
  .terminal-hint{font-size:12px; color:var(--text-faint); margin-top:18px;}
  .terminal-actions{display:flex; gap:10px; margin-top:26px; flex-wrap:wrap; justify-content:center;}
  .term-btn{
    padding:12px 24px; border-radius:10px; font-weight:700; font-size:13.5px;
    cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px;
  }
  .term-btn.accept{background:var(--success); color:#0D2419;}
  .term-btn.decline{background:rgba(255,107,129,0.14); color:var(--danger); border-color:rgba(255,107,129,0.3);}
  .term-btn.cancel{background:var(--surface); color:var(--text-soft); border-color:var(--border);}

  /* ---------- RESULT STATES ---------- */
  .result-banner{text-align:center; padding:36px 20px 8px;}
  .result-icon{
    width:60px; height:60px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
  }
  .result-icon.success{background:var(--success-soft); color:var(--success);}
  .result-icon.declined{background:rgba(255,107,129,0.14); color:var(--danger);}
  .result-icon.cancelled{background:var(--surface-2); color:var(--text-faint);}
  .result-title{font-size:19px; font-weight:800; margin-bottom:6px;}
  .result-sub{font-size:13px; color:var(--text-soft); margin-bottom:24px;}
  .result-actions{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .receipt-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px; margin:0 0 22px; text-align:left;
  }
  .receipt-row{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--text-soft);}
  .receipt-row.total{border-top:1px solid var(--border); margin-top:6px; padding-top:10px; font-weight:800; color:var(--text); font-size:13.5px;}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 18px; border-radius:10px; font-size:13px; font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.4); z-index:90; opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .co-loading{padding:60px 20px; text-align:center; color:var(--text-faint); font-size:13.5px;}
  .btn[disabled]{opacity:0.4; cursor:not-allowed; pointer-events:none;}
</style>
</head>

    if(!t){
      t = document.createElement('div');
      t.id = 'toast';
      t.className = 'toast';
      document.body.appendChild(t);

    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

<script>
  /* ---------------------------------------------------
     LIVE DATA — Supabase wiring
     Mirrors booking.html's auth/config plumbing. Loads the booking
     from ?id=, takes a (simulated terminal) payment, and on Accept
     marks the booking completed via the same admin_update_booking_status
     RPC used everywhere else. There is no payments/transactions table
     in this schema yet, so tip amount and payment method are shown to
     staff during checkout but are not persisted anywhere — only the
     booking's own total/status are real, saved data.
  --------------------------------------------------- */
  const SUPABASE_URL = "https://jzyvnipzdgfjportrbpo.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1EOYX0bR8WLF9f4Wf-5NqA_73ixmjUx";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"blooma-venue-auth"}});
  let currentSalonId = null;
  let booking = null;
  let salonLoyalty = null;
  let ckMethod = 'card';
  let ckTipPct = 0;

  function localTimeLabel(iso){ return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit",timeZone:"Pacific/Auckland"}); }
  function nzTodayKey(){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); return `${o.year}-${o.month}-${o.day}`; }
  function nzDateKeyForIso(iso){ const o={}; new Intl.DateTimeFormat("en-CA",{timeZone:"Pacific/Auckland",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date(iso)).forEach(p=>{if(p.type!=="literal")o[p.type]=p.value;}); return `${o.year}-${o.month}-${o.day}`; }
  function dateKeyDayDiff(aKey,bKey){ const [ay,am,ad]=aKey.split("-").map(Number),[by,bm,bd]=bKey.split("-").map(Number); return Math.round((Date.UTC(ay,am-1,ad)-Date.UTC(by,bm-1,bd))/86400000); }
  function whenShortLabel(iso){
    const diff = dateKeyDayDiff(nzDateKeyForIso(iso), nzTodayKey());
    const time = localTimeLabel(iso);
    if(diff===0) return 'Today, ' + time;
    if(diff===-1) return 'Yesterday, ' + time;
    if(diff===1) return 'Tomorrow, ' + time;
    return new Intl.DateTimeFormat("en-US",{timeZone:"Pacific/Auckland",month:"short",day:"numeric"}).format(new Date(iso)) + ' · ' + time;
  }
  function initialsFor(name){
    var parts = String(name||'').trim().split(/\s+/);
    return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }

  async function persistBookingStatus(status, paymentMethod, tipAmount){
    const args = {p_booking_id:booking.id,p_status:status,p_payment_method:paymentMethod!=null?paymentMethod:null,p_tip_amount:tipAmount!=null?tipAmount:null};
    const {error} = await supabaseClient.rpc("admin_update_booking_status", args);
    if(error) throw error;
  }

  async function awardLoyaltyPoints(){
    if(!salonLoyalty?.enabled || !booking.customer_user_id) return;
    const pts = Math.max(0, Math.round(Number(booking.total||0) * Number(salonLoyalty.pointsPerDollar||0)));
    if(pts<=0) return;
    try{
      const {error:txError} = await supabaseClient.from("loyalty_transactions").insert({salon_id:currentSalonId,customer_user_id:booking.customer_user_id,booking_id:booking.id,points_change:pts,reason:"Booking completed"});
      if(txError){ if(txError.code==="23505") return; throw txError; }
      const {data:existing} = await supabaseClient.from("loyalty_accounts").select("points").eq("salon_id",currentSalonId).eq("customer_user_id",booking.customer_user_id).maybeSingle();
      const nextPoints = (existing?.points||0) + pts;
      await supabaseClient.from("loyalty_accounts").upsert({salon_id:currentSalonId,customer_user_id:booking.customer_user_id,customer_name:booking.customer_name,points:nextPoints,updated_at:new Date().toISOString()},{onConflict:"salon_id,customer_user_id"});
    }catch(e){ console.warn("Loyalty award failed", e); }
  }

  function showLoginRequired(title, message, ctaLabel, ctaHref){
    document.querySelector('.shell').innerHTML = `
      <div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:24px;">
        <div style="max-width:360px;text-align:center;">
          <h1 style="font-size:22px;margin:0 0 8px;color:var(--text);">${title}</h1>
          <p style="font-size:13.5px;color:var(--text-soft);line-height:1.5;margin:0 0 18px;">${message}</p>
          <a href="${ctaHref}" class="btn btn-violet" style="justify-content:center;">${ctaLabel}</a>
        </div>
      </div>
    `;
  }

  function showNotFound(){
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" style="text-align:center;padding:60px 24px;">
        <h1 style="font-size:18px;margin-bottom:8px;">Booking not found</h1>
        <p style="font-size:13.5px;color:var(--text-soft);">This booking doesn't exist, or doesn't belong to your venue.</p>
      </div>
    `;
  }

  function lineItemsHtml(){
    const addonsSum = (booking.addons||[]).reduce((s,a)=>s+Number(a.price||0),0);
    const rows = [`<div class="line-item"><div><div class="li-name">${escapeHtml(booking.service_name_snapshot||'Service')}</div><div class="li-sub">${(booking.duration_minutes||0)} min · ${escapeHtml(booking.stylist_name_snapshot||'Venue team')}</div></div><div class="li-price">$${(Number(booking.subtotal||0)-addonsSum).toFixed(2)}</div></div>`];
    (booking.addons||[]).forEach(a=>{
      rows.push(`<div class="line-item"><div><div class="li-name">${escapeHtml(a.name)}</div></div><div class="li-price">+$${Number(a.price||0).toFixed(2)}</div></div>`);
    });
    if(Number(booking.discount||0) > 0){
      rows.push(`<div class="line-item"><div><div class="li-name">Discount${booking.promo_code?' ('+escapeHtml(booking.promo_code)+')':''}</div></div><div class="li-price">-$${Number(booking.discount).toFixed(2)}</div></div>`);
    }
    return rows.join('');
  }

  function renderSummary(){
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" id="ckSummary">
        <div class="co-client-row">
          <div class="co-client-avatar">${initialsFor(booking.customer_name)}</div>
          <div>
            <div class="co-client-name">${escapeHtml(booking.customer_name)}</div>
            <div class="co-client-sub">${whenShortLabel(booking.starts_at)} · with ${escapeHtml(booking.stylist_name_snapshot||'Venue team')}</div>
          </div>
        </div>

        ${lineItemsHtml()}

        <div class="tip-label">Add a tip for ${escapeHtml(booking.stylist_name_snapshot||'the stylist')}</div>
        <div class="tip-row">
          <div class="tip-btn active" onclick="setTip(0, this)">No tip</div>
          <div class="tip-btn" onclick="setTip(0.15, this)">15%</div>
          <div class="tip-btn" onclick="setTip(0.18, this)">18%</div>
          <div class="tip-btn" onclick="setTip(0.20, this)">20%</div>
        </div>

        <div class="total-row">
          <div class="t-label">Total due</div>
          <div class="t-amount" id="totalAmt">$${Number(booking.total||0).toFixed(2)}</div>
        </div>

        <div class="pm-label">Payment method</div>
        <div class="pm-grid">
          <div class="pm-card" id="pmCash" onclick="selectPM('cash', this)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
            <div class="pm-name">Cash</div>
          </div>
          <div class="pm-card active" id="pmCard" onclick="selectPM('card', this)">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            <div class="pm-name">Card</div>
          </div>
        </div>

        <div class="btn btn-violet co-charge-btn" onclick="goToTerminal()">
          Charge <span id="chargeBtnAmt">&nbsp;$${Number(booking.total||0).toFixed(2)}</span>
        </div>
      </div>
    `;
  }

  function ckTotal(){
    const base = Number(booking.total||0);
    return Math.round((base + base*ckTipPct) * 100) / 100;
  }

  function setTip(pct, el){
    ckTipPct = pct;
    document.querySelectorAll('.tip-btn').forEach(function(b){ b.classList.remove('active'); });
    el.classList.add('active');
    const total = ckTotal();
    document.getElementById('totalAmt').textContent = '$' + total.toFixed(2);
    document.getElementById('chargeBtnAmt').textContent = ' $' + total.toFixed(2);
  }

  function selectPM(method, el){
    document.querySelectorAll('.pm-card').forEach(function(c){ c.classList.remove('active'); });
    el.classList.add('active');
    ckMethod = method;
  }

  function goToTerminal(){
    const total = ckTotal();
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" id="ckTerminal">
        <div class="terminal-card">
          <div class="terminal-eyebrow">Processing transaction</div>
          <div class="terminal-amount">$${total.toFixed(2)}</div>
          <div class="terminal-method">
            ${ckMethod==='cash'
              ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/></svg> Cash payment'
              : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg> Card payment'}
          </div>
          <div class="terminal-hint">Confirm the outcome once payment has been taken${ckMethod==='card'?' on your card reader':''}.</div>
          <div class="terminal-actions">
            <div class="term-btn accept" onclick="txAccept()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg>
              Accept
            </div>
            <div class="term-btn decline" onclick="txDecline()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
              Decline
            </div>
            <div class="term-btn cancel" onclick="txCancel()">Cancel transaction</div>
          </div>
        </div>
      </div>
    `;
  }

  function txAccept(){
    const btn = document.querySelector('.term-btn.accept');
    if(btn){ btn.textContent = 'Processing…'; btn.style.pointerEvents = 'none'; }
    const tipAmount = Math.round((Number(booking.total||0) * ckTipPct) * 100) / 100;
    persistBookingStatus('completed', ckMethod, tipAmount).then(function(){
      booking.status = 'completed';
      return awardLoyaltyPoints();
    }).then(function(){
      renderAccepted();
    }).catch(function(err){
      showToast(err.message || 'Could not complete booking');
      if(btn){ btn.textContent = 'Accept'; btn.style.pointerEvents = ''; }
    });
  }

  function renderAccepted(){
    const total = ckTotal();
    const tip = Math.round((Number(booking.total||0) * ckTipPct) * 100) / 100;
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" id="ckResultAccepted">
        <div class="result-banner">
          <div class="result-icon success"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
          <div class="result-title">Payment accepted</div>
          <div class="result-sub">${escapeHtml(booking.customer_name)}'s appointment is marked complete.</div>
          <div class="receipt-box">
            <div class="receipt-row"><span>${escapeHtml(booking.service_name_snapshot||'Service')}</span><span>$${Number(booking.subtotal||0).toFixed(2)}</span></div>
            <div class="receipt-row"><span>Tip (${Math.round(ckTipPct*100)}%)</span><span>$${tip.toFixed(2)}</span></div>
            <div class="receipt-row total"><span>Total paid</span><span>$${total.toFixed(2)}</span></div>
          </div>
          <div class="result-actions">
            <a href="/venue/admin/bookings" class="btn btn-violet">Back to bookings</a>
            <div class="btn btn-ghost" onclick="showToast('${booking.customer_email ? ('Receipt emailed to ' + escapeHtml(booking.customer_email)) : 'No email on file for this client'}')">Email receipt</div>
          </div>
        </div>
      </div>
    `;
  }

  function txDecline(){
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" id="ckResultDeclined">
        <div class="result-banner">
          <div class="result-icon declined"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
          <div class="result-title">Payment declined</div>
          <div class="result-sub">The card was declined. Try again or switch payment method.</div>
          <div class="result-actions">
            <div class="btn btn-violet" onclick="goToTerminal()">Try again</div>
            <div class="btn btn-ghost" onclick="renderSummary()">Switch payment method</div>
          </div>
        </div>
      </div>
    `;
  }

  function txCancel(){
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" id="ckResultCancelled">
        <div class="result-banner">
          <div class="result-icon cancelled"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
          <div class="result-title">Transaction cancelled</div>
          <div class="result-sub">No charge was made. ${escapeHtml(booking.customer_name)}'s appointment is still awaiting checkout.</div>
          <div class="result-actions">
            <div class="btn btn-violet" onclick="renderSummary()">Back to checkout</div>
            <a href="/venue/admin/bookings" class="btn btn-ghost">Back to bookings</a>
          </div>
        </div>
      </div>
    `;
  }

  function renderAlreadyDone(){
    const map = { completed:"This appointment has already been checked out and marked completed.", cancelled:"This appointment was cancelled, so it can't be checked out.", no_show:"This appointment was marked as a no-show, so it can't be checked out." };
    document.getElementById('coWrap').innerHTML = `
      <div class="panel" style="text-align:center;padding:48px 24px;">
        <h1 style="font-size:18px;margin-bottom:8px;">${escapeHtml(booking.customer_name)} · ${escapeHtml(booking.service_name_snapshot||'Service')}</h1>
        <p style="font-size:13.5px;color:var(--text-soft);margin-bottom:20px;">${map[booking.status]||'This appointment is not awaiting checkout.'}</p>
        <a href="/venue/admin/booking?id=${booking.id}" class="btn btn-violet">View booking</a>
      </div>
    `;
  }

  async function bootCheckoutPage(){
    const bookingId = new URLSearchParams(window.location.search).get('id');
    if(!bookingId){ showNotFound(); return; }

    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session){
      showLoginRequired("Log in to your venue","Use your venue account before opening Checkout.","Log in","/business-auth?view=login");
      return;
    }
    const [{data:profile},{data:owner}] = await Promise.all([
      supabaseClient.from("user_profiles").select("account_type,first_name,last_name").eq("user_id",session.user.id).maybeSingle(),
      supabaseClient.from("owner_profiles").select("salon_id,role").eq("user_id",session.user.id).maybeSingle()
    ]);
    const accountType=String(profile?.account_type||session.user.user_metadata?.account_type||(owner?.salon_id?"venue":"customer")).toLowerCase();
    if(accountType!=="venue"){
      try{ await supabaseClient.auth.signOut(); }catch(e){}
      showLoginRequired("Venue account required","Customer accounts cannot be used in Blooma for Business.","Venue log in","/business-auth?view=login");
      return;
    }
    if(!owner?.salon_id){
      showLoginRequired("Finish venue setup","This account doesn't have a venue yet.","Set up venue","/business-auth?view=register");
      return;
    }
    currentSalonId=owner.salon_id;
    var displayName = [profile?.first_name,profile?.last_name].filter(Boolean).join(' ').trim() || session.user.email || 'Owner';
    document.getElementById('sbAvatar').textContent = initialsFor(displayName);
    document.getElementById('sbUserName').textContent = displayName;
    document.getElementById('sbUserRole').textContent = owner.role==='owner' ? 'Owner' : (owner.role||'Team');

    const {data:row,error} = await supabaseClient.from("bookings").select("*").eq("id",bookingId).eq("salon_id",currentSalonId).maybeSingle();
    if(error || !row){ showNotFound(); return; }
    booking = row;

    const [{data:salonRow},{data:cfgRow}] = await Promise.all([
      supabaseClient.from("salons").select("name,city,suburb").eq("id",currentSalonId).maybeSingle(),
      supabaseClient.from("app_config").select("config").eq("salon_id",currentSalonId).maybeSingle()
    ]);
    if(salonRow){
      document.querySelector('.sb-venue-name').textContent = salonRow.name || "Your venue";
      document.querySelector('.sb-venue-sub').textContent = [salonRow.suburb,salonRow.city].filter(Boolean).join(", ") || "";
      document.title = salonRow.name ? `Checkout — ${salonRow.name}` : "Checkout — Blooma Business";
    }
    salonLoyalty = cfgRow?.config?.salon?.loyalty || null;

    if(booking.status !== 'upcoming'){ renderAlreadyDone(); return; }
    renderSummary();
  }

  bootCheckoutPage();
</script>

<script>
(function(){
  var tbInput = document.getElementById('tbSearchInput');
  var tbResults = document.getElementById('tbSearchResults');
  if(!tbInput || !tbResults) return;
  var debounceTimer = null;

  function escHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function initials(name){
    var parts = String(name||'?').trim().split(/\s+/);
    return ((parts[0]||'?')[0] + (parts[1]?parts[1][0]:'')).toUpperCase();
  }
  function hideResults(){ tbResults.classList.remove('open'); tbResults.innerHTML=''; }

  function renderResults(clients, bookings, q){
    if(!clients.length && !bookings.length){
      tbResults.innerHTML = '<div class="tb-sr-empty">No matches for "'+escHtml(q)+'"</div>';
      tbResults.classList.add('open');
      return;
    }
    var html = '';
    if(clients.length){
      html += '<div class="tb-sr-heading">Clients</div>';
      clients.slice(0,5).forEach(function(c){
        html += '<a class="tb-sr-row" href="/venue/admin/client?key='+encodeURIComponent(c.key)+'">'
          + '<div class="tb-sr-avatar">'+escHtml(initials(c.name))+'</div>'
          + '<div class="tb-sr-info"><div class="tb-sr-name">'+escHtml(c.name||'Unnamed')+'</div><div class="tb-sr-sub">'+escHtml(c.phone||c.email||'Client')+'</div></div>'
          + '</a>';
      });
    }
    if(bookings.length){
      html += '<div class="tb-sr-heading">Bookings</div>';
      bookings.slice(0,5).forEach(function(b){
        var when = '';
        try{ when = new Date(b.starts_at).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }catch(e){}
        html += '<a class="tb-sr-row" href="/venue/admin/booking?id='+encodeURIComponent(b.id)+'">'
          + '<div class="tb-sr-avatar">'+escHtml(initials(b.customer_name))+'</div>'
          + '<div class="tb-sr-info"><div class="tb-sr-name">'+escHtml(b.customer_name||'Booking')+'</div><div class="tb-sr-sub">'+escHtml(b.service_name_snapshot||'')+(when?' • '+when:'')+'</div></div>'
          + '</a>';
      });
    }
    tbResults.innerHTML = html;
    tbResults.classList.add('open');
  }

  function clientKeyForRow(r){
    return r.phone ? 'ph:'+String(r.phone).trim()
      : r.email ? 'em:'+String(r.email).trim().toLowerCase()
      : 'nm:'+String(r.name||'Customer').trim().toLowerCase();
  }
  function clientKeyForBooking(b){
    return b.customer_user_id ? 'uid:'+b.customer_user_id
      : b.customer_phone ? 'ph:'+String(b.customer_phone).trim()
      : b.customer_email ? 'em:'+String(b.customer_email).trim().toLowerCase()
      : 'nm:'+String(b.customer_name||'Customer').trim().toLowerCase();
  }

  function runSearch(q){
    if(typeof currentSalonId === 'undefined' || !currentSalonId){ hideResults(); return; }
    var safeQ = q.replace(/[,()%*]/g,'');
    if(!safeQ){ hideResults(); return; }
    var pattern = '%'+safeQ+'%';
    Promise.all([
      supabaseClient.from('bookings').select('id,customer_user_id,customer_name,customer_phone,customer_email,service_name_snapshot,starts_at')
        .eq('salon_id',currentSalonId)
        .or('customer_name.ilike.'+pattern+',customer_phone.ilike.'+pattern+',customer_email.ilike.'+pattern+',service_name_snapshot.ilike.'+pattern)
        .order('starts_at',{ascending:false}).limit(20),
      supabaseClient.rpc('get_venue_clients')
    ]).then(function(res){
      if(tbInput.value.trim().toLowerCase()!==q) return;
      var bookingRows = (res[0] && res[0].data) || [];
      var manual = (res[1] && res[1].data) || [];
      var seen = {};
      var clientMatches = [];
      bookingRows.forEach(function(b){
        var key = clientKeyForBooking(b);
        if(!seen[key]){ seen[key]=true; clientMatches.push({key:key,name:b.customer_name,phone:b.customer_phone,email:b.customer_email}); }
      });
      manual.forEach(function(r){
        var hay = ((r.name||'')+' '+(r.phone||'')+' '+(r.email||'')).toLowerCase();
        if(hay.indexOf(q)===-1) return;
        var key = clientKeyForRow(r);
        if(!seen[key]){ seen[key]=true; clientMatches.push({key:key,name:r.name,phone:r.phone,email:r.email}); }
      });
      var bookingMatches = bookingRows.slice(0,8);
      renderResults(clientMatches, bookingMatches, q);
    }).catch(function(){ hideResults(); });
  }

  tbInput.addEventListener('input', function(){
    var q = tbInput.value.trim().toLowerCase();
    clearTimeout(debounceTimer);
    if(q.length < 2){ hideResults(); return; }
    debounceTimer = setTimeout(function(){ runSearch(q); }, 250);
  });
  tbInput.addEventListener('focus', function(){
    if(tbInput.value.trim().length>=2 && tbResults.innerHTML) tbResults.classList.add('open');
  });
  document.addEventListener('click', function(e){
    if(e.target===tbInput) return;
    if(!tbResults.contains(e.target)) hideResults();
  });
  tbInput.addEventListener('keydown', function(e){ if(e.key==='Escape'){ hideResults(); tbInput.blur(); } });
})();
</script>
